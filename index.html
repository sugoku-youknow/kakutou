<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>シールドファイト</title>
<style>
  html,body{margin:0;height:100%;background:#111827;color:#e5e7eb;font-family:system-ui,"Yu Gothic",sans-serif;overflow:hidden}
  :root{--b:min(21vw,92px);--g:8px;--sh:124px}   /* 操作ボタンの大きさ / ボタン同士のすき間 / 下のプレイヤー情報の高さ（縦持ちで固定） */
  /* 画面構成: 上=戦闘画面 / 中=操作ボタン（スマホのみ）/ 下=プレイヤー情報 */
  #wrap{position:relative;display:flex;flex-direction:column;width:100%;height:100vh;height:100dvh}
  #stats{display:none;flex:none;align-items:center;box-sizing:border-box;width:min(100%,620px);min-height:var(--sh);margin:0 auto;padding:4px 3px calc(6px + env(safe-area-inset-bottom))}
  /* 戦闘中のプレイヤー情報: 1 人ぶんのカードを横に並べ、カードの中は縦に（名前 / キャラ / 攻撃 / 防御 / スピード）。
     文字と棒の大きさはカードの幅に合わせて変わる（cqw）。人数が少ないほど大きく、4 人でも読める大きさにする */
  .pcs{flex:1 1 auto;display:flex;justify-content:center;gap:3px;min-width:0}
  .pc{container-type:inline-size;flex:1 1 0;min-width:0;max-width:230px;box-sizing:border-box;padding:4px 3px 5px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid transparent;font-size:11px;line-height:1.25}
  .pc.me{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28)}
  .pc b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-size:clamp(11px,13.8cqw,16px)}
  .pc .sub{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:3px;color:#9ca3af;white-space:nowrap;font-size:11px;font-size:clamp(9.5px,11.7cqw,13px)}
  .pc .sub span:first-child{overflow:hidden;text-overflow:ellipsis}
  .pc .wn{flex:none;display:flex;align-items:center}
  .pc .wn i{display:block;width:.62em;height:.62em;margin-left:.22em;box-sizing:border-box;border:1px solid currentColor;border-radius:50%}
  .pc .wn i.on{background:currentColor}
  .pc .pr{display:flex;align-items:center;gap:3px;height:17px;height:clamp(15px,18cqw,20px)}
  .pc .lb{flex:0 0 4.1em;white-space:nowrap;font-size:10.5px;font-size:clamp(9px,11.2cqw,12.5px)}
  .pc .g{flex:1 1 0;min-width:0;display:flex;gap:1px}
  .pc .g i{flex:1;height:10px;height:clamp(8px,10.6cqw,12px);border-radius:1px;background:#374151}
  .pc .g i.on{background:var(--c)}
  .pc .g i.up{background:#fff;box-shadow:0 0 5px var(--c),inset 0 0 0 2px var(--c)}   /* 狂化・巨大化の上乗せぶん */
  #box{position:relative;flex:1 1 0;min-height:0;width:100%}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  #mute{position:absolute;top:6px;right:8px;z-index:3;width:34px;height:34px;padding:0;margin:0;border-radius:50%;background:rgba(255,255,255,.14);font-size:16px;line-height:1}
  #quit{display:none;position:absolute;top:6px;left:8px;z-index:3;height:34px;padding:0 12px;margin:0;border-radius:17px;background:rgba(255,255,255,.14);font-size:13px;line-height:1}
  body.solo.battle #quit{display:block}
  #skillhint{display:none;position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:3;padding:4px 12px;border-radius:999px;background:rgba(0,0,0,.5);font-size:12px;pointer-events:none;white-space:nowrap}
  @media (pointer:fine){body.battle #skillhint{display:block}}

  /* メニュー共通 */
  .panel{pointer-events:auto;background:rgba(17,24,39,.94);border:1px solid #374151;border-radius:12px;padding:18px 24px;text-align:center;max-width:92%;max-height:calc(100% - 16px);overflow:auto;box-sizing:border-box}
  .panel h1{margin:0 0 8px;font-size:26px}
  .panel p{margin:6px 0;color:#9ca3af;font-size:13px}
  button{font:inherit;background:#3b82f6;color:#fff;border:0;border-radius:8px;padding:10px 20px;margin:6px 4px;cursor:pointer}
  button.sub{background:#4b5563}
  button:disabled{background:#4b5563;opacity:.55;cursor:default}
  input{font:inherit;width:100%;box-sizing:border-box;padding:8px;border-radius:6px;border:1px solid #4b5563;background:#111827;color:#e5e7eb}
  .code{font-size:48px;font-weight:bold;letter-spacing:12px;line-height:1.1}
  .pl{margin:3px 0;font-size:15px}
  .pl .ok{color:#4ade80;font-size:12px;margin-left:6px}
  .pl .wt{color:#9ca3af;font-size:12px;margin-left:6px}

  /* キャラ選択画面 */
  .panel.setup{width:min(92%,420px)}
  .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
  .chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 4px;margin:0;border-radius:10px;background:#1f2937;border:2px solid transparent;font-size:10px;line-height:1.2;color:#e5e7eb}
  .chip canvas{position:static;inset:auto;width:36px;height:50px}
  .chip.on{border-color:#facc15;background:#374151}
  .detail{text-align:left;background:#111827;border:1px solid #374151;border-radius:10px;padding:10px 12px;margin:6px 0}
  .detail h2{margin:0;font-size:17px}
  .detail .tag{color:#9ca3af;font-size:12px;margin:2px 0 6px}
  .detail .skl{font-size:12px;margin-top:8px;line-height:1.5;color:#d1d5db}
  .detail .skl b{color:#facc15}
  .detail .trait{color:#fca5a5}

  /* CPU 戦の設定 */
  .cpuset{text-align:left;background:#111827;border:1px solid #374151;border-radius:10px;padding:6px 12px;margin:6px 0}
  .cpuset .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0;font-size:13px;color:#d1d5db}
  .cpuset .hint{margin:-2px 0 6px;font-size:11px;color:#9ca3af;text-align:left}
  .seg{display:inline-flex;gap:4px}
  .seg button{margin:0;padding:6px 12px;background:#374151;font-size:13px}
  .seg button.on{background:#3b82f6}
  select{font:inherit;font-size:13px;background:#1f2937;color:#e5e7eb;border:1px solid #4b5563;border-radius:6px;padding:5px 6px;max-width:60%}

  /* 戦闘中: 画面上部のステータス表（横向きの棒グラフ） */
  .st-r{display:flex;align-items:center;gap:6px;height:30px;padding:0 4px;border-radius:5px}
  .st-r.me{background:rgba(255,255,255,.08)}
  .st-r .nm{flex:0 0 84px;overflow:hidden;line-height:1.15;font-size:13px;font-weight:bold}
  .st-r .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .st-r .nm small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;font-weight:normal;color:#9ca3af}
  .st-r .g{flex:1 1 0;min-width:0;display:flex;gap:2px}
  .st-r .g i{flex:1;height:9px;border-radius:2px;background:#374151}
  .st-r .g i.on{background:var(--c)}
  .st-r .g i.up{background:#fff;box-shadow:0 0 5px var(--c),inset 0 0 0 2px var(--c)}   /* 狂化・巨大化の上乗せぶん */
  .st-r .wn{flex:0 0 42px;text-align:right;font-size:11px;letter-spacing:1px}
  .st-r.st-h{height:16px}
  .st-r.st-h .g{font-size:11px;line-height:16px;display:block}
  .detail .st-r{height:20px;padding:0}
  .detail .st-r .nm{flex-basis:64px}

  /* 操作ボタン（スマホのみ・戦闘中だけ表示）。ジャンプと攻撃を横に並べ、スキルをその上の真ん中に置く（3つの中心が正三角形） */
  #touch{display:none;flex:none;justify-content:space-between;align-items:flex-end;box-sizing:border-box;padding:0 16px calc(20px + env(safe-area-inset-bottom));pointer-events:none}
  #touch>div{pointer-events:auto}
  #dpad{display:flex;gap:10px}
  .tb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:var(--b);height:var(--b);background:rgba(255,255,255,.18);border-radius:18px;font-size:calc(var(--b)*.38);user-select:none;-webkit-user-select:none;touch-action:none}
  .tb:active{background:rgba(255,255,255,.35)}
  #rbtns{position:relative;width:calc(var(--b)*2 + var(--g));height:calc(var(--b) + (var(--b) + var(--g))*.866)}
  #rbtns .tb{position:absolute;border-radius:50%}
  .tb.jump{right:0;bottom:0;background:rgba(59,130,246,.4);font-size:11px;font-weight:bold;gap:2px}
  .tb.jump svg{width:calc(var(--b)*.44);height:calc(var(--b)*.44)}
  .tb.atk{left:0;bottom:0;font-size:calc(var(--b)*.4);background:rgba(239,68,68,.4)}
  .tb.skill{left:calc((var(--b) + var(--g))/2);top:0;background:rgba(168,85,247,.45);font-weight:bold;overflow:hidden;gap:0}
  .tb.skill b{font-size:11px;line-height:1.1;max-width:88%;text-align:center}
  .tb.skill i{font-style:normal;font-size:calc(var(--b)*.28);line-height:1.1;min-height:1em}
  .tb.skill::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.6) calc(var(--p,0)*1turn),transparent 0);pointer-events:none}
  .tb.skill[data-state="none"]{opacity:.28}
  .tb.skill[data-state="ready"]{box-shadow:0 0 0 3px rgba(250,204,21,.65)}
  .tb.skill[data-state="charge"]{background:rgba(250,204,21,.6)}
  @media (pointer:coarse){body.battle #touch{display:flex}}
  /* スマホ縦持ち: ボタンを画面の下端から持ち上げる（親指が届きやすいように）。ぶんだけ戦闘画面は縦に縮む */
  @media (pointer:coarse) and (orientation:portrait){
    /* 操作ボタンの下端を、画面の下から「プレイヤー情報の高さ + 持ち上げ分」の位置に置く。持ち上げ分は画面の高さに比例（840px の画面で約 109px） */
    #touch{padding-bottom:calc(20px + clamp(0px, 25dvh - var(--sh) + 23px, 130px))}
  }
  /* スマホ横持ち: 画面の下端に重ねる */
  @media (pointer:coarse) and (orientation:landscape){
    :root{--b:min(12vw,64px)}
    #touch{position:absolute;left:0;right:0;bottom:6px;padding:0 16px}
    #dpad{gap:8px}
  }
  /* 4 人戦をスマホの縦持ち（高さに余裕のある画面）で遊ぶときは、カードを 2×2 に並べて大きくする（操作ボタンの下の余白を使う） */
  @media (pointer:coarse) and (orientation:portrait) and (min-height:700px){
    body.q4{--sh:218px}
    body.q4 .pcs{display:grid;grid-template-columns:1fr 1fr;gap:4px;align-content:center}
    body.q4 .pc{max-width:none;padding:4px 8px 5px}
    body.q4 .pc b{font-size:15px}
    body.q4 .pc .sub{font-size:12px}
    body.q4 .pc .pr{height:18px}
    body.q4 .pc .lb{font-size:11.5px}
    body.q4 .pc .g i{height:11px}
  }
  /* 高さが足りない横長画面: プレイヤー情報は画面の下の中央に小さく重ねる（スマホなら左右の操作ボタンのあいだ） */
  @media (orientation:landscape) and (max-height:520px){
    #stats{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:min(70%,520px);min-height:0;z-index:3;padding:2px 3px;background:rgba(17,24,39,.6);border-radius:8px;pointer-events:none}
    .pc{padding:2px 3px}
    .pc b{font-size:10px}
    .pc .sub{font-size:9px;margin-bottom:1px}
    .pc .pr{height:11px}
    .pc .lb{font-size:8.5px}
    .pc .g i{height:6px}
  }
  @media (pointer:coarse) and (orientation:landscape) and (max-height:520px){
    #stats{width:calc(100% - 340px);max-width:520px}
  }
  @media (max-width:480px){
    .panel{padding:14px 16px}
    .panel h1{font-size:22px}
    .code{font-size:40px}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="box">
    <canvas id="cv"></canvas>
    <div id="ui"></div>
    <button id="mute" type="button" aria-label="効果音のオン・オフ">🔊</button>
    <button id="quit" type="button" aria-label="CPU戦をやめる">やめる</button>
    <div id="skillhint"></div>
  </div>
  <div id="touch">
    <div id="dpad">
      <span class="tb l" data-k="l">◀</span>
      <span class="tb r" data-k="r">▶</span>
    </div>
    <div id="rbtns">
      <span class="tb atk" data-k="a">⚔</span>
      <span class="tb skill" data-k="k" data-state="none"><b>スキル</b><i></i></span>
      <span class="tb jump" data-k="u">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11l7-7 7 7"/><path d="M5 19l7-7 7 7"/></svg>
        JUMP
      </span>
    </div>
  </div>
  <div id="stats"></div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
"use strict";
// ---------- 定数 ----------
const W = 960, H = 540;                       // 場外判定に使うワールド基準サイズ
const PX = 190, PW = 580, PY = 400;           // メインステージ（上面の高さが PY）
const UP_GAP = 150, UP_H = 14;                // 上の台: メインの上面からの高さ / 厚み
const MAIN_PLAT = { x: PX, y: PY, w: PW, main: true };
// 戦う人数に応じたステージ（上にあるものから順に並べる）
//   2人: メインだけ / 3人: 上に台が1つ（漢字の「二」の形）/ 4人: 上に台が2つ
// 上の台は下からは通り抜けられ、上からは乗れる（メインも同じ）
// 3 人・4 人のときは、足場の横幅を 1.2 倍にする（中央を基準に広げる。高さの間隔は変えない）
const WIDE_SCALE = 1.2, CENTER_X = PX + PW / 2;
const widen = (pl, k) => Object.assign({}, pl, { x: CENTER_X + (pl.x - CENTER_X) * k, w: pl.w * k });
function layoutFor(n) {
  const y = PY - UP_GAP, k = n >= 3 ? WIDE_SCALE : 1;
  let list;
  if (n >= 4) list = [{ x: PX + 20, y, w: 200 }, { x: PX + PW - 220, y, w: 200 }, MAIN_PLAT];
  else if (n === 3) list = [{ x: PX + 130, y, w: 320 }, MAIN_PLAT];
  else list = [MAIN_PLAT];
  return k === 1 ? list : list.map(pl => widen(pl, k));
}
const LAYOUTS = [layoutFor(2), layoutFor(2), layoutFor(2), layoutFor(3), layoutFor(4)];   // 人数 0〜4
const PLW = 40, PLH = 60;                     // プレイヤー
const COLORS = ["#ef4444", "#3b82f6", "#22c55e", "#eab308"];
const CLONE_COLOR = "#f472b6";                // コペルニウムの分身
const MAX_PLAYERS = 4, WIN_ROUNDS = 3;
const ATK_COOLDOWN = 10;
// 攻撃の種類: 0=通常 / 1=侍の居合斬り（少しためてから、踏み込みながら斬る）
const ATKS = [
  { total: 26, on: 7, off: 13, reach: 46 },
  { total: 50, on: 24, off: 29, reach: 74, dash: 6.5, dashFrom: 20, dashTo: 29 },   // 20 フレームためてから踏み込む（踏み込みは約 65px）
];
const KEY = { l: 1, r: 2, u: 4, d: 8, a: 16, k: 32 };

// 性能: 攻撃 / 防御 / スピード（各 0〜6、2 が標準）
const MIN_STAT = 0, MAX_STAT = 6, BASE_STAT = 2;
const STATS = [
  { label: "攻撃", color: "#f97316" },
  { label: "防御", color: "#22d3ee" },
  { label: "スピード", color: "#c084fc" },
];
const KNOCK_BASE = 11.3, MOVE_BASE = 6;   // 性能 2 のときの値
const atkMul = a => 1 + 0.15 * (a - BASE_STAT);    // 与える吹っ飛ばし力
const defMul = d => 1 - 0.10 * (d - BASE_STAT);    // 受ける吹っ飛ばし力（小さいほど飛ばされにくい）
// スピード: 2 を基準（移動 6）にして、上げるほど急に速くなる
//   移動速度  : 6 で基準の 2.8 倍（最高 16.8）。2 未満は 1 ポイントごとに 10% 減
//   ジャンプ  : 高さがスピード 0 で 100px、6 で 200px（1 ポイントごとに約 17px）。空中でもう 1 回だけ、地上の 75% の高さで跳べる（二段ジャンプ）
const moveMul = s => s >= BASE_STAT ? 1 + 1.8 * (s - BASE_STAT) / (MAX_STAT - BASE_STAT) : 1 + 0.10 * (s - BASE_STAT);
const JUMP_MIN = 100, JUMP_MAX = 200, AIR_JUMP = 0.75;     // ジャンプの高さ(px): スピード 0 / 6 のとき / 二段目の割合
const jumpHeight = s => JUMP_MIN + (JUMP_MAX - JUMP_MIN) * Math.max(0, Math.min(MAX_STAT, s)) / MAX_STAT;
const jumpVel = h => 0.3 + Math.sqrt(0.09 + 1.2 * h);       // 高さ h(px) に届く初速（重力 0.6 を 1 フレームずつ足す計算に合わせた式）
const SHIELD_HITS = 3;               // 盾が壊れるまでの回数（攻撃・防御の差に関係なく全員一律）
const SHIELD_BREAK_FRAMES = 300;     // 壊れた盾が元に戻るまで（60fps で 5 秒）
const SHIELD_IDLE_FRAMES = 180;      // 攻撃されないまま 3 秒たつと、盾のダメージは全回復

// 制限時間とサドンデス（60fps 換算）。時間切れになると足場が縮み、睨み合いを終わらせる
const ROUND_FRAMES = 40 * 60;        // 1 ラウンドの制限時間
const SD_UP_FRAMES = 8 * 60;         // サドンデス開始から、上の台がすべて消えるまで
const SD_SHRINK_FRAMES = 18 * 60;    // サドンデス開始から、メインステージが最小幅になるまで
const SD_MIN_W = 120;                // 縮みきったメインステージの幅
const SD_HOLD_FRAMES = 6 * 60;       // 最小幅になってから、足場がすべて崩れるまで

// スキルの数値（60fps 換算）
const BOMB_FUSE = 120, BOMB_R = 9, BOMB_BLAST = 85;     // ボム: 導火線の長さ（2 秒）/ 大きさ / 爆風の半径
const BOMB_KNOCK = 0.475, BOMB_LIFT = 5.5;              // ボムの吹っ飛び（横の強さ / 上向きの初速）。以前の半分
const FLOWER_ARM = 20, FLOWER_LIFE = 600, FLOWER_ROOT = 60;    // 花: 咲くまで / 残る時間 / 踏んだ人が動けない時間（1 秒）
const DOGEZA_KNOCK = 0.5;            // 花で動けない（土下座）間に受ける吹っ飛びの倍率
const CLONE_LIFE = 420;              // 分身が消えるまで
const BZ_FRAMES = 360, BZ_BONUS = 2; // 狂化: 続く時間 / 攻撃・防御・スピードに足す値
const CN_FRAMES = 24, CN_WHIFF = 18; // カウンター: 構えている時間 / 空振りしたときの隙
const GH_FRAMES = 240;               // 透過が続く時間（4 秒）
const GH_ATK_MUL = 1.5;              // 透過中に振った攻撃の吹っ飛ばし力の倍率
const GIANT_FRAMES = 480, GIANT_BONUS = 4, GIANT_SCALE = 2, GIANT_LOCK = 600;   // 巨大化: 続く時間（8 秒）/ 全性能に足す値 / 大きさの倍率 / ラウンド開始から使えない時間（10 秒）
const RESPAWN_INV = 120;             // 残機で復活したあとの無敵時間

// ---------- キャラクター ----------
// A/D/S = 攻撃/防御/スピード。skill.cd = クールタイム(秒)、スキルが強いほど長い。hold = 押している間ためて離すと発動
const CHARS = [
  { id: "normal", name: "ノーマル", A: 2, D: 2, S: 2, tag: "練習用。すべて普通で、スキルはない", skill: null },
  { id: "bomber", name: "ボマー", A: 2, D: 2, S: 3, tag: "爆弾で周りを吹っ飛ばす",
    skill: { name: "ボム", cd: 6, text: "爆弾を短く山なりに投げる。敵に当たっても爆発せず、2秒後に爆発して周りを軽く吹っ飛ばす。盾は効かない（自分は無傷）" } },
  { id: "samurai", name: "侍", A: 5, D: 1, S: 3, tag: "攻撃力が高く、盾を一撃で割れる",

}

    if (u && p.ground && p.cn === 0) { p.vy = -jumpVel(jumpHeight(S)); p.ground = false; if (!p.isClone) emit("j", ecx(p), p.y + PLH); }
    else if (jrise && !p.ground && !p.dj && p.cn === 0) {       // 二段ジャンプ: 空中で 1 回だけ
      p.vy = Math.min(p.vy, -jumpVel(jumpHeight(S) * AIR_JUMP)); p.dj = 1;   // 上昇中に押しても、いまの勢いより弱くはならない

    }
    if (a && p.a === 0 && p.cd === 0 && p.ks === 0 && p.cn === 0) {
      p.a = 1; p.ak = 0; p.hit = [];
      if (p.gh > 0) { p.gh = 0; p.gb = 1; emit("gx", ecx(p), ecy(p)); }       // 自分から攻撃すると透過が解ける（この攻撃は 1.5 倍）

}

function breakShield(t) { t.sh = 0; t.sbk = SHIELD_BREAK_FRAMES; t.shi = 0; t.bf = 14; }

function knock(att, t, frac, dir) {

  t.vx = (dir === undefined ? att.f : dir) * KNOCK_BASE * atkMul(effA(att)) * defMul(effD(t)) * frac * mul;

// 騎士のカウンター: 受けた攻撃を、相手自身の攻撃力の 200% で相手に返す

// 近接攻撃と矢の命中処理。o: { dir 飛んでくる向き, frac 盾なしの強さ, recoil 反動, breaker 盾を一撃で壊す（吹っ飛ばさない）}

  if (open) { knock(att, t, o.frac, o.dir); impact("h", att, t, o.frac, o.dir); return; }

function resolveHits(list) {
  for (const p of list) {
    const ak = ATKS[p.ak] || ATKS[0];
    if (!p.al || p.a < ak.on || p.a > ak.off) continue;
    const sz = szOf(p), reach = ak.reach * sz;                       // 巨大化中は射程も 2 倍

      if (hx1 < t.x || hx0 > t.x + pwOf(t) || hy1 < t.y || hy0 > t.y + phOf(t)) continue;

// ボムの爆発: 爆風の中の相手を、盾を無視して軽く吹っ飛ばす（持ち主と分身は無傷）
function explode(b, list) {

function updateProjectiles(list) {
  const pls = platforms();

      b.x += b.vx; b.y += b.vy;

        if (oy + BOMB_R <= pl.y + 1 && b.y + BOMB_R >= pl.y && b.x > pl.x - 4 && b.x < pl.x + pl.w + 4) {

        if (e.x < xb && e.x + pwOf(e) > xa && b.y > e.y && b.y < e.y + phOf(e)) { hit = e; break; }
      }
      if (hit) {
        const owner = game.p[b.own] || { ch: 0, bz: 0, f: Math.sign(b.vx), al: false };
        strike(owner, hit, { dir: Math.sign(b.vx), frac: b.pw, recoil: false });

      if (b.x < -250 || b.x > W + 250 || b.t > 200) game.pj.splice(i, 1);

  }
}

function updateFlowers(list) {
  const pls = platforms();
  for (let i = game.fl.length - 1; i >= 0; i--) {
    const f = game.fl[i];
    f.t++;
    const sup = pls.some(pl => Math.abs(pl.y - f.y) < 1 && f.x > pl.x + 2 && f.x < pl.x + pl.w - 2);   // 足場が縮んで無くなったら枯れる
    if (!sup || f.t > FLOWER_LIFE) { game.fl.splice(i, 1); continue; }
    if (f.t < FLOWER_ARM) continue;                          // 咲くまでは無害
    for (const e of list) {
      if (e.own === f.own || untouchable(e) || !e.ground) continue;
      if (Math.abs(e.y + phOf(e) - f.y) < 3 && e.x < f.x + 9 && e.x + pwOf(e) > f.x - 9) {      // 踏んだ人は土下座して動けなくなる
        e.fz = FLOWER_ROOT; e.dz = FLOWER_ROOT; e.a = 0; e.ak = 0; e.ks = 0; e.cn = 0; e.vx = 0;

  }
}

// ---- CPU の頭脳 ----
// 分身（味方）と、CPU 戦の相手は、同じ頭脳（aiThink）で動く。作るのは人のプレイヤーと同じ「ボタンの状態」だけなので、物理や当たり判定は人と同じ。計算はホストだけで行う。
//   ・いちばん近い敵を狙う（分身は、持ち主が戦っている相手を優先して援護する）。透過中・復活直後の敵は狙わない
//   ・敵の盾が自分のほうを向いているときは、背中側へ回り込んでから殴る。盾が外れているときは、そのまま殴る。ときどき盾を殴って削る
//   ・足場の端では止まる。上の台から降りるときだけ、中央に近い側の端から飛び降りる。敵が上の台にいれば、ジャンプ（二段ジャンプ込み）で登る

//   skill スキルを使う確率 / punish 1 で、間合いの外で敵の出方を待つ / dodge 矢・爆弾・花を避ける確率
//   recover 落ちかけて戻ろうとする確率 / clones 敵の分身も狙うか
const AI_LEVELS = [
  { name: "よわい", desc: "反応が遅く、よく空振りする。盾の向きも読まない", think: 14, miss: 0.4, flank: 0.2, chip: 0.5, skill: 0.25, punish: 0, dodge: 0, recover: 0.5, clones: false },
  { name: "ふつう", desc: "ひととおり動く。スキルもほどよく使う", think: 8, miss: 0.2, flank: 0.6, chip: 0.35, skill: 0.6, punish: 0, dodge: 0.4, recover: 0.9, clones: true },
  { name: "つよい", desc: "反応が速く、盾の向きや間合いを読んで戦う", think: 4, miss: 0.05, flank: 1, chip: 0.25, skill: 1, punish: 1, dodge: 0.9, recover: 1, clones: true },
];
const AI_CLONE = { think: 3, miss: 0, flank: 1, chip: 0.35, skill: 0, punish: 0, dodge: 0, recover: 1, clones: false };   // 分身（味方）。スキルは使えない
const AI_EDGE = 24;                       // 足場の端で止まる距離（px）

}
function aiTarget(c, owner, B, ccx, feet) {            // 狙う敵: 近い（高さの違いは重く見る）。持ち主が戦っている相手は優先
  const orc = owner ? ecx(owner) : ccx;
  let t = null, best = 1e9;
  const eat = (e, w) => {
    if (!e || !e.c || !e.al || e.own === c.own || untouchable(e)) return;
    let sc = (Math.abs(ecx(e) - ccx) + 1.5 * Math.abs(e.y + phOf(e) - feet)) * w;
    if (owner && Math.abs(ecx(e) - orc) < 260) sc *= 0.7;
    if (sc < best) { best = sc; t = e; }

function aiSkill(c, t, X, B) {                         // スキルを使うなら KEY.k（使わなければ 0）。条件はキャラごと
  const ch = chOf(c), id = ch.id;
  if (!ch.skill || c.kc > 0 || c.kp || c.a > 0 || c.cn > 0 || c.s > 0 || c.fz > 0 || Math.random() >= B.skill) return 0;
  const { gap, sgn, sd, dyFeet, sameLevel, tr } = X, g = c.ground, face = c.f === sgn, tFaces = t.f === -sgn;
  switch (id) {
    case "bomber": return g && face && sameLevel && gap > 40 && gap < 230 ? KEY.k : 0;                                  // 前へ投げる
    case "samurai": return g && face && sameLevel && gap > 18 && gap < 112 && shieldUp(t) && tFaces && t.a === 0 && t.cd === 0 ? KEY.k : 0;   // 盾で固めた敵を、盾ごと割る
    case "berserker": return sameLevel && gap < 230 ? KEY.k : 0;
    case "knight": return g && face && t.a >= 1 && t.a <= 6 && t.ak === 0 && gap <= tr + 10 ? KEY.k : 0;                // 敵が振りかぶった瞬間にカウンター
    case "ghost": return sameLevel && gap > 50 && gap < 280 && (t.a > 0 || (shieldUp(t) && tFaces)) ? KEY.k : 0;

    case "archer":                                                                                                      // 遠いほど長くためる

function aiThink(c, owner, pls, B) {

  const main = pls.find(q => q.main) || pls[pls.length - 1];

  let inp = 0;
  const steer = x => { c.aiGoal = x; if (Math.abs(x - ccx) > 8) inp |= x > ccx ? KEY.r : KEY.l; };   // 横へ x に向かう（着いたら止まる。aiInput が行き過ぎを防ぐ）
  c.aiDrop = false; c.aiGoal = null; c.aiOnce = 0;
  const t = aiTarget(c, owner, B, ccx, feet);
  // 0) ためている最中（弓・テレポート）: 狙いの長さになるまで押し続ける。弓は、敵が近づきすぎたらすぐ放つ
  if (c.ks > 0 && c.aiCh > 0) {

    return inp;
  }

  if (!c.ground && feet > PY + 4) {

    if (!c.dj && !c.jp && c.vy > -3 && Math.random() < B.recover) inp |= KEY.u;
    else if (c.dj && id === "teleporter" && B.skill > 0 && !c.kc && !c.kp && c.s === 0 && c.a === 0 && Math.sign(main.x + main.w / 2 - ccx) === c.f && Math.random() < B.skill) { c.aiCh = 14; inp |= KEY.k; }   // 足場のほうを向いていれば、瞬間移動で戻る
    return inp;

    else if (Math.abs(CENTER_X - ccx) > 60) steer(stayX(CENTER_X));

  // 3) 敵が上の台に立っている: 真下まで行って跳び、届かなければ二段ジャンプで登る
  if (dyFeet < -45 && tpl) {
    const gx = Math.max(tpl.x + 14, Math.min(tpl.x + tpl.w - 14, tcx));
    steer(gx);
    if (c.ground && Math.abs(ccx - gx) < 36) inp |= KEY.u;
    else if (!c.ground && !c.dj && !c.jp && c.vy > -2 && feet > tpl.y - 20) inp |= KEY.u;
    return inp;
  }
  // 4) 自分が上の台にいて、敵が下にいる: 中央に近い側の端から飛び降りる（外側へ降りると場外へ落ちる）
  if (dyFeet > 45 && pl && !pl.main && c.ground) {

function hostTick() {
  const slots = connectedSlots();
  if (game.ph !== "play") for (const i of slots) if (game.p[i].cpu) inputs[i] = 0;      // CPU は戦闘中だけ動く
  if (game.ph === "lobby") {
    for (const i of slots) {
      const p = game.p[i];
      physics(p, inputs[i], true);

      p.al = true;
    }
  } else if (game.ph === "count") {

  } else if (game.ph === "play") {
    if (game.hs > 0) { game.hs--; return; }                // ヒットストップ中は全員の動きを止める
    if (game.rt > 0) game.rt--; else game.sd++;            // 制限時間が尽きたらサドンデス（足場が縮む）
    for (const i of slots) { const p = game.p[i]; if (p.cpu) inputs[i] = p.al ? aiInput(p, null, AI_LEVELS[p.cpuLv] || AI_LEVELS[1]) : 0; }   // CPU の頭脳
    for (const i of slots) physics(game.p[i], inputs[i], false);
    for (const i of slots) tickClone(i);
    const list = ents();

    updateProjectiles(list);
    resolveHits(ents());
    for (const i of slots) {

    }

    if (alive.length <= 1) {

      if (game.win >= 0) game.p[game.win].w++;

    p: game.p.map(p => p ? Object.assign(serEnt(p),
      { w: p.w, c: p.c ? 1 : 0, n: p.n, rd: p.rd ? 1 : 0, lk: p.lk ? 1 : 0, kc: p.kc, lv: p.lv },
      inGame ? { ch: p.ch } : null) : null),

let tickCount = 0, lastPh = "", lastSig = "";

  inputs[0] = myKeys;

// ---------- ネットワーク ----------
function randCode() { return String(Math.floor(Math.random() * 10)); }

let hostTries = 0;
function startHost() {
  role = "host"; net = "connecting"; netMsg = ""; renderUI();
  roomCode = randCode();
  peer = new Peer(PREFIX + roomCode);
  peer.on("open", () => {
    net = "ready"; myId = 0;
    const me = game.p[0] = newPlayer(); me.own = 0; spawn(me, 0, 1); me.al = true;
    hostTimer = setInterval(hostLoop, 1000 / 60);
    renderUI();
  });
  peer.on("error", e => {
    if (e.type === "unavailable-id" && net === "connecting" && ++hostTries < 30) { peer.destroy(); startHost(); return; }
    if (e.type === "unavailable-id") { net = "error"; netMsg = "空いている部屋番号がありません。しばらくしてからやり直してください"; renderUI(); return; }
    net = "error"; netMsg = "接続エラー: " + e.type; renderUI();
  });
  peer.on("connection", conn => {
    conn.on("open", () => {
      let slot = -1;
      for (let i = 1; i < MAX_PLAYERS; i++) if (!game.p[i] || !game.p[i].c) { slot = i; break; }
      if (slot < 0) { conn.send({ t: "full" }); setTimeout(() => conn.close(), 300); return; }
      conns[slot] = conn;
      const p = newPlayer(); p.own = slot; game.p[slot] = p;
      spawn(p, slot, connectedSlots().length);
      p.al = game.ph === "lobby";            // 試合中の参加は、キャラを選んで次のラウンドから
      inputs[slot] = 0;
      conn.send({ t: "hello", id: slot });
      renderUI();
      conn.on("data", d => {
        if (!d) return;
        if (d.t === "in") inputs[slot] = d.k | 0;
        else if (d.t === "prof") { applyProfile(p, sanitizeProfile(d)); renderUI(); }
        else if (d.t === "unprof") { if (canEdit(p)) p.rd = false; renderUI(); }
      });
      conn.on("close", () => { if (conns[slot] === conn) { game.p[slot].c = false; game.p[slot].al = false; conns[slot] = null; renderUI(); } });
    });
  });
}

function startClient(code) {
  role = "client"; roomCode = code; net = "connecting"; renderUI();
  peer = new Peer();
  peer.on("open", () => {
    hostConn = peer.connect(PREFIX + code, { reliable: true });
    hostConn.on("data", d => {
      if (!d) return;
      if (d.t === "hello") { myId = d.id; net = "ready"; renderUI(); }
      else if (d.t === "full") { net = "error"; netMsg = "この部屋は満員です（最大4人）"; renderUI(); }
      else if (d.t === "s") applySnapshot(d);
    });
    hostConn.on("close", () => { net = "error"; netMsg = "ホストとの接続が切れました"; renderUI(); });
    setTimeout(() => { if (net === "connecting") { net = "error"; netMsg = "部屋が見つかりません（番号を確認してください）"; renderUI(); } }, 10000);
  });
  peer.on("error", e => { net = "error"; netMsg = e.type === "peer-unavailable" ? "部屋が見つかりません（ホストが閉じたか、番号が違います）" : "接続エラー: " + e.type; renderUI(); });
}

function readEnt(p, n) {                                     // スナップショットの内容を、見た目用の状態に反映する

  p.tx = n.x; p.ty = n.y; if (jump) { p.x = n.x; p.y = n.y; }

  p.sh = n.sh; p.sbk = n.sk; p.sg = n.sg;

const keyMap = { ArrowLeft: "l", KeyA: "l", ArrowRight: "r", KeyD: "r", ArrowUp: "u", KeyW: "u", ArrowDown: "d", KeyS: "d",

  } else if (id === "nao") {
    c.fillStyle = "#fb7185"; c.beginPath(); c.moveTo(x + 20, y + 48);
    c.bezierCurveTo(x + 4, y + 36, x + 12, y + 24, x + 20, y + 34); c.bezierCurveTo(x + 28, y + 24, x + 36, y + 36, x + 20, y + 48); c.fill();
  } else if (id === "berserker") {
    c.fillStyle = "#7f1d1d";
    c.beginPath(); c.moveTo(x + 2, y); c.lineTo(x + 7, y - 10); c.lineTo(x + 13, y); c.fill();
    c.beginPath(); c.moveTo(x + PLW - 2, y); c.lineTo(x + PLW - 7, y - 10); c.lineTo(x + PLW - 13, y); c.fill();
    c.strokeStyle = "#7f1d1d"; c.lineWidth = 2; c.beginPath(); c.moveTo(x + 10, y + 34); c.lineTo(x + 30, y + 46); c.stroke();
  } else if (id === "knight") {
    c.fillStyle = "#cbd5e1"; c.fillRect(x + 2, y - 2, PLW - 4, 12);
    c.fillStyle = "#111827"; c.fillRect(x + (f > 0 ? 18 : 6), y + 4, 16, 3);
    c.fillStyle = "#dc2626"; c.fillRect(x + 16, y - 8, 8, 7);
  } else if (id === "giant") {
    c.fillStyle = "#78350f"; c.fillRect(x, y + 38, PLW, 9);
    c.fillStyle = "#fbbf24"; c.fillRect(x + 16, y + 38, 8, 9);
    c.fillStyle = "#451a03";
    c.beginPath(); c.moveTo(x + 6, y); c.lineTo(x + 10, y - 9); c.lineTo(x + 15, y); c.fill();
    c.beginPath(); c.moveTo(x + 17, y); c.lineTo(x + 21, y - 12); c.lineTo(x + 26, y); c.fill();
    c.beginPath(); c.moveTo(x + 28, y); c.lineTo(x + 32, y - 9); c.lineTo(x + 36, y); c.fill();
  } else if (id === "ghost") {
    c.fillStyle = "#f8fafc"; c.beginPath(); c.arc(x + 20, y + 36, 8, Math.PI, 0);
    c.lineTo(x + 28, y + 49); c.lineTo(x + 24, y + 45); c.lineTo(x + 20, y + 49); c.lineTo(x + 16, y + 45); c.lineTo(x + 12, y + 49); c.closePath(); c.fill();
    c.fillStyle = "#111827"; c.fillRect(x + 15, y + 34, 3, 3); c.fillRect(x + 22, y + 34, 3, 3);
  }
}
function drawChar(c, idx, x, y, f, col, flash) {
  c.fillStyle = flash ? "#ffffff" : col;
  c.fillRect(x, y, PLW, PLH);
  c.fillStyle = "#111827";
  c.fillRect(x + (f > 0 ? 24 : 8), y + 12, 8, 8);            // 目（向き）
  deco(c, (CHARS[idx] || CHARS[0]).id, x, y, f);
}

  const me = game.p[myId];

  if (role && net === "ready" && me && game.ph !== "lobby") {
    const sk = chOf(me).skill;
    if (sk) {
      label = sk.name;

// ---------- 効果音と演出 ----------
// 効果音は WebAudio で合成する（音声ファイルは使わない）。ブラウザの決まりで、最初の操作のあとから鳴る
const Sfx = (() => {
  let ac = null, master = null, buf = null, muted = false;
  try { muted = localStorage.getItem("shieldfight-muted") === "1"; } catch (e) {}
  function init() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { ac = new AC(); } catch (e) { ac = null; return; }
      master = ac.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(ac.destination);
      buf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);              // ノイズの素材（1 秒）
      const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === "suspended") ac.resume();
  }
  const env = (g, t0, dur, vol) => {                                       // すぐ立ち上がって減衰する音量の形
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0002), t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  };
  function tone(f0, f1, dur, type, vol, delay) {                           // f0 → f1 に音程が動く音
    if (!ac || muted) return;
    const t0 = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    env(g, t0, dur, vol); o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function noise(dur, vol, type, f0, f1, delay) {                          // フィルターを通したノイズ
    if (!ac || muted) return;
    const t0 = ac.currentTime + (delay || 0), s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = buf; f.type = type; f.Q.value = 1; f.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    env(g, t0, dur, vol); s.connect(f); f.connect(g); g.connect(master); s.start(t0, Math.random() * 0.3); s.stop(t0 + dur + 0.03);
  }
  return {
    init,
    get muted() { return muted; },
    setMuted(m) {
      muted = !!m;
      try { localStorage.setItem("shieldfight-muted", muted ? "1" : "0"); } catch (e) {}
      if (master) master.gain.value = muted ? 0 : 0.6;
    },
    swing() { noise(0.12, 0.10, "bandpass", 700, 2600); },
    jump() { tone(280, 560, 0.09, "sine", 0.07); },
    block() { tone(920, 900, 0.14, "triangle", 0.18); tone(1380, 1350, 0.10, "square", 0.05); noise(0.04, 0.12, "highpass", 3500, 3500); },
    hit(f) { f = f || 1; tone(190, 45, 0.18 + 0.10 * f, "sine", 0.45); noise(0.09, 0.20, "lowpass", 2600, 500); tone(540, 150, 0.08, "square", 0.07); },
    shieldBreak() { noise(0.5, 0.26, "highpass", 2500, 7000); tone(1900, 320, 0.30, "triangle", 0.16); tone(1250, 220, 0.25, "square", 0.06, 0.04); },
    ko() { tone(720, 90, 0.5, "sine", 0.16); noise(0.25, 0.10, "lowpass", 1600, 300); },
    beep(go) { if (go) tone(990, 990, 0.32, "square", 0.10); else tone(660, 660, 0.12, "square", 0.09); },
    tick(urgent) { const f = urgent ? 1180 : 880; tone(f, f, 0.07, "square", 0.07); },
    // 決着の落下音（ko）と重ならないよう、少し遅らせて鳴らす
    roundEnd(win) { (win ? [523, 659, 784] : [392, 330, 262]).forEach((f, i) => tone(f, f, 0.15, "triangle", 0.18, 0.45 + i * 0.11)); },
    matchEnd() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, f, 0.17, "triangle", 0.18, 0.45 + i * 0.12)); },
    siren() { tone(260, 520, 0.45, "sawtooth", 0.10); tone(520, 260, 0.45, "sawtooth", 0.10, 0.45); },
    rumble() { noise(0.6, 0.22, "lowpass", 260, 70); tone(70, 40, 0.5, "sine", 0.25); },
    // スキル
    throwBomb() { noise(0.18, 0.12, "bandpass", 300, 1100); tone(220, 440, 0.12, "sine", 0.06); },
    explode() { noise(0.8, 0.5, "lowpass", 2200, 90); tone(120, 32, 0.6, "sine", 0.55); tone(300, 60, 0.25, "sawtooth", 0.12); },
    slash() { noise(0.16, 0.2, "highpass", 2200, 7000); tone(1600, 500, 0.14, "sawtooth", 0.09); },
    arrow(c) { tone(900 + 600 * (c || 0), 380, 0.14, "triangle", 0.16); noise(0.06, 0.10, "highpass", 3000, 3000); },

// 試合の状態の変わり目（カウントダウン・残り時間・サドンデス・脱落）から鳴らす音と演出。全員が自分の画面で同じ状態を見て出す
const fxPrev = { ph: "", sec: -1, rt: -1, sd: 0, al: [false, false, false, false] };
let fxBannerT = 99, fxGoT = 0, fxSdT = 0;          // 見出しが出てからのフレーム / 「GO!」・「サドンデス！」の表示の残り
function fxPhase(dt) {
  fxBannerT += dt; fxGoT = Math.max(0, fxGoT - dt); fxSdT = Math.max(0, fxSdT - dt);
  if (game.ph !== fxPrev.ph) {
    if (game.ph === "play" && fxPrev.ph === "count") { Sfx.beep(true); fxGoT = 40; fxBannerT = 0; }
    else if (game.ph === "round") { Sfx.roundEnd(game.win >= 0); fxBannerT = 0; }
    else if (game.ph === "match") { Sfx.matchEnd(); fxBannerT = 0; }
    if (game.ph === "count") fxPrev.sec = -1;
    if (fxPrev.ph === "lobby" && game.ph !== "count") fxPrev.sd = game.sd;   // 途中参加のとき、過去の節目の音を鳴らさない
    fxPrev.ph = game.ph;
  }
  if (game.ph === "count") {
    const s = Math.ceil(game.tm / 60);
    if (s !== fxPrev.sec) { fxPrev.sec = s; Sfx.beep(false); fxBannerT = 0; }
  }
  if (game.ph === "play" && game.sd === 0) {       // 残り 10 秒から 1 秒ごとに刻む（3 秒前からは高い音）
    const s = Math.ceil(game.rt / 60);
    if (s !== fxPrev.rt) { if (fxPrev.rt >= 0 && s >= 1 && s <= 10) Sfx.tick(s <= 3); fxPrev.rt = s; }
  } else fxPrev.rt = -1;
  const sd = game.sd, E1 = SD_UP_FRAMES, E2 = SD_SHRINK_FRAMES, E3 = SD_SHRINK_FRAMES + SD_HOLD_FRAMES;
  if (sd > 0 && fxPrev.sd === 0) { fxSdT = 110; fxBannerT = 0; Sfx.siren(); shake(6); }      // サドンデス開始
  if (sd >= E1 && fxPrev.sd < E1) { Sfx.rumble(); shake(5); }                                 // 上の台が消えた
  if (sd >= E2 && fxPrev.sd < E2) { Sfx.siren(); shake(6); }                                  // 最小幅になった（崩れるまでのカウント開始）
  if (sd >= E3 && fxPrev.sd < E3) { Sfx.rumble(); shake(14); flashA = Math.max(flashA, 0.4); } // 足場がすべて崩れた
  if (game.ph === "play" && sd > 0 && sd < E3) shake(1.1);                                    // 足場が縮んでいる間の地鳴り
  fxPrev.sd = sd;
  for (let i = 0; i < MAX_PLAYERS; i++) {          // 脱落した瞬間
    const p = game.p[i], alive = !!(p && p.c && p.al);
    // 最後の 1 人が落ちた瞬間はラウンド終了と同時に届くので、round / match でも検出する
    if ((game.ph === "play" || game.ph === "round" || game.ph === "match") && fxPrev.al[i] && !alive && p && p.c) koFx(p);
    fxPrev.al[i] = alive;
  }

    }
  }
  // 盾が戻るまでのゲージ
  if (p.al && p.sbk > 0 && !chd.noShield) {
    cx.fillStyle = "rgba(0,0,0,0.5)"; cx.fillRect(p.x, p.y - 6, PLW, 3);
    cx.fillStyle = "#fb923c"; cx.fillRect(p.x, p.y - 6, PLW * (1 - p.sbk / SHIELD_BREAK_FRAMES), 3);
  }
  // 騎士のカウンターの構え
  if (p.cn > 0) {
    cx.strokeStyle = "rgba(250,204,21," + (0.55 + 0.35 * Math.sin(now / 40)).toFixed(2) + ")"; cx.lineWidth = 3;
    cx.strokeRect(p.x - 4, p.y - 4, PLW + 8, PLH + 8);
  }
  // 花で動けない（つるが巻きつく）
  if (p.dz > 0 && p.al) {
    cx.strokeStyle = "#16a34a"; cx.lineWidth = 3;
    cx.beginPath(); cx.moveTo(p.x - 2, p.y + 52); cx.lineTo(p.x + PLW + 2, p.y + 38); cx.moveTo(p.x - 2, p.y + 32); cx.lineTo(p.x + PLW + 2, p.y + 46);
    cx.moveTo(p.x + 6, p.y + PLH); cx.lineTo(p.x + 10, p.y + 22); cx.stroke();
    cx.fillStyle = "#f472b6"; cx.beginPath(); cx.arc(p.x + PLW / 2, p.y + 30, 4, 0, 6.2832); cx.fill();
  }
  // ためている間のリングと、テレポートの行き先
  if (p.ks > 0 && chd.skill && chd.skill.hold && p.al) {
    const c = Math.min(1, p.ks / chd.skill.maxCharge);
    cx.strokeStyle = c >= 1 ? "#fde047" : "#ffffff"; cx.lineWidth = 3;
    cx.beginPath(); cx.arc(p.x + PLW / 2, p.y + PLH / 2, 38, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * c); cx.stroke();
    if (chd.id === "teleporter") {
      cx.globalAlpha = 0.55 * alpha; cx.strokeStyle = "#22d3ee"; cx.lineWidth = 2; cx.setLineDash([4, 3]);
      cx.strokeRect(p.x + p.f * (90 + 260 * c) + 0.5, p.y + 0.5, PLW - 1, PLH - 1); cx.setLineDash([]);
    }
  }
  cx.restore();
  if (p.al) {
    cx.fillStyle = col; cx.font = "bold 16px sans-serif"; cx.textAlign = "center";
    const label = clone ? "分身" : nameOf(i) + (p.lv > 0 ? " ♥" : "") + (me ? " ▼" : "");
    cx.fillText(label, p.x + PLW * sz / 2, p.y - 10);
  }
}
function drawBomb(b, now) {
  const blink = b.t > BOMB_FUSE - 30 && Math.floor(b.t / 5) % 2 === 0;
  cx.fillStyle = blink ? "#ef4444" : "#1f2937"; cx.beginPath(); cx.arc(b.x, b.y, BOMB_R, 0, 6.2832); cx.fill();
  cx.fillStyle = "rgba(255,255,255,0.35)"; cx.beginPath(); cx.arc(b.x - 3, b.y - 3, 3, 0, 6.2832); cx.fill();
  cx.strokeStyle = "#a16207"; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(b.x + 2, b.y - BOMB_R + 1); cx.lineTo(b.x + 6, b.y - BOMB_R - 5); cx.stroke();
  cx.fillStyle = Math.floor(now / 60) % 2 ? "#fde047" : "#fb923c"; cx.fillRect(b.x + 5, b.y - BOMB_R - 8, 3, 3);
}
function drawArrow(b) {
  const d = Math.sign(b.vx) || 1, L = 26, strong = b.pw >= 1;
  cx.strokeStyle = strong ? "#fde047" : "#e5e7eb"; cx.lineWidth = 2.5;
  cx.beginPath(); cx.moveTo(b.x - d * L, b.y); cx.lineTo(b.x, b.y); cx.stroke();
  cx.fillStyle = strong ? "#fb923c" : "#cbd5e1";
  cx.beginPath(); cx.moveTo(b.x + d * 7, b.y); cx.lineTo(b.x, b.y - 4); cx.lineTo(b.x, b.y + 4); cx.fill();
  cx.strokeStyle = "#94a3b8"; cx.lineWidth = 1.5;
  cx.beginPath(); cx.moveTo(b.x - d * L, b.y); cx.lineTo(b.x - d * (L + 4), b.y - 4); cx.moveTo(b.x - d * L, b.y); cx.lineTo(b.x - d * (L + 4), b.y + 4); cx.stroke();
}
function drawFlower(f, now) {
  const g = Math.min(1, f.t / FLOWER_ARM), h = 16 * g, hx = f.x + Math.sin(now / 300 + f.x) * 1.5 * g, hy = f.y - h;
  cx.strokeStyle = "#16a34a"; cx.lineWidth = 2.5; cx.beginPath(); cx.moveTo(f.x, f.y); cx.lineTo(hx, hy); cx.stroke();
  cx.fillStyle = "#16a34a"; cx.fillRect(f.x - 6, f.y - 5, 6, 2); cx.fillRect(f.x + 1, f.y - 8, 6, 2);
  cx.fillStyle = f.t >= FLOWER_ARM ? "#f472b6" : "#fbcfe8";
  for (let k = 0; k < 5; k++) { const a = k * 1.2566; cx.beginPath(); cx.arc(hx + Math.cos(a) * 4 * g, hy + Math.sin(a) * 4 * g, 3.4 * g, 0, 6.2832); cx.fill(); }
  cx.fillStyle = "#facc15"; cx.beginPath(); cx.arc(hx, hy, 2.4 * g, 0, 6.2832); cx.fill();
}
function banner(t, sub) {
  const fs = Math.min(56, cw / 9), h = fs * 2.4, y = ch * 0.3;
  const s = 1 + 0.45 * Math.max(0, 1 - fxBannerT / 9);                 // 出た瞬間だけ少し大きく弾む
  cx.save(); cx.translate(cw / 2, y + h / 2); cx.scale(s, s); cx.translate(-cw / 2, -(y + h / 2));
  cx.fillStyle = "rgba(0,0,0,0.45)"; cx.fillRect(0, y, cw, h);
  cx.fillStyle = "#fff"; cx.textAlign = "center"; cx.font = "bold " + fs + "px sans-serif"; cx.fillText(t, cw / 2, y + fs * 1.15);
  if (sub) { cx.font = fs * 0.4 + "px sans-serif"; cx.fillStyle = "#d1d5db"; cx.fillText(sub, cw / 2, y + fs * 1.85); }
  cx.restore();
}
// 画面上部の中央に、残り時間（サドンデス中は警告）を出す
function drawTimer(now) {
  if (game.ph !== "play" && game.ph !== "count") return;
  const fs = Math.max(16, Math.min(34, cw / 13)), blink = Math.floor(now / 250) % 2 === 0;
  const E2 = SD_SHRINK_FRAMES, E3 = SD_SHRINK_FRAMES + SD_HOLD_FRAMES;
  let text, color;
  if (game.sd >= E3) { text = "足場が崩れた！"; color = blink ? "#fca5a5" : "#ef4444"; }
  else if (game.sd >= E2) { text = "足場が崩れるまで " + Math.ceil((E3 - game.sd) / 60); color = blink ? "#fca5a5" : "#ef4444"; }
  else if (game.sd > 0) { text = "SUDDEN DEATH"; color = blink ? "#fca5a5" : "#ef4444"; }
  else {
    const secs = Math.max(0, Math.ceil(game.rt / 60));
    text = String(secs); color = secs <= 10 ? (blink ? "#fca5a5" : "#ef4444") : "rgba(255,255,255,0.9)";
  }
  cx.textAlign = "center"; cx.font = "bold " + fs + "px sans-serif"; cx.lineJoin = "round"; cx.lineWidth = 4; cx.strokeStyle = "rgba(0,0,0,0.55)";
  cx.strokeText(text, cw / 2, fs + 6); cx.fillStyle = color; cx.fillText(text, cw / 2, fs + 6);
}
const VIEW_W = 640;                                  // 画面幅いっぱいに映すワールドの幅（ステージ580＋余白）
const VIEW_TOP = PY - 380, VIEW_BOTTOM = PY + 80;    // いつも映しておく縦の範囲（ワールド座標）。上の台に立っていても収まる
let camTop = VIEW_TOP;                               // いま映している上端。高く跳んだ人がいると上がり、そのぶん画面が少し引く
let lastT = performance.now();
function render() {
  fitCanvas();
  const now = performance.now(), dt = Math.min(3, Math.max(0.2, (now - lastT) / 16.667));   // dt: 60fps を 1 としたときの経過フレーム数
  lastT = now;
  fxPhase(dt); updateFx(dt); updateSkillUI();
  if (role === "client" && !game.hsf) {              // 参加者側では、飛び道具をスナップショットの合間に先へ進めて滑らかに見せる
    for (const b of game.pj) { b.x += b.vx * dt; b.y += b.vy * dt; b.t += dt; if (b.k === 0) b.vy += 0.5 * dt; }
  }
  const g = cx.createLinearGradient(0, 0, 0, ch); g.addColorStop(0, "#1e293b"); g.addColorStop(1, "#0f172a");
  cx.fillStyle = g; cx.fillRect(0, 0, cw, ch);
  // いちばん高い人の頭（名前の分の余白つき）まで映す。範囲が広がったぶんだけ画面を引き、ステージは下端に残す
  const portrait = window.innerHeight > window.innerWidth;          // 縦持ち。映す範囲の上を少し詰めて、ステージを画面の上寄りにする（上の台に立つ人と名前は収まる高さ）
  let top = portrait ? PY - 320 : VIEW_TOP;
  for (const p of game.p) if (p && p.c && p.al) top = Math.min(top, p.y - 30);
  camTop += (top - camTop) * (top < camTop ? 0.2 : 0.08);
  const sc = Math.min(cw / (VIEW_W * (game.nf >= 3 ? WIDE_SCALE : 1)), ch / (VIEW_BOTTOM - camTop));   // 3〜4 人のステージは広いので、そのぶん広く映す
  // 画面の揺れ（強さは毎フレーム減衰する）
  let ox = 0, oy = 0;
  if (shakeAmp > 0.25) { ox = (Math.random() * 2 - 1) * shakeAmp; oy = (Math.random() * 2 - 1) * shakeAmp; shakeAmp *= Math.pow(0.86, dt); }
  else shakeAmp = 0;
  cx.save();
  cx.translate(ox + cw / 2 - (PX + PW / 2) * sc, oy + ch / 2 - ((camTop + VIEW_BOTTOM) / 2) * sc);
  cx.scale(sc, sc);
  // ステージ（メイン＋人数に応じた上の台）。サドンデス中は縮んでいく端が赤く点滅する
  const sdOn = game.sd > 0, blink = Math.floor(now / 250) % 2 === 0;
  for (const pl of platforms()) {
    if (pl.main) {
      cx.fillStyle = "#64748b"; cx.fillRect(pl.x, pl.y, pl.w, 22);
      cx.fillStyle = "#475569"; cx.fillRect(pl.x + 20, pl.y + 22, Math.max(0, pl.w - 40), 30);
    } else {
      cx.fillStyle = "rgba(100,116,139,0.85)"; cx.fillRect(pl.x, pl.y, pl.w, UP_H);   // 下からは通り抜けられる台
      cx.fillStyle = "#94a3b8"; cx.fillRect(pl.x, pl.y, pl.w, 3);                      // 上面（ここに乗れる）
    }
    if (sdOn) {
      cx.fillStyle = blink ? "#ef4444" : "#b91c1c";
      const th = pl.main ? 22 : UP_H;
      cx.fillRect(pl.x, pl.y, 5, th); cx.fillRect(pl.x + pl.w - 5, pl.y, 5, th);
    }
  }
  for (const f of game.fl) drawFlower(f, now);
  // プレイヤーと分身（吹っ飛んでいる間は残像を引く）
  const drawWithTrail = (p, i, me) => {
    if (role === "client" && p.tx !== undefined) { p.x += (p.tx - p.x) * 0.6; p.y += (p.ty - p.y) * 0.6; }
    const h = p.hist || (p.hist = []);
    h.push(p.x, p.y); if (h.length > 14) h.splice(0, 2);
    if (p.al && p.s > 0) {
      cx.save(); cx.fillStyle = p.isClone ? CLONE_COLOR : COLORS[i];
      const tz = p.gt > 0 ? GIANT_SCALE : 1;
      for (let k = 0; k < h.length - 2; k += 2) { cx.globalAlpha = 0.05 + 0.2 * (k / h.length); cx.fillRect(h[k], h[k + 1], PLW * tz, PLH * tz); }
      cx.restore();
    }
    drawPlayer(p, i, me, now);
  };
  for (let i = 0; i < MAX_PLAYERS; i++) { const c = game.cl[i]; if (c) drawWithTrail(c, i, false); }
  for (let i = 0; i < MAX_PLAYERS; i++) { const p = game.p[i]; if (p && p.c) drawWithTrail(p, i, i === myId); }
  for (const b of game.pj) { if (b.k === 0) drawBomb(b, now); else drawArrow(b); }
  drawFx();
  cx.restore();
  if (flashA > 0.02) { cx.fillStyle = "rgba(255,255,255," + flashA.toFixed(3) + ")"; cx.fillRect(0, 0, cw, ch); flashA *= Math.pow(0.8, dt); }
  else flashA = 0;
  // メッセージ
  drawTimer(now);
  if (game.ph === "count") banner(String(Math.ceil(game.tm / 60)), "ラウンド開始！");
  else if (game.ph === "round") banner(game.win >= 0 ? nameOf(game.win) + " の勝ち！" : "引き分け");
  else if (game.ph === "match") banner(nameOf(game.win) + " 優勝！", "まもなくロビーに戻ります");
  else if (game.ph === "play") {
    if (fxSdT > 0) banner("サドンデス！", "足場が縮みます");
    else if (fxGoT > 0) banner("GO!");
    if (myId >= 0 && game.p[myId] && !game.p[myId].al) {
      cx.fillStyle = "rgba(255,255,255,.6)"; cx.font = "18px sans-serif"; cx.textAlign = "center";
      cx.fillText("観戦中", cw / 2, Math.max(16, Math.min(34, cw / 13)) + 34);
    }
  }
}
function loop() { render(); requestAnimationFrame(loop); }

renderUI();
loop();
</script>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="you know games">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>you know games</title>
<script>
// 招待リンクの読みかえ。前からの「?zone=」（シールドファイト）と「?room=」（ジェンガ）は、そのゲームのページへそのまま送る
(function () {
  const q = new URLSearchParams(location.search);
  const to = q.has("zone") ? "shieldfight/" : q.has("room") ? "jenga/" : null;
  if (to) location.replace(to + location.search + location.hash);
})();
</script>
<style>
  :root { --bg:#111827; --card:#1c2636; --line:#2c3a52; --text:#e5e7eb; --sub:#9aa3b5; --accent:#f0b25a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif; }
  body { padding:calc(env(safe-area-inset-top) + 28px) 16px calc(env(safe-area-inset-bottom) + 28px); }
  main { max-width:480px; margin:0 auto; }
  h1 { margin:0; font-size:34px; letter-spacing:.02em; }
  h1 span { color:var(--accent); }
  .lead { margin:6px 0 24px; color:var(--sub); font-size:14px; }
  .games { display:grid; gap:12px; }
  a.game { display:flex; align-items:center; gap:14px; padding:14px; border-radius:16px; background:var(--card); border:1px solid var(--line); color:inherit; text-decoration:none; }
  a.game:active { transform:scale(.98); }
  .icon { flex:none; width:72px; height:72px; border-radius:16px; overflow:hidden; background:#0f141f; display:grid; place-items:center; }
  .icon img, .icon svg { width:100%; height:100%; display:block; }
  .name { font-size:20px; font-weight:800; }
  .desc { font-size:13px; color:var(--sub); margin-top:4px; line-height:1.5; }
  .tags { margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; }
  .tags span { font-size:11px; padding:2px 8px; border-radius:99px; background:#2a3142; color:var(--sub); }
  .go { margin-left:auto; color:var(--sub); font-size:22px; }
  .foot { margin-top:28px; font-size:12px; color:var(--sub); line-height:1.6; }
  button.install { margin-top:20px; width:100%; padding:14px; border:0; border-radius:12px; font:inherit; font-weight:700; font-size:16px; background:var(--accent); color:#2a1a05; }
</style>
</head>
<body>
<main>
  <h1>you know <span>games</span></h1>
  <p class="lead">友だちとあそべるミニゲーム集</p>
  <div class="games">
    <a class="game" href="shieldfight/">
      <div class="icon"><img src="icon-192.png" alt=""></div>
      <div><div class="name">シールドファイト</div>
        <div class="desc">盾が外れた隙を突いて、相手をステージから落とす対戦ゲーム</div>
        <div class="tags"><span>1〜4人</span><span>オンライン</span><span>CPU戦</span></div></div>
      <div class="go">›</div>
    </a>
    <a class="game" href="jenga/">
      <div class="icon"><svg viewBox="0 0 72 72" aria-hidden="true">
        <rect width="72" height="72" fill="#1b2a3f"/>
        <g stroke="#7a5230" stroke-width="1.2">
          <rect x="18" y="52" width="36" height="8" fill="#dcb47c"/>
          <rect x="18" y="44" width="11" height="8" fill="#d2a86e"/><rect x="30.5" y="44" width="11" height="8" fill="#e2bd88"/><rect x="43" y="44" width="11" height="8" fill="#d2a86e"/>
          <rect x="18" y="36" width="36" height="8" fill="#e0b880"/>
          <rect x="18" y="28" width="11" height="8" fill="#d2a86e"/><rect x="43" y="28" width="11" height="8" fill="#d8b076"/>
          <rect x="18" y="20" width="36" height="8" fill="#dcb47c"/>
          <rect x="24" y="12" width="36" height="8" fill="#e6c48f" transform="rotate(-6 42 16)"/>
        </g></svg></div>
      <div><div class="name">ジェンガ</div>
        <div class="desc">ブロックを抜いて上に積む。崩した人の負け（3D・本物っぽい物理）</div>
        <div class="tags"><span>1〜4人</span><span>オンライン</span><span>1台で交代</span></div></div>
      <div class="go">›</div>
    </a>
    <a class="game" href="soinsu/">
      <div class="icon"><svg viewBox="0 0 72 72" aria-hidden="true">
        <rect width="72" height="72" fill="#8fb8e8"/>
        <rect y="50" width="72" height="22" fill="#6f9a5a"/>
        <rect x="9" y="7" width="54" height="22" rx="6" fill="#0a0f1e" stroke="#ffd400" stroke-width="2"/>
        <text x="36" y="24" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="15" fill="#fff">360</text>
        <circle cx="36" cy="37" r="6" fill="#ffe0bd"/>
        <rect x="29" y="43" width="14" height="22" rx="7" fill="#4aa3ff"/>
      </svg></div>
      <div><div class="name">素因数バトル</div>
        <div class="desc">頭の数字を素因数分解して打ち込む。間違えると自分が弱くなる</div>
        <div class="tags"><span>1〜8人</span><span>オンライン</span><span>CPU戦</span></div></div>
      <div class="go">›</div>
    </a>
  </div>
  <button class="install" id="install" hidden>アプリとして入れる</button>
  <p class="foot" id="foot"></p>
</main>
<script>
// アプリとして入れる（Android の Chrome など）。iPhone は共有ボタンから
let installEvt = null;
const standalone = matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches || navigator.standalone;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (!standalone) document.getElementById("install").hidden = false; });
document.getElementById("install").onclick = () => { if (!installEvt) return; installEvt.prompt(); document.getElementById("install").hidden = true; installEvt = null; };
if (/iPhone|iPad/.test(navigator.userAgent) && !standalone)
  document.getElementById("foot").textContent = "アプリのように使うには: 共有ボタン（□↑）→「ホーム画面に追加」";
try { if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<!-- ホーム画面に追加して開くと、アドレスバーなしで起動する（iPhone は全画面の機能がないので、これが画面を広く使う唯一の方法） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="シールドファイト">
<meta name="theme-color" content="#111827">
<title>シールドファイト</title>
<style>
  html,body{margin:0;height:100%;background:#111827;color:#e5e7eb;font-family:system-ui,"Yu Gothic",sans-serif;overflow:hidden}
  :root{--b:min(21vw,92px);--g:8px;--sh:124px}   /* 操作ボタンの大きさ / ボタン同士のすき間 / 下のプレイヤー情報の高さ（縦持ちで固定） */
  /* 画面構成: 上=戦闘画面 / 中=操作ボタン（スマホのみ）/ 下=プレイヤー情報 */
  #wrap{position:relative;display:flex;flex-direction:column;width:100%;height:100vh;height:100dvh}
  #stats{display:none;flex:none;align-items:center;box-sizing:border-box;width:min(100%,620px);min-height:var(--sh);margin:0 auto;padding:4px 3px calc(6px + env(safe-area-inset-bottom))}
  /* 戦闘中のプレイヤー情報: 1 人ぶんのカードを横に並べ、カードの中は縦に（名前 / キャラ / 攻撃 / 防御 / スピード）。
     文字と棒の大きさはカードの幅に合わせて変わる（cqw）。人数が少ないほど大きく、4 人でも読める大きさにする */
  .pcs{flex:1 1 auto;display:flex;justify-content:center;gap:3px;min-width:0}
  .pc{container-type:inline-size;flex:1 1 0;min-width:0;max-width:230px;box-sizing:border-box;padding:4px 3px 5px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid transparent;font-size:11px;line-height:1.25}
  .pc.me{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28)}
  .pc b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-size:clamp(11px,13.8cqw,16px)}
  .pc .sub{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:3px;color:#9ca3af;white-space:nowrap;font-size:11px;font-size:clamp(9.5px,11.7cqw,13px)}
  .pc .sub span:first-child{overflow:hidden;text-overflow:ellipsis}
  .pc .wn{flex:none;display:flex;align-items:center}
  .pc .wn i{display:block;width:.62em;height:.62em;margin-left:.22em;box-sizing:border-box;border:1px solid currentColor;border-radius:50%}
  .pc .wn i.on{background:currentColor}
  .pc .pr{display:flex;align-items:center;gap:3px;height:17px;height:clamp(15px,18cqw,20px)}
  .pc .lb{flex:0 0 4.1em;white-space:nowrap;font-size:10.5px;font-size:clamp(9px,11.2cqw,12.5px)}
  .pc .g{flex:1 1 0;min-width:0;display:flex;gap:1px}
  .pc .g i{flex:1;height:10px;height:clamp(8px,10.6cqw,12px);border-radius:1px;background:#374151}
  .pc .g i.on{background:var(--c)}
  .pc .g i.up{background:#fff;box-shadow:0 0 5px var(--c),inset 0 0 0 2px var(--c)}   /* 狂化・巨大化の上乗せぶん */
  .pc .g i.dn{background:#450a0a;box-shadow:inset 0 0 0 1px #ef4444}                     /* 狂化で下がったぶん */
  #box{position:relative;flex:1 1 0;min-height:0;width:100%}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  /* 画面の上のボタン。ホーム画面から開いた iPhone などでは、時計・電池の帯やカメラの切り欠き（safe-area）を避ける */
  #mute{position:absolute;top:calc(6px + env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));z-index:3;width:34px;height:34px;padding:0;margin:0;border-radius:50%;background:rgba(255,255,255,.14);font-size:16px;line-height:1}
  #fs{display:none;position:absolute;top:calc(6px + env(safe-area-inset-top));right:calc(max(8px,env(safe-area-inset-right)) + 40px);z-index:3;width:34px;height:34px;padding:0;margin:0;border-radius:50%;background:rgba(255,255,255,.14);line-height:0}
  #fs svg{width:18px;height:18px}
  body.fsok #fs{display:block}
  #rot{display:none;position:absolute;top:calc(6px + env(safe-area-inset-top));right:calc(max(8px,env(safe-area-inset-right)) + 80px);z-index:3;width:34px;height:34px;padding:0;margin:0;border-radius:50%;background:rgba(255,255,255,.14);line-height:0}
  #rot svg{width:18px;height:18px}
  body.rotok:not(.battle) #rot{display:block}                          /* 縦横の切り替えは、戦闘中以外に出す */
  #quit{display:none;position:absolute;top:calc(6px + env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));z-index:3;height:34px;padding:0 12px;margin:0;border-radius:17px;background:rgba(255,255,255,.14);font-size:13px;line-height:1}
  body.solo.battle #quit{display:block}
  #skillhint{display:none;position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:3;padding:4px 12px;border-radius:999px;background:rgba(0,0,0,.5);font-size:12px;pointer-events:none;white-space:nowrap}
  @media (pointer:fine){body.battle #skillhint{display:block}}

  /* メニュー共通 */
  .panel{pointer-events:auto;background:rgba(17,24,39,.94);border:1px solid #374151;border-radius:12px;padding:18px 24px;text-align:center;max-width:92%;max-height:calc(100% - 16px);overflow:auto;box-sizing:border-box}
  .panel h1{margin:0 0 8px;font-size:26px}
  .panel p{margin:6px 0;color:#9ca3af;font-size:13px}
  button{font:inherit;background:#3b82f6;color:#fff;border:0;border-radius:8px;padding:10px 20px;margin:6px 4px;cursor:pointer}
  button.sub{background:#4b5563}
  button:disabled{background:#4b5563;opacity:.55;cursor:default}
  input{font:inherit;width:100%;box-sizing:border-box;padding:8px;border-radius:6px;border:1px solid #4b5563;background:#111827;color:#e5e7eb}
  .code{font-size:48px;font-weight:bold;letter-spacing:12px;line-height:1.1}
  .pl{margin:3px 0;font-size:15px}
  .pl .ok{color:#4ade80;font-size:12px;margin-left:6px}
  .pl .wt{color:#9ca3af;font-size:12px;margin-left:6px}

  /* キャラ選択画面 */
  .panel.setup{width:min(92%,420px)}
  .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
  .chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 4px;margin:0;border-radius:10px;background:#1f2937;border:2px solid transparent;font-size:10px;line-height:1.2;color:#e5e7eb}
  .chip canvas{position:static;inset:auto;width:36px;height:50px}
  .chip.on{border-color:#facc15;background:#374151}
  .detail{text-align:left;background:#111827;border:1px solid #374151;border-radius:10px;padding:10px 12px;margin:6px 0}
  .detail h2{margin:0;font-size:17px}
  .detail .tag{color:#9ca3af;font-size:12px;margin:2px 0 6px}
  .detail .skl{font-size:12px;margin-top:8px;line-height:1.5;color:#d1d5db}
  .detail .skl b{color:#facc15}
  .detail .trait{color:#fca5a5}

  /* CPU 戦の設定 */
  .cpuset{text-align:left;background:#111827;border:1px solid #374151;border-radius:10px;padding:6px 12px;margin:6px 0}
  .cpuset .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0;font-size:13px;color:#d1d5db}
  .cpuset .hint{margin:-2px 0 6px;font-size:11px;color:#9ca3af;text-align:left}
  .seg{display:inline-flex;gap:4px}
  .seg button{margin:0;padding:6px 12px;background:#374151;font-size:13px}
  .seg button.on{background:#3b82f6}
  .seg button:disabled{opacity:.4}
  .wrv{display:inline-block;min-width:2.4em;text-align:center;align-self:center;font-weight:bold;color:#e5e7eb}   /* 何本先取か（− 3 ＋） */
  .rounds{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0 2px;font-size:13px;color:#d1d5db}
  select{font:inherit;font-size:13px;background:#1f2937;color:#e5e7eb;border:1px solid #4b5563;border-radius:6px;padding:5px 6px;max-width:60%}

  /* 戦闘中: 画面上部のステータス表（横向きの棒グラフ） */
  .st-r{display:flex;align-items:center;gap:6px;height:30px;padding:0 4px;border-radius:5px}
  .st-r.me{background:rgba(255,255,255,.08)}
  .st-r .nm{flex:0 0 84px;overflow:hidden;line-height:1.15;font-size:13px;font-weight:bold}
  .st-r .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .st-r .nm small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;font-weight:normal;color:#9ca3af}
  .st-r .g{flex:1 1 0;min-width:0;display:flex;gap:2px}
  .st-r .g i{flex:1;height:9px;border-radius:2px;background:#374151}
  .st-r .g i.on{background:var(--c)}
  .st-r .g i.up{background:#fff;box-shadow:0 0 5px var(--c),inset 0 0 0 2px var(--c)}   /* 狂化・巨大化の上乗せぶん */
  .st-r .wn{flex:0 0 42px;text-align:right;font-size:11px;letter-spacing:1px}
  .st-r.st-h{height:16px}
  .st-r.st-h .g{font-size:11px;line-height:16px;display:block}
  .detail .st-r{height:20px;padding:0}
  .detail .st-r .nm{flex-basis:64px}

  /* 操作ボタン（スマホのみ・戦闘中だけ表示）。ジャンプと攻撃を横に並べ、スキルをその上の真ん中に置く（3つの中心が正三角形） */
  #touch{display:none;flex:none;justify-content:space-between;align-items:flex-end;box-sizing:border-box;padding:0 16px calc(20px + env(safe-area-inset-bottom));pointer-events:none}
  #touch>div{pointer-events:auto}
  #dpad{display:flex;gap:10px}
  .tb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:var(--b);height:var(--b);background:rgba(255,255,255,.18);border-radius:18px;font-size:calc(var(--b)*.38);user-select:none;-webkit-user-select:none;touch-action:none}
  .tb:active{background:rgba(255,255,255,.35)}
  #rbtns{position:relative;width:calc(var(--b)*2 + var(--g));height:calc(var(--b) + (var(--b) + var(--g))*.866)}
  #rbtns .tb{position:absolute;border-radius:50%}
  .tb.jump{right:0;bottom:0;background:rgba(59,130,246,.4);font-size:11px;font-weight:bold;gap:2px}
  .tb.jump svg{width:calc(var(--b)*.44);height:calc(var(--b)*.44)}
  .tb.atk{left:0;bottom:0;font-size:calc(var(--b)*.4);background:rgba(239,68,68,.4)}
  .tb.skill{left:calc((var(--b) + var(--g))/2);top:0;background:rgba(168,85,247,.45);font-weight:bold;overflow:hidden;gap:0}
  .tb.skill b{font-size:11px;line-height:1.1;max-width:88%;text-align:center}
  .tb.skill i{font-style:normal;font-size:calc(var(--b)*.28);line-height:1.1;min-height:1em}
  .tb.skill::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.6) calc(var(--p,0)*1turn),transparent 0);pointer-events:none}
  .tb.skill[data-state="none"]{opacity:.28}
  .tb.skill[data-state="ready"]{box-shadow:0 0 0 3px rgba(250,204,21,.65)}
  .tb.skill[data-state="charge"]{background:rgba(250,204,21,.6)}
  @media (pointer:coarse){body.battle #touch{display:flex}}
  /* スマホ縦持ち: ボタンを画面の下端から持ち上げる（親指が届きやすいように）。ぶんだけ戦闘画面は縦に縮む */
  @media (pointer:coarse) and (orientation:portrait){
    /* 操作ボタンの下端を、画面の下から「プレイヤー情報の高さ + 持ち上げ分」の位置に置く。持ち上げ分は画面の高さに比例（840px の画面で約 109px） */
    #touch{padding-bottom:calc(20px + clamp(0px, 25dvh - var(--sh) + 23px, 130px))}
  }
  /* スマホ横持ち: 画面の下端に重ねる */
  @media (pointer:coarse) and (orientation:landscape){
    :root{--b:min(12vw,64px)}
    #touch{position:absolute;left:0;right:0;bottom:6px;padding:0 16px}
    #dpad{gap:8px}
  }
  /* 4 人戦をスマホの縦持ち（高さに余裕のある画面）で遊ぶときは、カードを 2×2 に並べて大きくする（操作ボタンの下の余白を使う） */
  @media (pointer:coarse) and (orientation:portrait) and (min-height:700px){
    body.q4{--sh:218px}
    body.q4 .pcs{display:grid;grid-template-columns:1fr 1fr;gap:4px;align-content:center}
    body.q4 .pc{max-width:none;padding:4px 8px 5px}
    body.q4 .pc b{font-size:15px}
    body.q4 .pc .sub{font-size:12px}
    body.q4 .pc .pr{height:18px}
    body.q4 .pc .lb{font-size:11.5px}
    body.q4 .pc .g i{height:11px}
  }
  /* 高さが足りない横長画面: プレイヤー情報は画面の下の中央に小さく重ねる（スマホなら左右の操作ボタンのあいだ） */
  @media (orientation:landscape) and (max-height:520px){
    #stats{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:min(70%,520px);min-height:0;z-index:3;padding:2px 3px;background:rgba(17,24,39,.6);border-radius:8px;pointer-events:none}
    .pc{padding:2px 3px}
    .pc b{font-size:10px}
    .pc .sub{font-size:9px;margin-bottom:1px}
    .pc .pr{height:11px}
    .pc .lb{font-size:8.5px}
    .pc .g i{height:6px}
  }
  @media (pointer:coarse) and (orientation:landscape) and (max-height:520px){
    #stats{width:calc(100% - 340px);max-width:520px}
  }
  /* 横画面モード（スマホの横持ち。JS が body.land を付ける）: 戦闘画面を画面いっぱいに使い、操作ボタンとプレイヤー情報は半透明で上に重ねる。
     ボタンは大きく（画面の高さに比例）、左下に ◀ ▶、右下に ジャンプ・攻撃・スキル（正三角形）。プレイヤー情報は上部に小さく、名前・キャラ名・勝ち数だけ */
  body.land{--b:clamp(62px,27vh,116px);--g:10px;--bin:7vw}         /* --bin: 左右の端から、中央へ寄せるぶん */
  body.land.battle #touch{display:flex}
  body.land #touch{position:absolute;left:0;right:0;bottom:0;padding:0 calc(max(20px,env(safe-area-inset-right)) + var(--bin)) calc(12px + env(safe-area-inset-bottom)) calc(max(20px,env(safe-area-inset-left)) + var(--bin))}
  body.land #dpad{gap:calc(var(--g)*1.2)}
  body.land .tb{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 2px rgba(255,255,255,.26)}
  body.land .tb:active{background:rgba(255,255,255,.32)}
  body.land .tb.jump{background:rgba(59,130,246,.28);font-size:calc(var(--b)*.16)}
  body.land .tb.atk{background:rgba(239,68,68,.28)}
  body.land .tb.skill{background:rgba(168,85,247,.3)}
  body.land .tb.skill b{font-size:calc(var(--b)*.16)}
  body.land .tb.jump:active{background:rgba(59,130,246,.55)}
  body.land .tb.atk:active{background:rgba(239,68,68,.55)}
  body.land .tb.skill:active{background:rgba(168,85,247,.55)}
  body.land .tb.skill[data-state="ready"]{box-shadow:0 0 0 3px rgba(250,204,21,.7),inset 0 0 0 2px rgba(250,204,21,.4)}
  body.land .tb.skill[data-state="charge"]{background:rgba(250,204,21,.5)}
  body.land #stats{position:absolute;top:0;left:0;right:0;bottom:auto;transform:none;width:auto;max-width:none;min-height:0;margin:0;z-index:2;
    padding:max(4px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left));
    background:none;border-radius:0;align-items:flex-start;justify-content:space-between;pointer-events:none}
  body.land #quit{top:calc(48px + env(safe-area-inset-top))}          /* 「やめる」は左のカードの下、音のボタンは上のまん中（残り時間の右）、全画面ボタンは残り時間の左 */
  body.land #mute{right:auto;left:calc(50% + 30px)}
  body.land #fs{right:auto;left:calc(50% - 64px)}
  body.fson.battle #fs{display:none}                                  /* 全画面で戦っている間は出さない（戻すのは画面の端から引く操作でもできる） */
  .hg{display:flex;gap:5px;min-width:0}
  .hc{display:flex;align-items:center;gap:6px;box-sizing:border-box;padding:3px 8px 4px;border-radius:8px;background:rgba(15,23,42,.55);border:1px solid rgba(255,255,255,.08);line-height:1.2;min-width:0}
  .hc.me{border-color:rgba(255,255,255,.4)}
  .hc b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:6.6em;font-size:13px;font-size:clamp(11px,3.3vh,14px);color:var(--c)}
  .hc .sub{display:flex;align-items:center;gap:6px;color:#cbd5e1;white-space:nowrap;font-size:11px;font-size:clamp(10px,2.7vh,12px)}
  .hc .wn{display:flex;align-items:center;color:var(--c)}
  .hc .wn i{display:block;width:.7em;height:.7em;margin-left:.25em;box-sizing:border-box;border:1px solid currentColor;border-radius:50%}
  .hc .wn i.on{background:currentColor}
  .hs{display:flex;flex-direction:column;gap:2px}                      /* 自分のカードだけ付く性能の棒（攻撃・防御・スピード） */
  .hs .g{display:flex;gap:1px;width:34px}
  .hs .g i{flex:1;height:4px;border-radius:1px;background:#374151}
  .hs .g i.on{background:var(--c)}
  .hs .g i.up{background:#fff;box-shadow:0 0 4px var(--c)}
  .hs .g i.dn{background:#450a0a;box-shadow:inset 0 0 0 1px #ef4444}
  @media (max-width:700px){body.land .hc{padding:2px 5px 3px;gap:4px}body.land .hc b{max-width:4.6em}body.land .hs .g{width:26px}}
  /* 横画面のメニュー: 縦に長いパネルを 2 列に組んで、スクロールしなくても決定まで届くようにする（左: 名前とキャラ一覧 / 右: 詳細と決定） */
  .cols{display:block}
  body.land .panel{padding:10px 18px}
  body.land .panel h1{font-size:20px;margin:0 0 4px}
  body.land .panel p{margin:3px 0;font-size:12px}
  body.land .panel .cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:0 18px;align-items:start}
  body.land .panel.setup{width:min(96%,880px)}
  body.land .panel.lobby{width:min(96%,700px)}
  body.land .panel.setup input{padding:6px 8px}
  /* キャラ一覧は 6 列（16 体で 3 段）。ブラウザのアドレスバーで高さが 280px ほどしかなくても収まるよう小さくし、それでも足りなければ左の列だけスクロールする */
  body.land .panel.setup .colL{max-height:calc(100dvh - 40px);overflow:auto}
  body.land .panel.setup .colL > p{display:none}
  body.land .panel.setup .chips{grid-template-columns:repeat(6,1fr);margin:5px 0 0;gap:3px}
  body.land .panel.setup .chip canvas{width:24px;height:34px}
  body.land .panel.setup .chip{padding:3px 1px 2px;font-size:9px;white-space:nowrap;overflow:hidden}
  body.land .panel.setup .chip span{max-width:100%;overflow:hidden}
  body.land .panel.setup h1{font-size:17px;margin:0 0 2px}
  /* 「決定」「戦闘開始」は、右の列をスクロールしなくても見えるよう、列の下端に貼り付ける */
  body.land .panel.setup .colR > #bOk, body.land .panel.setup .btns{position:sticky;bottom:0;z-index:1;background:rgba(17,24,39,.97);box-shadow:0 -6px 8px rgba(17,24,39,.9)}
  body.land .panel.setup .colR > #bOk{margin:4px 0 0}
  body.land .panel.setup .colR{display:flex;flex-direction:column;align-items:stretch;max-height:calc(100dvh - 44px);overflow:auto}
  body.land .panel.setup .detail{margin:0 0 4px;padding:8px 10px}
  body.land .panel.setup .detail .skl{font-size:11px;line-height:1.45;margin-top:5px}
  body.land .panel.setup .colR button{margin:3px 4px;padding:8px 16px}
  body.land .code{font-size:36px;letter-spacing:8px}
  body.land .panel.lobby button{margin:4px}
  body.land .panel.setup .btns{display:flex;gap:4px}
  body.land .panel.setup .btns button{flex:1 1 0}

"use strict";
// ---------- 定数 ----------

const WIDE_SCALE = 1.2, CENTER_X = PX + PW / 2;
const widen = (pl, k) => Object.assign({}, pl, { x: CENTER_X + (pl.x - CENTER_X) * k, w: pl.w * k });
function layoutFor(n) {

// ローの ROOM: 押している間だけ円が広がり（上限なし）、離すとその場所に 5 秒残る。円の中では、攻撃ボタンで敵の背後へ回り込んで攻撃し、スキルボタンで入れ替える。

const ROOM_R0 = 40, ROOM_LIFE = 300, ROOM_SWAP_GAP = 6;                  // 押した瞬間の半径 / 円が残る時間（5 秒）/ 入れ替えの間隔（0.1 秒）

//   半径 = 40 + 10.5 × 25 × (1 − e^(−ため/25)) + 1.5 × ため（0.25 秒で約 240px、0.5 秒で約 320px、1 秒で約 390px、2 秒で約 550px）

// ---------- キャラクター ----------

const effA = p => statOf(p, "A");
const effD = p => statOf(p, "D");
const effS = p => statOf(p, "S");
const szOf = p => p.gt > 0 ? GIANT_SCALE : 1;                // 巨大化中は 2 倍の大きさ
const pwOf = p => PLW * szOf(p), phOf = p => PLH * szOf(p);
const dzMul = t => t.dz > 0 ? DOGEZA_KNOCK : 1;              // 土下座中は吹っ飛びにくい

// rm: ローの ROOM（持ち主ごとに 1 つまで）

// いま使える足場。サドンデス中は縮む（上の台は早く消え、メインは最小幅まで縮んだあとすべて崩れる）
function platforms() {
  const base = LAYOUTS[Math.max(0, Math.min(4, game.nf | 0))], sd = game.sd | 0;
  if (sd <= 0) return base;
  const out = [];
  for (const pl of base) {
    const half = pl.w / 2;
    const inset = pl.main
      ? (sd >= SD_SHRINK_FRAMES + SD_HOLD_FRAMES ? half : (pl.w - SD_MIN_W) / 2 * Math.min(1, sd / SD_SHRINK_FRAMES))
      : half * Math.min(1, sd / SD_UP_FRAMES);
    if (inset >= half) continue;                       // 消えた足場
    out.push({ x: pl.x + inset, y: pl.y, w: pl.w - inset * 2, main: pl.main });
  }

}

  let c = Math.round(Number(d.c));
  if (d.c == null || !Number.isFinite(c) || c < 0 || c >= CHARS.length) c = 0;
  return { n, c };
}

function shieldUp(p) {
  const c = chOf(p);

// battle=true: 戦闘のスタート位置（2人目まではメインの通常位置、3人目以降は上の台に1人ずつ）

    else { const m = layoutFor(n).slice(-1)[0], k = n >= 3 ? WIDE_SCALE : 1; x = [m.x + 150 * k, m.x + m.w - 150 * k - PLW][slot]; }   // メインの左右

function connectedSlots() {
  const r = [];
  for (let i = 0; i < MAX_PLAYERS; i++) if (game.p[i] && game.p[i].c) r.push(i);
  return r;
}
const readySlots = () => connectedSlots().filter(i => game.p[i].rd);

function startRound() {
  const fighters = readySlots();
  game.nf = fighters.length;                // 人数でステージの形が変わる
  game.rt = ROUND_FRAMES; game.sd = 0; game.hs = 0;
  clearEntities();
  for (const s of connectedSlots()) {
    const p = game.p[s], idx = fighters.indexOf(s);
    p.own = s;
    if (idx >= 0) { spawn(p, idx, fighters.length, true); p.al = true; p.lk = true; p.lv = chOf(p).lives || 0; }
    else p.al = false;                    // 選んでいる最中の人は観戦（次のラウンドから参加）
  }
  game.ph = "count"; game.tm = 180; game.win = -1;
}

function hostStartMatch() {
  if (role !== "host" || game.ph !== "lobby" || readySlots().length < 2) return;
  readySlots().forEach(s => game.p[s].w = 0);
  game.wr = winRounds;                                     // 何本先取か（この試合の間は変わらない）
  startRound();
}

function toLobby() {
  const slots = connectedSlots();
  slots.forEach((s, idx) => { const p = game.p[s]; p.w = 0; p.lk = false; p.lv = 0; spawn(p, idx, slots.length); p.al = true; });
  game.ph = "lobby"; game.win = -1; game.nf = 0;
  game.rt = ROUND_FRAMES; game.sd = 0; game.hs = 0;
  clearEntities();
}

// 戦っている全員（プレイヤーと分身）。own は持ち主のスロットで、同じ持ち主どうしは当たらない
function ents() {
  const r = [];
  for (let i = 0; i < MAX_PLAYERS; i++) {
    const p = game.p[i];
    if (p && p.c && p.al) { p.own = i; r.push(p); }
    const c = game.cl[i];
    if (c && c.al) r.push(c);
  }
  return r;
}

// ---- スキル ----
function aimAtFoe(p) {                       // 居合斬り: 右を向いていても、左に敵がいれば左へ踏み込む
  let best = null, bd = 1e9;
  for (const e of ents()) {
    if (e.own === p.own || untouchable(e)) continue;
    const d = Math.abs(ecx(e) - ecx(p)) + 1.5 * Math.abs(e.y + phOf(e) - (p.y + phOf(p)));
    if (d < bd) { bd = d; best = e; }
  }
  const sg = best ? Math.sign(ecx(best) - ecx(p)) : 0;
  if (sg) p.f = sg;
}
function useSkill(p) {                       // 押した瞬間に発動するスキル
  const id = chOf(p).id;
  if (id === "bomber") {
    game.pj.push({ k: 0, x: ecx(p) + p.f * 18, y: p.y + 14, vx: p.f * 3.75 + p.vx * 0.25, vy: -8.5, own: p.own, t: 0 });   // 飛ぶ距離は以前の半分
  } else if (id === "samurai") {

    aimAtFoe(p);                             // いちばん近い敵のほうを向く

    if (!plantFlower(p)) return false;

    p.bz = BZ_FRAMES;
  } else if (id === "knight") {
    p.cn = CN_FRAMES; p.cnHit = false;

    p.gh = GH_FRAMES;

    p.gt = GIANT_FRAMES; p.x -= PLW / 2; p.y -= PLH;     // 足もとの中心を保ったまま 2 倍の大きさになる
  } else if (id === "clock") {                 // 巻き戻し: 記録した通り道を、新しい順に早戻りでたどる（吹っ飛びも止まる）
    if (p.tl.length < 2) return false;

    p.gr = 1; p.grT = null; p.grH = 0; p.grD = 0; p.f0 = p.f; p.s = 0;
  } else if (id === "tengu") {                 // 風の場: 前方（体の中心から少し後ろを含む）に、足もとより少し下まで
    const feet = p.y + phOf(p), x = p.f > 0 ? ecx(p) - 30 : ecx(p) + 30 - WIND_W;
    game.wd = game.wd.filter(w => w.own !== p.own);

}
function fireHold(p) {                       // ためて離すスキル
  const sk = chOf(p).skill, c = Math.min(1, p.ks / sk.maxCharge), id = chOf(p).id, ks = p.ks;

// ---- 時計師: 巻き戻し ----
// 戻る道（新しい順）を 1 フレームに RW_SPEED ぶんずつたどる。体は記録どおりに動き、足場や重力の影響を受けない
function rewindStep(p) {
  const path = p.rwPath;
  if (!path || !path.length) { p.rw = 0; p.rwPath = null; return; }
  p.rwI = Math.min(path.length - 1, p.rwI + RW_SPEED);
  const e = path[p.rwI];
  p.x = e[0]; p.y = e[1]; p.f = e[2]; p.vx = p.vy = 0;
  if (--p.rw <= 0 || p.rwI >= path.length - 1) { p.rw = 0; p.dj = e[3]; p.ground = e[4]; p.rwPath = null; }
}

// ---- ロー: ROOM ----
// 体のいちばん近い点が、円の中心から r 以内なら「円の中」
function distToBody(x, y, e) {
  const nx = Math.max(e.x, Math.min(x, e.x + pwOf(e))), ny = Math.max(e.y, Math.min(y, e.y + phOf(e)));
  return Math.hypot(x - nx, y - ny);

const roomOf = p => game.rm.find(m => m.own === p.own) || null;            // 自分の ROOM（なければ null）
const inRoom = (m, e) => distToBody(m.x, m.y, e) <= m.r;
// ROOM の中にいる敵（透過中・復活直後・巻き戻し中・つかまれている人は除く）
const roomFoes = (p, m) => ents().filter(e => e !== p && e.own !== p.own && e.al && !untouchable(e) && e.hd === 0 && inRoom(m, e));
function openRoom(p, ks) {                     // 離した場所に、広げた大きさの円を残す（クールタイムは円が消えてから）
  const m = { own: p.own, x: ecx(p), y: ecy(p), r: roomR(ks), t: ROOM_LIFE };

function updateRooms() {
  for (let i = game.rm.length - 1; i >= 0; i--) {
    const m = game.rm[i];

function physics(p, inp, neutral) {

// スキルボタンの処理（ふつうのときと、吹っ飛ばされている最中）。何か発動したら true（先行入力を消す）

  }

// ---------- ネットワーク ----------

function startHost() {
  role = "host"; net = "connecting"; netMsg = ""; renderUI();
  roomCode = randCode();
  peer = new Peer(PREFIX + roomCode);
  peer.on("open", () => {
    net = "ready"; myId = 0; game.wr = winRounds;

    hostLast = 0; hostTimer = setInterval(hostLoop, 1000 / 60);

    net = "error"; netMsg = "接続エラー: " + e.type; renderUI();
  });

    conn.on("open", () => {
      let slot = -1;

      if (slot < 0) { conn.send({ t: "full" }); setTimeout(() => conn.close(), 300); return; }

      p.al = game.ph === "lobby";            // 試合中の参加は、キャラを選んで次のラウンドから

        else if (d.t === "prof") { applyProfile(p, sanitizeProfile(d)); renderUI(); }
        else if (d.t === "unprof") { if (canEdit(p)) p.rd = false; renderUI(); }
      });
      conn.on("close", () => { if (conns[slot] === conn) { game.p[slot].c = false; game.p[slot].al = false; conns[slot] = null; renderUI(); } });
    });

}

function startClient(code) {
  role = "client"; roomCode = code; net = "connecting"; renderUI();
  peer = new Peer();
  peer.on("open", () => {
    hostConn = peer.connect(PREFIX + code, { reliable: true });
    hostConn.on("data", d => {
      if (!d) return;
      if (d.t === "hello") { myId = d.id; net = "ready"; renderUI(); }
      else if (d.t === "full") { net = "error"; netMsg = "この部屋は満員です（最大4人）"; renderUI(); }
      else if (d.t === "s") applySnapshot(d);
    });
    hostConn.on("close", () => { net = "error"; netMsg = "ホストとの接続が切れました"; renderUI(); });

  });

}

  if (e.target.tagName !== "INPUT") e.preventDefault();      // ボタンにフォーカスが残っていても、Space で押されないようにする
  down.delete(k); recalcKeys();
});
addEventListener("blur", () => { down.clear(); recalcKeys(); });
document.querySelectorAll(".tb").forEach(el => {
  const k = el.dataset.k;
  el.addEventListener("pointerdown", e => { e.preventDefault(); down.add(k); recalcKeys(); });
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => el.addEventListener(ev, () => { down.delete(k); recalcKeys(); }));
});
setInterval(() => { if (role === "client") { sentKeys = -1; pushKeys(); } }, 500);   // 取りこぼし対策

// ---------- キャラの見た目（本体と飾り）----------
// 本体は枠の色（プレイヤーごと）で、飾りでキャラを見分ける。c は描く先の 2D コンテキスト
function deco(c, id, x, y, f) {
  c.lineWidth = 1; c.setLineDash([]);
  if (id === "bomber") {
    c.fillStyle = "#111827"; c.beginPath(); c.arc(x + 20, y + 42, 7, 0, 6.2832); c.fill();
    c.strokeStyle = "#a16207"; c.lineWidth = 2; c.beginPath(); c.moveTo(x + 21, y + 35); c.lineTo(x + 25, y + 30); c.stroke();
    c.fillStyle = "#fb923c"; c.fillRect(x + 24, y + 27, 3, 3);
  } else if (id === "samurai") {
    c.fillStyle = "#f8fafc"; c.fillRect(x, y + 4, PLW, 5);
    c.fillStyle = "#dc2626"; c.fillRect(x + (f > 0 ? 3 : PLW - 9), y + 4, 6, 5);
    const bx = f > 0 ? x + 3 : x + PLW - 3;
    c.strokeStyle = "#e2e8f0"; c.lineWidth = 2; c.beginPath(); c.moveTo(bx, y + 16); c.lineTo(bx + (f > 0 ? -7 : 7), y + 46); c.stroke();
  } else if (id === "archer") {
    c.fillStyle = "#166534"; c.fillRect(x, y, PLW, 8);
    const bx = f > 0 ? x + 1 : x + PLW - 1, o = f > 0 ? -13 : 13;
    c.strokeStyle = "#a16207"; c.lineWidth = 2.5; c.beginPath(); c.moveTo(bx, y + 14); c.quadraticCurveTo(bx + o, y + 30, bx, y + 46); c.stroke();
    c.strokeStyle = "#e5e7eb"; c.lineWidth = 1; c.beginPath(); c.moveTo(bx, y + 14); c.lineTo(bx, y + 46); c.stroke();
  } else if (id === "okure") {
    c.fillStyle = "#f9a8d4";
    for (let k = 0; k < 5; k++) { const a = k * 1.2566; c.beginPath(); c.arc(x + 20 + Math.cos(a) * 5, y + 3 + Math.sin(a) * 5, 3.4, 0, 6.2832); c.fill(); }
    c.fillStyle = "#facc15"; c.beginPath(); c.arc(x + 20, y + 3, 2.6, 0, 6.2832); c.fill();
  } else if (id === "teleporter") {
    c.strokeStyle = "#22d3ee"; c.lineWidth = 3; c.beginPath(); c.arc(x + 20, y + 38, 9, 0, 6.2832); c.stroke();
    c.fillStyle = "#a5f3fc"; c.fillRect(x + 18, y + 36, 4, 4);
  } else if (id === "copern") {
    c.strokeStyle = "#f472b6"; c.lineWidth = 2; c.strokeRect(x + 8, y + 28, 14, 14); c.strokeRect(x + 16, y + 36, 14, 14);
  } else if (id === "nao") {
    c.fillStyle = "#fb7185"; c.beginPath(); c.moveTo(x + 20, y + 48);
    c.bezierCurveTo(x + 4, y + 36, x + 12, y + 24, x + 20, y + 34); c.bezierCurveTo(x + 28, y + 24, x + 36, y + 36, x + 20, y + 48); c.fill();
  } else if (id === "berserker") {
    c.fillStyle = "#7f1d1d";
    c.beginPath(); c.moveTo(x + 2, y); c.lineTo(x + 7, y - 10); c.lineTo(x + 13, y); c.fill();
    c.beginPath(); c.moveTo(x + PLW - 2, y); c.lineTo(x + PLW - 7, y - 10); c.lineTo(x + PLW - 13, y); c.fill();
    c.strokeStyle = "#7f1d1d"; c.lineWidth = 2; c.beginPath(); c.moveTo(x + 10, y + 34); c.lineTo(x + 30, y + 46); c.stroke();
  } else if (id === "knight") {
    c.fillStyle = "#cbd5e1"; c.fillRect(x + 2, y - 2, PLW - 4, 12);
    c.fillStyle = "#111827"; c.fillRect(x + (f > 0 ? 18 : 6), y + 4, 16, 3);
    c.fillStyle = "#dc2626"; c.fillRect(x + 16, y - 8, 8, 7);
  } else if (id === "giant") {
    c.fillStyle = "#78350f"; c.fillRect(x, y + 38, PLW, 9);
    c.fillStyle = "#fbbf24"; c.fillRect(x + 16, y + 38, 8, 9);
    c.fillStyle = "#451a03";
    c.beginPath(); c.moveTo(x + 6, y); c.lineTo(x + 10, y - 9); c.lineTo(x + 15, y); c.fill();
    c.beginPath(); c.moveTo(x + 17, y); c.lineTo(x + 21, y - 12); c.lineTo(x + 26, y); c.fill();
    c.beginPath(); c.moveTo(x + 28, y); c.lineTo(x + 32, y - 9); c.lineTo(x + 36, y); c.fill();
  } else if (id === "ghost") {
    c.fillStyle = "#f8fafc"; c.beginPath(); c.arc(x + 20, y + 36, 8, Math.PI, 0);
    c.lineTo(x + 28, y + 49); c.lineTo(x + 24, y + 45); c.lineTo(x + 20, y + 49); c.lineTo(x + 16, y + 45); c.lineTo(x + 12, y + 49); c.closePath(); c.fill();
    c.fillStyle = "#111827"; c.fillRect(x + 15, y + 34, 3, 3); c.fillRect(x + 22, y + 34, 3, 3);
  } else if (id === "clock") {                 // 胸の時計（針が逆に回っている）
    c.fillStyle = "#f8fafc"; c.beginPath(); c.arc(x + 20, y + 38, 9, 0, 6.2832); c.fill();
    c.strokeStyle = "#1e3a8a"; c.lineWidth = 2; c.stroke();
    c.beginPath(); c.moveTo(x + 20, y + 38); c.lineTo(x + 20, y + 32); c.moveTo(x + 20, y + 38); c.lineTo(x + 15, y + 40); c.stroke();
    c.fillStyle = "#93c5fd"; c.fillRect(x + 17, y + 26, 6, 3);
  } else if (id === "law") {                   // 白い帽子と、水色の円の印
    c.fillStyle = "#f8fafc"; c.fillRect(x - 1, y - 6, PLW + 2, 10);
    c.fillStyle = "#a16207"; c.fillRect(x + 6, y - 4, 4, 4); c.fillRect(x + 18, y - 3, 4, 4); c.fillRect(x + 30, y - 4, 4, 4);
    c.strokeStyle = "#67e8f9"; c.lineWidth = 2; c.beginPath(); c.arc(x + 20, y + 40, 9, 0, 6.2832); c.stroke();
    c.beginPath(); c.moveTo(x + 11, y + 40); c.lineTo(x + 29, y + 40); c.stroke();
  } else if (id === "wrestler") {              // 覆面とチャンピオンベルト
    c.fillStyle = "#7c3aed"; c.fillRect(x, y, PLW, 11);
    c.fillStyle = "#facc15"; c.fillRect(x + (f > 0 ? 21 : 5), y + 9, 14, 3);
    c.fillStyle = "#facc15"; c.fillRect(x, y + 42, PLW, 7);
    c.fillStyle = "#e5e7eb"; c.fillRect(x + 15, y + 41, 10, 9);
  } else if (id === "tengu") {                 // 赤い長い鼻と、黒い頭巾、羽うちわ
    c.fillStyle = "#dc2626"; c.fillRect(f > 0 ? x + PLW - 6 : x - 8, y + 18, 14, 5);
    c.fillStyle = "#111827"; c.fillRect(x + 13, y - 7, 14, 8);
    const bx = f > 0 ? x + 4 : x + PLW - 4;
    c.strokeStyle = "#a16207"; c.lineWidth = 2; c.beginPath(); c.moveTo(bx, y + 46); c.lineTo(bx, y + 34); c.stroke();
    c.fillStyle = "#16a34a"; c.beginPath(); c.ellipse(bx, y + 28, 6, 8, 0, 0, 6.2832); c.fill();
  }
}
function drawChar(c, idx, x, y, f, col, flash) {
  c.fillStyle = flash ? "#ffffff" : col;
  c.fillRect(x, y, PLW, PLH);
  c.fillStyle = "#111827";
  c.fillRect(x + (f > 0 ? 24 : 8), y + 12, 8, 8);            // 目（向き）
  deco(c, (CHARS[idx] || CHARS[0]).id, x, y, f);
}

// ---------- UI（DOM）----------
const ui = document.getElementById("ui"), stats = document.getElementById("stats");
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function shareUrl() {
  const u = new URL(location.href); u.search = "?room=" + roomCode; u.hash = "";
  return u.toString();
}

// v: 今の値 / base: もとの値（v が大きいぶんの目盛りは「上乗せ」として光らせる）
const barHtml = (v, c, base) => {
  const b = base === undefined ? v : base;             // up: 上がったぶん / dn: 下がったぶん（狂化の防御）
  return `<span class="g" style="--c:${c}">${[1, 2, 3, 4, 5, 6].map(n => `<i class="${n <= v ? (n > b ? "on up" : "on") : (n <= b ? "dn" : "")}"></i>`).join("")}</span>`;
};
// 横画面モード: 画面の上に、全員の名前・キャラ名・勝ち数だけを小さなカードで出す（自分が左上。左右に半分ずつ、まん中は残り時間のために空ける）。
// 性能の棒は自分のカードにだけ付ける（敵の性能は出さない）。LAND_MY_STATS を false にすると自分の分も出さない
const LAND_MY_STATS = true;
function landStatsHtml() {
  const ids = [];
  for (let i = 0; i < MAX_PLAYERS; i++) { const p = game.p[i]; if (p && p.c && p.lk) ids.push(i); }
  ids.sort((a, b) => a === myId ? -1 : b === myId ? 1 : a - b);
  const card = i => {
    const p = game.p[i], c = chOf(p), wins = Array.from({ length: game.wr }, (_, k) => `<i class="${k < p.w ? "on" : ""}"></i>`).join("");
    const vals = [effA(p), effD(p), effS(p)], bases = [c.A, c.D, c.S];
    const bars = i === myId && LAND_MY_STATS ? `<div class="hs">${STATS.map((st, k) => barHtml(vals[k], st.color, bases[k])).join("")}</div>` : "";
    return `<div class="hc${i === myId ? " me" : ""}" style="--c:${COLORS[i]}"><div><b>${esc(nameOf(i))}</b>` +
      `<div class="sub"><span>${esc(c.name)}${p.lv > 0 ? " ♥" + p.lv : ""}</span><span class="wn">${wins}</span></div></div>${bars}</div>`;
  };
  const half = Math.ceil(ids.length / 2);
  return `<div class="hg">${ids.slice(0, half).map(card).join("")}</div><div class="hg">${ids.slice(half).map(card).join("")}</div>`;
}
// 戦闘中だけ、画面の下に全員のキャラと性能と勝ち数を、1 人ずつのカード（縦並び）で表示する
function statsHtml() {
  if (land) return landStatsHtml();
  let html = "";
  for (let i = 0; i < MAX_PLAYERS; i++) {
    const p = game.p[i];
    if (!p || !p.c || !p.lk) continue;
    const c = chOf(p), wins = Array.from({ length: game.wr }, (_, k) => `<i class="${k < p.w ? "on" : ""}"></i>`).join("");
    const vals = [effA(p), effD(p), effS(p)], bases = [c.A, c.D, c.S];
    html +=`<div class="pc${i === myId ? " me" : ""}"><b style="color:${COLORS[i]}">${esc(nameOf(i))}</b>` +
      `<div class="sub"><span>${esc(c.name)}${p.lv > 0 ? " ♥" + p.lv : ""}</span><span class="wn" style="color:${COLORS[i]}">${wins}</span></div>` +
      STATS.map((st, k) => `<div class="pr"><span class="lb" style="color:${st.color}">${st.label}</span>${barHtml(vals[k], st.color, bases[k])}</div>`).join("") + `</div>`;
  }
  return `<div class="pcs">${html}</div>`;
}
// 横画面モード: タッチ操作の端末（スマホ・タブレット）を横持ちしているとき。URL に ?land=1 で強制オン、?land=0 で強制オフ（PC で見た目を確かめる用）
let landForce = new URLSearchParams(location.search).get("land");
const coarseMq = window.matchMedia("(pointer:coarse)");
let land = false;
function updateLand() {
  const v = landForce === "1" || (landForce !== "0" && coarseMq.matches && window.innerWidth > window.innerHeight);
  if (v === land) return;
  land = v; cam.init = false; lastHud = "";
  document.body.classList.toggle("land", land);
  refreshHud();
}
let lastHud = "";
function refreshHud() {
  const me = game.p[myId];
  const inBattle = !!(role && net === "ready" && me && game.ph !== "lobby");
  const sig = (inBattle ? 1 : 0) + "|" + (land ? 1 : 0) + "|" + game.ph + "|" + game.wr + "|" + myId + "|" +
    game.p.map(p => p ? [p.c ? 1 : 0, p.lk ? 1 : 0, p.ch, p.lv, p.w, p.n, p.bz > 0 ? 1 : 0, p.gt > 0 ? 1 : 0].join(",") : "-").join("|");
  if (sig === lastHud) return;
  lastHud = sig;
  document.body.classList.toggle("battle", inBattle);
  document.body.classList.toggle("q4", inBattle && game.p.filter(p => p && p.c && p.lk).length >= 4);   // 4 人のとき、縦持ちのスマホではカードを 2×2 に並べる
  stats.style.display = inBattle ? "flex" : "none";
  if (inBattle) stats.innerHTML = statsHtml();
}

// キャラ選択画面（名前＋キャラ）
function drawPreview(canvas, idx) {
  const c = canvas.getContext("2d");
  c.setTransform(1.4, 0, 0, 1.4, 8, 14);
  c.clearRect(-8, -14, 80, 110);
  drawChar(c, idx, 0, 0, 1, COLORS[myId] || COLORS[0], false);
}
function paintSelect() {
  const root = ui.querySelector(".setup"); if (!root) return;
  root.querySelectorAll(".chip").forEach(b => b.classList.toggle("on", Number(b.dataset.i) === draft.c));
  const c = CHARS[draft.c], vals = [c.A, c.D, c.S];
  const traits = (c.noShield ? "<br><span class=\"trait\">盾を持たない</span>" : "") + (c.lives ? `<br><span class="trait">残機 +${c.lives}（落ちても1回だけ復活する）</span>` : "");
  root.querySelector("#detail").innerHTML =
    `<h2>${esc(c.name)}</h2><div class="tag">${esc(c.tag)}</div>` +
    STATS.map((s, k) => `<div class="st-r"><span class="nm" style="color:${s.color}">${s.label}</span>${barHtml(vals[k], s.color)}</div>`).join("") +
    `<div class="skl">${c.skill
      ? `<b>スキル「${esc(c.skill.name)}」</b>（クールタイム ${esc(c.skill.cdText || c.skill.cd + "秒")}${c.skill.hold ? "・ためて発動" : ""}）<br>${esc(c.skill.text)}`
      : "スキルなし"}${traits}</div>`;
}
function showSelect() {
  const chips = CHARS.map((c, i) => `<button class="chip" data-i="${i}"><canvas width="72" height="100"></canvas><span>${esc(c.name)}</span></button>`).join("");
  ui.innerHTML = `<div class="panel setup"><div class="cols"><div class="colL"><h1>キャラ選択</h1>
    <p>部屋番号 <b style="color:#e5e7eb">${esc(roomCode)}</b> ／ 相手のキャラは開始まで非公開</p>
    <input id="pname" maxlength="8" placeholder="${esc("プレイヤー" + (myId + 1))}" value="${esc(draft.n)}">
    <div class="chips">${chips}</div></div><div class="colR">
    <div class="detail" id="detail"></div>
    <button id="bOk">決定</button></div></div></div>`;
  const root = ui.querySelector(".setup");
  root.querySelectorAll(".chip").forEach(b => {
    const i = Number(b.dataset.i);
    drawPreview(b.querySelector("canvas"), i);
    b.onclick = () => { draft.c = i; paintSelect(); };
  });
  const name = root.querySelector("#pname");
  name.oninput = () => { draft.n = name.value; };
  name.onkeydown = e => { if (e.key === "Enter") root.querySelector("#bOk").click(); };
  root.querySelector("#bOk").onclick = e => {
    const prof = sanitizeProfile(draft);
    draft = prof; saveProfile();
    if (role === "host") { applyProfile(game.p[0], prof); renderUI(); }
    else if (hostConn && hostConn.open) {
      hostConn.send(Object.assign({ t: "prof" }, prof));
      e.target.disabled = true; e.target.textContent = "送信中…";
      setTimeout(() => { if (e.target.isConnected) { e.target.disabled = false; e.target.textContent = "決定"; } }, 2000);
    }
  };
  paintSelect();
}

// 何本先取かを決める「− 3 ＋」（ホストのロビーと CPU 戦の設定画面）。id: ボタンの id の頭（wr）/ after: 変えたあとにやること
const roundsHtml = id => `<span class="seg"><button type="button" id="${id}Minus"${winRounds <= WIN_ROUNDS_MIN ? " disabled" : ""}>−</button><span class="wrv" id="${id}Val">${winRounds}</span><button type="button" id="${id}Plus"${winRounds >= WIN_ROUNDS_MAX ? " disabled" : ""}>＋</button></span>`;
function bindRounds(root, id, after) {
  root.querySelector("#" + id + "Minus").onclick = () => { setRounds(winRounds - 1); after(); };
  root.querySelector("#" + id + "Plus").onclick = () => { setRounds(winRounds + 1); after(); };
}
function paintRounds(root, id) {
  root.querySelector("#" + id + "Val").textContent = winRounds;
  root.querySelector("#" + id + "Minus").disabled = winRounds <= WIN_ROUNDS_MIN;
  root.querySelector("#" + id + "Plus").disabled = winRounds >= WIN_ROUNDS_MAX;
}
function showSolo() {                       // CPU 戦の設定（自分の名前・キャラ、CPU の数・強さ・キャラ、何本先取か）
  const chips = CHARS.map((c, i) => `<button class="chip" data-i="${i}"><canvas width="72" height="100"></canvas><span>${esc(c.name)}</span></button>`).join("");
  ui.innerHTML = `<div class="panel setup"><div class="cols"><div class="colL"><h1>CPU戦</h1>
    <p>名前とキャラを選んで、ひとりで CPU と対戦します（ネット不要）</p>
    <input id="pname" maxlength="8" placeholder="${esc("プレイヤー1")}" value="${esc(draft.n)}">
    <div class="chips">${chips}</div></div><div class="colR">
    <div class="detail" id="detail"></div>
    <div class="cpuset">
      <div class="row"><span>CPU の数</span><span class="seg" id="segN">${[1, 2, 3].map(v => `<button data-v="${v}">${v}</button>`).join("")}</span></div>
      <div class="row"><span>強さ</span><span class="seg" id="segLv">${AI_LEVELS.map((l, v) => `<button data-v="${v}">${esc(l.name)}</button>`).join("")}</span></div>
      <div class="hint" id="lvHint"></div>
      <div id="cpuRows"></div>
      <div class="row"><span>何本先取</span>${roundsHtml("wr")}</div>
    </div>
    <div class="btns"><button id="bGo">戦闘開始</button>
    <button id="bBack" class="sub">タイトルへ</button></div></div></div></div>`;
  const root = ui.querySelector(".setup");
  root.querySelectorAll(".chip").forEach(b => {
    const i = Number(b.dataset.i);
    drawPreview(b.querySelector("canvas"), i);
    b.onclick = () => { draft.c = i; game.p[0].ch = i; paintSelect(); };
  });
  const name = root.querySelector("#pname");
  name.oninput = () => { draft.n = name.value; };
  const opts = `<option value="-1">ランダム</option>` + CHARS.map((c, i) => `<option value="${i}">${esc(c.name)}</option>`).join("");
  const paintCfg = () => {
    root.querySelectorAll("#segN button").forEach(b => b.classList.toggle("on", Number(b.dataset.v) === soloCfg.n));
    root.querySelectorAll("#segLv button").forEach(b => b.classList.toggle("on", Number(b.dataset.v) === soloCfg.lv));
    root.querySelector("#lvHint").textContent = AI_LEVELS[soloCfg.lv].desc;
    root.querySelector("#cpuRows").innerHTML = Array.from({ length: soloCfg.n }, (_, k) =>
      `<div class="row"><span>CPU${k + 1} のキャラ</span><select data-k="${k}">${opts}</select></div>`).join("");
    root.querySelectorAll("#cpuRows select").forEach(sel => {
      const k = Number(sel.dataset.k);
      sel.value = String(soloCfg.chars[k]);
      sel.onchange = () => { soloCfg.chars[k] = Number(sel.value); saveSolo(); applySoloCfg(); };
    });
  };
  bindRounds(root, "wr", () => paintRounds(root, "wr"));
  root.querySelectorAll("#segN button").forEach(b => b.onclick = () => { soloCfg.n = Number(b.dataset.v); saveSolo(); applySoloCfg(); paintCfg(); });
  root.querySelectorAll("#segLv button").forEach(b => b.onclick = () => { soloCfg.lv = Number(b.dataset.v); saveSolo(); applySoloCfg(); paintCfg(); });
  root.querySelector("#bGo").onclick = () => {
    autoFs();
    const prof = sanitizeProfile(draft);
    draft = prof; saveProfile();
    applyProfile(game.p[0], prof);
    rollCpuChars();
    hostStartMatch();
  };
  root.querySelector("#bBack").onclick = () => { location.href = location.pathname; };
  paintCfg();
  paintSelect();
}

function showLobby() {
  const list = game.p.map((p, i) => p && p.c
    ? `<div class="pl" style="color:${COLORS[i]}"><b>${esc(nameOf(i))}</b>${i === myId ? "（あなた）" : ""}<span class="${p.rd ? "ok" : "wt"}">${p.rd ? "✔ 準備OK" : "選択中…"}</span></div>` : "").join("");
  const n = connectedSlots().length, ready = readySlots().length;
  if (role === "host") {
    ui.innerHTML = `<div class="panel lobby"><h1>ロビー</h1><div class="cols"><div class="colL">
      <p>部屋番号</p>
      <div class="code">${esc(roomCode)}</div>
      <p>この番号を友達に伝えるか、下の URL を送ってください</p>
      <input id="url" readonly value="${esc(shareUrl())}">
      <button id="bCopy" class="sub">URLをコピー</button></div><div class="colR">
      <p>参加者 ${n}/4</p>${list}
      <div class="rounds"><span>何本先取</span>${roundsHtml("wr")}</div>
      <button id="bStart" ${ready < 2 ? "disabled" : ""}>ゲーム開始</button>
      <button id="bEdit" class="sub">キャラを変更</button>
      <p>${ready < 2 ? "準備OKが2人以上になると開始できます<br>" : ""}ホストはこの画面を開いたままにしてください<br>（他のアプリに切り替えると全員の画面が止まります）</p></div></div></div>`;

let uiKey = "";

function updateSkillUI() {
  const me = game.p[myId];
  let state = "none", label = "なし", sec = "", ratio = 0;
  if (role && net === "ready" && me && game.ph !== "lobby") {
    const sk = chOf(me).skill;
    if (sk) {
      label = sk.name;

      else if (me.ks > 0) { state = "charge"; label = "ため中"; }
      else if (chOf(me).id === "archer" && me.am <= 0) { state = "cool"; label = "矢なし"; ratio = 1 - me.amT / ARROW_REGEN; sec = "0"; }   // 矢がないとき: 次の 1 本までを円で出す
      else if (me.kc > 0) { state = "cool"; ratio = Math.min(1, me.kc / (me.km || sk.cd * 60)); sec = String(Math.ceil(me.kc / 60)); }

function koFx(p) {                                 // 場外に落ちた瞬間: 出ていった場所（画面の端に近い側）に出す

// 試合の状態の変わり目（カウントダウン・残り時間・サドンデス・脱落）から鳴らす音と演出。全員が自分の画面で同じ状態を見て出す
const fxPrev = { ph: "", sec: -1, rt: -1, sd: 0, al: [false, false, false, false] };
let fxBannerT = 99, fxGoT = 0, fxSdT = 0;          // 見出しが出てからのフレーム / 「GO!」・「サドンデス！」の表示の残り
function fxPhase(dt) {
  fxBannerT += dt; fxGoT = Math.max(0, fxGoT - dt); fxSdT = Math.max(0, fxSdT - dt);
  if (game.ph !== fxPrev.ph) {
    if (game.ph === "play" && fxPrev.ph === "count") { Sfx.beep(true); fxGoT = 40; fxBannerT = 0; }
    else if (game.ph === "round") { Sfx.roundEnd(game.win >= 0); fxBannerT = 0; }
    else if (game.ph === "match") { Sfx.matchEnd(); fxBannerT = 0; }
    if (game.ph === "count") fxPrev.sec = -1;
    if (fxPrev.ph === "lobby" && game.ph !== "count") fxPrev.sd = game.sd;   // 途中参加のとき、過去の節目の音を鳴らさない
    fxPrev.ph = game.ph;
  }
  if (game.ph === "count") {
    const s = Math.ceil(game.tm / 60);
    if (s !== fxPrev.sec) { fxPrev.sec = s; Sfx.beep(false); fxBannerT = 0; }
  }
  if (game.ph === "play" && game.sd === 0) {       // 残り 10 秒から 1 秒ごとに刻む（3 秒前からは高い音）
    const s = Math.ceil(game.rt / 60);
    if (s !== fxPrev.rt) { if (fxPrev.rt >= 0 && s >= 1 && s <= 10) Sfx.tick(s <= 3); fxPrev.rt = s; }
  } else fxPrev.rt = -1;
  const sd = game.sd, E1 = SD_UP_FRAMES, E2 = SD_SHRINK_FRAMES, E3 = SD_SHRINK_FRAMES + SD_HOLD_FRAMES;
  if (sd > 0 && fxPrev.sd === 0) { fxSdT = 110; fxBannerT = 0; Sfx.siren(); shake(6); }      // サドンデス開始
  if (sd >= E1 && fxPrev.sd < E1) { Sfx.rumble(); shake(5); }                                 // 上の台が消えた
  if (sd >= E2 && fxPrev.sd < E2) { Sfx.siren(); shake(6); }                                  // 最小幅になった（崩れるまでのカウント開始）
  if (sd >= E3 && fxPrev.sd < E3) { Sfx.rumble(); shake(14); flashA = Math.max(flashA, 0.4); } // 足場がすべて崩れた
  if (game.ph === "play" && sd > 0 && sd < E3) shake(1.1);                                    // 足場が縮んでいる間の地鳴り
  fxPrev.sd = sd;
  for (let i = 0; i < MAX_PLAYERS; i++) {          // 脱落した瞬間
    const p = game.p[i], alive = !!(p && p.c && p.al);
    // 最後の 1 人が落ちた瞬間はラウンド終了と同時に届くので、round / match でも検出する
    if ((game.ph === "play" || game.ph === "round" || game.ph === "match") && fxPrev.al[i] && !alive && p && p.c) koFx(p);
    fxPrev.al[i] = alive;
  }
}

const cv = document.getElementById("cv"), cx = cv.getContext("2d");
let cw = 960, ch = 540;
function fitCanvas() {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cw = Math.max(1, r.width); ch = Math.max(1, r.height);
  const bw = Math.round(cw * dpr), bh = Math.round(ch * dpr);
  if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function drawPlayer(p, i, me, now) {

  if (p.iv > 0 && Math.floor(now / 70) % 2) alpha *= 0.4;         // 復活直後の無敵は点滅

    cx.fillStyle = "rgba(249,115,22,0.18)"; cx.fillRect(p.x - 9, p.y - 10, PLW + 18, PLH + 16);

function updateCamera(dt) {

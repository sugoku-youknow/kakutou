<script>
// 招待リンクの読みかえ。前からの「?zone=」（シールドファイト）と「?room=」（ジェンガ）は、そのゲームのページへそのまま送る
(function () {
  const q = new URLSearchParams(location.search);
  const to = q.has("zone") ? "shieldfight/" : q.has("room") ? "jenga/" : null;
  if (to) location.replace(to + location.search + location.hash);
})();

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap">
<style>
  :root { --ink:#4a4f8f; --panel:#dfe6ff; --edge:#b9c3f2; --sub:#6d74b0; --orange:#ffa42e; --green:#58c943; --pink:#ee5fc0; --blue:#31aef0; --text:#4a4f8f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; min-height:100%; color:var(--ink); font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif; font-weight:700; }
  html { background:#7fc8ff; }
  body { min-height:100vh; background:radial-gradient(circle at 20% 0%,#c6f0ff 0,transparent 45%),linear-gradient(180deg,#7fc8ff 0,#a9b6ff 55%,#d3a8f5 100%) fixed; padding:calc(env(safe-area-inset-top) + 20px) 14px calc(env(safe-area-inset-bottom) + 28px); }
  main { max-width:480px; margin:0 auto; }
  /* タイトル（リボン） */
  .ribbon { position:relative; margin:34px 14px 0; padding:14px 12px 16px; text-align:center; background:linear-gradient(180deg,#46b9ff,#2f8fe8); border:4px solid #fff; border-radius:16px; box-shadow:0 5px 0 #2a6fc0,0 10px 16px rgba(40,60,140,.25); }
  .ribbon::before,.ribbon::after { content:""; position:absolute; top:14px; width:34px; height:100%; background:#2f8fe8; border:4px solid #fff; border-radius:6px; z-index:-1; }
  .ribbon::before { left:-22px; clip-path:polygon(0 0,100% 0,100% 100%,0 100%,30% 50%); }
  .ribbon::after { right:-22px; clip-path:polygon(0 0,100% 0,70% 50%,100% 100%,0 100%); }
  .stars { position:absolute; left:50%; top:-30px; transform:translateX(-50%); display:flex; gap:2px; align-items:flex-end; }
  .stars i { width:38px; height:38px; background:linear-gradient(#ffe45c,#ffb800); clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%); filter:drop-shadow(0 2px 0 #c77f00); }
  .stars i:nth-child(2) { width:48px; height:48px; margin-bottom:6px; }
  h1 { margin:0; font-size:32px; font-weight:900; color:#fff; letter-spacing:.02em; text-shadow:0 3px 0 #1f64b8,2px 0 0 #1f64b8,-2px 0 0 #1f64b8,0 -2px 0 #1f64b8; }
  h1 span { color:#ffe45c; }
  .lead { margin:14px 0 18px; text-align:center; color:#fff; font-size:14px; text-shadow:0 2px 0 rgba(60,70,150,.5); }
  /* パネル（みんなで遊ぶ） */
  .party { position:relative; margin:26px 0 30px; padding:30px 14px 14px; background:var(--panel); border:4px solid #fff; border-radius:22px; box-shadow:0 5px 0 var(--edge),0 12px 18px rgba(60,70,150,.22); }
  .party h2 { position:absolute; left:50%; top:-18px; transform:translateX(-50%); margin:0; padding:6px 22px; white-space:nowrap; font-size:16px; font-weight:900; color:#fff; background:linear-gradient(#3cc2ff,#1d93e6); border:3px solid #fff; border-radius:99px; box-shadow:0 3px 0 #1a6db5; text-shadow:0 2px 0 #1a6db5; }
  .party input { width:100%; font:inherit; font-size:17px; padding:11px 14px; border-radius:99px; border:3px solid var(--edge); background:#fff; color:var(--ink); outline:0; }
  .party input:focus { border-color:var(--blue); }
  .party .row { display:flex; gap:8px; margin-top:10px; }
  .party .row > * { flex:1; min-width:0; }
  .party button { font:inherit; font-weight:900; font-size:16px; border:3px solid #fff; border-radius:99px; padding:11px 10px; color:#fff; cursor:pointer; background:linear-gradient(#9aa4dd,#7a85c9); box-shadow:0 4px 0 #5a65a8; text-shadow:0 2px 0 rgba(0,0,0,.2); }
  .party button:active { transform:translateY(3px); box-shadow:0 1px 0 #5a65a8; }
  .party button.main { background:linear-gradient(#ffc04d,#ff9a1f); box-shadow:0 4px 0 #cc7410; }
  .party button.main:active { box-shadow:0 1px 0 #cc7410; }
  .party button.blue { background:linear-gradient(#4cc4ff,#1f9de8); box-shadow:0 4px 0 #1578b8; }
  .party button.blue:active { box-shadow:0 1px 0 #1578b8; }
  .party .code { font-size:48px; font-weight:900; color:#fff; line-height:1; text-shadow:0 3px 0 var(--orange),2px 0 0 var(--orange),-2px 0 0 var(--orange),0 -2px 0 var(--orange); }
  .party .members { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .party .members span { font-size:13px; padding:4px 12px; border-radius:99px; background:#fff; border:2px solid var(--edge); }
  .party .members span.me { border-color:var(--orange); background:#fff4de; }
  .party .note { font-size:13px; color:var(--sub); margin-top:10px; line-height:1.55; font-weight:700; }
  .party .err { color:#e0453a; font-size:13px; margin-top:10px; }
  .party .small { font-size:13px; padding:8px; margin-top:12px; width:100%; }
  .statsbox { margin-top:12px; padding:10px; border-radius:16px; background:#fff; border:3px solid var(--edge); }
  .statshead { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .statshead button { padding:6px 12px; font-size:13px; }
  .statsbox table { width:100%; border-collapse:collapse; font-size:14px; }
  .statsbox th { color:var(--sub); font-weight:800; font-size:12px; text-align:left; padding:4px; }
  .statsbox td { padding:6px 4px; border-top:2px solid #e8ecfb; }
  .statsbox td:nth-child(1), .statsbox td:nth-child(3), .statsbox td:nth-child(4), .statsbox th:nth-child(1), .statsbox th:nth-child(3), .statsbox th:nth-child(4) { text-align:center; width:3.5em; }

  /* ゲームのアイコン（ストアの屋根つき） */

  .name { font-size:11px; font-weight:900; line-height:1.25; text-align:center; color:#fff; background:linear-gradient(#6a76c8,#515db2); border-radius:12px; padding:4px 5px; width:100%; min-height:2.6em; display:grid; place-items:center; box-shadow:0 2px 0 #38428a; word-break:keep-all; overflow-wrap:anywhere; }

  button.game.folder .icon { background:#3b4385; border-color:#cfd5f5; }
  .fgrid { width:100%; height:100%; padding:11%; box-sizing:border-box; display:grid; grid-template-columns:1fr 1fr; gap:8%; }
  .fgrid > div { border-radius:24%; overflow:hidden; background:#fff; }
  .fgrid svg, .fgrid img { width:100%; height:100%; display:block; }
  .folderbox { background:var(--panel); border:4px solid #fff; border-radius:22px; box-shadow:0 5px 0 var(--edge); padding:16px 12px 20px; margin-bottom:16px; }
  .folderbox h2 { margin:0 0 14px; text-align:center; font-size:17px; color:var(--ink); }
  .partybtn { display:block; width:100%; margin-top:22px; padding:16px; font:inherit; font-size:20px; font-weight:900; color:#fff; border:4px solid #fff; border-radius:99px; background:linear-gradient(#ffc04d,#ff9a1f); box-shadow:0 5px 0 #cc7410,0 10px 14px rgba(60,70,150,.25); text-shadow:0 2px 0 #cc7410; cursor:pointer; }
  .partybtn:active { transform:translateY(4px); box-shadow:0 1px 0 #cc7410; }
  body.offline .partybtn { display:none; }
  .sheet { position:fixed; inset:0; z-index:50; background:rgba(60,60,130,.55); overflow-y:auto; padding:calc(env(safe-area-inset-top) + 40px) 14px calc(env(safe-area-inset-bottom) + 24px); }

  .sheetclose { display:block; margin:0 auto; padding:10px 34px; font:inherit; font-weight:900; font-size:16px; color:#fff; border:3px solid #fff; border-radius:99px; background:linear-gradient(#9aa4dd,#7a85c9); box-shadow:0 4px 0 #5a65a8; cursor:pointer; }
  .avlabel { margin:12px 0 6px; font-size:13px; color:var(--sub); font-weight:900; }
  .avpick { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .party .avb { padding:3px; border-radius:16px; aspect-ratio:1; border:3px solid #fff; background:#fff; box-shadow:0 3px 0 var(--edge); text-shadow:none; display:grid; place-items:center; }
  .party .avb.sel { border-color:var(--orange); background:#fff4de; box-shadow:0 3px 0 #cc7410; }
  .party .avb img { width:100%; height:100%; object-fit:contain; display:block; }
  img.av { width:26px; height:26px; object-fit:contain; vertical-align:middle; margin-right:5px; }
  .party .members span { display:inline-flex; align-items:center; }

  .foot { margin-top:22px; font-size:12px; color:#fff; line-height:1.6; text-align:center; text-shadow:0 1px 0 rgba(60,70,150,.5); }
  a.game.locked { opacity:.6; filter:grayscale(.3); }
  .toast { z-index:99; position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px); transform:translateX(-50%); background:#fff; color:var(--ink); border:3px solid var(--edge); padding:10px 18px; border-radius:99px; font-size:14px; box-shadow:0 4px 0 var(--edge); }
  button.install { margin-top:20px; width:100%; padding:14px; border:3px solid #fff; border-radius:99px; font:inherit; font-weight:900; font-size:16px; color:#fff; background:linear-gradient(#6fdb55,#44b832); box-shadow:0 4px 0 #2f8a20; text-shadow:0 2px 0 rgba(0,0,0,.2); }

</style>

<script>
// アプリとして入れる（Android の Chrome など）。iPhone は共有ボタンから
let installEvt = null;
const standalone = matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches || navigator.standalone;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (!standalone) document.getElementById("install").hidden = false; });
document.getElementById("install").onclick = () => { if (!installEvt) return; installEvt.prompt(); document.getElementById("install").hidden = true; installEvt = null; };
if (/iPhone|iPad/.test(navigator.userAgent) && !standalone)
  document.getElementById("foot").textContent = "アプリのように使うには: 共有ボタン（□↑）→「ホーム画面に追加」";
// ================= パーティ =================
// 最初に 1 回だけ、ホストが部屋を作り、ゲストが 1 桁の番号で入る。そのあとはホストがゲームを選ぶと、
// みんなの画面も同じゲームへ移って自動で部屋に入る（番号を入れ直さない）。ゲームから戻ってきても、パーティはそのまま。
// 状態は sessionStorage の ykg-party（{ role: "host" | "guest", code, name, spec }）に置き、ゲームのページもこれを読む。
//   name: パーティの中での名前（ホストが重ならないようにする。途中で変えられる）/ spec: 観戦する（ゲストだけ）
// 成績（勝ち・負け）はホストの端末の sessionStorage ykg-stats（{ 名前: { w, l } }）。パーティを解散すると消える。
// ゲームのページ（ホスト側）は、勝ち負けが決まると ykg-results に { game, w: [名前], l: [名前] } を足しておき、ゲーム一覧に戻ったときにここで集計する。
const PP = "ykg-party-";   // PeerJS の ID の頭（ゲームのページとは別の ID を使う）
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const sjson = {
  get(k, d) { try { return JSON.parse(sessionStorage.getItem(k) || "null") ?? d; } catch (e) { return d; } },
  set(k, v) { try { if (v == null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const partyStore = { get: () => sjson.get("ykg-party", null), set: v => sjson.set("ykg-party", v) };
let party = partyStore.get();
let peer = null, hostConn = null, members = [], status = "", errMsg = "", tries = 0, stats = {}, showStats = false;
const guests = new Map();   // ホスト: 相手の PeerJS の ID → { conn, name, spec }
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cleanName = v => String(v || "").trim().slice(0, 12) || "ゲスト";
const myName = () => cleanName(document.getElementById("pname")?.value ?? store.get("ykg-name"));
const AV_N = 15;   // avatars/a00.png ～ a18.png（ぜんぶ自分で描いたキャラ）
const clampAv = v => { v = Math.floor(+v); return v >= 0 && v < AV_N ? v : 0; };
function myAv() {
  let v = store.get("ykg-av");
  if (v == null || v === "") { v = String(Math.floor(Math.random() * AV_N)); store.set("ykg-av", v); }
  return clampAv(v);
}
const avUrl = (i, ex) => "avatars/a" + String(clampAv(i)).padStart(2, "0") + (ex && ex !== "n" ? "_" + ex : "") + ".png";
const avImg = (i, cls, ex) => `<img class="${cls || "av"}" src="${avUrl(i, ex)}" alt="">`;
const avOf = name => { const m = members.find(x => x.name === name); return m ? m.av : null; };
function setAv(i) {
  i = clampAv(i); store.set("ykg-av", String(i));
  if (party) {
    party.av = i; saveParty();
    if (party.role === "host") sendMembers(); else { try { hostConn?.send({ t: "av", av: i }); } catch (e) {} render(); }
  } else render();
}
const avPickHtml = () => `<div class="avlabel">キャラをえらぶ</div><div class="avpick">${Array.from({ length: AV_N }, (_, i) => `<button class="avb${i === myAv() ? " sel" : ""}" data-av="${i}" aria-label="キャラ${i + 1}">${avImg(i)}</button>`).join("")}</div>`;
const saveParty = () => { if (party) party.av = myAv(); partyStore.set(party); };

// 成績の表（勝ち数の多い順。同じなら負けの少ない順。どちらも同じなら同じ順位）
function rankRows() {
  const names = members.map(m => m.name);
  for (const n of Object.keys(stats)) if (!names.includes(n)) names.push(n);   // 抜けた人の成績も残す
  const rows = names.map(n => ({ name: n, w: stats[n]?.w || 0, l: stats[n]?.l || 0, here: members.some(m => m.name === n) }));
  rows.sort((a, b) => b.w - a.w || a.l - b.l);
  rows.forEach((r, i) => { r.rank = i && rows[i - 1].w === r.w && rows[i - 1].l === r.l ? rows[i - 1].rank : i + 1; });
  return rows;
}
// 成績の表の表情: 1位はニコニコ、最下位はあせり、ほかはふつう（全員が同じ順位なら全員ふつう）
const moodOfRank = (r, rows) => { const mx = Math.max(...rows.map(x => x.rank)); return mx === 1 ? "n" : r.rank === 1 ? "h" : r.rank === mx ? "p" : "n"; };
function statsHtml() {
  const rows = rankRows();
  return `<div class="statsbox"><div class="statshead"><b>成績（このパーティ）</b><button data-p="stats">とじる</button></div>
    ${rows.length ? `<table><tr><th>順位</th><th>名前</th><th>勝ち</th><th>負け</th></tr>
      ${rows.map(r => `<tr class="${r.name === party.name ? "me" : ""}"><td>${r.rank}</td><td>${avOf(r.name) != null ? avImg(avOf(r.name), "av", moodOfRank(r, rows)) : ""}${esc(r.name)}${r.here ? "" : "（抜けた）"}</td><td>${r.w}</td><td>${r.l}</td></tr>`).join("")}</table>`
      : `<div class="note">まだ勝負がついていません</div>`}
    <div class="note">パーティでオンライン対戦したゲームの勝ち負けを数えます（観戦・ひとり用・CPU戦・この端末で交代は数えません）。順位は勝ち数の多い順です。</div></div>`;
}

// 2026-11-09: オフライン（ネットにつながっていない、または ?offline=1 で試すとき）は、パーティ（オンライン）を出さない。
// ゲームはそれぞれ、オフラインのときは CPU 戦・練習だけを出す
const FORCE_OFF = /[?&]offline=1/.test(location.search);
const OFFLINE = () => FORCE_OFF || !navigator.onLine;
const sheetEl = document.getElementById("sheet");
document.getElementById("partybtn").onclick = () => { sheetEl.hidden = false; render(); };
document.getElementById("sheetclose").onclick = () => { sheetEl.hidden = true; };
sheetEl.addEventListener("click", e => { if (e.target === sheetEl) sheetEl.hidden = true; });
function partyBtnLabel() {
  const t = document.getElementById("partybtnt"); if (!t) return;
  t.textContent = party ? (party.role === "host" ? "パーティ中（ホスト・番号 " : "パーティ中（番号 ") + party.code + "）" : "みんなで遊ぶ";
}
function render() {
  partyBtnLabel();
  const el = document.getElementById("party");
  document.body.classList.toggle("offline", OFFLINE());
  if (OFFLINE()) {
    el.innerHTML = `<h2>オフライン</h2><div class="note">ネットにつながっていないので、みんなで遊ぶ（パーティ・オンライン対戦）は使えません。下のゲームの CPU 戦・練習で遊べます。</div>`;
    for (const a of document.querySelectorAll("a.game")) a.classList.remove("locked");
    return;
  }
  if (!party) {
    el.innerHTML = `<h2>みんなで遊ぶ</h2>
      <input id="pname" maxlength="12" placeholder="なまえ" value="${esc(store.get("ykg-name") || "")}">
      ${avPickHtml()}
      <div class="row"><button class="main" data-p="host">ホスト（部屋を作る）</button></div>
      <div class="row"><input id="pcode" inputmode="numeric" maxlength="1" placeholder="番号" value="${esc(store.get("ykg-last") || "")}"><button class="blue" data-p="join">入室</button></div>
      <div class="note">入室するときは、最初に 1 回だけ、ホストの番号（1けた）を入れます。あとはホストがゲームを選ぶと、みんな一緒にそのゲームへ移ります。ひとりで遊ぶときは、下のゲームをそのまま選んでください。</div>
      ${errMsg ? `<div class="err">${esc(errMsg)}</div>` : ""}`;
    const n = document.getElementById("pname"); n.oninput = () => store.set("ykg-name", n.value);
  } else {
    const host = party.role === "host";
    const nameBox = document.getElementById("pname");
    const typing = nameBox && document.activeElement === nameBox ? nameBox.value : null;   // 名前を入力中なら消さない
    el.innerHTML = `<h2>${host ? "あなたがホスト" : "パーティに参加中"}</h2>
      <div style="display:flex;align-items:flex-end;gap:12px"><div class="code">${esc(party.code)}</div>
        <div class="note" style="margin:0">${host ? "この番号をゲストに伝えてください" : status === "joined" ? "ホストがゲームを選ぶのを待っています" : "ホストを探しています…"}</div></div>
      <div class="members">${members.map(m => `<span class="${m.name === party.name ? "me" : ""}">${m.av != null ? avImg(m.av) : ""}${esc(m.name)}${m.host ? "（ホスト）" : m.spec ? "（観戦）" : ""}</span>`).join("")}</div>
      ${avPickHtml()}
      <div class="row"><input id="pname" maxlength="12" value="${esc(typing ?? party.name)}"><button data-p="rename" style="flex:0 0 auto">名前を変える</button></div>
      ${host ? "" : `<div class="row"><button data-p="spec" class="${party.spec ? "main" : ""}">${party.spec ? "観戦する（オン）" : "観戦する（オフ）"}</button></div>`}
      <div class="note">${host ? "下のゲームを選ぶと、みんなも一緒に移ります。ホストは遊ぶ人になります（観戦はできません）。"
        : party.spec ? "観戦オン: ゲームでは遊ばずに、ホストのゲームの様子を見ます。" : "ゲームはホストが選びます。見るだけにしたいときは「観戦する」をオンに。"}</div>
      <div class="row"><button data-p="stats">成績（勝ち・負け・順位）</button></div>
      ${showStats ? statsHtml() : ""}
      ${errMsg ? `<div class="err">${esc(errMsg)}</div>` : ""}
      <button class="small" data-p="leave">${host ? "パーティを解散" : "パーティをぬける"}</button>`;
    if (typing != null) { const b = document.getElementById("pname"); b.focus(); b.setSelectionRange(b.value.length, b.value.length); }
  }
  for (const a of document.querySelectorAll("a.game")) a.classList.toggle("locked", !!party && party.role === "guest");
}
function toast(t) {
  const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d);
  setTimeout(() => d.remove(), 2200);
}

// ---------- ホスト ----------
// 名前が重なったら「2」「3」…をつける（selfPeer: 名前を決める本人。ホスト自身は "host"）
function uniqueName(name, selfPeer) {
  const taken = n => (selfPeer !== "host" && n === party.name) || [...guests.entries()].some(([k, g]) => k !== selfPeer && g.name === n);
  let n = name, i = 2;
  while (taken(n)) n = name.slice(0, 11) + i++;
  return n;
}
function renameStats(from, to) {
  if (from === to || !stats[from]) return;
  const a = stats[from], b = stats[to] || { w: 0, l: 0 };
  stats[to] = { w: a.w + b.w, l: a.l + b.l }; delete stats[from]; sjson.set("ykg-stats", stats);
}
// ゲームのページが置いていった勝ち負けを集計する
function takeResults() {
  const res = sjson.get("ykg-results", []);
  if (!res.length) return;
  for (const r of res) {
    for (const n of r.w || []) (stats[n] ||= { w: 0, l: 0 }).w++;
    for (const n of r.l || []) (stats[n] ||= { w: 0, l: 0 }).l++;
  }
  sjson.set("ykg-results", null); sjson.set("ykg-stats", stats);
}
// ホスト: 部屋を作る（ゲームから戻ってきたときは同じ番号で作り直す。前の接続が残っていると少し待つ）
let goingTo = null;   // ホストが選んだゲーム（移る途中）
function hostParty(code, again) {
  if (typeof Peer !== "function") { errMsg = "通信の部品を読み込めませんでした（ネットを確かめて開き直してください）"; party = null; partyStore.set(null); render(); return; }
  const name = party ? party.name : myName();
  code = code ?? String(Math.floor(Math.random() * 10));
  peer = new Peer(PP + code);
  peer.on("open", () => {
    tries = 0; errMsg = "";
    party = { role: "host", code, name: party && party.code !== "…" ? party.name : name }; saveParty();
    sendMembers();
  });
  peer.on("error", e => {
    if (e.type === "unavailable-id" && ++tries < (again ? 120 : 25)) {   // 戻ってきたとき: ゲームのページの待ち受けが残っていることがあるので長めに待つ
      try { peer.destroy(); } catch (x) {}
      if (again) setTimeout(() => hostParty(code, true), 1000);   // 戻ってきたとき: 同じ番号が空くのを待つ
      else hostParty(null, false);                                // 新しく作るとき: ほかの番号を試す
      return;
    }
    if (e.type !== "unavailable-id") {   // 中継のサーバーにつながらない（network など）: 少し待って作り直す（一度つながったあとの切れ目は party-beacon.js がつなぎ直す）
      try { peer.destroy(); } catch (x) {}
      setTimeout(() => { if (party && party.role === "host") hostParty(party.code === "…" ? null : party.code, party.code !== "…"); }, 1500);
      return;
    }
    errMsg = "空いている番号がありません。少し待ってからやり直してください"; render();
  });
  peer.on("connection", conn => {
    conn.on("data", m => {
      if (!m) return;
      const g = guests.get(conn.peer);
      if (m.t === "hi") {
        const name = uniqueName(cleanName(m.name), conn.peer);
        guests.set(conn.peer, { conn, name, spec: !!m.spec, av: clampAv(m.av) });
        conn.send({ t: "you", name }); sendMembers();
      } else if (m.t === "name" && g) {
        const name = uniqueName(cleanName(m.name), conn.peer);
        renameStats(g.name, name); g.name = name;
        conn.send({ t: "you", name }); sendMembers();
      } else if (m.t === "av" && g) { g.av = clampAv(m.av); sendMembers(); }
      else if (m.t === "spec" && g) { g.spec = !!m.spec; sendMembers(); }
      else if (m.t === "where") { try { conn.send({ t: "at", game: goingTo, list: true }); } catch (x) {} }   // ゲームの中のゲスト: ホストは一覧にいる（移る途中ならそのゲーム）
    });
    conn.on("close", () => { if (guests.get(conn.peer)?.conn === conn) { guests.delete(conn.peer); sendMembers(); } });
  });
}
function sendMembers() {
  const list = [{ name: party.name, host: true, av: myAv() }, ...[...guests.values()].map(g => ({ name: g.name, spec: g.spec, av: g.av }))];
  for (const g of guests.values()) { try { g.conn.send({ t: "members", list, stats }); } catch (e) {} }
  members = list;
  render();
}

// ---------- ゲスト ----------
// 番号で入る。ホストが見つからないあいだ（ホストがゲームから戻る途中など）は、少しずつ探し続ける
function joinParty(code) {
  if (typeof Peer !== "function") { errMsg = "通信の部品を読み込めませんでした（ネットを確かめて開き直してください）"; party = null; partyStore.set(null); render(); return; }
  party = { role: "guest", code, name: party ? party.name : myName(), spec: !!(party && party.spec) }; saveParty();
  store.set("ykg-last", code);
  status = "looking"; render();
  peer = new Peer();
  peer.on("open", connectHost);
  peer.on("error", e => {
    if (e.type === "peer-unavailable") { status = "looking"; render(); return; }   // 探し直しは connectHost の時間切れで行う
    // 中継のサーバーにつながらない（network など）: 少し待って peer から作り直す
    status = "looking"; render();
    const p = peer; setTimeout(() => { if (peer === p && party && party.role === "guest" && !(hostConn && hostConn.open)) { try { p.destroy(); } catch (x) {} joinParty(party.code); } }, 1500);
  });
}
// PeerJS は 2 回目以降の「相手が見つからない」を知らせないことがあるので、2.5 秒たってもつながらなければつなぎ直す
let lookTries = 0;
function connectHost() {
  if (!party || party.role !== "guest" || !peer || peer.destroyed) return;
  if (peer.disconnected) { try { peer.destroy(); } catch (e) {} joinParty(party.code); return; }
  const c = hostConn = peer.connect(PP + party.code, { reliable: true });
  setTimeout(() => {
    if (hostConn !== c || c.open || !party) return;
    try { c.close(); } catch (e) {}
    if (++lookTries % 3 === 0) { try { peer.destroy(); } catch (e) {} joinParty(party.code); }   // ときどき peer から作り直す
    else connectHost();
  }, 2500);
  c.on("open", () => { c.opened = true; lookTries = 0; status = "joined"; errMsg = ""; c.send({ t: "hi", name: party.name, spec: !!party.spec, av: myAv() }); render(); });
  c.on("data", m => {
    if (!m) return;
    if (m.t === "you") { party.name = m.name; saveParty(); render(); }                 // ホストが決めた名前（重なったときは番号つき）
    else if (m.t === "members") { members = m.list; stats = m.stats || {}; render(); }
    else if (m.t === "go") location.replace(m.game + "?party=1");   // ホストがゲームを選んだ（履歴を積まない）
  });
  c.on("close", () => { if (hostConn !== c || !party || !c.opened) return; status = "looking"; members = []; render(); setTimeout(connectHost, 1500); });
}
function leaveParty() {
  party = null; partyStore.set(null); members = []; status = ""; errMsg = ""; guests.clear(); stats = {}; showStats = false;
  sjson.set("ykg-stats", null); sjson.set("ykg-results", null);
  try { peer?.destroy(); } catch (e) {} peer = null; hostConn = null;
  render();
}

document.getElementById("party").addEventListener("click", e => {
  const avb = e.target.closest("[data-av]"); if (avb) { setAv(avb.dataset.av); return; }
  const a = e.target.closest("[data-p]")?.dataset.p; if (!a) return;
  if (a === "host") {
    store.set("ykg-name", myName()); errMsg = ""; tries = 0; party = null; stats = {}; sjson.set("ykg-stats", null); sjson.set("ykg-results", null);
    const n = myName(); hostParty(null, false); party = { role: "host", code: "…", name: n }; members = [{ name: n, host: true, av: myAv() }]; render();
  }
  else if (a === "join") {
    if (!(document.getElementById("pname").value || "").trim()) { errMsg = "名前を入力してください"; render(); toast("名前を入力してください"); return; }
    const c = (document.getElementById("pcode").value || "").replace(/\D/g, "");
    if (c.length !== 1) { errMsg = "番号は 1けたです"; render(); return; }
    store.set("ykg-name", myName()); errMsg = ""; joinParty(c);
  }
  else if (a === "rename") {
    const n = cleanName(document.getElementById("pname").value);
    store.set("ykg-name", n);
    if (party.role === "host") { const u = uniqueName(n, "host"); renameStats(party.name, u); party.name = u; saveParty(); sendMembers(); }
    else { party.name = n; saveParty(); try { hostConn?.send({ t: "name", name: n }); } catch (x) {} render(); }
    document.activeElement?.blur?.(); toast("名前を変えました");
  }
  else if (a === "spec") { party.spec = !party.spec; saveParty(); try { hostConn?.send({ t: "spec", spec: party.spec }); } catch (x) {} render(); }
  else if (a === "stats") { showStats = !showStats; render(); }
  else if (a === "leave") leaveParty();
});
// その他フォルダ: ミニアイコンを作って、押すと残りのゲームを開く
(() => {
  const g = document.getElementById("fgrid");
  for (const ic of document.querySelectorAll("#foldergames .icon")) { const d = document.createElement("div"); d.innerHTML = ic.innerHTML; g.appendChild(d); }
  const sh = document.getElementById("foldersheet");
  document.getElementById("folderbtn").onclick = () => { sh.hidden = false; };
  document.getElementById("folderclose").onclick = () => { sh.hidden = true; };
  sh.addEventListener("click", e => { if (e.target === sh) sh.hidden = true; });
})();
// ゲームを選んだとき: パーティのホストなら、みんなにも同じゲームへ移ってもらう
document.addEventListener("click", e => {
  const a = e.target.closest("a.game"); if (!a) return;
  if (OFFLINE()) { if (FORCE_OFF) { e.preventDefault(); location.href = a.getAttribute("href") + "?offline=1"; } return; }
  if (!party) return;
  e.preventDefault();
  if (party.role === "guest") { toast("ゲームはホストが選びます"); return; }
  if (party.code === "…") return;
  const game = a.getAttribute("href");
  if (!a.dataset.party) toast("このゲームはまだパーティの自動参加に対応していません（ゲームの中で番号を入れてください）");
  goingTo = game;
  for (const g of guests.values()) { try { g.conn.send({ t: "go", game }); } catch (x) {} }
  setTimeout(() => { location.replace(game + (a.dataset.party ? "?party=1" : "")); }, a.dataset.party ? 400 : 1500);
});

// 戻る・進むでページが凍ったまま戻ってきたら読み込み直す（古い接続のままだと、次のゲーム選びがみんなに届かない）
addEventListener("pageshow", e => { if (e.persisted) location.reload(); });
if (OFFLINE()) { if (party && party.role === "host") { stats = sjson.get("ykg-stats", {}); takeResults(); } }   // つながったら読み込み直してパーティを続ける
else if (party && party.role === "host") { stats = sjson.get("ykg-stats", {}); takeResults(); hostParty(party.code, true); }
else if (party && party.role === "guest") joinParty(party.code);
render();
addEventListener("online", () => { if (!FORCE_OFF) location.reload(); });
addEventListener("offline", render);

try { if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
</script>
<script>
// 2026-11-28: ゲーム一覧は縦画面。ゲームの中で横画面に固定していても、一覧にもどったら縦にもどす（勝手に横のままにならないように）
(function () {
  const o = screen.orientation;
  if (!o || !matchMedia("(pointer:coarse)").matches) return;
  const standalone = matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches || navigator.standalone === true;
  const fs = () => document.fullscreenElement || document.webkitFullscreenElement || standalone;
  const fix = () => {
    try {
      if (fs() && o.lock) { const r = o.lock("portrait"); if (r && r.catch) r.catch(() => { try { o.unlock(); } catch (e) {} }); }
      else if (o.unlock) o.unlock();
    } catch (e) {}
  };
  fix();
  addEventListener("pageshow", fix);
})();
</script>

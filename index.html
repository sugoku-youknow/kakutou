<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<!-- ホーム画面に追加して開くと、アドレスバーなしで起動する（iPhone は全画面の機能がないので、これが画面を広く使う唯一の方法） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="シールドファイト">
<meta name="theme-color" content="#111827">
<!-- アプリとしてインストールできるようにする（Android の Chrome など）。インストールしたアイコンから開くと、最初から全画面で起動し、全画面のお知らせも出ない -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>シールドファイト</title>
<style>
  html,body{margin:0;height:100%;background:#111827;color:#e5e7eb;font-family:system-ui,"Yu Gothic",sans-serif;overflow:hidden}
  /* iPhone の Safari は user-scalable=no を無視するので、ボタンやその間をすばやく 2 回たたくと拡大されてしまう。manipulation で、どこでもダブルタップの拡大をしない（スクロールはできる） */
  html,body{touch-action:manipulation}
  #cv{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  /* 戦闘中は、どこを長押ししても文字の選択（青い選択とコピーのメニュー）を出さない。出ると指の動きが選択に取られ、ボタンを離したことが届かず押しっぱなしになるため */
  body.battle, body.battle *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  :root{--b:min(21vw,92px);--g:8px;--sh:124px}   /* 操作ボタンの大きさ / ボタン同士のすき間 / 下のプレイヤー情報の高さ（縦持ちで固定） */
  /* 画面構成: 上=戦闘画面 / 中=操作ボタン（スマホのみ）/ 下=プレイヤー情報 */
  #wrap{position:relative;display:flex;flex-direction:column;width:100%;height:100vh;height:100dvh}
  #stats{display:none;flex:none;align-items:center;box-sizing:border-box;width:min(100%,620px);min-height:var(--sh);margin:0 auto;padding:4px 3px calc(6px + env(safe-area-inset-bottom))}
  /* 戦闘中のプレイヤー情報: 1 人ぶんのカードを横に並べ、カードの中は縦に（名前 / キャラ / 攻撃 / 防御 / スピード）。
     文字と棒の大きさはカードの幅に合わせて変わる（cqw）。人数が少ないほど大きく、4 人でも読める大きさにする */
  .pcs{flex:1 1 auto;display:flex;justify-content:center;gap:3px;min-width:0}
  .pc{container-type:inline-size;flex:1 1 0;min-width:0;max-width:230px;box-sizing:border-box;padding:4px 3px 5px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid transparent;font-size:11px;line-height:1.25}
  .pc.me{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28)}
  .pc b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-size:clamp(11px,13.8cqw,16px)}
  .pc .sub{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:3px;color:#9ca3af;white-space:nowrap;font-size:11px;font-size:clamp(9.5px,11.7cqw,13px)}
  .pc .sub span:first-child{overflow:hidden;text-overflow:ellipsis}
  .pc .wn{flex:none;display:flex;align-items:center}
  .pc .wn i{display:block;width:.62em;height:.62em;margin-left:.22em;box-sizing:border-box;border:1px solid currentColor;border-radius:50%}
  .pc .wn i.on{background:currentColor}
  .pc .pr{display:flex;align-items:center;gap:3px;height:17px;height:clamp(15px,18cqw,20px)}
  .pc .lb{flex:0 0 4.1em;white-space:nowrap;font-size:10.5px;font-size:clamp(9px,11.2cqw,12.5px)}
  .pc .g{flex:1 1 0;min-width:0;display:flex;gap:1px}
  .pc .g i{flex:1;height:10px;height:clamp(8px,10.6cqw,12px);border-radius:1px;background:#374151}
  .pc .g i.on{background:var(--c)}
  .pc .g i.up{background:#fff;box-shadow:0 0 5px var(--c),inset 0 0 0 2px var(--c)}   /* 狂化・巨大化の上乗せぶん */
  .pc .g i.dn{background:#450a0a;box-shadow:inset 0 0 0 1px #ef4444}                     /* 狂化で下がったぶん */
  #box{position:relative;flex:1 1 0;min-height:0;width:100%}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  /* 画面の上のボタン。ホーム画面から開いた iPhone などでは、時計・電池の帯やカメラの切り欠き（safe-area）を避ける */
  #mute{position:absolute;top:calc(6px + env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));z-index:3;width:34px;height:34px;padding:0;margin:0;border-radius:50%;background:rgba(255,255,255,.14);font-size:16px;line-height:1}
  #fs{display:none;position:absolute;top:calc(6px + env(safe-area-inset-top));right:calc(max(8px,env(safe-area-inset-right)) + 40px);z-index:3;width:34px;height:34px;padding:0;margin:0;border-radius:50%;background:rgba(255,255,255,.14);line-height:0}
  #fs svg{width:18px;height:18px}
  body.fsok #fs{display:block}
  #rot{display:none;position:absolute;top:calc(6px + env(safe-area-inset-top));right:calc(max(8px,env(safe-area-inset-right)) + 80px);z-index:3;width:34px;height:34px;padding:0;margin:0;border-radius:50%;background:rgba(255,255,255,.14);line-height:0}
  #rot svg{width:18px;height:18px}
  body.rotok:not(.battle) #rot{display:block}                          /* 縦横の切り替えは、戦闘中以外に出す */
  #quit{display:none;position:absolute;top:calc(6px + env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));z-index:3;height:34px;padding:0 12px;margin:0;border-radius:17px;background:rgba(255,255,255,.14);font-size:13px;line-height:1}
  body.solo.battle #quit{display:block}
  /* タイトルへ戻るボタン（家のマーク）: タイトル画面以外ではいつも左上に出す。2 回押すと戻る（1 回目で「もう一度押すとタイトルへ」と出る）。「やめる」はその右 */
  #home{display:none;position:absolute;top:calc(6px + env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));z-index:4;min-width:34px;height:34px;padding:0;margin:0;border-radius:17px;background:rgba(255,255,255,.14);line-height:0}
  #home svg{width:18px;height:18px}
  /* 操作ボタンを自分で置いた配置（z-index 5）が重なっても、音・全画面・向き・タイトルへ・やめるのボタンが押せるよう、それより上に出す（配置の編集中は下に戻す） */
  body.customlayout #mute, body.customlayout #fs, body.customlayout #rot, body.customlayout #quit{z-index:6}
  body.customlayout #home{z-index:7}
  body.editing #mute, body.editing #fs, body.editing #rot, body.editing #quit{z-index:3}

  #home.ask{padding:0 12px;background:rgba(239,68,68,.75);font-size:12px;line-height:1}
  body.inapp #home{display:block}
  /* 操作ボタンの配置の編集画面: 操作ボタンを出して、ドラッグで動かす。選んでいるボタンは黄色の枠 */
  body.editing #touch{display:flex}
  body.editing #home, body.editing #stats, body.editing #skillhint{display:none}
  body.editing .tb{touch-action:none;cursor:grab}
  .tb.sel{outline:3px solid #facc15;outline-offset:3px}
  .panel.layoutbar{position:absolute;top:calc(6px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:6;width:min(92%,460px);padding:8px 12px;text-align:left}
  .panel.layoutbar h1{font-size:15px;margin:0 0 2px}
  .panel.layoutbar p{margin:2px 0;font-size:12px}
  .panel.layoutbar .lrow{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}
  .panel.layoutbar input[type=range]{flex:1;padding:0}
  .panel.layoutbar button{margin:4px 4px 0 0;padding:7px 14px}
  body.inapp #quit{left:calc(max(8px,env(safe-area-inset-left)) + 42px)}
  #skillhint{display:none;position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:3;padding:4px 12px;border-radius:999px;background:rgba(0,0,0,.5);font-size:12px;pointer-events:none;white-space:nowrap}
  @media (pointer:fine){body.battle #skillhint{display:block}}

  /* メニュー共通 */
  .panel{pointer-events:auto;background:rgba(17,24,39,.94);border:1px solid #374151;border-radius:12px;padding:18px 24px;text-align:center;max-width:92%;max-height:calc(100% - 16px);overflow:auto;box-sizing:border-box}
  .panel h1{margin:0 0 8px;font-size:26px}
  .panel p{margin:6px 0;color:#9ca3af;font-size:13px}
  button{font:inherit;background:#3b82f6;color:#fff;border:0;border-radius:8px;padding:10px 20px;margin:6px 4px;cursor:pointer}
  button.sub{background:#4b5563}
  button:disabled{background:#4b5563;opacity:.55;cursor:default}
  input{font:inherit;width:100%;box-sizing:border-box;padding:8px;border-radius:6px;border:1px solid #4b5563;background:#111827;color:#e5e7eb}
  .code{font-size:48px;font-weight:bold;letter-spacing:12px;line-height:1.1}
  .pl{margin:3px 0;font-size:15px}
  .pl .ok{color:#4ade80;font-size:12px;margin-left:6px}
  .pl .wt{color:#9ca3af;font-size:12px;margin-left:6px}

  /* キャラ選択画面 */
  .panel.setup{width:min(92%,420px)}
  .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
  .chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 4px;margin:0;border-radius:10px;background:#1f2937;border:2px solid transparent;font-size:10px;line-height:1.2;color:#e5e7eb}
  .chip canvas{position:static;inset:auto;width:36px;height:50px}
  .chip.on{border-color:#facc15;background:#374151}
  .detail{text-align:left;background:#111827;border:1px solid #374151;border-radius:10px;padding:10px 12px;margin:6px 0}
  .detail h2{margin:0;font-size:17px}
  .detail .tag{color:#9ca3af;font-size:12px;margin:2px 0 6px}
  .detail .skl{font-size:12px;margin-top:8px;line-height:1.5;color:#d1d5db}
  .detail .skl b{color:#facc15}
  .detail .trait{color:#fca5a5}

  /* CPU 戦の設定 */
  .cpuset{text-align:left;background:#111827;border:1px solid #374151;border-radius:10px;padding:6px 12px;margin:6px 0}
  .cpuset .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0;font-size:13px;color:#d1d5db}
  .cpuset .hint{margin:-2px 0 6px;font-size:11px;color:#9ca3af;text-align:left}
  .seg{display:inline-flex;gap:4px}
  .seg button{margin:0;padding:6px 12px;background:#374151;font-size:13px}
  .seg button.on{background:#3b82f6}
  .seg button:disabled{opacity:.4}
  .wrv{display:inline-block;min-width:2.4em;text-align:center;align-self:center;font-weight:bold;color:#e5e7eb}   /* 何本先取か（− 3 ＋） */
  .rounds{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0 2px;font-size:13px;color:#d1d5db}
  select{font:inherit;font-size:13px;background:#1f2937;color:#e5e7eb;border:1px solid #4b5563;border-radius:6px;padding:5px 6px;max-width:60%}

  /* 戦闘中: 画面上部のステータス表（横向きの棒グラフ） */
  .st-r{display:flex;align-items:center;gap:6px;height:30px;padding:0 4px;border-radius:5px}
  .st-r.me{background:rgba(255,255,255,.08)}
  .st-r .nm{flex:0 0 84px;overflow:hidden;line-height:1.15;font-size:13px;font-weight:bold}
  .st-r .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .st-r .nm small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;font-weight:normal;color:#9ca3af}
  .st-r .g{flex:1 1 0;min-width:0;display:flex;gap:2px}
  .st-r .g i{flex:1;height:9px;border-radius:2px;background:#374151}
  .st-r .g i.on{background:var(--c)}
  .st-r .g i.up{background:#fff;box-shadow:0 0 5px var(--c),inset 0 0 0 2px var(--c)}   /* 狂化・巨大化の上乗せぶん */
  .st-r .wn{flex:0 0 42px;text-align:right;font-size:11px;letter-spacing:1px}
  .st-r.st-h{height:16px}
  .st-r.st-h .g{font-size:11px;line-height:16px;display:block}
  .detail .st-r{height:20px;padding:0}
  .detail .st-r .nm{flex-basis:64px}

  /* 操作ボタン（スマホのみ・戦闘中だけ表示）。ジャンプと攻撃を横に並べ、スキルをその上の真ん中に置く（3つの中心が正三角形） */
  #touch{display:none;flex:none;justify-content:space-between;align-items:flex-end;box-sizing:border-box;padding:0 16px calc(20px + env(safe-area-inset-bottom));pointer-events:none}
  #touch>div{pointer-events:auto}
  #dpad{display:flex;gap:10px}
  .tb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:var(--b);height:var(--b);background:rgba(255,255,255,.18);border-radius:18px;font-size:calc(var(--b)*.38);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
  .tb:active{background:rgba(255,255,255,.35)}
  #rbtns{position:relative;width:calc(var(--b)*2 + var(--g));height:calc(var(--b) + (var(--b) + var(--g))*.866)}
  #rbtns .tb{position:absolute;border-radius:50%}
  .tb.jump{right:0;bottom:0;background:rgba(59,130,246,.4);font-size:11px;font-weight:bold;gap:2px}
  .tb.jump svg{width:calc(var(--b)*.44);height:calc(var(--b)*.44)}
  .tb.atk{left:0;bottom:0;font-size:calc(var(--b)*.4);background:rgba(239,68,68,.4)}
  .tb.skill{left:calc((var(--b) + var(--g))/2);top:0;background:rgba(168,85,247,.45);font-weight:bold;overflow:hidden;gap:0}
  .tb.skill b{font-size:11px;line-height:1.1;max-width:88%;text-align:center}
  .tb.skill i{font-style:normal;font-size:calc(var(--b)*.28);line-height:1.1;min-height:1em}
  .tb.skill::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.6) calc(var(--p,0)*1turn),transparent 0);pointer-events:none}
  .tb.skill[data-state="none"]{opacity:.28}
  .tb.skill[data-state="ready"]{box-shadow:0 0 0 3px rgba(250,204,21,.65)}
  .tb.skill[data-state="charge"]{background:rgba(250,204,21,.6)}
  @media (pointer:coarse){body.battle #touch{display:flex}}
  /* スマホ縦持ち: ボタンを画面の下端から持ち上げる（親指が届きやすいように）。ぶんだけ戦闘画面は縦に縮む */
  @media (pointer:coarse) and (orientation:portrait){
    /* 操作ボタンの下端を、画面の下から「プレイヤー情報の高さ + 持ち上げ分」の位置に置く。持ち上げ分は画面の高さに比例（840px の画面で約 109px） */
    #touch{padding-bottom:calc(20px + clamp(0px, 25dvh - var(--sh) + 23px, 130px))}
  }
  /* スマホ横持ち: 画面の下端に重ねる */
  @media (pointer:coarse) and (orientation:landscape){
    :root{--b:min(12vw,64px)}
    #touch{position:absolute;left:0;right:0;bottom:6px;padding:0 16px}
    #dpad{gap:8px}
  }
  /* 4 人戦をスマホの縦持ち（高さに余裕のある画面）で遊ぶときは、カードを 2×2 に並べて大きくする（操作ボタンの下の余白を使う） */
  @media (pointer:coarse) and (orientation:portrait) and (min-height:700px){
    body.q4{--sh:218px}
    body.q4 .pcs{display:grid;grid-template-columns:1fr 1fr;gap:4px;align-content:center}
    body.q4 .pc{max-width:none;padding:4px 8px 5px}
    body.q4 .pc b{font-size:15px}
    body.q4 .pc .sub{font-size:12px}
    body.q4 .pc .pr{height:18px}
    body.q4 .pc .lb{font-size:11.5px}
    body.q4 .pc .g i{height:11px}
  }
  /* 高さが足りない横長画面: プレイヤー情報は画面の下の中央に小さく重ねる（スマホなら左右の操作ボタンのあいだ） */
  @media (orientation:landscape) and (max-height:520px){
    #stats{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:min(70%,520px);min-height:0;z-index:3;padding:2px 3px;background:rgba(17,24,39,.6);border-radius:8px;pointer-events:none}
    .pc{padding:2px 3px}
    .pc b{font-size:10px}
    .pc .sub{font-size:9px;margin-bottom:1px}
    .pc .pr{height:11px}
    .pc .lb{font-size:8.5px}
    .pc .g i{height:6px}
  }
  @media (pointer:coarse) and (orientation:landscape) and (max-height:520px){
    #stats{width:calc(100% - 340px);max-width:520px}
  }
  /* 横画面モード（スマホの横持ち。JS が body.land を付ける）: 戦闘画面を画面いっぱいに使い、操作ボタンとプレイヤー情報は半透明で上に重ねる。
     ボタンは大きく（画面の高さに比例）、左下に ◀ ▶、右下に ジャンプ・攻撃・スキル（正三角形）。プレイヤー情報は上部に小さく、名前・キャラ名・勝ち数だけ */
  body.land{--b:clamp(62px,27vh,116px);--g:10px;--bin:7vw}         /* --bin: 左右の端から、中央へ寄せるぶん */
  body.land.battle #touch{display:flex}
  body.land #touch{position:absolute;left:0;right:0;bottom:0;padding:0 calc(max(20px,env(safe-area-inset-right)) + var(--bin)) calc(12px + env(safe-area-inset-bottom)) calc(max(20px,env(safe-area-inset-left)) + var(--bin))}
  body.land #dpad{gap:calc(var(--g)*1.2)}
  body.land .tb{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 2px rgba(255,255,255,.26)}
  body.land .tb:active{background:rgba(255,255,255,.32)}
  body.land .tb.jump{background:rgba(59,130,246,.28);font-size:calc(var(--b)*.16)}
  body.land .tb.atk{background:rgba(239,68,68,.28)}
  body.land .tb.skill{background:rgba(168,85,247,.3)}
  /* 横画面の右のボタン: 画面の右下の角を中心とする円（半径 --R）の上に、下から 攻撃（15 度）・スキル（43 度）・ジャンプ（72 度）の順に並べる。
     親指を右下の角あたりに置いたまま、弧を描くように届く。数字は cos / sin（例: 15 度 → 0.966 / 0.259） */
  body.land{--R:calc(var(--b)*2.4)}
  body.land #rbtns{position:absolute;right:0;bottom:0;width:0;height:0}
  body.land #rbtns .tb{left:auto;top:auto}
  body.land .tb.atk{right:calc(var(--R)*.966 - var(--b)/2 + env(safe-area-inset-right));bottom:calc(var(--R)*.259 - var(--b)/2 + env(safe-area-inset-bottom))}
  body.land .tb.skill{right:calc(var(--R)*.731 - var(--b)/2 + env(safe-area-inset-right));bottom:calc(var(--R)*.682 - var(--b)/2 + env(safe-area-inset-bottom))}
  body.land .tb.jump{right:calc(var(--R)*.309 - var(--b)/2 + env(safe-area-inset-right));bottom:calc(var(--R)*.951 - var(--b)/2 + env(safe-area-inset-bottom))}
  body.land .tb.skill b{font-size:calc(var(--b)*.16)}
  body.land .tb.jump:active{background:rgba(59,130,246,.55)}
  body.land .tb.atk:active{background:rgba(239,68,68,.55)}
  body.land .tb.skill:active{background:rgba(168,85,247,.55)}
  body.land .tb.skill[data-state="ready"]{box-shadow:0 0 0 3px rgba(250,204,21,.7),inset 0 0 0 2px rgba(250,204,21,.4)}
  body.land .tb.skill[data-state="charge"]{background:rgba(250,204,21,.5)}
  body.land #stats{position:absolute;top:0;left:0;right:0;bottom:auto;transform:none;width:auto;max-width:none;min-height:0;margin:0;z-index:2;
    padding:max(4px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left));
    background:none;border-radius:0;align-items:flex-start;justify-content:space-between;pointer-events:none}
  body.land #quit{top:calc(48px + env(safe-area-inset-top))}

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
"use strict";
// LINE の中のブラウザ（アプリ内ブラウザ）は、全画面にも横画面にもできない。LINE は URL に openExternalBrowser=1 が付いていると、
// いつものブラウザ（Chrome / Safari）で開くので、LINE の中で開かれたら、それを付けて開き直す（1 回だけ。付いていても LINE の中に残ったら、タイトル画面で案内する）
const isLineApp = /\bLine\//i.test(navigator.userAgent);
const extUrl = () => { const u = new URL(location.href); u.searchParams.set("openExternalBrowser", "1"); return u.toString(); };
if (isLineApp && !new URLSearchParams(location.search).has("openExternalBrowser")) location.replace(extUrl());
// ---------- 定数 ----------
const W = 960, H = 540;                       // 場外判定に使うワールド基準サイズ
const PX = 190, PW = 580, PY = 400;           // メインステージ（上面の高さが PY）
const UP_GAP = 150, UP_H = 14;                // 上の台: メインの上面からの高さ / 厚み
const MAIN_PLAT = { x: PX, y: PY, w: PW, main: true };
// 戦う人数に応じたステージ（上にあるものから順に並べる）
//   2人: メインだけ / 3人: 上に台が1つ（漢字の「二」の形）/ 4人: 上に台が2つ
// 上の台は下からは通り抜けられ、上からは乗れる（メインも同じ）
// 3 人・4 人のときは、足場の横幅を 1.2 倍にする（中央を基準に広げる。高さの間隔は変えない）
const WIDE_SCALE = 1.2, CENTER_X = PX + PW / 2;
const widen = (pl, k) => Object.assign({}, pl, { x: CENTER_X + (pl.x - CENTER_X) * k, w: pl.w * k });
function layoutFor(n) {
  const y = PY - UP_GAP, k = WIDE_SCALE;                 // 2 人のときも、3〜4 人と同じ幅（2026-10-16 から）
  let list;
  if (n >= 4) list = [{ x: PX + 20, y, w: 200 }, { x: PX + PW - 220, y, w: 200 }, MAIN_PLAT];
  else if (n === 3) list = [{ x: PX + 130, y, w: 320 }, MAIN_PLAT];
  else list = [MAIN_PLAT];
  return k === 1 ? list : list.map(pl => widen(pl, k));
}
const LAYOUTS = [layoutFor(2), layoutFor(2), layoutFor(2), layoutFor(3), layoutFor(4)];   // 人数 0〜4
const PLW = 40, PLH = 60;                     // プレイヤー
const COLORS = ["#ef4444", "#3b82f6", "#22c55e", "#eab308"];
// チーム（0 = チームなし / 1〜4 = 赤・青・緑・黄）。同じチームどうしは攻撃・罠・置き物が当たらない。チーム戦では、体の色をチームの色の濃淡にし、体のまわりにチームの色の光を出す
const TEAM_NAMES = ["なし", "赤", "青", "緑", "黄"];
const TEAM_COLORS = [null, "#ef4444", "#3b82f6", "#22c55e", "#eab308"];
const TEAM_SHADES = [null, ["#ef4444", "#fb7185", "#b91c1c", "#fda4af"], ["#3b82f6", "#38bdf8", "#1d4ed8", "#93c5fd"], ["#22c55e", "#86efac", "#15803d", "#a3e635"], ["#eab308", "#fde047", "#ca8a04", "#fdba74"]];
const CLONE_COLOR = "#f472b6";                // コペルニウムの分身
const MAX_PLAYERS = 4;
const WIN_ROUNDS_DEFAULT = 3, WIN_ROUNDS_MIN = 1, WIN_ROUNDS_MAX = 9;   // 何本先取か（ホスト・CPU 戦で、始める前に決められる。標準 3 本先取）
const ATK_COOLDOWN = 10;
const STUN_SPEED = 2.0;              // 吹っ飛ばされたときの硬直 = 飛ばされた横の速さ × STUN_SPEED（フレーム。スマブラと同じく、強く飛ばされるほど長い）。ノーマルの通常攻撃で 23 フレーム（約 0.38 秒）
const INPUT_BUF = 8;                 // 先行入力: 押した瞬間を覚えておくフレーム数（硬直が解ける少し前に押しても出る）
const JUMP_TURN = 8;                 // ジャンプした直後、空中でも向きを変えられるフレーム数（反転ジャンプ）
// 攻撃の種類: 0=通常 / 1=侍の居合斬り（少しためてから、踏み込みながら斬る）/ 2=槍兵の通常攻撃（長いが出が遅い）/ 3=槍兵の突進突き
// frac: 盾なしの相手への吹っ飛ばしの倍率 / breaker: 盾で受けられたら盾を一撃で壊す（吹っ飛ばさない）/ aim: 踏み込む直前に近い敵へ向き直る
// lock: 攻撃の間ずっと動けない（踏み込みだけ進む）/ hover: 空中で踏み込むとき、落ちる速さを抑えて真横へ進む
// stop: 踏み込み中、向かう先の敵の体に触れたら手前で止まる（すり抜けない。dashStop）
const ATKS = [
  { total: 26, on: 7, off: 13, reach: 46 },
  { total: 40, on: 14, off: 19, reach: 74, dash: 15.6, dashFrom: 10, dashTo: 19, frac: 1.1, breaker: true, aim: true, stop: true },   // 10 フレームためてから踏み込む（踏み込みは約 156px）。敵の体に触れたら手前で止まる
  { total: 30, on: 10, off: 16, reach: 82 },                                                                             // ふつうの約 1.8 倍の長さ
  { total: 34, on: 9, off: 18, reach: 82, dash: 12, dashFrom: 9, dashTo: 18, frac: 1.2, breaker: true, lock: true, hover: true },   // 8 フレーム構えて、10 フレーム突進（約 120px）。終わって 16 フレームは動けない
];
const KEY = { l: 1, r: 2, u: 4, d: 8, a: 16, k: 32 };

// 性能: 攻撃 / 防御 / スピード（各 0〜6、2 が標準）
const MIN_STAT = 0, MAX_STAT = 6, BASE_STAT = 2;
const STATS = [
  { label: "攻撃", color: "#f97316" },
  { label: "防御", color: "#22d3ee" },
  { label: "スピード", color: "#c084fc" },
];
const KNOCK_BASE = 11.3, MOVE_BASE = 6 * 0.7;   // 性能 2 のときの値（移動速度は、以前の 6px/フレームの 70%）
const atkMul = a => 1 + 0.15 * (a - BASE_STAT);    // 与える吹っ飛ばし力
const defMul = d => 1 - 0.10 * (d - BASE_STAT);    // 受ける吹っ飛ばし力（小さいほど飛ばされにくい）
// スピード: 2 を基準（移動 6）にして、上げるほど急に速くなる
//   移動速度  : 6 で基準の 2.8 倍（最高 16.8）。2 未満は 1 ポイントごとに 10% 減
//   ジャンプ  : 高さがスピード 0 で 100px、6 で 200px（1 ポイントごとに約 17px）。空中でもう 1 回だけ、地上の 75% の高さで跳べる（二段ジャンプ）
const moveMul = s => s >= BASE_STAT ? 1 + 1.8 * (s - BASE_STAT) / (MAX_STAT - BASE_STAT) : 1 + 0.10 * (s - BASE_STAT);
const JUMP_MIN = 100, JUMP_MAX = 200, AIR_JUMP = 0.75;     // ジャンプの高さ(px): スピード 0 / 6 のとき / 二段目の割合
const jumpHeight = s => JUMP_MIN + (JUMP_MAX - JUMP_MIN) * Math.max(0, Math.min(MAX_STAT, s)) / MAX_STAT;
const jumpVel = h => 0.3 + Math.sqrt(0.09 + 1.2 * h);       // 高さ h(px) に届く初速（重力 0.6 を 1 フレームずつ足す計算に合わせた式）
const SHIELD_HITS = 3;               // 盾が壊れるまでの回数（攻撃・防御の差に関係なく全員一律）
const SHIELD_BREAK_FRAMES = 300;     // 壊れた盾が元に戻るまで（60fps で 5 秒）
const SHIELD_STEP_FRAMES = 300;      // 盾のダメージは、攻撃されないまま 5 秒たつごとに 1 段階（1 回ぶん）ずつ回復する

// 制限時間とサドンデス（60fps 換算）。時間切れになると足場が縮み、睨み合いを終わらせる
const ROUND_FRAMES = 40 * 60;        // 1 ラウンドの制限時間
const SD_UP_FRAMES = 8 * 60;         // サドンデス開始から、上の台がすべて消えるまで
const SD_SHRINK_FRAMES = 18 * 60;    // サドンデス開始から、メインステージが最小幅になるまで
const SD_MIN_W = 120;                // 縮みきったメインステージの幅
const SD_HOLD_FRAMES = 6 * 60;       // 最小幅になってから、足場がすべて崩れるまで

// スキルの数値（60fps 換算）
const BOMB_FUSE = 120, BOMB_R = 9, BOMB_BLAST = 85;     // ボム: 導火線の長さ（2 秒）/ 大きさ / 爆風の半径
const BOMB_KNOCK = 0.855, BOMB_LIFT = 5.5;              // ボムの吹っ飛び（横の強さ / 上向きの初速）。2026-10-16 に 0.475 → 0.57 → 0.855（1.5 倍）
// ボムの投げ方（ためて離す）: 横の初速は BOMB_VX0 + BOMB_VX1 × ため量（0〜1）、上向きの初速 BOMB_VY（低い山なり。上の台の下から投げても台に乗らない）
const BOMB_VX0 = 3.5, BOMB_VX1 = 6, BOMB_VY = 5.5, BOMB_CHARGE = 48, BOMB_MAX = 2;   // … / 最大までためる時間（0.8 秒）/ 画面に置ける数（クールタイムはない。ラストスパート中は LATE_BOMBS）
const BOMB_HIT_FRAC = 0.35, BOMB_RECOIL = 2.5;          // 飛んでいる爆弾が人に当たったときの吹っ飛ばし（盾なら 1 段階削る）/ 盾に当たって跳ね返る横の速さの最低値
const FLOWER_ARM = 20, FLOWER_LIFE = 600, FLOWER_ROOT = 120;   // 花: 咲くまで / 残る時間 / 踏んだ人が動けない時間（2 秒。花で動けない間は、ほかの花は効かない）
const FLOWER_HALF = 9, FLOWER_BIG_P = 0.2, FLOWER_BIG_ROOT = 240, FLOWER_BIG_SCALE = 1.6, FLOWER_BIG_HALF = 14;   // 花を踏む判定の幅（半分）/ 大きな花になる確率 / 大きな花で動けない時間（3 秒）/ 見た目の倍率 / 判定の幅（半分）
const DOGEZA_KNOCK = 0.5;            // 花で動けない（土下座）間に受ける吹っ飛びの倍率
const CLONE_LIFE = 420;              // 分身が消えるまで
const ARROW_SPEED = 0.7;              // 矢の速さの倍率（13〜22px/フレームに掛ける）
const ARROW_MAX = 5, ARROW_REGEN = 60;   // アーチャーの矢: 持てる本数（ラウンド開始時の本数。ラストスパート中の上限は LATE_ARROW_MAX）/ 1 本回復するまで（1 秒）。矢がないと撃てない
const CLONE_STATS = { A: 2, D: 1, S: 2 };   // コペルニウムの分身の性能（本体とは別）
const BZ_FRAMES = 360, BZ_BONUS = { A: 2, D: -2, S: 2 }; // 狂化: 続く時間 / 攻撃・防御・スピードに足す値（防御は下がる）
const CN_FRAMES = 24, CN_WHIFF = 18, CN_MUL = 1.2; // カウンター: 構えている時間 / 空振りしたときの隙 / 返す吹っ飛ばしの倍率（相手自身の攻撃の 1.2 倍。2026-10-17 に 1.5 → 1.2）
const TP_MIN = 90, TP_MAX = PW * WIDE_SCALE - PLW; // テレポートの距離: いちばん近く / いちばん遠く（ステージの端から端まで = 656px）
const TP_CD0 = 1, TP_CD1 = 2.5;      // テレポーターのクールタイム（秒）= TP_CD0 + TP_CD1 × ため量（近くへ 1 秒〜いちばん遠くへ 3.5 秒）
const GH_FRAMES = 240;               // 透過が続く時間（4 秒）
const GH_ATK_MUL = 1.5;              // 透過中に振った攻撃の吹っ飛ばし力の倍率
const GIANT_FRAMES = 480, GIANT_BONUS = 5, GIANT_SCALE = 2, GIANT_LOCK = 600;   // 巨大化: 続く時間（8 秒）/ 全性能に足す値 / 大きさの倍率 / ラウンド開始から使えない時間（10 秒）
const RESPAWN_INV = 120;             // 残機で復活したあとの無敵時間
const RW_PUSH = 0.45;   // 巻き戻しの通り道にいた敵を、ステージの外側へ弾く強さ（盾・カウンター無視。ノーマルに当てて硬直約 10 フレーム）
const RW_SPAN = 120, RW_SPEED = 4;   // 時計師の巻き戻し: さかのぼる長さ（2 秒）/ 早戻りの速さ（4 倍速。2 秒ぶんを 0.5 秒で戻る）
// スワッパーの ゾーン: 押している間だけ円が広がり（上限なし）、離すとその場所に 5 秒残る。円の中では、攻撃ボタンで敵の背後へ回り込んで攻撃し、スキルボタンで入れ替える。
// 円が消えるとクールタイム（2 秒＋半径 100px ごとに 1 秒）が始まり、その間は盾がなく、移動速度が 0.7 倍になる
const ZONE_R0 = 40, ZONE_LIFE = 300, ZONE_SWAP_GAP = 6;                  // 押した瞬間の半径 / 円が残る時間（5 秒）/ 入れ替えの間隔（0.1 秒）
// 円の広がり方: 押した直後は 1 フレームに 12px と速く、広がるほど遅くなり、やがて 1 フレームに 1.5px で広がり続ける（上限なし）

// ---- 魔法使い: 魔法 ----

// ---- 天狗: 風の場 ----
// 場の中（体の中心が入っている）では、敵は遅く・低く、持ち主は速く・高くなる。透過中・復活直後・巻き戻し中は受けない
function windMul(p) {

function updateWinds() {
  for (let i = game.wd.length - 1; i >= 0; i--) if (++game.wd[i].t >= WIND_FRAMES) game.wd.splice(i, 1);
}

// ---- 蜘蛛: 糸 ----
const mainPlat = () => platforms().find(q => q.main) || null;     // メインの足場（サドンデスで崩れたら null）
// 蜘蛛の居場所（= 使う効果の番号）: 0 = 崖の外（体の中心がメインの左右の端より外、または足もとがメインの上面より下）/ 1 = 地上 / 2 = ステージの上の空中
// ステージの上の空中は「\＿/」の形: メインの左右の端から、高さと同じだけ外側（斜め 45 度。急降下の角度と同じ）まで広がる。ただし急降下の糸が届く高さまで
// 体の中心が、ステージの上の「\＿/」の範囲（メインの左右の端から、足もとの高さと同じだけ外側まで広がる。足もとがメインの上面より下なら外）にあるか。高さの上限はない

function webSkill(p) {

// 糸で動く（崖へ引き上げる・急降下する）。重力も入力も受けない。殴られると止まる（knock で解除）
function webStep(p) {

  if (p.wb > 0) return;

  if (p.wbm === 2) { webStomp(p); p.fz = WEB_LAG; }               // 急降下: 着地で足もとの敵を軽く吹っ飛ばし、少し隙ができる

function webStomp(p) {                       // 盾は効かない（真上から降ってくるため）

    if (hbR(e) < x - r || hbL(e) > x + r || e.y + phOf(e) < feet - 70 || e.y > feet + 4) continue;
    const dir = Math.sign(ecx(e) - x) || p.f;

// ---- 幽霊（脱落した人）----
// ラウンドが終わるまで、普通のキャラのように足場の上を歩き（左右＋ジャンプ 1 回）、攻撃かスキルのボタンで足もとに爆弾を置く。爆弾は動かず、1 秒後に爆発して、盾に関係なく軽く吹っ飛ばす。

function yureiSpawn(p) {                     // メインの足場の真ん中（面の少し上）から降りてくる。足場がなければ、元のメインの位置の上。足場があれば true

// ---- クロス使い・ゴブG ----

    } else if ((jrise || p.bu > 0) && !p.ground && !p.dj && p.cn === 0 && !lock) {     // 二段ジャンプ: 空中で 1 回だけ（押した瞬間に左右を押していれば、その方向を向く）。先行入力でも出る
      p.vy = Math.min(p.vy, -jumpVel(jumpHeight(S) * AIR_JUMP * wm.jp)); p.dj = 1; p.bu = 0;   // 上昇中に押しても、いまの勢いより弱くはならない
      if (dir && p.a === 0 && p.ks === 0) p.f = dir;
      if (!p.isClone) emit("dj", ecx(p), p.y + phOf(p));
    }
    if (apress && p.a === 0 && p.cd === 0 && p.ks === 0 && p.cn === 0 && p.mc === 0) {
      p.ba = 0;
      if (zone && inZone(zone, p)) zoneWarp(p, zone);           // 円の中なら、敵の背後へ回り込んでから攻撃する
      p.a = 1; p.ak = chd.atk || 0; p.hit = [];                 // 通常攻撃（槍兵は長い槍）
      if (p.gh > 0) { p.gh = 0; p.gb = 1; emit("gx", ecx(p), ecy(p)); }       // 自分から攻撃すると透過が解ける（この攻撃は 1.5 倍）
      emit("s", ecx(p), ecy(p));
    }
  }
  if (canSkill && sk && !neutral && !p.isClone && chd.id !== "clock" && skillInput(p, chd, kin, kpress, dir, zone)) p.bk = 0;   // スキル（時計師は上で処理する）
  const ak = ATKS[p.ak] || ATKS[0];
  if (p.a > 0) {
    p.a++;
    if (ak.dash && p.a === ak.dashFrom) { if (ak.aim) aimAtFoe(p); emit("sl", ecx(p), ecy(p), p.ak); }      // 居合斬りは、踏み込む直前にも敵の方向へ向き直す（突進突きは真っすぐ）
    if (ak.dash && p.a >= ak.dashFrom && p.a <= ak.dashTo) {                         // 居合斬りの踏み込み・突進突きの突進
      p.vx = p.f * ak.dash;
      if (ak.stop) p.vx = dashStop(p, p.vx);
      if (ak.hover && !p.ground) p.vy = Math.min(p.vy, 1);
    } else if (ak.stop && p.a > ak.dashTo && p.vx * p.f > 0) p.vx = dashStop(p, p.vx);   // 踏み込みのあとの惰性でも、敵の体にめりこまない（向きが逆・0 のときはそのまま）
    if (p.a > ak.total) { p.a = 0; p.ak = 0; p.cd = ATK_COOLDOWN; p.wa = 0; }
  }
  if (p.cd > 0) p.cd--;
  const gk = chd.id === "wizard" && !p.ground && (p.mgr || p.mc > 0 || p.bm > 0) ? 0.6 : 1;   // 魔法使い: 空中でためている・詠唱している間は、落ちる速さが 0.6 倍
  p.vy += 0.6 * gk;
  if (d && !p.ground && p.s === 0) p.vy += 0.4 * gk;
  if (p.vy > 18 * gk) p.vy = 18 * gk;

  const prevBottom = p.y + phOf(p), ww = pwOf(p), hh = phOf(p);
  p.x += p.vx; p.y += p.vy;
  p.ground = false;
  if (p.vy >= 0) {
    for (const pl of platforms()) {               // 上にある台から調べる。上からは乗れて、下からは通り抜ける
      if (prevBottom <= pl.y + 0.01 && p.y + hh >= pl.y && p.x + ww > pl.x && p.x < pl.x + pl.w) {
        p.y = pl.y - hh; p.vy = 0; p.ground = true; p.dj = 0; break;
      }
    }
  }
  if (!neutral && chd.id === "clock" && !p.isClone) {          // 時計師: 2 秒ぶんの通り道を覚えておく（巻き戻しで戻る道）
    p.tl.push([p.x, p.y, p.f, p.dj, p.ground]);
    if (p.tl.length > RW_SPAN) p.tl.shift();
  }
}

// スキルボタンの処理（ふつうのときと、吹っ飛ばされている最中）。何か発動したら true（先行入力を消す）
// 空中・吹っ飛び中は、左右を押しながら使うと、その方向を向いてから放つ（ためるスキルは、離す瞬間の向き）
function skillInput(p, chd, kin, kpress, dir, zone) {
  const sk = chd.skill;
  const aim = () => { if (dir && (!p.ground || p.s > 0)) p.f = dir; };
  if (zone) {                                    // スワッパーの ゾーンがある間、スキルボタンは入れ替えボタン
    if (kpress && p.rmSw === 0 && p.a === 0) { zoneSwap(p, zone); p.rmSw = ZONE_SWAP_GAP; return true; }
    return false;
  }
  if (chd.id === "wizard") {                     // 魔法使い: 1 回目で ため始め、2 回目で詠唱（0.2 秒後に撃つ）。魔法書が壊れている間・詠唱中は何もしない
    if (!kpress || p.mc > 0 || p.bd <= 0 || p.cn > 0) return false;
    if (!p.mg) { p.mg = 1; p.mgr = 1; emit("sc", ecx(p), ecy(p), p.ch); return true; }
    if (!p.mgr && p.mg < MAGIC_FULL) { p.mgr = 1; emit("sc", ecx(p), ecy(p), p.ch); return true; }   // 止まっていたためを、その段階から再開する
    if (p.a > 0) return false;                   // 攻撃の途中では撃てない
    aim(); p.ml = magicLv(p.mg); p.mg = 0; p.mgr = 0; p.mc = MAGIC_CAST; p.vx *= 0.3;   // ためている最中（または究極魔法までたまって止まっている）なら撃つ
    emit("mgc", ecx(p), ecy(p), p.f, p.ml);
    return true;
  }
  if (sk.hold) {
    if (p.ks > 0) { if (kin) p.ks = Math.min(p.ks + 1, sk.maxCharge); else { aim(); fireHold(p); } return false; }
    if (kpress && p.kc === 0 && p.a === 0 && p.cn === 0 && (chd.id !== "archer" || p.am > 0) && (chd.id !== "bomber" || bombsOf(p).length < bombMax())) { aim(); p.ks = 1; emit("sc", ecx(p), ecy(p), p.ch); return true; }   // ボマー: 爆弾が画面に 2 個ある間は ため始められない
    return false;
  }

  if (kpress && p.kc === 0 && p.a === 0 && p.cn === 0) { aim(); return useSkill(p) !== false; }
  return false;
}

function breakShield(t) { t.sh = 0; t.sbk = SHIELD_BREAK_FRAMES; t.shi = 0; t.bf = 14; }
// frac: 盾なしで当たったときの吹っ飛ばしに対する割合（0 なら横には飛ばず、少し浮いてよろけるだけ）
function knock(att, t, frac, dir, cap) {                         // cap: 強さの上限（ふだんは 1.3。究極魔法だけ上げる）
  if (att.wa) { frac *= ZONE_WARP_MUL; att.wa = 0; }               // スワッパーの回り込み攻撃
  frac = Math.min(cap || 1.3, frac);
  const mul = (att.gb > 0 ? GH_ATK_MUL : 1) * dzMul(t);          // 透過中の攻撃は強く、土下座中は飛びにくい
  t.vx = (dir === undefined ? att.f : dir) * KNOCK_BASE * atkMul(effA(att)) * defMul(effD(t)) * frac * mul;
  t.vy = -9; t.s = Math.max(1, Math.round(Math.abs(t.vx) * STUN_SPEED));   // 攻撃力・防御力・ため量・透過・土下座などで速さが変わると、硬直もそのぶん変わる
  grabBroken(t);
  const fz0 = t.fz, dz0 = t.dz;
  t.a = 0; t.ak = 0; t.cd = 0; t.ks = 0; t.cn = 0; t.fz = 0; t.dz = 0; t.mc = 0;   // 魔法使いの詠唱も取り消し（耐久は減らない）
  t.ground = false; t.hf = 12; releaseGrab(t); t.hd = 0; t.wa = 0; stopWeb(t);   // 吹っ飛ばされたら、回り込み攻撃・糸の動きも取り消し
  if (t.mb > 0) {                                                // 拘束魔法で動けない相手
    if (att.own === t.mbo) {                                     // かけた魔法使い（と分身）の攻撃: 吹っ飛びをためておき、拘束が解けた瞬間にまとめて飛ばす
      const v = t.mbv || (t.mbv = { vx: 0, vy: 0, s: 0, n: 0 });
      v.vx += t.vx; v.vy = Math.max(-15, Math.min(v.vy, t.vy) - (v.n ? 1.5 : 0)); v.s = Math.min(120, v.s + t.s); v.n++;
      t.vx = t.vy = 0; t.s = 0;
    } else { const v = freeBind(t); if (v) { t.vx += v.vx; t.vy = Math.min(t.vy, v.vy); t.s = Math.max(t.s, v.s); } }   // ほかの人の攻撃: 拘束が解けて、たまっていたぶんも足して飛ぶ
  }
  keepRoot(t, fz0, dz0);                                         // 花で動けない相手は、崖の外まで飛ばない限り動けないまま
}
// 拘束魔法を解く（ほかの人の攻撃・つかみ・糸など）。たまっていた吹っ飛び（なければ null）を返す
function freeBind(t) { const v = t.mbv; t.mb = 0; t.mbv = null; return v; }
// 拘束が時間切れで解けた: たまっていた吹っ飛びで飛ぶ
function releaseBind(p) {
  const v = freeBind(p);
  emit("mbx", ecx(p), ecy(p));
  if (!v) return;
  p.vx = v.vx; p.vy = v.vy; p.s = Math.max(1, v.s); p.ground = false; p.hf = 12;
  emit("h", ecx(p), ecy(p), Math.sign(v.vx) || 1, Math.min(1.5, 0.5 + 0.25 * v.n));
  if (flyOut(p)) game.hs = Math.max(game.hs, 10);
}

// 吹っ飛ばされた人が、足場に戻れず崖の外まで飛ぶか（いまの速度で、何も操作しなかったときの軌道を先に計算する）
function flyOut(t) {
  const pls = platforms(), w = pwOf(t), h = phOf(t);
  let x = t.x, y = t.y, vx = t.vx, vy = t.vy;
  for (let f = 0; f < 180; f++) {
    vx *= f < t.s ? 0.985 : 0.88;                // 硬直が解けたら、何も押さなければ横の勢いは止まる
    vy = Math.min(18, vy + 0.6);
    const pb = y + h; x += vx; y += vy;
    if (vy >= 0) for (const pl of pls) if (pb <= pl.y + 0.01 && y + h >= pl.y && x + w > pl.x && x < pl.x + pl.w) return false;   // 足場に着地する
    if (x + w / 2 < KO_L || x + w / 2 > KO_R || y > KO_B) return true;
  }
  return true;
}
// 当たった瞬間: 効果音と演出を出す。全員の動きを一瞬止める（ヒットストップ）のは、崖の外まで飛ぶような当たりだけ（多すぎて重く感じるため）
// kind: b=盾で受けた / k=盾が割れた / h=当たった
function impact(kind, att, t, frac, dir) {
  const d = dir === undefined ? att.f : dir;
  const x = kind === "h" ? ecx(t) : (t.f > 0 ? t.x + pwOf(t) + 4 : t.x - 4), y = ecy(t);   // 体の中心 / 盾の位置
  emit(kind, x, y, d, frac);
  if (kind === "h" && flyOut(t)) game.hs = Math.max(game.hs, 8 + Math.round(3 * frac));
}

// 騎士のカウンター: 受けた攻撃を、相手自身の攻撃力の 200% で相手に返す
function counterHit(kn, att) {
  const dir = Math.sign(ecx(att) - ecx(kn)) || -kn.f;
  att.vx = dir * KNOCK_BASE * atkMul(effA(att)) * defMul(effD(att)) * CN_MUL;
  grabBroken(att); freeBind(att);
  att.vy = -9; att.s = 48; att.a = 0; att.ak = 0; att.cd = 0; att.ks = 0; att.cn = 0; att.fz = 0; att.dz = 0; att.mc = 0; att.ground = false; att.hf = 14; releaseGrab(att); att.hd = 0; stopWeb(att);
  kn.cn = 0; kn.cnHit = true;
  emit("cn", ecx(kn), ecy(kn), dir);
  if (flyOut(att)) game.hs = Math.max(game.hs, 12);
}

// 近接攻撃と矢の命中処理。o: { dir 飛んでくる向き, frac 盾なしの強さ, recoil 反動, breaker 盾を一撃で壊す（吹っ飛ばさない）}
function strike(att, t, o) {
  if (untouchable(t)) return;
  if (t.cn > 0 && att.al) { counterHit(t, att); return; }
  const open = !shieldUp(t) || t.f !== -o.dir;               // 盾がない・外れている・背後から → 盾は効かない
  if (open) { knock(att, t, o.frac, o.dir); impact("h", att, t, o.frac, o.dir); return; }
  if (o.breaker) {                                           // 居合斬り: 盾を壊すだけで、吹っ飛ばしはしない
    breakShield(t); impact("k", att, t, 0, o.dir); return;
  }
  t.shi = 0;                                                 // 盾で受けた（攻撃・防御に関係なく 3 回で壊れる）
  t.sh -= 1 / SHIELD_HITS;
  const broke = t.sh <= 0.001;
  if (broke) breakShield(t); else t.bf = 10;
  t.vx += o.dir * 3;
  if (o.recoil) { att.vx = -o.dir * 5; att.bf = 10; }
  impact(broke ? "k" : "b", att, t, 0, o.dir);
}

function resolveHits(list) {
  for (const p of list) {
    const ak = ATKS[p.ak] || ATKS[0];
    if (!p.al || p.a < ak.on || p.a > ak.off) continue;
    const sz = szOf(p), reach = ak.reach * sz;                       // 巨大化中は射程も 2 倍
    const hx0 = p.f > 0 ? p.x + PLW * sz : p.x - reach, hx1 = hx0 + reach;
    const hy0 = p.y + 8 * sz, hy1 = p.y + (PLH - 8) * sz;
    for (const t of list) {
      if (t === p || ally(t.own, p.own) || p.hit.includes(t) || !t.al || untouchable(t)) continue;
      if (hx1 < hbL(t) || hx0 > hbR(t) || hy1 < t.y || hy0 > t.y + phOf(t)) continue;
      p.hit.push(t);
      strike(p, t, { dir: p.f, frac: ak.frac || 1, recoil: true, breaker: !!ak.breaker });
    }
    hitObjs(p.own, hx0, hy0, hx1, hy1, p.hit);                      // 手下とクロスボウにも当たる（クロスボウは 1 回の攻撃で 1 回だけ削る）
    cutFlowers(p.own, hx0, hy0, hx1, hy1);
  }
}
// おくれたんの花は、敵の通常攻撃（近接）が当たると消える（2026-10-17）。咲く前・落ちている途中の花も消える。飛び道具・爆風では消えない
function cutFlowers(own, x0, y0, x1, y1) {
  for (let i = game.fl.length - 1; i >= 0; i--) {
    const f = game.fl[i], s = f.big ? FLOWER_BIG_SCALE : 1, hw = (f.big ? FLOWER_BIG_HALF : FLOWER_HALF) + 4;
    if (ally(f.own, own) || f.x + hw < x0 || f.x - hw > x1 || f.y < y0 || f.y - 16 * s > y1) continue;
    game.fl.splice(i, 1);
    emit("flx", f.x, f.y, f.big ? 1 : 0);
  }
}

// ボムの爆発: 爆風の中の相手を、盾を無視して軽く吹っ飛ばす（持ち主と分身は無傷）
function explode(b, list) {
  const owner = game.p[b.own], A = owner ? effA(owner) : BASE_STAT;
  emit("x", b.x, b.y, BOMB_BLAST);
  let any = false;
  for (const e of list) {
    if (ally(e.own, b.own) || untouchable(e)) continue;
    const nx = Math.max(hbL(e), Math.min(b.x, hbR(e))), ny = Math.max(e.y, Math.min(b.y, e.y + phOf(e)));
    const dist = Math.hypot(b.x - nx, b.y - ny);
    if (dist > BOMB_BLAST) continue;
    const dir = Math.sign(ecx(e) - b.x) || (e.f > 0 ? -1 : 1);
    e.vx = dir * KNOCK_BASE * atkMul(A) * defMul(effD(e)) * BOMB_KNOCK * dzMul(e) * (1 - 0.4 * dist / BOMB_BLAST);
    grabBroken(e); const bv = freeBind(e); if (bv) e.vx += bv.vx;
    const fz0 = e.fz, dz0 = e.dz;
    e.vy = -BOMB_LIFT; e.s = Math.max(34, bv ? bv.s : 0); e.a = 0; e.ak = 0; e.cd = 0; e.ks = 0; e.cn = 0; e.fz = 0; e.dz = 0; e.mc = 0; e.ground = false; e.hf = 12; releaseGrab(e); e.hd = 0; stopWeb(e);
    keepRoot(e, fz0, dz0);
    if (flyOut(e)) any = true;
  }
  blastObjs(b.own, b.x, b.y, BOMB_BLAST);     // 手下は消え、クロスボウは 1 回削れる
  if (any) game.hs = Math.max(game.hs, 8);   // 崖の外まで飛ばしたときだけ止める
}

function updateProjectiles(list) {
  const pls = platforms();
  for (let i = game.pj.length - 1; i >= 0; i--) {
    const b = game.pj[i];
    b.t++;
    if (b.k === 0) {                                         // ボム
      b.vy += 0.5; b.vx *= 0.995;
      const oy = b.y;
      b.x += b.vx; b.y += b.vy;
      if (b.vy > 0) for (const pl of pls) {                  // 足場の上で跳ねる
        if (oy + BOMB_R <= pl.y + 1 && b.y + BOMB_R >= pl.y && b.x > pl.x - 4 && b.x < pl.x + pl.w + 4) {
          b.y = pl.y - BOMB_R; b.vy = -b.vy * 0.4; if (Math.abs(b.vy) < 2.5) b.vy = 0; b.vx *= 0.7; break;
        }
      }
      if (b.vy !== 0 || Math.abs(b.vx) > 0.8) {              // 飛んでいる・転がっている間は当たり判定がある（同じ相手には 1 回まで）。止まった爆弾は当たらない
        const hit = b.hit || (b.hit = []);
        for (const e of list) {
          if (ally(e.own, b.own) || !e.al || untouchable(e) || hit.includes(e)) continue;
          const nx = Math.max(hbL(e), Math.min(b.x, hbR(e))), ny = Math.max(e.y, Math.min(b.y, e.y + phOf(e)));
          if (Math.hypot(b.x - nx, b.y - ny) > BOMB_R) continue;
          hit.push(e);
          const dir = Math.abs(b.vx) > 0.3 ? Math.sign(b.vx) : (Math.sign(ecx(e) - b.x) || 1);
          const guard = e.cn === 0 && shieldUp(e) && e.f === -dir;
          strike(game.p[b.own] || e, e, { dir, frac: BOMB_HIT_FRAC, recoil: false });   // 盾なら 1 段階削る / 盾がなければ少し吹っ飛ばす（騎士の構えには返される）
          if (guard) { b.vx = -dir * Math.max(BOMB_RECOIL, Math.abs(b.vx) * 0.6); b.vy = Math.min(b.vy, -3.5); }   // 盾に当たった: 跳ね返る
          else { b.vx = -dir * 1.2; b.vy = Math.min(b.vy, -2); }                                                 // 人に当たった: その場で軽く跳ねて落ちる
          b.x = dir > 0 ? Math.min(b.x, hbL(e) - BOMB_R - 1) : Math.max(b.x, hbR(e) + BOMB_R + 1);              // 体の外へ出す
          break;
        }
      }
      const boom = b.t >= BOMB_FUSE;                         // 敵に当たっても爆発しない。導火線が尽きたときだけ爆発
      if (boom) { explode(b, list); game.pj.splice(i, 1); continue; }
      if (b.y > KO_B + 80 || b.x < KO_L - 60 || b.x > KO_R + 60) game.pj.splice(i, 1);
    } else if (b.k === 3) {                                  // 幽霊の爆弾: 置かれた場所から動かず（重力なし）、YUREI_FUSE フレーム後に爆発する（足場が崩れても、その場で爆発）
      if (b.t >= YUREI_FUSE) { yureiBlast(b, list); game.pj.splice(i, 1); continue; }
    } else if (b.k === 2) {                                  // ブーメラン使いの盾: 行き（だんだん遅く）→ 投げた人のほうへ横一直線に戻る（高さは少しずつ合わせる）→ かわされたら、後ろへ飛んで止まり、また戻る
      const o = game.p[b.own];
      if (!o || !o.al) { if (o) o.bt = 0; game.pj.splice(i, 1); continue; }
      let caught = false;
      if (b.ph === 0) {                                      // 行き（かわされたあとも同じ。勢いのまま進んで、だんだん遅くなる）
        const sp = Math.abs(b.vx) - BOOM_DECEL;
        b.vy *= 0.85;
        if (sp > 0) b.vx = Math.sign(b.vx) * sp;
        else { b.vx = 0; b.vy = 0; b.ph = 1; b.dx = Math.sign(ecx(o) - b.x) || 1; b.hit = []; }   // 止まった: 投げた人のいる側へ戻り始める（向きは戻る間ずっと同じ）
      } else {
        const sp = Math.min(BOOM_BACK_MAX, Math.abs(b.vx) + BOOM_BACK_ACC);
        b.vx = b.dx * sp;
        const ty = Math.max(-BOOM_STEER, Math.min(BOOM_STEER, (ecy(o) - b.y) * 0.25));   // 高さはゆっくり合わせるだけなので、跳べばかわせる
        b.vy += (ty - b.vy) * 0.5;
      }
      const ox = b.x, oy = b.y;
      b.x += b.vx; b.y += b.vy;
      const xa = Math.min(ox, b.x) - BOOM_HALF, xb = Math.max(ox, b.x) + BOOM_HALF, ya = Math.min(oy, b.y) - BOOM_HALF, yb = Math.max(oy, b.y) + BOOM_HALF;

function snapshot() {

let tickCount = 0, lastPh = "", lastSig = "";
const nameOf = i => (game.p[i] && game.p[i].n) || "プレイヤー" + (i + 1);
// 入力: held = いま押されているボタン（ホスト自身は myKeys、参加者は届いた最新の状態）/ latch = 前の計算から今までに一度でも押されたボタン。
// 1 回の計算（16.7ms）より短いタップや、押して離すが同時に届いたときも、押したことを 1 回ぶんは必ず計算に渡す
const held = [0, 0, 0, 0], latch = [0, 0, 0, 0];

function hostLoop() {

  const now = performance.now();

    hostTick(); tickCount++;

function startHost() {
  role = "host"; net = "connecting"; netMsg = ""; renderUI();
  roomCode = randCode();
  peer = new Peer(PREFIX + roomCode);
  peer.on("open", () => {
    net = "ready"; myId = 0; game.wr = winRounds;
    const me = game.p[0] = newPlayer(); me.own = 0; spawn(me, 0, 1); me.al = true;
    hostLast = 0; hostTimer = setInterval(hostLoop, 1000 / 60);
    renderUI();
  });
  peer.on("error", e => {
    if (e.type === "unavailable-id" && net === "connecting" && ++hostTries < 30) { peer.destroy(); startHost(); return; }
    if (e.type === "unavailable-id") { net = "error"; netMsg = "空いている部屋番号がありません。しばらくしてからやり直してください"; renderUI(); return; }

      conn.on("open", () => {
        const slot = conns.findIndex(c => c && c.open && c.peer === conn.peer);
        if (slot < 0) { try { conn.close(); } catch (e) {} return; }
        fastConns[slot] = conn;
        conn.on("data", s => {
          if (typeof s !== "string" || fastConns[slot] !== conn) return;
          let d; try { d = JSON.parse(s); } catch (e) { return; }

      });

      inputs[slot] = held[slot] = latch[slot] = inQs[slot] = 0;

}
// 参加者の入力。番号（q）が前に使ったもの以下なら、遅れて届いた古い入力なので使わない（番号のない古い版の参加者は、届いた順に使う）
function takeInput(slot, d) {
  if (d.q !== undefined) { const q = Number(d.q); if (!(q > inQs[slot])) return; inQs[slot] = q; }
  held[slot] = d.k & 63; latch[slot] |= held[slot];
}

function startClient(code) {
  role = "client"; roomCode = code; net = "connecting"; renderUI();
  const sid = sessionId;
  peer = new Peer();
  peer.on("open", () => {
    hostConn = peer.connect(PREFIX + code, { reliable: true });
    hostConn.on("data", d => {
      if (!d) return;
      if (d.t === "hello") { myId = d.id; net = "ready"; renderUI(); openFast(code, sid); }
      else if (d.t === "full") { net = "error"; netMsg = "この部屋は満員です（最大4人）"; renderUI(); }
      else if (d.t === "s") applySnapshot(d);
      else if (d.t === "pause") { hostPause = !!d.v; if (d.v) pauseQ = d.q | 0; }   // ホストが画面を離れた / 戻った
    });
    hostConn.on("close", () => { net = "error"; netMsg = "ホストとの接続が切れました"; renderUI(); });
    setTimeout(() => { if (sid === sessionId && net === "connecting") { net = "error"; netMsg = "部屋が見つかりません（番号を確認してください）"; renderUI(); } }, 10000);
  });

// ---------- UI（DOM）----------
const ui = document.getElementById("ui"), stats = document.getElementById("stats");
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function shareUrl() {

  return u.toString();

// v: 今の値 / base: もとの値（v が大きいぶんの目盛りは「上乗せ」として光らせる）
const barHtml = (v, c, base) => {
  const b = base === undefined ? v : base;             // up: 上がったぶん / dn: 下がったぶん（狂化の防御）
  return `<span class="g" style="--c:${c}">${[1, 2, 3, 4, 5, 6].map(n => `<i class="${n <= v ? (n > b ? "on up" : "on") : (n <= b ? "dn" : "")}"></i>`).join("")}</span>`;
};
// 横画面モード: 画面の上に、全員の名前・キャラ名・勝ち数だけを小さなカードで出す（自分が左上。左右に半分ずつ、まん中は残り時間のために空ける）。
// 性能の棒は自分のカードにだけ付ける（敵の性能は出さない）。LAND_MY_STATS を false にすると自分の分も出さない
const LAND_MY_STATS = true;
function landStatsHtml() {
  const ids = [];
  for (let i = 0; i < MAX_PLAYERS; i++) { const p = game.p[i]; if (p && p.c && p.lk) ids.push(i); }
  ids.sort((a, b) => a === myId ? -1 : b === myId ? 1 : a - b);
  const card = i => {
    const p = game.p[i], c = chOf(p), wins = Array.from({ length: game.wr }, (_, k) => `<i class="${k < p.w ? "on" : ""}"></i>`).join("");
    const vals = [effA(p), effD(p), effS(p)], bases = [baseStat(p, "A"), baseStat(p, "D"), baseStat(p, "S")];   // もとの値（リバーシは今の形態）
    const bars = i === myId && LAND_MY_STATS ? `<div class="hs">${STATS.map((st, k) => barHtml(vals[k], st.color, bases[k])).join("")}</div>` : "";
    return `<div class="hc${i === myId ? " me" : ""}" style="--c:${colOf(i)}"><div><b>${esc(nameOf(i))}</b>` +
      `<div class="sub"><span>${esc(c.name)}${p.lv > 0 ? " ♥" + p.lv : ""}</span><span class="wn">${wins}</span></div></div>${bars}</div>`;
  };
  const half = Math.ceil(ids.length / 2);
  return `<div class="hg">${ids.slice(0, half).map(card).join("")}</div><div class="hg">${ids.slice(half).map(card).join("")}</div>`;
}
// 戦闘中だけ、画面の下に全員のキャラと性能と勝ち数を、1 人ずつのカード（縦並び）で表示する
function statsHtml() {
  if (land) return landStatsHtml();
  let html = "";
  for (let i = 0; i < MAX_PLAYERS; i++) {
    const p = game.p[i];
    if (!p || !p.c || !p.lk) continue;
    const c = chOf(p), wins = Array.from({ length: game.wr }, (_, k) => `<i class="${k < p.w ? "on" : ""}"></i>`).join("");
    const vals = [effA(p), effD(p), effS(p)], bases = [baseStat(p, "A"), baseStat(p, "D"), baseStat(p, "S")];   // もとの値（リバーシは今の形態）
    html +=`<div class="pc${i === myId ? " me" : ""}"><b style="color:${colOf(i)}">${esc(nameOf(i))}</b>${teamLabel(p)}` +
      `<div class="sub"><span>${esc(c.name)}${p.lv > 0 ? " ♥" + p.lv : ""}</span><span class="wn" style="color:${colOf(i)}">${wins}</span></div>` +
      STATS.map((st, k) => `<div class="pr"><span class="lb" style="color:${st.color}">${st.label}</span>${barHtml(vals[k], st.color, bases[k])}</div>`).join("") + `</div>`;
  }
  return `<div class="pcs">${html}</div>`;
}
// 横画面モード: タッチ操作の端末（スマホ・タブレット）を横持ちしているとき。URL に ?land=1 で強制オン、?land=0 で強制オフ（PC で見た目を確かめる用）
let landForce = new URLSearchParams(location.search).get("land");
const coarseMq = window.matchMedia("(pointer:coarse)");
let land = false;
function updateLand() {
  const v = landForce === "1" || (landForce !== "0" && coarseMq.matches && window.innerWidth > window.innerHeight);
  if (v === land) return;
  land = v; cam.init = false; lastHud = "";
  document.body.classList.toggle("land", land);
  if (editing && layoutMode() !== editMode) { commitEdit(); openLayoutEditor(); }
  else applyLayout();                          // 縦・横それぞれの、自分で決めた配置
  refreshHud();
}
let lastHud = "";
function refreshHud() {
  const me = game.p[myId];
  const inBattle = !!(role && net === "ready" && me && game.ph !== "lobby");
  const sig = (inBattle ? 1 : 0) + "|" + (land ? 1 : 0) + "|" + (late() ? 1 : 0) + "|" + game.ph + "|" + game.wr + "|" + myId + "|" +
    game.p.map(p => p ? [p.c ? 1 : 0, p.lk ? 1 : 0, p.ch, p.lv, p.w, p.n, p.tg | 0, p.bz > 0 ? 1 : 0, p.gt > 0 ? 1 : 0, p.fm ? 1 : 0, p.slw > 0 ? 1 : 0].join(",") : "-").join("|");
  if (sig === lastHud) return;
  lastHud = sig;
  document.body.classList.toggle("battle", inBattle);
  document.body.classList.toggle("q4", inBattle && game.p.filter(p => p && p.c && p.lk).length >= 4);   // 4 人のとき、縦持ちのスマホではカードを 2×2 に並べる
  stats.style.display = inBattle ? "flex" : "none";
  if (inBattle) stats.innerHTML = statsHtml();
}

  else if ((CHARS[idx] || CHARS[0]).id === "wizard") c.setTransform(1.15, 0, 0, 1.15, 12, 22);   // 魔法使いは、帽子の先が欠けないよう少し小さく、下げて描く
  else c.setTransform(1.4, 0, 0, 1.4, 8, 14);

}

// 自分のスキルボタン（スマホ）と、キーボード用の表示を更新する
const skBtn = document.querySelector(".tb.skill"), skHint = document.getElementById("skillhint");
let lastSk = "";
function updateSkillUI() {
  const me = game.p[myId];
  let state = "none", label = "なし", sec = "", ratio = 0, bg = "", wizHint = "";   // bg: ボタンの色（魔法使いの段階）/ wizHint: 魔法使いの説明
  if (role && net === "ready" && me && game.ph !== "lobby" && me.yr && !me.al) {   // 幽霊: スキルボタンも爆弾（攻撃ボタンでも落とせる）
    label = "爆弾";
    if (me.yrc > 0) { state = "cool"; ratio = Math.min(1, me.yrc / YUREI_CD); sec = String(Math.ceil(me.yrc / 60)); } else state = "ready";
  } else if (role && net === "ready" && me && game.ph !== "lobby") {
    const sk = chOf(me).skill;
    if (sk) {
      label = sk.name;
      const id = chOf(me).id, zone = id === "swapper" ? zoneOf(me) : null;
      if (id === "spider") {                                     // 蜘蛛: 今の居場所で使う効果の名前と、その効果のクールタイム
        const m = role === "client" ? (me.wm | 0) : webMode(me), k = me.wk[m] | 0;
        label = ["崖へ", "引き寄せ", "急降下"][m] || sk.name;
        if (k > 0) { state = "cool"; ratio = Math.min(1, k / (me.wkm[m] || Math.round(WEB_CD[m] * cdMul()))); sec = String(Math.ceil(k / 60)); } else state = "ready";
      }
      else if (id === "wizard") {                                // 魔法使い: 魔法書の耐久（📖）と、ためている魔法の段階
        if (me.bd <= 0) { state = "cool"; label = "本なし"; ratio = Math.min(1, me.bdT / BOOK_REGEN); sec = String(Math.ceil(me.bdT / 60)); }
        else if (me.mc > 0) { state = "charge"; label = "詠唱"; sec = "📖" + me.bd; bg = MAGIC[Math.max(1, me.ml) - 1].btn; }
        else if (me.mg > 0) {                                     // ためている（mgr）/ 止まっている。ボタンの色は段階の色
          const M = MAGIC[magicLv(me.mg) - 1], full = me.mg >= MAGIC_FULL;
          state = me.mgr ? "charge" : "ready"; label = M.name; sec = "📖" + me.bd; bg = M.btn;
          wizHint = me.mgr ? "もう一度押すと発射（動くと止まる）" : full ? "押すと発射" : "止まっている  押すとため再開";
        }
        else { state = "ready"; label = "ため始め"; sec = "📖" + me.bd; wizHint = "押すとため始める（地上で動くと止まる。空中では横に動いてもたまる）"; }

      }
      else if (zone) { state = "ready"; label = "入れ替え"; sec = String(Math.ceil(zone.t / 60)); }   // スワッパーの ゾーンがある間（数字は円が消えるまでの秒数）
      else if (me.ks > 0) { state = "charge"; label = "ため中"; }
      else if (id === "archer" && me.am <= 0) { state = "cool"; label = "矢なし"; ratio = 1 - me.amT / ARROW_REGEN; sec = "0"; }   // 矢がないとき: 次の 1 本までを円で出す
      else if (me.kc > 0) { state = "cool"; ratio = Math.min(1, me.kc / (me.km || skCd(me))); sec = String(Math.ceil(me.kc / 60)); }
      else if (id === "boomer" && me.sbk > 0) { state = "cool"; label = "盾なし"; ratio = Math.min(1, me.sbk / SHIELD_BREAK_FRAMES); sec = String(Math.ceil(me.sbk / 60)); }   // 盾が壊れている間は投げられない
      else if (id === "boomer" && me.bt > 0) { state = "cool"; label = "盾なし"; ratio = Math.max(0, 1 - me.bt / BOOM_REGEN); sec = String(Math.max(1, Math.ceil((BOOM_REGEN - me.bt) / 60))); }   // 投げている間（受け止めるか、5 秒で新しい盾）
      else if (id === "bomber" && bombsOf(me).length >= bombMax()) {   // 爆弾が画面に 2 個（ラストスパート中は 4 個）: いちばん古い爆弾が爆発するまで
        const t = Math.max(0, BOMB_FUSE - bombsOf(me)[0].t);
        state = "cool"; label = "爆弾2個"; ratio = Math.min(1, t / BOMB_FUSE); sec = String(Math.max(1, Math.ceil(t / 60)));
      }
      else state = "ready";
      if (chOf(me).id === "archer" && state !== "cool") sec = "×" + me.am;      // アーチャー: 残りの矢の本数
      if (id === "bomber" && state === "ready") sec = "×" + (bombMax() - bombsOf(me).length);   // ボマー: あと何個投げられるか
    }
  }
  const key = [state, label, sec, Math.round(ratio * 50), bg, wizHint].join("|");
  if (key === lastSk) return;
  lastSk = key;
  skBtn.dataset.state = state; skBtn.style.setProperty("--p", ratio.toFixed(3));
  if (bg) skBtn.style.background = bg; else skBtn.style.removeProperty("background");

  const x = p.yrx, feet = p.yry, hover = 3 + Math.sin(now / 260 + i) * 1.5, y = feet - hover - 14, col = colOf(i), ready = p.yrc <= 0;
  const st = 1 + Math.min(0.18, Math.abs(p.yrvy || 0) * 0.012);
  cx.save(); cx.globalAlpha = 0.62;
  cx.translate(x, feet); cx.scale(1 / st, st); cx.translate(-x, -feet);
  cx.fillStyle = "#f8fafc"; cx.strokeStyle = col; cx.lineWidth = 2.5;
  cx.beginPath(); cx.arc(x, y - 4, 14, Math.PI, 0); cx.lineTo(x + 14, y + 14);
  for (let k = 0; k < 4; k++) { const wx = x + 14 - (k + 0.5) * 7; cx.lineTo(wx, y + (k % 2 ? 14 : 9)); }
  cx.lineTo(x - 14, y + 14); cx.closePath(); cx.fill(); cx.stroke();
  cx.fillStyle = "#111827"; cx.fillRect(x - 6 + p.f * 2, y - 7, 3, 4); cx.fillRect(x + 3 + p.f * 2, y - 7, 3, 4);
  if (ready) { cx.globalAlpha = 0.9; cx.fillStyle = "#4c1d95"; cx.beginPath(); cx.arc(x + p.f * 20, y + 8, YUREI_R, 0, 6.2832); cx.fill(); }   // 次の爆弾を持っている（進む向きの横）
  cx.restore();
  cx.save(); cx.globalAlpha = 0.8; cx.fillStyle = col; cx.font = "bold 13px sans-serif"; cx.textAlign = "center";
  cx.fillText(nameOf(i) + (me ? " ▲" : ""), x, y - 26);
  cx.restore();
}
// 置かれた幽霊の爆弾: 爆風の範囲（点線の輪）の中で、置いた人の色の円が広がっていき（爆発の瞬間に輪いっぱい）、爆弾は爆発が近いほど速く点滅する
function drawYureiBomb(b, now) {
  const left = Math.max(0, 1 - b.t / YUREI_FUSE), col = colOf(b.own) || "#ffffff";
  cx.save();
  cx.globalAlpha = 0.16 + 0.1 * (1 - left); cx.fillStyle = col; cx.beginPath(); cx.arc(b.x, b.y, YUREI_BLAST * (1 - left), 0, 6.2832); cx.fill();
  cx.globalAlpha = 0.45; cx.strokeStyle = col; cx.lineWidth = 2; cx.setLineDash([6, 5]); cx.beginPath(); cx.arc(b.x, b.y, YUREI_BLAST, 0, 6.2832); cx.stroke(); cx.setLineDash([]);
  cx.restore();
  const flash = Math.floor(b.t / Math.max(2, Math.round(3 + 9 * left))) % 2 === 0;       // 点滅の間隔が、14 フレーム → 3 フレームへ縮む
  cx.fillStyle = flash ? "#4c1d95" : "#f8fafc"; cx.beginPath(); cx.arc(b.x, b.y, YUREI_R, 0, 6.2832); cx.fill();
  cx.strokeStyle = flash ? "#e9d5ff" : col; cx.lineWidth = 2; cx.stroke();
}
// 魔法使いの魔法: 段階の色の光の弾と、後ろに伸びる尾。拘束魔法は輪、究極魔法は太く長い光線
// 究極魔法のビーム: 手もとから射程いっぱいまで、青い太い光と白い芯、黄色と青の稲妻。最後の 8 フレームで細くなって消える
function drawBeam(b, now) {
  const M = MAGIC[3], d = b.dir || Math.sign(b.pw) || 1, L = M.range, k = Math.max(0, Math.min(1, (M.beam - b.t) / 8)), h = BEAM_HALF * (0.6 + 0.4 * k) * (1 + 0.12 * Math.sin(now / 30));
  const x0 = d > 0 ? b.x : b.x - L;
  cx.save();
  cx.globalAlpha = 0.5 * k; cx.fillStyle = M.col; cx.fillRect(x0, b.y - h * 2, L, h * 4);
  cx.globalAlpha = 0.95 * k; cx.fillRect(x0, b.y - h, L, h * 2);
  cx.fillStyle = "#ffffff"; cx.fillRect(x0, b.y - h * 0.4, L, h * 0.8);
  cx.lineWidth = 3;
  for (let j = 0; j < 3; j++) {
    cx.strokeStyle = j % 2 ? M.col2 : "#93c5fd"; cx.beginPath(); cx.moveTo(b.x, b.y);
    for (let s = 1; s <= 24; s++) cx.lineTo(b.x + d * s * L / 24, b.y + (Math.random() - 0.5) * h * 3.2);
    cx.stroke();
  }
  cx.globalAlpha = k; cx.fillStyle = M.col2; cx.beginPath(); cx.arc(b.x, b.y, h * 1.8, 0, 6.2832); cx.fill();
  cx.fillStyle = "#ffffff"; cx.beginPath(); cx.arc(b.x, b.y, h, 0, 6.2832); cx.fill();
  cx.restore();
}
function drawMagic(b, now) {
  const M = MAGIC[(b.lv || 1) - 1] || MAGIC[0], d = Math.sign(b.vx) || 1, lv = b.lv || 1, L = [40, 52, 34, 140][lv - 1], r = [6, 9, 11, 14][lv - 1];
  cx.save();
  const g = cx.createLinearGradient(b.x - d * L, 0, b.x, 0); g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(1, M.col);
  cx.fillStyle = g; cx.fillRect(Math.min(b.x, b.x - d * L), b.y - r * 0.7, L, r * 1.4);
  cx.globalAlpha = 0.6; cx.fillStyle = M.col; cx.beginPath(); cx.arc(b.x, b.y, r * 2, 0, 6.2832); cx.fill();
  cx.globalAlpha = 1; cx.beginPath(); cx.arc(b.x, b.y, r, 0, 6.2832); cx.fill();
  cx.fillStyle = "#ffffff"; cx.beginPath(); cx.arc(b.x, b.y, r * 0.45, 0, 6.2832); cx.fill();
  if (lv === 3) { cx.strokeStyle = M.col; cx.lineWidth = 2; cx.lineWidth = 3; cx.beginPath(); cx.ellipse(b.x, b.y, 9, 21, now / 80, 0, 6.2832); cx.stroke(); }
  if (M.col2) {                                                     // 究極魔法: 光線のまわりに黄色と青の稲妻
    cx.lineWidth = 3;
    for (let k = 0; k < 3; k++) {
      cx.strokeStyle = k % 2 ? M.col : M.col2; cx.beginPath();
      let x = b.x, y = b.y; cx.moveTo(x, y);
      for (let j = 0; j < 7; j++) { x -= d * 20; y = b.y + (Math.random() - 0.5) * 34; cx.lineTo(x, y); }
      cx.stroke();
    }
  }
  cx.restore();
}
function drawThrownShield(b) {                     // ブーメラン使いが投げた盾（回りながら飛ぶ。縁は持ち主の色）
  cx.save(); cx.translate(b.x, b.y); cx.rotate(b.t * 0.45);
  cx.fillStyle = "rgba(226,232,240,0.95)"; cx.fillRect(-4, -19, 8, 38);
  cx.strokeStyle = colOf(b.own) || "#ffffff"; cx.lineWidth = 2; cx.strokeRect(-4, -19, 8, 38);
  cx.restore();
}
function drawSpear(b) {                            // ゴブGの槍（飛ぶ向きに回す。茶色の柄と灰色の穂先）
  cx.save(); cx.translate(b.x, b.y); cx.rotate(Math.atan2(b.vy, b.vx));
  cx.strokeStyle = "#92400e"; cx.lineWidth = 2.5; cx.beginPath(); cx.moveTo(-10, 0); cx.lineTo(5, 0); cx.stroke();
  cx.fillStyle = "#cbd5e1"; cx.beginPath(); cx.moveTo(11, 0); cx.lineTo(4, -3.5); cx.lineTo(4, 3.5); cx.fill();
  cx.restore();
}
// クロスボウ（置き物）: 茶色の台座と柱の上に、横向きのクロスボウ。台座に持ち主の色の帯、上に耐久の点。足場に乗っている間は、射線を持ち主の色の薄い点線で出す
function drawCb(c, now) {
  const f = c.f, x = c.x, y = c.y, col = colOf(c.own) || "#ffffff", mx = f > 0 ? x + CB_W : x, on = c.rl >= 0;
  const blink = c.t >= CB_LIFE - CB_BLINK && Math.floor(now / 120) % 2;
  if (c.g !== undefined ? c.g : on) {              // 足場に乗っている間だけ（ホストは g、参加者は rl が -1 でないこと）
    cx.save(); cx.globalAlpha = 0.15; cx.strokeStyle = col; cx.lineWidth = 2; cx.setLineDash([8, 8]);
    cx.beginPath(); cx.moveTo(mx, y + 4); cx.lineTo(mx + f * CB_RANGE, y + 4); cx.stroke(); cx.restore();
  }
  cx.save();
  if (blink) cx.globalAlpha = 0.3;
  cx.fillStyle = "#78350f"; cx.beginPath(); cx.moveTo(x + 4, y + CB_H); cx.lineTo(x + CB_W - 4, y + CB_H); cx.lineTo(x + CB_W - 8, y + 19); cx.lineTo(x + 8, y + 19); cx.fill();
  cx.fillStyle = col; cx.fillRect(x + 7, y + 22, CB_W - 14, 2);
  cx.fillStyle = "#92400e"; cx.fillRect(x + CB_W / 2 - 2, y + 5, 4, 14);
  cx.fillStyle = "#a16207"; cx.fillRect(x + 2, y + 2, CB_W - 4, 4);
  cx.strokeStyle = "#451a03"; cx.lineWidth = 2.5; cx.beginPath(); cx.moveTo(mx - f * 5, y - 1); cx.quadraticCurveTo(mx + f * 4, y + 4, mx - f * 5, y + 9); cx.stroke();
  cx.strokeStyle = "#e5e7eb"; cx.lineWidth = 1; cx.beginPath(); cx.moveTo(mx - f * 5, y - 1); cx.lineTo(mx - f * 5, y + 9); cx.stroke();
  if (c.rl === 0) {                                // 矢を装填している
    cx.strokeStyle = "#e5e7eb"; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(mx - f * 22, y + 4); cx.lineTo(mx + f * 1, y + 4); cx.stroke();
    cx.fillStyle = "#cbd5e1"; cx.beginPath(); cx.moveTo(mx + f * 6, y + 4); cx.lineTo(mx + f * 1, y + 1); cx.lineTo(mx + f * 1, y + 7); cx.fill();
  }
  if (c.hp < CB_HP) {                              // ひび
    cx.strokeStyle = "rgba(15,23,42,0.8)"; cx.lineWidth = 1;
    cx.beginPath(); cx.moveTo(x + 10, y + 19); cx.lineTo(x + 13, y + 23); cx.lineTo(x + 11, y + CB_H);
    if (c.hp < CB_HP - 1) { cx.moveTo(x + 20, y + 19); cx.lineTo(x + 17, y + 22); cx.lineTo(x + 20, y + CB_H); }
    cx.stroke();
  }
  for (let k = 0; k < CB_HP; k++) { cx.fillStyle = k < c.hp ? col : "rgba(255,255,255,0.2)"; cx.beginPath(); cx.arc(x + CB_W / 2 + (k - (CB_HP - 1) / 2) * 7, y - 9, 2.5, 0, 6.2832); cx.fill(); }
  cx.restore();
}
// ゴブGの手下: 緑の体に、持ち主の色の縁取り。前に小さな剣。斬る間は、黄色い弧が出る。残り 1 秒は点滅
function drawMinion(m, now) {
  const f = m.f, x = m.x, y = m.y, col = colOf(m.own) || "#ffffff";
  cx.save();
  if (m.t >= MN_LIFE - 60 && Math.floor(now / 120) % 2) cx.globalAlpha = 0.4;
  cx.fillStyle = "#16a34a"; cx.fillRect(x, y, MN_W, MN_H);
  cx.strokeStyle = col; cx.lineWidth = 2; cx.strokeRect(x + 1, y + 1, MN_W - 2, MN_H - 2);
  cx.fillStyle = "#16a34a"; cx.beginPath(); cx.moveTo(x, y + 3); cx.lineTo(x - 4, y + 1); cx.lineTo(x, y + 7); cx.fill();
  cx.beginPath(); cx.moveTo(x + MN_W, y + 3); cx.lineTo(x + MN_W + 4, y + 1); cx.lineTo(x + MN_W, y + 7); cx.fill();
  cx.fillStyle = "#fde047"; cx.fillRect(f > 0 ? x + 8 : x + 2, y + 5, 4, 4);
  cx.fillStyle = "#111827"; cx.fillRect(f > 0 ? x + 10 : x + 2, y + 6, 2, 2);
  const hx = f > 0 ? x + MN_W : x, hy = y + 12, ang = m.a > 0 ? -1.2 + 2.2 * Math.min(1, m.a / MN_OFF) : -0.4;
  cx.strokeStyle = "#cbd5e1"; cx.lineWidth = 2.5; cx.beginPath(); cx.moveTo(hx, hy); cx.lineTo(hx + f * Math.cos(ang) * 12, hy + Math.sin(ang) * 12); cx.stroke();
  if (m.a >= MN_ON && m.a <= MN_OFF) {
    cx.strokeStyle = "#fde047"; cx.lineWidth = 3; cx.beginPath();
    cx.arc(hx, hy, MN_REACH - 2, f > 0 ? -1.1 : Math.PI - 1.1, f > 0 ? 1.1 : Math.PI + 1.1); cx.stroke();
  }
  cx.restore();
}
function drawFlower(f, now) {
  const s = f.big ? FLOWER_BIG_SCALE : 1;                  // 大きな花は 1.6 倍（色は同じ）
  if (f.air) {                                             // 落ちている花: 花びらを下にして、くるくる回りながら落ちる
    cx.save(); cx.translate(f.x, f.y - 8 * s); cx.rotate(now / 120);
    cx.fillStyle = "#f472b6";
    for (let k = 0; k < 5; k++) { const a = k * 1.2566; cx.beginPath(); cx.arc(Math.cos(a) * 5 * s, Math.sin(a) * 5 * s, 4 * s, 0, 6.2832); cx.fill(); }
    cx.fillStyle = "#facc15"; cx.beginPath(); cx.arc(0, 0, 3 * s, 0, 6.2832); cx.fill();
    cx.restore();
    cx.strokeStyle = "#16a34a"; cx.lineWidth = 2 * s; cx.beginPath(); cx.moveTo(f.x, f.y - 8 * s); cx.lineTo(f.x, f.y - 20 * s); cx.stroke();
    return;
  }

  const g = Math.min(1, f.t / FLOWER_ARM), h = 16 * g * s, hx = f.x + Math.sin(now / 300 + f.x) * 1.5 * g * s, hy = f.y - h;
  cx.strokeStyle = "#16a34a"; cx.lineWidth = 2.5 * s; cx.beginPath(); cx.moveTo(f.x, f.y); cx.lineTo(hx, hy); cx.stroke();
  cx.fillStyle = "#16a34a"; cx.fillRect(f.x - 6 * s, f.y - 5 * s, 6 * s, 2 * s); cx.fillRect(f.x + 1 * s, f.y - 8 * s, 6 * s, 2 * s);
  cx.fillStyle = f.t >= FLOWER_ARM ? "#f472b6" : "#fbcfe8";
  for (let k = 0; k < 5; k++) { const a = k * 1.2566; cx.beginPath(); cx.arc(hx + Math.cos(a) * 4 * g * s, hy + Math.sin(a) * 4 * g * s, 3.4 * g * s, 0, 6.2832); cx.fill(); }
  cx.fillStyle = "#facc15"; cx.beginPath(); cx.arc(hx, hy, 2.4 * g * s, 0, 6.2832); cx.fill();
}
// 天狗の風の場: うっすら色のついた範囲に、風下へ流れる線（出るときと消えるときはふわっと）
function drawWind(w, now) {
  const fade = Math.max(0, Math.min(1, w.t / 10, (WIND_FRAMES - w.t) / 30));
  cx.save(); cx.globalAlpha = fade;
  cx.fillStyle = "rgba(186,230,253,0.10)"; cx.fillRect(w.x, w.y, w.w, w.h);
  cx.strokeStyle = colOf(w.own) || "#ffffff"; cx.globalAlpha = fade * 0.35; cx.lineWidth = 1.5; cx.setLineDash([6, 6]);
  cx.strokeRect(w.x, w.y, w.w, w.h); cx.setLineDash([]);
  cx.beginPath(); cx.rect(w.x, w.y, w.w, w.h); cx.clip();
  cx.globalAlpha = fade * 0.6; cx.strokeStyle = "#e0f2fe"; cx.lineWidth = 2; cx.lineCap = "round";
  cx.beginPath();
  for (let k = 0; k < 10; k++) {
    const yy = w.y + 12 + (w.h - 24) * ((k * 0.618) % 1), len = 26 + (k % 3) * 16;
    const off = ((now * 0.32 + k * 71) % (w.w + len)) - len;
    const x0 = w.d > 0 ? w.x + off : w.x + w.w - off - len;
    cx.moveTo(x0, yy); cx.quadraticCurveTo(x0 + len / 2, yy - 4, x0 + len, yy);
  }
  cx.stroke(); cx.restore();
}
// スワッパーの ゾーン: ためている間はスワッパーを中心に広がり（点線）、張ったあとはその場所に残る（実線。消える前の 1 秒は点滅）。全員に見える
function drawZoneCircle(x, y, r, placed, alpha) {
  cx.save(); cx.globalAlpha = alpha;
  cx.fillStyle = placed ? "rgba(103,232,249,0.14)" : "rgba(103,232,249,0.09)"; cx.strokeStyle = "rgba(103,232,249,0.85)"; cx.lineWidth = placed ? 2.5 : 2;
  if (!placed) cx.setLineDash([8, 6]);
  cx.beginPath(); cx.arc(x, y, r, 0, 6.2832); cx.fill(); cx.stroke();
  cx.restore();
}
function drawZone(p) { drawZoneCircle(ecx(p), ecy(p), zoneR(p.ks), false, 1); }
function drawPlacedZone(m, now) {
  const fadeIn = Math.min(1, (ZONE_LIFE - m.t) / 6), blink = m.t < 60 && Math.floor(now / 120) % 2 ? 0.45 : 1;
  drawZoneCircle(m.x, m.y, m.r, true, fadeIn * blink);
}
// 時計師の巻き戻しの残像（各自の画面で作る）
const rwGhosts = [];
function drawRewindGhosts(dt) {
  for (let k = rwGhosts.length - 1; k >= 0; k--) if ((rwGhosts[k].t += dt) >= 24) rwGhosts.splice(k, 1);
  for (const g of rwGhosts) {
    cx.save(); cx.globalAlpha = 0.45 * (1 - g.t / 24);
    drawChar(cx, g.ch, g.x, g.y, g.f, "#60a5fa", false);
    cx.restore();
  }
}
function banner(t, sub) {
  const fs = land ? Math.min(44, ch / 8.5) : Math.min(56, cw / 9), h = fs * 2.4, y = ch * 0.3;
  const s = 1 + 0.45 * Math.max(0, 1 - fxBannerT / 9);                 // 出た瞬間だけ少し大きく弾む
  cx.save(); cx.translate(cw / 2, y + h / 2); cx.scale(s, s); cx.translate(-cw / 2, -(y + h / 2));
  cx.fillStyle = "rgba(0,0,0,0.45)"; cx.fillRect(0, y, cw, h);
  cx.fillStyle = "#fff"; cx.textAlign = "center"; cx.font = "bold " + fs + "px sans-serif"; cx.fillText(t, cw / 2, y + fs * 1.15);
  if (sub) { cx.font = fs * 0.4 + "px sans-serif"; cx.fillStyle = "#d1d5db"; cx.fillText(sub, cw / 2, y + fs * 1.85); }
  cx.restore();
}
// 画面上部の中央に、残り時間（サドンデス中は警告）を出す
function drawTimer(now) {
  if (game.ph !== "play" && game.ph !== "count") return;
  let fs = Math.max(16, Math.min(34, cw / 13)), ty = fs + 6;
  if (land) { const num = game.sd <= 0; fs = num ? 30 : 17; ty = num ? 36 : 70; }     // 横画面: 数字は上のまん中（左右のカードのあいだ）、警告の文は、カードの下
  const blink = Math.floor(now / 250) % 2 === 0;
  const E2 = SD_SHRINK_FRAMES, E3 = SD_SHRINK_FRAMES + SD_HOLD_FRAMES;
  let text, color;
  if (game.sd >= E3) { text = "足場が崩れた！"; color = blink ? "#fca5a5" : "#ef4444"; }
  else if (game.sd >= E2) { text = "足場が崩れるまで " + Math.ceil((E3 - game.sd) / 60); color = blink ? "#fca5a5" : "#ef4444"; }
  else if (game.sd > 0) { text = "SUDDEN DEATH"; color = blink ? "#fca5a5" : "#ef4444"; }
  else {
    const secs = Math.max(0, Math.ceil(game.rt / 60));
    text = String(secs); color = secs <= 10 ? (blink ? "#fca5a5" : "#ef4444") : late() ? "#fb923c" : "rgba(255,255,255,0.9)";   // ラストスパート中は橙（残り 10 秒からは赤の点滅）
    if (training) { text = "撃墜 " + trainKO; color = "rgba(255,255,255,0.9)"; }   // トレーニング: 制限時間はなく、相手を落とした回数を出す
  }
  cx.textAlign = "center"; cx.font = "bold " + fs + "px sans-serif"; cx.lineJoin = "round"; cx.lineWidth = 4; cx.strokeStyle = "rgba(0,0,0,0.55)";
  cx.strokeText(text, cw / 2, ty); cx.fillStyle = color; cx.fillText(text, cw / 2, ty);
}
// ---------- カメラ ----------
// 通常（縦持ち・PC）: 以前どおり、ステージを画面幅いっぱいに映す。ただし戦っている人がその外（崖の外）へ出たら、その人が映るまで広げて引く。
// 横画面モード（スマホの横持ち）: 戦っている全員を、操作ボタンと上部のカードに重ならない範囲で、できるだけ大きく映す。
//   近づけばズームイン、離れたり崖の外へ出たりすればズームアウトし、カメラの位置も動く（solveLandCam）。
const VIEW_W = 640;                                  // 画面幅いっぱいに映すワールドの幅（ステージ580＋余白）
const VIEW_TOP = PY - 380, VIEW_BOTTOM = PY + 80;    // いつも映しておく縦の範囲（ワールド座標）。上の台に立っていても収まる
let camTop = VIEW_TOP;                               // いま映している上端。高く跳んだ人がいると上がり、そのぶん画面が少し引く
const cam = { s: 1, x: CENTER_X, y: (VIEW_TOP + VIEW_BOTTOM) / 2, init: false };   // いまのカメラ: 倍率 / 中心のワールド座標 / 横画面で初期化済みか
let camView = { x0: 0, y0: 0, x1: W, y1: H };        // いま映しているワールドの範囲（撃墜の演出の位置に使う）
const camVel = [null, null, null, null];             // 戦っている人の速度の推定（先読み用。参加者の画面には速度が届かないので、動きから測る）
const camExp = { l: 0, r: 0, t: 0, b: 0 };           // 通常カメラで、戦っている人が映る範囲の外へ出たとき、範囲を広げているぶん（ワールド px）
const LAND_FEET = 0.66;                              // 横画面: 足もとを置きたい高さ（画面の上から 66%。下の 3 割はステージの側面と崖の外）

  if (role === "client") { game.p.forEach(smoothClient); game.cl.forEach(smoothClient); }
  const g = cx.createLinearGradient(0, 0, 0, ch); g.addColorStop(0, "#1e293b"); g.addColorStop(1, "#0f172a");
  cx.fillStyle = g; cx.fillRect(0, 0, cw, ch);
  updateCamera(dt);
  // 画面の揺れ（強さは毎フレーム減衰する）
  let ox = 0, oy = 0;
  if (shakeAmp > 0.25) { ox = (Math.random() * 2 - 1) * shakeAmp; oy = (Math.random() * 2 - 1) * shakeAmp; shakeAmp *= Math.pow(0.86, dt); }
  else shakeAmp = 0;
  cx.save();
  cx.translate(ox + cw / 2 - cam.x * cam.s, oy + ch / 2 - cam.y * cam.s);
  cx.scale(cam.s, cam.s);
  // ステージ（メイン＋人数に応じた上の台）。サドンデス中は縮んでいく端が赤く点滅する
  const sdOn = game.sd > 0, blink = Math.floor(now / 250) % 2 === 0;
  for (const pl of platforms()) {
    if (pl.main) {
      cx.fillStyle = "#64748b"; cx.fillRect(pl.x, pl.y, pl.w, 22);
      cx.fillStyle = "#475569"; cx.fillRect(pl.x + 20, pl.y + 22, Math.max(0, pl.w - 40), 30);
    } else {
      cx.fillStyle = "rgba(100,116,139,0.85)"; cx.fillRect(pl.x, pl.y, pl.w, UP_H);   // 下からは通り抜けられる台
      cx.fillStyle = "#94a3b8"; cx.fillRect(pl.x, pl.y, pl.w, 3);                      // 上面（ここに乗れる）
    }
    if (sdOn) {
      cx.fillStyle = blink ? "#ef4444" : "#b91c1c";
      const th = pl.main ? 22 : UP_H;
      cx.fillRect(pl.x, pl.y, 5, th); cx.fillRect(pl.x + pl.w - 5, pl.y, 5, th);
    }
  }
  // 撃墜ライン: この外へ出ると脱落する。崖の外まで映っているときだけ、うっすら見える
  if (game.ph !== "lobby" && (camView.x0 < KO_L || camView.x1 > KO_R || camView.y1 > KO_B)) {
    const v = camView, top = Math.min(v.y0, KO_B);
    cx.save(); cx.strokeStyle = "rgba(248,113,113,0.38)"; cx.lineWidth = 2 / cam.s; cx.setLineDash([12 / cam.s, 9 / cam.s]);
    cx.beginPath();
    if (v.x0 < KO_L) { cx.moveTo(KO_L, top); cx.lineTo(KO_L, KO_B); }
    if (v.x1 > KO_R) { cx.moveTo(KO_R, top); cx.lineTo(KO_R, KO_B); }
    if (v.y1 > KO_B) { cx.moveTo(Math.max(v.x0, KO_L), KO_B); cx.lineTo(Math.min(v.x1, KO_R), KO_B); }
    cx.stroke(); cx.restore();
  }
  for (const w of game.wd) drawWind(w, now);
  for (const f of game.fl) drawFlower(f, now);
  for (const m of game.rm) drawPlacedZone(m, now);
  for (const c of game.cb) drawCb(c, now);
  for (const p of game.p) if (p && p.c && p.al && p.ks > 0 && chOf(p).id === "swapper") drawZone(p);
  drawRewindGhosts(dt);
  // プレイヤーと分身（吹っ飛んでいる間は残像を引く。巻き戻し中は、通った場所に青い残像を残す）
  const drawWithTrail = (p, i, me) => {
    if (!p.al && p.yr) { drawYurei(p, i, me, now); return; }
    const h = p.hist || (p.hist = []);
    h.push(p.x, p.y); if (h.length > 14) h.splice(0, 2);
    if (p.al && p.rw > 0 && rwGhosts.length < 80) rwGhosts.push({ x: p.x, y: p.y, f: p.f, ch: p.ch, t: 0 });
    if (p.al && p.s > 0) {
      cx.save(); cx.fillStyle = p.isClone ? CLONE_COLOR : colOf(i);
      const tz = p.gt > 0 ? GIANT_SCALE : 1;
      for (let k = 0; k < h.length - 2; k += 2) { cx.globalAlpha = 0.05 + 0.2 * (k / h.length); cx.fillRect(h[k], h[k + 1], PLW * tz, PLH * tz); }
      cx.restore();
    }
    drawPlayer(p, i, me, now);
  };
  for (let i = 0; i < MAX_PLAYERS; i++) { const c = game.cl[i]; if (c) drawWithTrail(c, i, false); }
  for (let i = 0; i < MAX_PLAYERS; i++) { const p = game.p[i]; if (p && p.c) drawWithTrail(p, i, i === myId); }
  for (const m of game.mn) drawMinion(m, now);
  for (const b of game.pj) { if (b.k === 0) drawBomb(b, now); else if (b.k === 2) drawThrownShield(b); else if (b.k === 3) drawYureiBomb(b, now); else if (b.k === 4) drawSpear(b); else if (b.k === 5) drawMagic(b, now); else if (b.k === 6) drawBeam(b, now)
; else drawArrow(b); }
  drawFx();
  cx.restore();
  if (flashA > 0.02) { cx.fillStyle = "rgba(255,255,255," + flashA.toFixed(3) + ")"; cx.fillRect(0, 0, cw, ch); flashA *= Math.pow(0.8, dt); }
  else flashA = 0;
  // メッセージ
  drawTimer(now);
  if (game.ph === "count") banner(String(Math.ceil(game.tm / 60)), "ラウンド開始！");
  else if (game.ph === "round") banner(game.win >= 0 ? (game.wt ? teamWord(game.wt) : nameOf(game.win)) + " の勝ち！" : "引き分け");
  else if (game.ph === "match") banner((game.wt ? teamWord(game.wt) : nameOf(game.win)) + " 優勝！", "まもなくロビーに戻ります");

  else if (game.ph === "play") {
    if (fxSdT > 0) banner("サドンデス！", "足場が縮みます");
    else if (fxGoT > 0) banner("GO!");
    const yr = myId >= 0 && game.p[myId] && !game.p[myId].al && game.p[myId].yr;
    if (!yr) yureiSince = 0; else if (!yureiSince) yureiSince = now;
    const hintY = land ? 96 : Math.max(16, Math.min(34, cw / 13)) + 34;
    let lateY = hintY;                                     // ラストスパートの文の位置（幽霊の説明が出ているときは、その下）
    if (myId >= 0 && game.p[myId] && !game.p[myId].al && (!yr || now - yureiSince < 4000)) {   // 幽霊の説明は、なってから 4 秒だけ
      cx.fillStyle = "rgba(255,255,255,.6)"; cx.textAlign = "center";
      if (yr) {
        cx.font = Math.min(15, cw / 28) + "px sans-serif";
        cx.fillText("幽霊になった！ 攻撃ボタンで爆弾を置く（1秒後に爆発）", cw / 2, hintY);
        cx.fillText("落ちても幽霊で復活", cw / 2, hintY + 18); lateY = hintY + 40;
      } else { cx.font = "18px sans-serif"; cx.fillText("観戦中", cw / 2, hintY); lateY = hintY + 26; }
    }
    if (fxLateT > 0) {                                      // ラストスパート突入の知らせ（約 3 秒。最後の 0.5 秒で消える）
      const a = Math.min(1, fxLateT / 30), pop = 1 + 0.25 * Math.max(0, 1 - (180 - fxLateT) / 8), fs = Math.min(26, cw / 15) * pop;
      cx.save(); cx.globalAlpha = a; cx.textAlign = "center"; cx.lineJoin = "round"; cx.lineWidth = 4; cx.strokeStyle = "rgba(0,0,0,0.55)";
      cx.font = "bold " + fs + "px sans-serif"; cx.strokeText("ラストスパート！", cw / 2, lateY + 6); cx.fillStyle = "#fb923c"; cx.fillText("ラストスパート！", cw / 2, lateY + 6);
      cx.font = Math.min(15, cw / 26) + "px sans-serif"; cx.lineWidth = 3;
      cx.strokeText("スキルのクールタイムが半分に", cw / 2, lateY + 28); cx.fillStyle = "#fed7aa"; cx.fillText("スキルのクールタイムが半分に", cw / 2, lateY + 28);
      cx.restore();
    }
  }
  if (role === "client" && hostPause) {                    // ホストが画面を離れている間は、ゲームが止まっている
    cx.fillStyle = "rgba(0,0,0,0.55)"; cx.fillRect(0, 0, cw, ch);
    cx.fillStyle = "#fff"; cx.textAlign = "center"; cx.font = "bold " + Math.max(12, Math.min(24, (cw - 20) / 21)) + "px sans-serif";
    cx.fillText("ホストが画面を離れているため一時停止中", cw / 2, ch / 2);
  }
}
function loop() { render(); requestAnimationFrame(loop); }

applyLayout();
renderUI();
loop();
</script>
</body>
</html>

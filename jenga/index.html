<body>

<div id="ui"><div class="screen"><div class="card"><h1>ジェンガ</h1><p class="lead">読み込み中…</p></div></div></div>
<script type="module">
import * as THREE from "three";
import RAPIER from "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/rapier.es.js";

await RAPIER.init();

// ================= 数値 =================
// 長さの単位：ブロックの幅 = 1（本物のジェンガ 7.5×2.5×1.5cm を 3×1×0.6 に）
const BL = 3, SLOT = 1, BW = 0.97, BH = 0.6;   // ブロックの長さ / 置き場の間隔 / ブロックの幅（すき間をあける）/ 高さ
const LEVELS = 18, N = LEVELS * 3;
const GRAV = -25;                  // 重力（見ためが軽すぎないよう本物より強め）
const DT = 1 / 120;                // 物理の 1 ステップ
let HVAR = 0.03;                 // ブロックの高さのばらつき（±3%）。高いブロックが重さを受け、低いブロックはゆるくなる
let FRICTION = 0.45;
let LIFT_MAX = 0.2;               // 押す・引くときに、指の上下でブロックを上下できる幅（元の高さから ±）。上下にゆらすとタワーも揺れる
const ROT_SPEED = 50 * Math.PI / 180;   // 置くときの回転ボタンを押している間の回る速さ（1秒あたり）
const FINGER_VMAX = 25;             // 指についていく速さの上限（1秒あたり）。ふつうに動かすぶんには指とぴったり同じに動く
let JITTER = 0.08;                 // 最初に積むときのずれ（長さ方向）。きっちりそろっていないぶん崩れやすい
const FALL_DROP = 0.75 * BH;       // ターン開始時からこれ以上下がったブロックがあれば「崩れた」
const SNAP_MS = 50;                // 動きを送る間隔（2026-11-06 に 80 → 50。落としてよい通り道で送るので増やしても詰まらない）
const PREFIX = "jenga-online-room-";
// パーティ（you know games のゲーム一覧で作るグループ）から開いたとき（?party=1）は、番号を入れずに自動で部屋を作る・入る。
// ホストはパーティの番号（1けた）で部屋を作り、ゲストはその部屋が開くまで探し続ける。ホストがいなくなったら、ゲストもゲーム一覧へ戻る。
const PARTY = (() => {
  try { if (!new URLSearchParams(location.search).has("party")) return null; const j = JSON.parse(sessionStorage.getItem("ykg-party") || "null"); return j && /^\d$/.test(j.code) ? j : null; } catch (e) { return null; }
})();
const netId = code => (PARTY ? "jenga-party-" : PREFIX) + code;   // パーティは、ふつうの部屋と別の ID を使う
let partyTries = 0;
let spectating = false, lobbySpecs = [];   // 観戦している / ロビーに出す観戦の人の名前
// パーティの成績: 勝ち負けが決まったら、ゲーム一覧で集計するために置いておく（ホストだけ）
function partyReport(w, l) {
  if (!PARTY || PARTY.role !== "host") return;
  try { const a = JSON.parse(sessionStorage.getItem("ykg-results") || "[]"); a.push({ game: "jenga", w, l }); sessionStorage.setItem("ykg-results", JSON.stringify(a)); } catch (e) {}
}
const MAX_PLAYERS = 4;
// 倒れやすさ（難易度）4段階。部屋ごとにホストが決め、開始のときに全員へ送る。4 が一番倒れやすい
const DIFFS = {
  1: { label: "1", HVAR: 0.02, JITTER: 0, FRICTION: 0.65, LIFT: 0.1, note: "いちばん倒れにくい。ブロックがきっちりそろっていて、すべりにくい" },
  2: { label: "2", HVAR: 0.025, JITTER: 0.02, FRICTION: 0.55, LIFT: 0.15, note: "倒れにくい" },
  3: { label: "3", HVAR: 0.028, JITTER: 0.05, FRICTION: 0.5, LIFT: 0.18, note: "やや倒れやすい" },
  4: { label: "4", HVAR: 0.03, JITTER: 0.08, FRICTION: 0.45, LIFT: 0.2, note: "いちばん倒れやすい。ずれがあって、すべりやすい" },
};
const DIFF_DEFAULT = "2";
const OLD_DIFF = { s: "2", m: "4", l: "4" };   // 前の 小・中・大 で覚えていた値の読みかえ
let diff = DIFF_DEFAULT;
function applyDiff(k) {
  k = String(OLD_DIFF[k] || k);
  const d = DIFFS[k] || DIFFS[DIFF_DEFAULT]; diff = DIFFS[k] ? k : DIFF_DEFAULT;
  HVAR = d.HVAR; JITTER = d.JITTER; FRICTION = d.FRICTION; LIFT_MAX = d.LIFT;
}
const ACTIVE = ["pull", "carry", "place", "settle", "fallen"];   // 自分が物理を動かしている間

// ================= 3D 表示 =================
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x161a24);
scene.fog = new THREE.Fog(0x161a24, 30, 60);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x5a4532, 1.15));
const sun = new THREE.DirectionalLight(0xfff2dd, 1.35);
sun.position.set(8, 20, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 14, bottom: -4, near: 1, far: 50 });
scene.add(sun);
// カメラ側から当てる弱い光（影の側のブロックも見えるように）
const fill = new THREE.DirectionalLight(0xffffff, 0.75);
scene.add(fill); scene.add(fill.target);
const table = new THREE.Mesh(new THREE.CylinderGeometry(15, 15, 0.4, 64), new THREE.MeshStandardMaterial({ color: 0x4a3322, roughness: 0.9 }));
table.position.y = -0.2; table.receiveShadow = true; scene.add(table);

function woodTexture() {
  const c = document.createElement("canvas"); c.width = 512; c.height = 128;
  const g = c.getContext("2d");
  g.fillStyle = "#dcb47c"; g.fillRect(0, 0, 512, 128);
  for (let i = 0; i < 70; i++) {
    g.strokeStyle = `rgba(${110 + Math.random() * 30},${70 + Math.random() * 20},35,${0.05 + Math.random() * 0.13})`;
    g.lineWidth = 0.6 + Math.random() * 2.2;
    g.beginPath(); let y = Math.random() * 128; g.moveTo(0, y);
    for (let x = 0; x <= 512; x += 32) { y += (Math.random() - 0.5) * 3; g.lineTo(x, y); }
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const WOOD = woodTexture();
const EDGE_MAT = new THREE.LineBasicMaterial({ color: 0x5a3c1e, transparent: true, opacity: 0.55 });

// 選んだ・持っているブロックを、ほかのブロックの向こうでも見えるように重ねて描く
const xray = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshBasicMaterial({ color: 0x4d7cff, transparent: true, opacity: 0.28, depthTest: false, depthWrite: false }));
xray.add(new THREE.LineSegments(new THREE.EdgesGeometry(xray.geometry),
  new THREE.LineBasicMaterial({ color: 0x9fbaff, transparent: true, opacity: 0.95, depthTest: false })));
xray.renderOrder = 10; xray.children[0].renderOrder = 11; xray.visible = false; scene.add(xray);
function updateXray() {
  const i = screen !== "game" || phase === "over" ? -1 : isMine() ? (sel >= 0 ? sel : held) : viewSel;
  xray.visible = i >= 0 && !!meshes[i];
  if (!xray.visible) return;
  xray.position.copy(meshes[i].position); xray.quaternion.copy(meshes[i].quaternion); xray.scale.set(BL, heights[i], BW);
}

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

const cam = { yaw: 0.65, pitch: 0.28, dist: 18, ty: 5, goal: null };
const PITCH_MIN = -0.25, PITCH_MAX = 1.4;   // 見上げる〜ほぼ真上から   // goal: 自動で視点の高さを合わせる先
function updateCamera() {
  if (cam.goal != null) { cam.ty += (cam.goal - cam.ty) * 0.08; if (Math.abs(cam.goal - cam.ty) < 0.02) cam.goal = null; }
  const cp = Math.cos(cam.pitch);
  camera.position.set(Math.sin(cam.yaw) * cp * cam.dist, cam.ty + Math.sin(cam.pitch) * cam.dist, Math.cos(cam.yaw) * cp * cam.dist);
  camera.lookAt(0, cam.ty, 0);
  fill.position.set(camera.position.x + Math.cos(cam.yaw) * 4, camera.position.y + 6, camera.position.z - Math.sin(cam.yaw) * 4);
  fill.target.position.set(0, cam.ty, 0);
}

// ================= 物理 =================
let world = null, bodies = [], cols = [], meshes = [], heights = [];
const tgtPos = [], tgtQuat = [];       // 見ているだけのときに近づけていく先
const Q_Y90 = { x: 0, y: Math.SQRT1_2, z: 0, w: Math.SQRT1_2 }, Q_ID = { x: 0, y: 0, z: 0, w: 1 };
const ZERO = { x: 0, y: 0, z: 0 };

function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function buildTower(seed) {
  if (world) world.free();
  for (const m of meshes) { scene.remove(m); m.geometry.dispose(); m.material.dispose(); m.children[0]?.geometry.dispose(); }
  world = new RAPIER.World({ x: 0, y: GRAV, z: 0 });
  world.timestep = DT;
  world.integrationParameters.numSolverIterations = 8;
  world.createCollider(RAPIER.ColliderDesc.cuboid(30, 0.5, 30).setTranslation(0, -0.5, 0).setFriction(0.7));
  bodies = []; cols = []; meshes = []; heights = [];
  const rnd = mulberry32(seed);
  let base = 0;
  for (let lv = 0; lv < LEVELS; lv++) {
    let top = 0;
    for (let k = 0; k < 3; k++) {
      const h = BH * (1 + (rnd() * 2 - 1) * HVAR);
      top = Math.max(top, h);
      const odd = lv % 2 === 1, off = (k - 1) * SLOT + (rnd() * 2 - 1) * 0.008, along = (rnd() * 2 - 1) * JITTER;
      const yaw = (odd ? Math.PI / 2 : 0) + (rnd() * 2 - 1) * 0.005;
      const b = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic()
        .setTranslation(odd ? off : along, base + h / 2, odd ? along : off).setRotation({ x: 0, y: Math.sin(yaw / 2), z: 0, w: Math.cos(yaw / 2) }));
      const c = world.createCollider(RAPIER.ColliderDesc.cuboid(BL / 2, h / 2, BW / 2).setFriction(FRICTION).setRestitution(0).setDensity(1), b);
      bodies.push(b); cols.push(c); heights.push(h);
      const tint = 0.9 + rnd() * 0.12;
      const m = new THREE.Mesh(new THREE.BoxGeometry(BL, h, BW),
        new THREE.MeshStandardMaterial({ map: WOOD, roughness: 0.75, color: new THREE.Color(tint, tint * 0.98, tint * 0.95) }));
      m.castShadow = m.receiveShadow = true; m.userData.i = bodies.length - 1;
      m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), EDGE_MAT));   // ふちの線（ブロックの境目を見やすく）
      scene.add(m); meshes.push(m);
      tgtPos.push(new THREE.Vector3()); tgtQuat.push(new THREE.Quaternion());
    }
    base += top;
  }
  tgtPos.length = tgtQuat.length = N;
  for (let i = 0; i < 240; i++) world.step();   // 積んだ直後のなじみ（少し沈む）を済ませてから始める
  syncMeshesFromBodies(true);
}

function syncMeshesFromBodies(alsoTarget) {
  for (let i = 0; i < N; i++) {
    const p = bodies[i].translation(), q = bodies[i].rotation();
    meshes[i].position.set(p.x, p.y, p.z); meshes[i].quaternion.set(q.x, q.y, q.z, q.w);
    if (alsoTarget) { tgtPos[i].copy(meshes[i].position); tgtQuat[i].copy(meshes[i].quaternion); }
  }
}
function lerpMeshes() {
  for (let i = 0; i < N; i++) { meshes[i].position.lerp(tgtPos[i], 0.3); meshes[i].quaternion.slerp(tgtQuat[i], 0.3); }
}
const r4 = v => Math.round(v * 10000) / 10000;
function snapshot() {
  const d = new Array(N * 7);
  for (let i = 0; i < N; i++) {
    const p = bodies[i].translation(), q = bodies[i].rotation(), o = i * 7;
    d[o] = r4(p.x); d[o + 1] = r4(p.y); d[o + 2] = r4(p.z); d[o + 3] = r4(q.x); d[o + 4] = r4(q.y); d[o + 5] = r4(q.z); d[o + 6] = r4(q.w);
  }
  return d;
}
function setTargets(d) {
  for (let i = 0; i < N; i++) { const o = i * 7; tgtPos[i].set(d[o], d[o + 1], d[o + 2]); tgtQuat[i].set(d[o + 3], d[o + 4], d[o + 5], d[o + 6]); }
}
function applySnapshot(d) {
  for (let i = 0; i < N; i++) {
    const b = bodies[i], o = i * 7;
    resetBody(i);
    b.setTranslation({ x: d[o], y: d[o + 1], z: d[o + 2] }, true);
    b.setRotation({ x: d[o + 3], y: d[o + 4], z: d[o + 5], w: d[o + 6] }, true);
    b.setLinvel(ZERO, true); b.setAngvel(ZERO, true);
  }
  syncMeshesFromBodies(true);
}
function resetBody(i) {
  const b = bodies[i];
  if (b.bodyType() !== RAPIER.RigidBodyType.Dynamic) b.setBodyType(RAPIER.RigidBodyType.Dynamic, true);
  cols[i].setSensor(false);
  b.setGravityScale(1, true); b.setLinearDamping(0); b.setAngularDamping(0); b.lockRotations(false, true);
}

const levelOf = i => Math.round((bodies[i].translation().y - BH / 2) / BH);
const axisOf = i => { const q = bodies[i].rotation(); return new THREE.Vector3(1, 0, 0).applyQuaternion(new THREE.Quaternion(q.x, q.y, q.z, q.w)).setY(0).normalize(); };

function towerInfo(excl) {
  const by = new Map(); let top = 0;
  for (let i = 0; i < N; i++) {
    if (i === excl) continue;
    const l = levelOf(i); if (!by.has(l)) by.set(l, []); by.get(l).push(i); top = Math.max(top, l);
  }
  return { by, top };
}
function canPick(i) {
  const { by, top } = towerInfo(-1), l = levelOf(i);
  return by.get(top).length < 3 ? l < top - 1 : l < top;   // 一番上の段（作りかけならその下の段も）は抜けない
}
// 抜いたブロックを置ける場所
function placeInfo(excl) {
  const { by, top } = towerInfo(excl);
  let lt = top, occ = new Set();
  if ((by.get(top) || []).length >= 3) lt = top + 1;
  const below = by.get(lt - 1) || [];
  let cx = 0, cz = 0;
  for (const i of below) { const p = bodies[i].translation(); cx += p.x; cz += p.z; }
  if (below.length) { cx /= below.length; cz /= below.length; }
  const odd = lt % 2 === 1;
  for (const i of by.get(lt) || []) {
    if (lt === top + 1) break;
    const p = bodies[i].translation();
    occ.add(Math.max(0, Math.min(2, Math.round((odd ? p.x - cx : p.z - cz) / SLOT) + 1)));
  }
  const free = [0, 1, 2].filter(k => !occ.has(k));
  return { lt, odd, cx, cz, free };
}
function slotPose(info, k) {
  const off = (k - 1) * SLOT;
  const x = info.cx + (info.odd ? off : 0), z = info.cz + (info.odd ? 0 : off);
  // 真上から光線を落として、置く面の高さを調べる（ブロックの両端と真ん中）
  let surf = 0;
  const ax = info.odd ? { x: 0, z: 1 } : { x: 1, z: 0 };
  for (const t of [-0.4, 0, 0.4]) {
    const ray = new RAPIER.Ray({ x: x + ax.x * BL * t, y: 60, z: z + ax.z * BL * t }, { x: 0, y: -1, z: 0 });
    const hit = world.castRay(ray, 120, true, undefined, undefined, cols[held], bodies[held]);
    if (hit) surf = Math.max(surf, 60 - hit.toi);
  }
  return { x, z, surf, q: info.odd ? Q_Y90 : Q_ID };
}

// ================= ゲームの状態 =================
let mode = null;          // "local" / "host" / "client"
let screen = "loading";   // loading / menu / connecting / lobby / game
let myId = 0, curId = 0, moves = 0, players = [], order = [];
let phase = "idle";       // pull / place / settle / fallen / wait / watch / over
let sel = -1, held = -1, viewSel = -1, phaseT = 0, quietT = 0;
let drag = null;          // { axis, off0, target, ty, y0, A, U, det, sx, sy } 押す・引くときの指
let rotHold = 0;          // 回転ボタンを押している向き（+1 左回り / -1 右回り）
let place = null;         // { info, k, pose, tx, ty, tz } 置き場の候補と、指で持っている目標の位置
let turnPos = [], baseY = [];
let overInfo = null, errMsg = "", toastMsg = "", toastT = 0, lastSend = 0;
let peer = null, hostConn = null, lobby = [];

const isMine = () => mode === "local" || curId === myId;
const nameOf = id => (players.find(p => p.id === id) || { name: "?" }).name;

function beginMyTurn() {
  phase = "pull"; sel = -1; held = -1; place = null; drag = null; phaseT = 0;
  turnPos = []; baseY = [];
  for (let i = 0; i < N; i++) setHighlight(i, false);
  for (let i = 0; i < N; i++) { const p = bodies[i].translation(); turnPos.push(new THREE.Vector3(p.x, p.y, p.z)); baseY.push(p.y); }
}
function setHighlight(i, on) {
  if (i < 0 || !meshes[i]) return;
  meshes[i].material.emissive.setHex(on ? 0x2a55ff : 0x000000);
  meshes[i].material.emissiveIntensity = on ? 0.55 : 0;
}
function selectBlock(i) {
  if (sel === i) return;
  releaseSel();
  sel = i; setHighlight(i, true);
  const b = bodies[i];
  cam.goal = b.translation().y;
  b.setGravityScale(0, true);      // 指でつまんでいるので、引き出しても落ちない
  b.setLinearDamping(4); b.setAngularDamping(8);
}
function releaseSel() {
  if (sel < 0) return;
  setHighlight(sel, false);
  const b = bodies[sel]; b.setGravityScale(1, true); b.setLinearDamping(0); b.setAngularDamping(0); b.wakeUp();
  sel = -1; drag = null;
}

function physStep() {
  if (phase === "pull" && sel >= 0 && drag) {
    const b = bodies[sel], p = b.translation(), v = b.linvel(), o = turnPos[sel];
    const off = (p.x - o.x) * drag.axis.x + (p.z - o.z) * drag.axis.z;
    const va = v.x * drag.axis.x + v.z * drag.axis.z;
    // 指の位置へ 1 ステップで着く速さにする（指は強いので、キツいブロックでも動く。そのぶんタワーを引きずる）
    const want = Math.max(-FINGER_VMAX, Math.min(FINGER_VMAX, (drag.target - off) / DT));
    const vy = drag.ty == null ? v.y : Math.max(-FINGER_VMAX, Math.min(FINGER_VMAX, (drag.ty - p.y) / DT));   // 上下も指と同じに
    b.setLinvel({ x: v.x + drag.axis.x * (want - va), y: vy, z: v.z + drag.axis.z * (want - va) }, true);
  }
  if (phase === "carry") {   // 抜いたブロックを、タワーの上（少し浮かせた所）まで自動で運ぶ
    const b = bodies[held], p = b.translation(), q = b.rotation(), t = place.pose;
    const k = Math.min(1, 9 * DT), ty = hoverY();
    b.setNextKinematicTranslation({ x: p.x + (t.x - p.x) * k, y: p.y + (ty - p.y) * k, z: p.z + (t.z - p.z) * k });
    const cq = new THREE.Quaternion(q.x, q.y, q.z, q.w).slerp(new THREE.Quaternion(t.q.x, t.q.y, t.q.z, t.q.w), k);
    b.setNextKinematicRotation({ x: cq.x, y: cq.y, z: cq.z, w: cq.w });
    if (Math.hypot(t.x - p.x, ty - p.y, t.z - p.z) < 0.03) startPlace();
  }
  if (phase === "place") {   // 指で持っている：指の位置へ 1 ステップで着く速さにする（ほかのブロックに当たるとそこで止まり、押せばタワーが動く）
    const b = bodies[held], p = b.translation();
    let vx = (place.tx - p.x) / DT, vy = (place.ty - p.y) / DT, vz = (place.tz - p.z) / DT;
    const vm = Math.hypot(vx, vy, vz);
    if (vm > FINGER_VMAX) { vx *= FINGER_VMAX / vm; vy *= FINGER_VMAX / vm; vz *= FINGER_VMAX / vm; }
    b.setLinvel({ x: vx, y: vy, z: vz }, true);
    if (rotHold) {   // 回転ボタンを押している間だけ、少しずつ回す
      const q = b.rotation();
      const r = new THREE.Quaternion(q.x, q.y, q.z, q.w).premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), rotHold * ROT_SPEED * DT));
      b.setRotation({ x: r.x, y: r.y, z: r.z, w: r.w }, true);
    }
  }
  world.step();
  phaseT += DT;

  if (phase === "pull" && sel >= 0) {
    const p = bodies[sel].translation(), o = turnPos[sel], ax = axisOf(sel);
    if (Math.abs((p.x - o.x) * ax.x + (p.z - o.z) * ax.z) > BL * 0.97) extract();
  }
  if (phase === "settle") {
    let mv = 0;
    for (const b of bodies) { const v = b.linvel(), w = b.angvel(); mv = Math.max(mv, Math.hypot(v.x, v.y, v.z), Math.hypot(w.x, w.y, w.z) * 0.5); }
    quietT = mv < 0.08 ? quietT + DT : 0;
    if ((phaseT > 0.8 && quietT > 0.6) || phaseT > 8) {
      if (!checkFallen()) { phase = "wait"; send({ t: "end", d: snapshot() }); renderUI(); return; }
    }
  }
  if ((phase === "pull" || phase === "carry" || phase === "place" || phase === "settle") && checkFallen()) {
    phase = "fallen"; phaseT = 0; releaseSel(); navigator.vibrate?.([80, 40, 160]); renderUI();
  }
  if (phase === "fallen" && phaseT > 2.5) { phase = "wait"; send({ t: "fall", d: snapshot() }); return; }
  const now = performance.now();   // 見ている人へ今の位置を送る
  if (mode !== "local" && now - lastSend > SNAP_MS && ACTIVE.includes(phase)) {
    lastSend = now; send({ t: "snap", d: snapshot(), s: sel >= 0 ? sel : held, ph: phase, yaw: +cam.yaw.toFixed(3) });
  }
}
function checkFallen() {
  for (let i = 0; i < N; i++) {
    if (i === sel || (i === held && (phase === "carry" || phase === "place"))) continue;
    if (bodies[i].translation().y < baseY[i] - FALL_DROP) return true;
  }
  return false;
}
function extract() {
  held = sel; setHighlight(sel, false); sel = -1; drag = null;
  const b = bodies[held];
  b.setGravityScale(1, true); b.setLinearDamping(0); b.setAngularDamping(0);
  b.setBodyType(RAPIER.RigidBodyType.KinematicPositionBased, true);
  cols[held].setSensor(true);      // 運んでいる間はほかのブロックにぶつからない
  const info = placeInfo(held);
  const k = info.free.includes(1) ? 1 : info.free[0];
  place = { info, k, pose: slotPose(info, k) };
  cam.goal = Math.min(LEVELS * BH + 8, place.pose.surf - 0.5);   // 上の置き場が見えるように
  phase = "carry"; phaseT = 0; navigator.vibrate?.(30);
  renderUI();
}
const hoverY = () => place.pose.surf + BH * 1.5 + heights[held] / 2;   // 運んできたブロックを浮かせる高さ
// 運び終わったら、ふつうの（ぶつかる）ブロックに戻して、指で持った状態にする
function startPlace() {
  const b = bodies[held], p = b.translation();
  b.setBodyType(RAPIER.RigidBodyType.Dynamic, true);
  cols[held].setSensor(false);
  b.setRotation(place.pose.q, true); b.setLinvel(ZERO, true); b.setAngvel(ZERO, true);
  b.setGravityScale(0, true); b.lockRotations(true, true);
  place.tx = p.x; place.ty = p.y; place.tz = p.z;
  phase = "place"; phaseT = 0;
  renderUI();
}
// ◀ ▶：置き場の候補へ移す（ぶつからないよう、低すぎたら少し持ち上げる）
function moveSlot(dir) {
  if (phase !== "place") return;
  const f = place.info.free;
  if (f.length > 1) { const idx = f.indexOf(place.k); place.k = f[((idx < 0 ? 0 : idx) + dir + f.length) % f.length]; }
  place.pose = slotPose(place.info, place.k);
  place.tx = place.pose.x; place.tz = place.pose.z; place.ty = Math.max(place.ty, hoverY());
  bodies[held].setRotation(place.pose.q, true);
}
// 離す：重力を戻す。崩れたかの判定は、真下の面の上に乗った高さを基準にする
function dropHeld() {
  if (phase !== "place") return;
  const b = bodies[held], p = b.translation(), ax = axisOf(held);
  b.lockRotations(false, true); b.setGravityScale(1, true); b.setLinearDamping(0);
  let surf = 0;
  for (const t of [-0.4, 0, 0.4]) {
    const hit = world.castRay(new RAPIER.Ray({ x: p.x + ax.x * BL * t, y: p.y, z: p.z + ax.z * BL * t }, { x: 0, y: -1, z: 0 }), 120, true, undefined, undefined, cols[held], bodies[held]);
    if (hit) surf = Math.max(surf, p.y - hit.toi);
  }
  baseY[held] = surf + heights[held] / 2;
  phase = "settle"; phaseT = 0; quietT = 0; place = null; rotHold = 0;
  renderUI();
}

// ================= 操作（タッチ）=================
const ptrs = new Map(); let gesture = null;
const raycaster = new THREE.Raycaster();
function pick(x, y) {
  updateCamera(); scene.updateMatrixWorld(); camera.updateMatrixWorld();
  raycaster.setFromCamera(new THREE.Vector2(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1), camera);
  const hit = raycaster.intersectObjects(meshes, false)[0];
  return hit ? hit.object.userData.i : -1;
}
function toScreen(v) { const p = v.clone().project(camera); return { x: (p.x + 1) / 2 * innerWidth, y: (1 - p.y) / 2 * innerHeight }; }
function startDrag(x, y) {
  const b = bodies[sel], p = b.translation(), o = turnPos[sel], axis = axisOf(sel);
  const c = new THREE.Vector3(p.x, p.y, p.z);
  const s0 = toScreen(c), s1 = toScreen(c.clone().add(axis)), s2 = toScreen(c.clone().add(new THREE.Vector3(0, 1, 0)));
  let A = { x: s1.x - s0.x, y: s1.y - s0.y };
  const U = { x: s2.x - s0.x, y: s2.y - s0.y };
  let det = A.x * U.y - A.y * U.x;
  // ブロックがこちらを向いている（画面上でほとんど長さがない）ときは、上へなぞる = 奥へ押す。上下には動かさない
  const facing = Math.hypot(A.x, A.y) < 22 || Math.abs(det) < 300;
  if (facing) {
    const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.setY(0).normalize();
    A = { x: 0, y: -(Math.sign(fwd.dot(axis)) || 1) * 40 }; det = 0;
  }
  const off0 = (p.x - o.x) * axis.x + (p.z - o.z) * axis.z;
  drag = { axis, off0, target: off0, ty: facing ? null : p.y, py0: p.y, y0: turnPos[sel].y, A, U, det, sx: x, sy: y };
}
canvas.addEventListener("pointerdown", e => {
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) {
    const hit = pick(e.clientX, e.clientY);
    if (screen === "game" && isMine() && phase === "pull" && sel >= 0 && hit === sel) { startDrag(e.clientX, e.clientY); gesture = { type: "push" }; }
    else if (screen === "game" && isMine() && phase === "place" && hit === held) gesture = startMove(e.clientX, e.clientY);
    else gesture = { type: "orbit", hit, moved: 0, lx: e.clientX, ly: e.clientY };
    cam.goal = null;
  } else if (ptrs.size === 2) {
    drag = null;
    const [a, b] = [...ptrs.values()];
    gesture = { type: "pinch", d0: Math.hypot(a.x - b.x, a.y - b.y), dist0: cam.dist, ty0: cam.ty, my0: (a.y + b.y) / 2 };
  }
});
canvas.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!gesture) return;
  if (gesture.type === "orbit") {
    const dx = e.clientX - gesture.lx, dy = e.clientY - gesture.ly;
    gesture.lx = e.clientX; gesture.ly = e.clientY; gesture.moved += Math.abs(dx) + Math.abs(dy);
    cam.yaw -= dx * 0.009;
    cam.pitch = Math.max(PITCH_MIN, Math.min(PITCH_MAX, cam.pitch + dy * 0.006));
  } else if (gesture.type === "push" && drag) {
    // 指の動き = s ×（ブロックの長さ方向 1 の画面上の長さ）+ v ×（上 1 の画面上の長さ）を解いて、両方とも指とぴったり同じに動かす
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    let s, v = 0;
    if (drag.det) { s = (dx * drag.U.y - dy * drag.U.x) / drag.det; v = (drag.A.x * dy - drag.A.y * dx) / drag.det; }
    else s = (dx * drag.A.x + dy * drag.A.y) / (drag.A.x * drag.A.x + drag.A.y * drag.A.y);
    drag.target = Math.max(-BL - 0.5, Math.min(BL + 0.5, drag.off0 + s));
    if (drag.ty != null) drag.ty = Math.max(drag.y0 - LIFT_MAX, Math.min(drag.y0 + LIFT_MAX, drag.py0 + v));
  } else if (gesture.type === "move" && phase === "place") {
    const h = planeHit(e.clientX, e.clientY, gesture.plane);
    if (h) {
      place.tx = gesture.t0.x + h.x - gesture.h0.x; place.tz = gesture.t0.z + h.z - gesture.h0.z;
      place.ty = Math.max(heights[held] / 2, gesture.t0.y + h.y - gesture.h0.y);
    }
  } else if (gesture.type === "pinch" && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()];
    cam.dist = Math.max(7, Math.min(32, gesture.dist0 * gesture.d0 / Math.max(10, Math.hypot(a.x - b.x, a.y - b.y))));
    cam.ty = Math.max(0.5, Math.min(LEVELS * BH + 8, gesture.ty0 + ((a.y + b.y) / 2 - gesture.my0) * 0.025));
  }
});
// 置くとき：持っているブロックをなぞると、指とぴったり同じだけ動く。
// 横から見ているときは画面に平行な縦の面の上で動く（上下・左右）。上から見下ろしているときは水平な面の上で動く（奥行き）
const LOOK_DOWN = 0.9;   // これより見下ろす角度が大きいと水平に動かす
function planeHit(x, y, plane) {
  updateCamera(); camera.updateMatrixWorld();
  raycaster.setFromCamera(new THREE.Vector2(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1), camera);
  return raycaster.ray.intersectPlane(plane, new THREE.Vector3());
}
function startMove(x, y) {
  const p = bodies[held].translation(), c = new THREE.Vector3(p.x, p.y, p.z);
  const n = cam.pitch > LOOK_DOWN ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(Math.sin(cam.yaw), 0, Math.cos(cam.yaw));
  const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(n, c);
  const h0 = planeHit(x, y, plane);
  if (!h0) return { type: "orbit", hit: -1, moved: 99, lx: x, ly: y };
  return { type: "move", plane, h0, t0: c };
}
function pointerEnd(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (gesture?.type === "orbit" && gesture.moved < 10 && gesture.hit >= 0 && ptrs.size === 0) tapBlock(gesture.hit);
  if (gesture?.type === "push") drag = null;
  if (gesture?.type === "move" && phase === "place") { const p = bodies[held].translation(); place.tx = p.x; place.ty = p.y; place.tz = p.z; }
  if (ptrs.size === 1) { const p = [...ptrs.values()][0]; gesture = { type: "orbit", hit: -1, moved: 99, lx: p.x, ly: p.y }; }
  else if (ptrs.size === 0) gesture = null;
}
canvas.addEventListener("pointerup", pointerEnd);
canvas.addEventListener("pointercancel", pointerEnd);
function tapBlock(i) {
  if (screen !== "game" || !isMine() || phase !== "pull") return;
  if (!canPick(i)) { toast("上の段からは抜けません"); return; }
  selectBlock(i); renderUI();
}
function toast(t) { toastMsg = t; toastT = performance.now() + 1500; renderUI(); setTimeout(renderUI, 1600); }

// ================= 通信 =================
// ホストがまとめ役。参加者 → ホスト → みんな。動かしている人だけが物理を計算し、ほかの人は送られてきた位置を表示する
const host = { conns: new Map(), nextId: 1, playing: false, turnI: 0, n: 0, last: null };

// 落としてよい通り道（シールドファイトと同じ）: ふつうの接続と同じ RTCPeerConnection の上に、届き直しをしない・順番を待たない
// データチャンネルを両側で同じ番号で作る。動いているあいだの位置（snap）だけこちらで送り、なくなったものは捨てて次の新しいものを使う。
// 順番が入れ替わって届くので、送る人が番号（q）を付け、受け取る側は古いものを捨てる
const UCH_ID = 8;
function openUch(conn, onMsg) {
  try {
    const pc = conn && conn.peerConnection;
    if (!pc || !pc.createDataChannel) return null;
    const ch = pc.createDataChannel("jenga-u", { negotiated: true, id: UCH_ID, ordered: false, maxRetransmits: 0 });
    ch.onmessage = e => { if (typeof e.data === "string") { let m; try { m = JSON.parse(e.data); } catch (x) { return; } onMsg(m); } };
    return ch;
  } catch (e) { return null; }
}
const uchOpen = ch => !!ch && ch.readyState === "open";
let hostUch = null, snapSeq = 0;
const snapQs = new Map();   // 送った人ごとに、最後に使った snap の番号
const freshSnap = (from, m) => { if (!m.q) return true; if (m.q <= (snapQs.get(from) || 0)) return false; snapQs.set(from, m.q); return true; };
function send(m) {
  if (m.t === "snap") m.q = ++snapSeq;
  if (mode === "client") {
    try { if (m.t === "snap" && uchOpen(hostUch)) hostUch.send(JSON.stringify(m)); else hostConn.send(m); } catch (e) {}
  }
  else hostHandle(mode === "local" ? curId : 0, m);
}
function bcast(m, except) {
  const str = m.t === "snap" ? JSON.stringify(m) : null;
  for (const [id, c] of host.conns) if (id !== except && c.open) {
    try { if (str && uchOpen(c.uch)) c.uch.send(str); else c.send(m); } catch (e) {}
  }
  if (except !== 0) onMsg(m);
}
function hostLobby() {
  const ids = [...host.conns.keys()];
  lobby = [{ id: 0, name: myName() }, ...ids.filter(id => !host.conns.get(id).spec).map(id => ({ id, name: host.conns.get(id).pname }))];
  lobbySpecs = ids.filter(id => host.conns.get(id).spec).map(id => host.conns.get(id).pname);   // 観戦の人（遊ぶ人には入らない）
  bcast({ t: "lobby", players: lobby, specs: lobbySpecs, diff });
}
function hostStart() {
  host.playing = true; host.turnI = 0; host.n = 0; host.last = null;
  const ps = mode === "local" ? players : lobby.slice();
  const ord = ps.map(p => p.id);
  for (let i = ord.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ord[i], ord[j]] = [ord[j], ord[i]]; }
  if (mode === "local") ord.sort((a, b) => a - b);
  host.seed = (Math.random() * 2 ** 31) | 0; host.ps = ps;   // 途中から入る観戦の人にも同じタワーを作ってもらう
  bcast({ t: "start", seed: host.seed, players: ps, order: ord, diff });
  bcast({ t: "turn", cur: ord[0], d: null, n: 0 });
}
function hostHandle(from, m) {
  if (m.t === "hello") return;
  if (m.t === "rename") { const c = host.conns.get(from); if (c && !host.playing) { c.pname = String(m.name || "ゲスト").slice(0, 12); hostLobby(); } return; }
  if (host.conns.get(from)?.spec) return;   // 観戦の人からの操作は受けない
  if (!host.playing) return;
  if (m.t === "look") { bcast({ t: "look", id: from, yaw: m.yaw }, from); return; }
  const cur = order[host.turnI % order.length];
  if (from !== cur) return;
  if (m.t === "snap") { if (!freshSnap(from, m)) return; host.last = m.d; bcast(m, from); }
  else if (m.t === "end") {
    host.last = m.d; host.n++; host.turnI = (host.turnI + 1) % order.length;
    bcast({ t: "turn", cur: order[host.turnI], d: m.d, n: host.n });
  } else if (m.t === "fall") {
    host.playing = false;
    partyReport(order.filter(id => id !== from).map(nameOf), [nameOf(from)]);   // 崩した人の負け、ほかの人の勝ち
    bcast({ t: "over", loser: from, d: m.d, n: host.n });
  }
}
function hostDrop(id) {
  const wasSpec = host.conns.get(id)?.spec;
  host.conns.delete(id);
  if (wasSpec) { hostLobby(); return; }   // 観戦の人が抜けても、ゲームはそのまま
  if (!host.playing) { hostLobby(); return; }
  const wasCur = order[host.turnI] === id;
  const idx = order.indexOf(id);
  const nextOrder = order.filter(x => x !== id);
  if (idx >= 0 && idx < host.turnI) host.turnI--;
  bcast({ t: "order", order: nextOrder, left: id });
  if (nextOrder.length < 2) { host.playing = false; bcast({ t: "over", loser: -1, left: id, d: host.last, n: host.n }); return; }
  host.turnI %= nextOrder.length;
  if (wasCur) bcast({ t: "turn", cur: nextOrder[host.turnI], d: host.last, n: host.n });
}

function onMsg(m) {
  switch (m.t) {
    case "welcome": myId = m.you; spectating = !!m.spec; if (screen !== "game") screen = "lobby"; break;
    case "reject": errMsg = m.why; screen = "menu"; cleanupNet(); break;
    case "lobby": lobby = m.players; lobbySpecs = m.specs || []; if (m.diff) diff = m.diff; break;
    case "start": {

function cleanupNet() { try { peer?.destroy(); } catch (e) {} peer = null; hostConn = null; host.conns.clear(); host.playing = false; }

let hostTries = 0;
function startHost() {
  mode = "host"; screen = "connecting"; errMsg = ""; myId = 0; renderUI();
  const code = PARTY ? PARTY.code : randCode();
  peer = new Peer(netId(code));
  peer.on("open", () => { host.code = code; screen = "lobby"; hostLobby(); renderUI(); });

    conn.on("open", () => { conn.uch = openUch(conn, m => { if (conn.pid) hostHandle(conn.pid, m); }); });

          host.conns.set(id, conn); conn.send({ t: "welcome", you: id, spec: true }); hostLobby();
          if (host.playing) {   // 途中から: 今のタワーと番を送る

            conn.send({ t: "turn", cur: order[host.turnI % order.length], d: host.last, n: host.n });
          }
          renderUI(); return;
        }
        if (host.playing) { conn.send({ t: "reject", why: "もう始まっています" }); setTimeout(() => conn.close(), 500); return; }
        if (nPlayers + 1 >= MAX_PLAYERS) { conn.send({ t: "reject", why: "満員です（4人まで）" }); setTimeout(() => conn.close(), 500); return; }
        const id = host.nextId++; conn.pid = id; conn.pname = String(m.name || "ゲスト").slice(0, 12);
        host.conns.set(id, conn); conn.send({ t: "welcome", you: id }); hostLobby(); renderUI(); return;
      }

}
function joinRoom(code) {
  code = String(code).replace(/\D/g, "");
  if (code.length !== 4 && !PARTY) { errMsg = "部屋番号は4けたです"; renderUI(); return; }
  mode = "client"; screen = "connecting"; errMsg = ""; host.code = code; renderUI();
  peer = new Peer();
  peer.on("open", () => {
    const hc = hostConn = peer.connect(netId(code), { reliable: true });
    // パーティ: PeerJS は「相手が見つからない」を知らせないまま止まることがあるので、2.5 秒でつながらなければ peer から作り直す
    if (PARTY) setTimeout(() => { if (hostConn === hc && !hc.open && screen === "connecting" && ++partyTries < 60) { cleanupNet(); joinRoom(code); } }, 2500);
    hostConn.on("open", () => { hc.opened = true; hostUch = openUch(hc, onMsg); hostConn.send({ t: "hello", name: myName(), spec: !!(PARTY && PARTY.spec) }); });
    hostConn.on("data", onMsg);
    hostConn.on("close", () => {
      if (PARTY) { if (hc.opened) location.href = "../"; return; }   // パーティ: ホストがいなくなったらゲーム一覧へ（つながる前の失敗は探し直しに任せる）
      if (screen !== "menu") { errMsg = "ホストとの接続が切れました"; screen = "menu"; cleanupNet(); renderUI(); }
    });
  });
  peer.on("error", e => {
    // パーティ: ホストの部屋がまだ開いていない。少し待って探し直す
    if (PARTY && e.type === "peer-unavailable" && ++partyTries < 40) { cleanupNet(); setTimeout(() => joinRoom(code), 1500); return; }
    errMsg = e.type === "peer-unavailable" ? "部屋が見つかりません（番号ちがい、またはホストが閉じました）" : "接続エラー: " + e.type;
    screen = "menu"; cleanupNet(); renderUI();
  });
}

  g.scale.setScalar(AV_SCALE); scene.add(g);
  const yaw = 0.65 + idx * spreadAngle();
  const a = { id: p.id, name: p.name, g, arm, hand, label, mats: [...mats, label.material], yaw, tyaw: yaw, on: false,
    handPos: new THREE.Vector3(), handDir: new THREE.Vector3(0, -1, 0), texOff: label.material.map, texOn: null };
  a.handPos.copy(restHand(a));
  avatars.set(p.id, a);
}
function clearAvatars() {
  for (const a of avatars.values()) {
    for (const o of [a.g, a.arm, a.hand]) { scene.remove(o); o.traverse(c => c.geometry?.dispose()); }
    for (const m of a.mats) { m.map?.dispose(); m.dispose(); }
    a.texOn?.dispose();
  }
  avatars.clear(); activeInfo = null;
}
function buildAvatars() {
  clearAvatars();
  if (mode === "local") return;
  players.forEach((p, i) => { if (p.id !== myId) makeAvatar(p, i); });
}
const shoulderOf = a => a.g.localToWorld(new THREE.Vector3(1.5, 6.0, 0.1));
const restHand = a => a.g.localToWorld(new THREE.Vector3(1.6, 3.2, 0.3));
const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
function updateAvatars() {
  for (const a of avatars.values()) {
    a.yaw += angDiff(a.tyaw, a.yaw) * 0.12;
    a.g.position.set(Math.sin(a.yaw) * AV_R, 0, Math.cos(a.yaw) * AV_R);
    a.g.lookAt(0, 0, 0);
    // 番の人の名札を光らせる
    const on = a.id === curId && phase !== "over";
    if (on !== a.on) {
      a.on = on;
      if (on && !a.texOn) a.texOn = nameSprite(a.name, true);
      a.label.material.map = on ? a.texOn : a.texOff; a.label.material.needsUpdate = true;
    }
    // 手の行き先
    let tgt = restHand(a), dir = new THREE.Vector3(0, -1, 0);
    const info = on ? activeInfo : null;
    if (info && info.s >= 0 && meshes[info.s]) {
      const m = meshes[info.s], c = m.position, ax = new THREE.Vector3(1, 0, 0).applyQuaternion(m.quaternion);
      if (info.ph === "pull") {   // 自分に近いほうの端をつまむ
        const sg = Math.sign(ax.dot(a.g.position.clone().sub(c))) || 1;
        tgt = c.clone().addScaledVector(ax, sg * (BL / 2 + 0.35));
        dir = ax.clone().multiplyScalar(-sg);
      } else if (info.ph === "carry" || info.ph === "place") {   // 上からつまむ
        tgt = c.clone().add(new THREE.Vector3(0, heights[info.s] / 2 + 0.45, 0));
      }
    }
    a.handPos.lerp(tgt, 0.25); a.handDir.lerp(dir, 0.25).normalize();
    const sh = shoulderOf(a), v = a.handPos.clone().sub(sh), len = Math.max(0.01, v.length());
    a.arm.position.copy(sh).addScaledVector(v, 0.5);
    a.arm.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), v.clone().divideScalar(len));
    a.arm.scale.set(1, len, 1);
    a.hand.position.copy(a.handPos);
    a.hand.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), a.handDir);
    // 自分の視点のすぐ前に立っている人は、透けさせる（タワーが見えなくならないように）
    const op = Math.abs(angDiff(a.yaw, cam.yaw)) < 0.45 ? 0.18 : 1;
    for (const m of a.mats) m.opacity = op;
  }
}
// 自分の見ている向きを、ほかの人へときどき知らせる（番の人は snap で送っている）
let lookSent = 0, lookYaw = 99;
function sendLook(now) {
  if (mode === "local" || !mode || screen !== "game" || (isMine() && ACTIVE.includes(phase))) return;
  if (now - lookSent < 400 || Math.abs(angDiff(cam.yaw, lookYaw)) < 0.05) return;
  lookSent = now; lookYaw = cam.yaw; send({ t: "look", yaw: +cam.yaw.toFixed(3) });
}

// ================= ループ =================
let acc = 0, last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const sim = screen === "game" && isMine() && ACTIVE.includes(phase);
  if (sim) {
    acc += dt; let k = 0;
    while (acc >= DT && k < 8) { physStep(); acc -= DT; k++; }
    if (k === 8) acc = 0;
    syncMeshesFromBodies(true);
  } else if (screen === "game") { acc = 0; if (!isMine() || phase === "over") lerpMeshes(); }
  updateCamera(); updateXray();
  if (screen === "game") { updateAvatars(); sendLook(now); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
buildTower(1);
screen = "menu"; renderUI();
// パーティから開いたときは、メニューを飛ばして自動で部屋を作る・入る
if (PARTY) { meName = String(PARTY.name || "").slice(0, 12); if (PARTY.role === "host") startHost(); else joinRoom(PARTY.code); }
// アプリとして入れたときに使うサービスワーカー（ミニゲーム集で 1 つ。1 つ上のフォルダにある）
try { if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) navigator.serviceWorker.register("../sw.js").catch(() => {}); } catch (e) {}
requestAnimationFrame(frame);
// 動作確認用（コンソールから __jenga.tap(10) / __jenga.pull(3.2) など）
window.__jenga = {
  get phase() { return phase; }, get sel() { return sel; }, get drag() { return drag; }, get gesture() { return gesture; }, pick,
  shown: i => [...tgtPos[i].toArray(), viewSel], get moves() { return moves; }, bodies: () => bodies, canPick,
  snap: snapshot, load: d => { applySnapshot(d); beginMyTurn(); }, build: s => { buildTower(s); beginMyTurn(); },
  set: o => { if (o.JITTER != null) JITTER = o.JITTER; if (o.HVAR != null) HVAR = o.HVAR; if (o.FRICTION != null) FRICTION = o.FRICTION; },
  tap: tapBlock, drop: dropHeld, moveSlot, rot: v => { rotHold = v; }, step: n => { for (let i = 0; i < n && ACTIVE.includes(phase); i++) physStep(); syncMeshesFromBodies(true); },
  get place() { return place; }, get cam() { return cam; }, avatars: () => avatars, get diff() { return diff; },
  render: n => { for (let i = 0; i < (n || 1); i++) { if (!isMine()) lerpMeshes(); updateCamera(); updateXray(); updateAvatars(); } renderer.render(scene, camera); },
  raw: n => { for (let i = 0; i < n; i++) world.step(); syncMeshesFromBodies(true); },
  pull: t => { if (sel >= 0) drag = { axis: axisOf(sel), off0: 0, target: t, ty: null, A: { x: 50, y: 0 }, U: { x: 0, y: -50 }, det: 0, sx: 0, sy: 0 }; },
};

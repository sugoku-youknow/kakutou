<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7a4520">
<title>カイタク島</title>
<!-- ミニゲーム集「you know games」のゲーム（kakutou/kaitaku/）。2026-11-09 作成:
     六角形の土地が並ぶ島で、サイコロで資源をあつめ、道・村・町をつくって点数を競う（オリジナルのルール）。
     2026-11-28: 見た目をリアル寄りに作り直し（立体の土地・絵・木の台・おはじき風の村と町）。ホームは夕焼けの島、
     あそぶ のあとに設定画面（勝利点・はじめの村のバー、大きい島・確率表示・バランスマップ・バランスダイス、CPU の追加と強さ）。 -->
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="you know games">
<link rel="manifest" href="../manifest.json"><link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png?v=3"><link rel="apple-touch-icon" href="../apple-touch-icon.png?v=3">
<style>
:root{--bg:#a8622f;--panel:rgba(36,20,9,.86);--card:#3a2416;--line:#6b4a30;--tx:#fff7ec;--sub:#d8c0a0;--acc:#f6b93b;--btn:#6b4426;--deep:#24150a;
  /* 2026-11-11: 木のテーブル（板のつなぎ目・木目） */
  --wood:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 2px,transparent 2px 86px),repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 9px),repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 3px,transparent 3px 23px),linear-gradient(90deg,#a85f2c,#c27a3e 50%,#a35b2a)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--wood);background-color:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-bottom:3px solid #0006;border-radius:12px;background:var(--btn);padding:10px 12px;min-height:44px;font-weight:700;touch-action:manipulation}
button:disabled{opacity:.38;cursor:default}
button.on{background:var(--acc);color:#2a1a05}
button.main{background:var(--acc);color:#2a1a05;font-size:18px}
input{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--deep);color:var(--tx);width:100%}
.hidden{display:none!important}
/* ---- メニュー・部屋 ---- */
.scr{position:fixed;inset:0;overflow-y:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:flex-start}
.card{max-width:460px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card h1{margin:0;font-size:30px;text-align:center;letter-spacing:2px}
.card h1 small{display:block;font-size:13px;color:var(--sub);letter-spacing:0;font-weight:400;margin-top:4px}
.card h3{margin:8px 0 0;font-size:14px;color:var(--sub)}
.seg{display:flex;gap:6px}.seg>*{flex:1}
/* −／＋ で数をえらぶ（勝利点・はじめの村） */
.stepr{display:flex;align-items:center;gap:8px}
.stepr button{width:56px;flex:none;font-size:22px;padding:6px 0}
.stepr b,.stepr label{flex:1;text-align:center;font-size:22px;font-weight:800;background:var(--deep);border-radius:10px;padding:7px 0;display:flex;align-items:center;justify-content:center;gap:2px}
.stepr input{width:3.2em;min-width:0;border:0;background:transparent;color:inherit;font:inherit;text-align:right;padding:0;margin:0;-moz-appearance:textfield}
.stepr input::-webkit-inner-spin-button,.stepr input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.row{display:flex;gap:8px}.row>*{flex:1}
.note{font-size:13px;color:var(--sub);line-height:1.5}
.err{color:#ffb4a8;font-size:14px}
.code{font-size:44px;font-weight:800;text-align:center;letter-spacing:8px;color:var(--acc)}
.mem{display:flex;flex-wrap:wrap;gap:6px}
.mem span{background:var(--deep);border-radius:99px;padding:6px 12px;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.mem small{color:var(--sub);font-size:12px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid #0008;flex:none}
/* ---- ゲーム画面（2026-11-11 作り直し: 横画面が基本）----
   上に人の帯、左はしにアイコン、まん中に盤、下に手札、右下にサイコロとボタン、右はしに交換のよびかけ。
   2026-11-11: たて持ちは下の @media (orientation:portrait) で、盤を画面はばいっぱいにし、手札とボタンを下にならべる。 */
#stage{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;pointer-events:none;z-index:10}
#stage>*{pointer-events:auto}
#stage>#toast{pointer-events:none}
#game{position:absolute;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left);right:env(safe-area-inset-right);overflow:hidden}
/* 2026-11-12: 人は盤の四すみに（上のまん中はスマホのカメラと重なるので使わない）。タップでくわしく */
#pls{position:absolute;inset:0;pointer-events:none;z-index:3}
/* 人: 丸い点数バッジ + その人の色のリボン（名前・手札・カード・道の長さ） */
.pl{display:flex;align-items:center;min-width:0;position:absolute;pointer-events:auto;cursor:pointer;width:max-content;max-width:min(42%,210px)}
.pl.c0{left:2px;top:2px}.pl.c1{right:2px;top:2px}.pl.c2{right:2px;bottom:100px}.pl.c3{left:2px;bottom:4px}
.pl:active{transform:scale(.96)}
/* 2026-11-13: 交換の画面をひらいているあいだ、下の 2 人の帯はその上へ持ち上げる（--lift は render で計算） */
.pl.c2,.pl.c3{translate:0 calc(-1 * var(--lift, 0px));transition:translate .2s}
.vpb{flex:none;width:34px;height:34px;border-radius:50%;background:#2b1a0e;border:3px solid var(--pc);color:#fff;font-weight:800;font-size:17px;display:grid;place-items:center;box-shadow:0 2px 5px #0009;z-index:1}
.pi{flex:1;min-width:0;margin-left:-12px;padding:2px 10px 3px 15px;background:linear-gradient(#ffffff26,#0000 45%,#0003),var(--pc);clip-path:polygon(0 0,100% 0,calc(100% - 7px) 50%,100% 100%,0 100%);box-shadow:0 2px 4px #0006}
.pi .nm{font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi .st{display:flex;flex-wrap:wrap;column-gap:6px;white-space:nowrap;font-size:11px;color:#fff;background:#0007;border-radius:5px;padding:0 4px;width:max-content;max-width:100%;overflow:hidden}
.pi .st .lr{color:var(--acc);font-weight:800}
.pl.cur .vpb{border-color:#ffd54a;box-shadow:0 0 0 2px #ffd54a,0 0 12px #ffd54a}
.pl.cur::after{content:"";position:absolute;left:12px;bottom:-7px;border:5px solid transparent;border-top-color:#ffd54a}
#side{position:absolute;left:5px;top:4px;display:flex;flex-direction:column;gap:6px;z-index:4}
#side button{width:40px;height:40px;min-height:0;padding:0;font-size:18px;border-radius:9px;color:#2a1a05;background:linear-gradient(#f3b84f,#c9822a);border-bottom:3px solid #7a4a14;position:relative;box-shadow:0 2px 4px #0007}
#side .pr{font-size:12px;font-weight:800;line-height:1}
#side .pm{width:auto;padding:0 9px;font-size:13px;white-space:nowrap}   /* 2026-11-18: 上の「確率」はなくし（メニューから見られる）、置場確率を横長 1 行に */
#side button.on{background:linear-gradient(#ff8a7a,#e0533f);color:#fff;box-shadow:0 0 0 2px #fff,0 2px 4px #0007}
.pi .st+.st{margin-top:1px}
#side .bd{position:absolute;right:-5px;top:-5px;min-width:18px;background:#c0392b;color:#fff;font-size:11px;line-height:18px;border-radius:9px;padding:0 4px}
#boardWrap{position:absolute;top:4px;bottom:72px;left:48px;right:4px;overflow:hidden}
#board{position:absolute;inset:0;width:100%;height:100%;touch-action:none;overflow:visible}
/* ズームのボタン（右上の人の下） */
#ban{position:absolute;top:6px;left:50%;transform:translateX(-50%);max-width:min(40%,420px);padding:4px 14px;border-radius:99px;background:var(--panel);font-size:13px;font-weight:700;z-index:4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;pointer-events:none;box-shadow:0 2px 6px #0007}
#ban:empty{display:none}
#ban.my{background:var(--acc);color:#2a1a05}
#bigDice{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:16px;z-index:6;pointer-events:none}
#bigDice .die{width:64px;height:64px;padding:8px;border-radius:12px;box-shadow:0 6px 16px #000a}
#log{position:absolute;left:52px;bottom:58px;max-width:42%;font-size:12px;line-height:1.4;color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000;pointer-events:none;z-index:2}
#game.p4 #log{bottom:104px}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.7}
#log div:last-child{opacity:1}
/* 手札: 下の赤茶のトレイに資源カード */
#hand{position:absolute;bottom:3px;left:48px;right:240px;max-width:440px;display:flex;gap:4px;padding:4px;background:linear-gradient(#5a1f14,#2e0f0a);border:2px solid #8a5a3a;border-radius:12px;box-shadow:inset 0 2px 6px #000a,0 2px 8px #0008;z-index:3}
.rc{flex:1;background:linear-gradient(#fffaf0,#ecdcbc);border-top:5px solid var(--rc,#999);border-radius:7px;padding:1px 1px 2px;text-align:center;font-size:9px;color:#6b4a30;position:relative;min-width:0;box-shadow:0 2px 3px #0007}
.rc .ic{font-size:16px;line-height:1.1}
.rc b{display:block;color:#2a170b;font-size:15px;line-height:1.05}
.rc .rt{position:absolute;right:2px;top:0;font-size:9px;font-weight:800;color:#b45309}
.rc.cards{background:linear-gradient(#5b3f8f,#3d2a63);border-top-color:#a78bfa;color:#ddd}.rc.cards b{color:#fff}
/* 右下: サイコロ、つくるボタン、おわり・やり直し・交換 */
#corner{position:absolute;right:5px;bottom:3px;display:flex;flex-direction:column;align-items:flex-end;gap:5px;z-index:4}
#dice{display:flex;gap:5px;align-items:center;pointer-events:none;min-height:30px}
.die{width:30px;height:30px;background:#fff;border-radius:6px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:3px;box-shadow:0 2px 6px #0007}
.die i{display:block;margin:1px;border-radius:50%}.die i.on{background:#222}
#dice .sum{font-size:20px;font-weight:800;text-shadow:0 2px 4px #000}
#dice .sum.seven{color:#ffb4a8}
#acts{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
#acts .r{display:flex;gap:5px}
#acts button{min-height:0;border-radius:10px;box-shadow:0 2px 5px #0008}
#acts .bb{width:54px;height:44px;padding:1px;font-size:13px;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center}
#acts .bb .cost{font-size:8px;font-weight:400;letter-spacing:-1px;white-space:nowrap}
#acts .sq{width:56px;height:56px;padding:0;font-size:26px;line-height:1;color:#2a1a05;background:linear-gradient(#f3b84f,#c9822a);border-bottom:4px solid #7a4a14;display:flex;flex-direction:column;align-items:center;justify-content:center}
#acts .sq small{font-size:9px;font-weight:800;margin-top:1px}
#acts .sq.on{background:linear-gradient(#ffe08a,#f6b93b);box-shadow:0 0 0 2px #fff,0 0 10px #ffd54a}
#acts .go{height:56px;min-width:96px;padding:0 10px;font-size:15px;line-height:1.15}
/* ふる → おわり など、同じ場所のボタンが入れかわったときは少しのあいだ押せない（2 度タップで番が終わらないように）。ふわっと出して見せる */
#acts .go.fresh{animation:goIn .45s ease-out}
@keyframes goIn{from{opacity:.25;transform:scale(.92)}to{opacity:1;transform:none}}
/* たて持ち: 盤は画面はばいっぱい。下に手札トレイ、その下にボタン 2 段（つくる 4 つ / おわり・やり直し・交換） */
@media (orientation:portrait){
  #boardWrap{top:4px;left:0;right:0;bottom:188px}
  /* アイコンは ≡ と 確率 だけを上のまん中に（四すみは人。あそびかた・できごとはメニューから、カードは手札の 🃏 から） */
  #side{top:4px;left:50%;transform:translateX(-50%);flex-direction:row}
  #side button{width:40px;height:40px}
  #side button:not(:first-child):not(.pr){display:none}
  #side{gap:5px}
  #side button{width:38px}
  /* 上のまん中に ≡・確率・ログ の 3 つがならぶので、人の帯はそのぶん細く。下のまん中はサイコロ */
  .pl{max-width:calc(50% - 82px)}
  .pl.c2{bottom:4px}
  .vpb{width:28px;height:28px;font-size:14px;border-width:2px}
  .pi{margin-left:-9px;padding:2px 7px 3px 11px}
  .pi .nm{font-size:11px}
  #ban{top:50px;max-width:calc(100% - 96px)}
  #log{left:8px;bottom:182px;max-width:72%}
  #game.p4 #log{bottom:228px}
  #hand{left:6px;right:6px;bottom:114px;max-width:none}
  .rc{font-size:10px}.rc .ic{font-size:18px}.rc b{font-size:16px}
  #corner{left:6px;right:6px;bottom:4px;align-items:stretch}
  /* サイコロは盤の下のまん中（右下の人と重ならないように） */
  #corner #dice{position:absolute;left:50%;right:auto;transform:translateX(-50%);bottom:calc(100% + 78px)}
  #corner #dice .die{width:26px;height:26px;padding:2px}
  #corner #dice .sum{font-size:18px}
  #acts{align-items:stretch}
  #acts .r{width:100%}
  #acts .bb{flex:1;width:auto;height:48px;font-size:14px}
  #acts .bb .cost{font-size:10px}
  #acts .go{flex:1;font-size:17px}
  #acts .sq{width:70px}
  #game #tradeBox{left:6px;right:6px;bottom:4px;max-width:none}
  #game #offerBox{top:44%}
}
/* 番が来たときの知らせ・資源カードが飛ぶ演出 */
#turnPop{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:linear-gradient(#5a3a22,#3a2416);border:2px solid #c9a06a;border-radius:12px;padding:10px 28px;font-size:20px;font-weight:800;z-index:7;pointer-events:none;white-space:nowrap;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px #000a;animation:tp 1.5s forwards}
#stealPop{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);background:linear-gradient(#4a2a2a,#2a1616);border:2px solid #e0533f;border-radius:14px;padding:12px 22px;font-size:18px;font-weight:800;z-index:9;pointer-events:none;text-align:center;line-height:1.5;box-shadow:0 6px 18px #000a;animation:sp 3s forwards;max-width:92%}
#stealPop.good{border-color:#5ee07a;background:linear-gradient(#244a2a,#132a16)}
#stealPop.info{border-color:#c9a06a;background:linear-gradient(#5a3a22,#3a2416);font-size:15px}
#stealPop .big{font-size:30px;display:block}
@keyframes sp{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}10%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}16%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0}}
@keyframes tp{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
#fx{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:hidden}
.fc{position:absolute;width:34px;height:46px;margin:-23px 0 0 -17px;border-radius:6px;background:linear-gradient(#fffaf0,#ecdcbc);border:3px solid var(--rc);display:grid;place-items:center;font-size:20px;box-shadow:0 3px 8px #000a;transition:left .55s cubic-bezier(.5,0,.3,1),top .55s cubic-bezier(.5,0,.3,1),transform .4s,opacity .3s}
.fc b{position:absolute;right:-8px;top:-9px;background:#2f9a48;color:#fff;font-size:11px;border-radius:9px;padding:0 4px;border:1px solid #fff}
.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.2)}}
/* ---- 盤 ---- */
.hl{animation:pulse .8s infinite alternate}
/* サイコロで当たった土地: 白く 3 回光る + 数字のまわりに金の輪が広がる */
.hitfx{fill:#fff7b0;stroke:#fff;stroke-width:7;stroke-linejoin:round;animation:hitflash .9s ease-in-out 3 both}
@keyframes hitflash{0%,100%{fill-opacity:0;stroke-opacity:.2}50%{fill-opacity:.62;stroke-opacity:1}}
.hitring{fill:none;stroke:#ffd54a;stroke-width:5;transform-box:fill-box;transform-origin:center;animation:hitring .9s ease-out 3 both}
@keyframes hitring{from{transform:scale(.7);opacity:1}to{transform:scale(2.6);opacity:0}}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
/* ---- 小窓 ---- */
#modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:12px;z-index:50}
#modal .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;max-width:440px;width:100%;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
#modal h2{margin:0;font-size:20px;text-align:center}
#modal .g4{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
#modal .g4 button{padding:6px 1px;font-size:12px;line-height:1.2;min-width:0}
#modal .g4 .ic{font-size:22px;display:block}
.rules{font-size:14px;line-height:1.7}
/* 交換のよびかけ（右はし）: もらう +1 / 出す −1 のカードと ✕ ✓ */
#offerBox{position:absolute;right:0;top:50%;transform:translateY(-50%);min-width:170px;padding:10px 10px 10px 26px;background:linear-gradient(90deg,#0000,#000b 22%);display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:6;animation:slide .25s}
#offerBox:not(.mine){border-right:4px solid #ffd54a;animation:slide .25s,glow 1s .25s infinite alternate}
@keyframes glow{from{border-right-color:#ffd54a}to{border-right-color:#ffd54a33}}
#offerBox .cd{font-size:12px;color:#ffd54a;font-weight:700}
/* 自分のよびかけ中の小さな知らせは、盤をふさがないよう右上に */
#game #offerBox.mine{top:50px;transform:none;padding:6px 8px 6px 20px;gap:3px}
#offerBox.mine .ob button{height:34px}
@keyframes slide{from{opacity:0;margin-right:-40px}to{opacity:1;margin-right:0}}
#offerBox .ot{font-size:14px;font-weight:700;color:#fff;border-bottom:1px solid #fff5;padding-bottom:4px;display:flex;align-items:center;gap:5px;white-space:nowrap}
#offerBox .orow{display:flex;align-items:center;gap:6px}
#offerBox .orow.sm{font-size:14px}
.n{font-size:24px;font-weight:800;text-shadow:0 1px 3px #000}.n.p{color:#5ee07a}.n.m{color:#ff6b6b}
.ocard{display:inline-grid;place-items:center;width:34px;height:46px;border-radius:6px;border:3px solid var(--rc);background:linear-gradient(#fffaf0,#ecdcbc);font-size:20px;box-shadow:0 2px 4px #0008}
#offerBox .ob{display:flex;gap:8px;margin-top:2px}
#offerBox .ob button{width:52px;height:46px;min-height:0;font-size:24px;padding:0;border-radius:10px;color:#fff}
[data-o="no"]{background:linear-gradient(#e0533f,#b02f22)!important}
[data-o="ok"]{background:linear-gradient(#4cc35f,#2a8a3c)!important}
#offerBox [data-o="open"]{width:auto;padding:0 14px;font-size:14px}
/* 交換の画面（下のまん中）: 上の列 = ほしい / 下の列 = 出す（自分の手札の数つき） */
#tradeBox{position:absolute;left:48px;right:240px;bottom:3px;max-width:600px;margin:0 auto;background:linear-gradient(#2a3442,#1b222c);border:3px solid #c9a06a;border-radius:12px;padding:18px 8px 6px;z-index:7;box-shadow:0 6px 20px #000c}
#tradeBox .tt{position:absolute;top:-15px;left:50%;transform:translateX(-50%);background:linear-gradient(#4a5568,#2d3748);border:2px solid #c9a06a;border-radius:6px;padding:2px 22px;font-weight:800;font-size:15px;white-space:nowrap}
#tradeBox .th{font-size:11px;color:#cbd5e1;text-align:center;font-style:italic;margin-bottom:3px}
#tradeBox .trow{display:flex;align-items:center;gap:5px;padding:4px 0;border-top:1px solid #fff1}
#tradeBox .who{width:46px;flex:none;text-align:center;font-size:10px;line-height:1.2;color:#e2e8f0}

/* =====================================================================
   2026-11-28 見た目の作り直し（リアル寄り）: 置き場所は今までと同じで、絵と質感だけ変える
   ===================================================================== */
:root{--gold:#d9b25a;--gold2:#8a6526;--ink:#1d140c;--plate:linear-gradient(#3b2b1f,#1e150e);
  --wood:radial-gradient(ellipse at 50% 45%,#0000 40%,#0007 100%),
    repeating-linear-gradient(0deg,#0000 0 118px,#00000059 118px 121px,#ffffff10 121px 122px),
    repeating-linear-gradient(1.2deg,#ffffff08 0 2px,#0000 2px 7px,#00000012 7px 9px,#0000 9px 17px),
    repeating-linear-gradient(-.8deg,#0000 0 31px,#0000001c 31px 34px,#0000 34px 57px),
    linear-gradient(90deg,#4a2a14,#6e4321 22%,#7c4c26 48%,#62391b 74%,#4a2a14)}
html,body{background-color:#4a2a14}
/* 上のボタン: こげ茶の板に金のふち */
#side button{background:var(--plate);color:#f6e7c4;border:2px solid var(--gold);border-bottom:2px solid var(--gold2);box-shadow:inset 0 1px 0 #ffffff26,0 3px 6px #000a;border-radius:8px}
#side button.on{background:linear-gradient(#b3402f,#6e1d14);color:#fff;border-color:#ffd27a}
#ban{background:linear-gradient(#f4e6c2,#d9c08a);color:#3a2412;border:2px solid #8a6526;box-shadow:0 3px 8px #000a,inset 0 1px 0 #fff8}
#ban.my{background:linear-gradient(#ffe08a,#e8a930);color:#2a1505;border-color:#fff3c4}
/* 人の札: 肖像（その人の色）+ 勝利点の六角バッジ + 名前の色帯 */
.pl{background:var(--plate);border:2px solid var(--gold);border-radius:9px;padding:2px;gap:4px;box-shadow:0 4px 10px #000b,inset 0 1px 0 #ffffff1f;align-items:stretch}
.pl.c1,.pl.c2{flex-direction:row-reverse}
.pl .av{position:relative;flex:none;width:40px;border-radius:6px;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--pc) 55%,#fff),var(--pc) 55%,color-mix(in srgb,var(--pc) 55%,#000));border:1px solid #0008;overflow:hidden}
.pl .av svg{position:absolute;left:50%;bottom:-3px;width:34px;height:34px;translate:-50% 0;filter:drop-shadow(0 1px 1px #0008)}
.vpb{position:absolute;width:26px;height:24px;border:0;border-radius:0;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:linear-gradient(#ffe9a8,#c9932f);color:#3a1d05;font:900 14px/1 Georgia,serif;z-index:2;box-shadow:none}
.pl{position:absolute}
.pl.c0 .vpb,.pl.c3 .vpb{left:-9px;bottom:-9px}.pl.c1 .vpb,.pl.c2 .vpb{right:-9px;bottom:-9px}
.pl .vpb::before{content:"";position:absolute;inset:2px;clip-path:inherit;background:linear-gradient(#fff3c9,#e7b54a);z-index:-1}
.pi{margin:0;padding:0;background:none;clip-path:none;box-shadow:none;display:flex;flex-direction:column;gap:1px;min-width:0}
.pi .nm{background:linear-gradient(90deg,var(--pc),color-mix(in srgb,var(--pc) 45%,#000));border-radius:4px;padding:1px 6px;text-shadow:0 1px 2px #000}
.pl.c1 .pi .nm,.pl.c2 .pi .nm{background:linear-gradient(270deg,var(--pc),color-mix(in srgb,var(--pc) 45%,#000));text-align:right}
.pi .st{background:none;color:#e9d7b4;padding:0 3px}
.pl.c1 .pi .st,.pl.c2 .pi .st{margin-left:auto}
.pl.cur{border-color:#ffe7a0;box-shadow:0 0 0 2px #ffd54a,0 0 16px #ffc83a,0 4px 10px #000b}
.pl.cur .vpb{border:0;box-shadow:none}
.pl.cur::after{display:none}
@media (orientation:portrait){ .pl .av{width:32px} .pl .av svg{width:28px;height:28px} .vpb{width:22px;height:20px;font-size:12px} .pl.c0 .vpb,.pl.c3 .vpb{left:-7px;bottom:-7px}.pl.c1 .vpb,.pl.c2 .vpb{right:-7px;bottom:-7px} }
/* 手札: 革のトレイに、絵のついた資源カード */
#hand{background:linear-gradient(#3a1a10,#1f0d07);border:2px solid var(--gold2);box-shadow:inset 0 3px 8px #000c,0 3px 10px #000a,0 0 0 1px #000;border-radius:10px;gap:5px;padding:5px}
.rc{background:#f6ecd4;border:0;border-radius:6px;padding:2px 2px 3px;color:#5a3a1e;box-shadow:0 2px 0 #b89a68,0 4px 6px #000a;display:flex;flex-direction:column;align-items:center}
.rc .art{width:100%;height:34px;border-radius:4px;background:var(--rf);display:grid;place-items:center;box-shadow:inset 0 0 0 1px #0004,inset 0 -6px 10px #0003;overflow:hidden}
.rc .art svg{width:40px;height:32px;filter:drop-shadow(0 2px 1px #0006)}
.rc b{font:900 17px/1.1 Georgia,serif;color:#24150a;margin-top:1px}
.rc .rn{font-size:9px;line-height:1}
.rc .rt{top:auto;bottom:1px;right:3px;background:#2f7d3a;color:#fff;border-radius:4px;padding:0 2px;font-size:8.5px}
.rc.cards{background:linear-gradient(#4b3474,#2c1e47);box-shadow:0 2px 0 #1a1030,0 4px 6px #000a;color:#d8ccf2}
.rc.cards .art{background:radial-gradient(circle,#7d61b5,#3d2a63)}
.rc.cards b{color:#fff}
.rc{display:grid;grid-template-columns:auto auto;justify-content:center;align-items:baseline;column-gap:3px}
.rc .art{grid-column:1/-1;margin-bottom:1px}
@media (orientation:portrait){ .rc .art{height:32px} .rc b{font-size:17px} .rc .rn{font-size:9.5px} }
/* ボタン: 黒い板に金のふち（つくる・やり直し・交換）、いちばん大事なボタンは金色 */
#acts button{background:var(--plate);color:#f6e7c4;border:2px solid var(--gold);border-bottom:2px solid var(--gold2);box-shadow:inset 0 1px 0 #ffffff22,0 3px 6px #000a}
#acts .bb .cost{display:flex;gap:0;justify-content:center}
.ri{width:13px;height:13px;flex:none;filter:drop-shadow(0 1px 0 #000)}
#acts .bb.on{background:linear-gradient(#ffe08a,#e8a930);color:#2a1505}
#acts .sq{background:var(--plate);color:var(--gold);border:2px solid var(--gold);border-bottom:2px solid var(--gold2)}
#acts .sq small{color:#f6e7c4}
#acts .sq.on{background:linear-gradient(#ffe08a,#e8a930);color:#2a1505}#acts .sq.on small{color:#2a1505}
#acts .go.main,#acts .main.go{background:linear-gradient(#ffe27a 0,#f5c23c 45%,#d99a1c 100%);color:#2a1505;border:3px solid #fff1b8;border-bottom:3px solid #a66d0c;box-shadow:0 0 0 2px #3a2408,0 5px 10px #000b,inset 0 2px 0 #fff8;font-weight:900;letter-spacing:1px}
#acts button:disabled{opacity:.45;filter:saturate(.4)}
/* サイコロ: 赤い角のまるいサイコロに白い目 */
.die{background:radial-gradient(circle at 30% 25%,#f0675a,#c8281f 55%,#8e140f);border-radius:22%;box-shadow:inset -2px -3px 3px #0005,inset 2px 2px 2px #fff5,0 4px 7px #000a}
.die i.on{background:radial-gradient(circle at 40% 35%,#fff,#e8dcd2);box-shadow:inset 0 1px 1px #0005}
#bigDice .die{width:72px;height:72px;padding:10px}
#bigDice .die:first-child{rotate:-12deg}#bigDice .die:last-child{rotate:9deg;translate:0 10px}
#dice .sum{font-family:Georgia,serif;color:#fff3c4}
/* 知らせ・小窓も 金ぶちの板に */
#turnPop,#stealPop.info{background:var(--plate);border:2px solid var(--gold);color:#f6e7c4}
#modal .box{background:linear-gradient(#3b2b1f,#24180f);border:2px solid var(--gold);box-shadow:0 10px 30px #000c}
#tradeBox{background:linear-gradient(#3b2b1f,#1e150e);border-color:var(--gold)}
#tradeBox .tt{background:linear-gradient(#ffe08a,#d99a1c);color:#2a1505;border-color:#fff1b8}
.ocard,.fc{background:#f6ecd4}

/* ---------------- ホーム画面（夕焼けの島）---------------- */
#menu.home{padding:0;display:block;overflow:hidden;background:#3a120c}
#menu.home .scene{position:absolute;inset:0;width:100%;height:100%}
.hm{position:absolute;inset:0;padding:calc(10px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto auto 1fr auto auto;grid-template-areas:"prof chips chips" "logo logo logo" "left . right" "opts opts opts" "mode mode play";gap:10px 12px}
/* 2026-11-28: 左上は ゲーム一覧へもどる ボタン、右上に なまえ と 人の六角 */
.hm .hbk{grid-area:prof;align-self:start;width:76px;height:60px;min-height:0;padding:4px 0 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:linear-gradient(#2e2924,#16130f);border:3px solid #0a0806;outline:2px solid #6b5a3e;outline-offset:-6px;border-radius:9px;box-shadow:0 4px 8px #0008}

.hm .hbk small{font-size:9.5px;font-weight:800;color:#e8b84a;letter-spacing:0}
.hm .prof{grid-area:chips;display:flex;align-items:center;gap:8px;justify-self:end}
.hexav{width:60px;height:66px;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(#ffe9a8,#b98420);display:grid;place-items:center;filter:drop-shadow(0 3px 4px #000a)}

.plate{background:linear-gradient(#2e221a,#17100b);border:2px solid var(--gold);border-radius:8px;box-shadow:inset 0 1px 0 #ffffff1f,0 4px 10px #000a;color:#f6e7c4}

// ---------------- 通信 ----------------
const randCode = () => String(Math.floor(1000 + Math.random() * 9000));
function sendAll(m) { for (const c of [...host.conns.values(), ...host.specs.values()]) { try { if (c.open) c.send(m); } catch (e) {} } }
function netFail() { errMsg = "オフラインのため通信できません。CPUと対戦で遊べます"; cleanupNet(); mode = "none"; screen = "menu"; renderUI(); }
function cleanupNet() { try { peer && peer.destroy(); } catch (e) {} peer = null; hostConn = null; host.conns.clear(); host.specs.clear(); host.playing = false; }
function peerOk() { if (typeof Peer !== "undefined" && !isOffline()) return true; netFail(); return false; }
function lobbyMsg() { return { t: "lobby", code: host.code, seats: host.seats.map(s => ({ name: s.name, bot: !!s.bot, pid: s.pid, diff: s.diff || "norm" })), specs: [...host.specs.values()].map(c => c.pname), diff: host.diff, cfg }; }

  try { peer = new Peer(netId(code)); } catch (e) { netFail(); return; }
  peer.on("open", () => { host.code = code; hostTries = 0; screen = "lobby"; hostLobby(); });
  peer.on("error", e => {
    if (e.type === "unavailable-id" && ++hostTries < (PARTY ? 90 : 20)) { try { peer.destroy(); } catch (x) {} setTimeout(startHost, PARTY ? 1000 : 50); return; }   // 前の部屋がまだ残っている・番号がかぶった
    if (screen === "game" || screen === "lobby") { toast("通信エラー: " + e.type); return; }
    errMsg = "接続エラー: " + e.type; cleanupNet(); mode = "none"; screen = "menu"; renderUI();
  });

    conn.on("data", m => hostMsg(conn, m));
    conn.on("close", () => hostDrop(conn));
  });
}
function hostMsg(conn, m) {
  if (!m) return;
  if (m.t === "hello") {
    const id = host.nextId++; conn.pid = id; conn.pname = String(m.name || "ゲスト").slice(0, 12); conn.wantSpec = !!m.spec;
    // 観戦: 観戦をえらんだ人・始まったあとに来た人・4人いっぱいのとき
    if (m.spec || host.playing || host.seats.length >= 4) {
      conn.spec = true; host.specs.set(id, conn); conn.send({ t: "welcome", you: id, spec: 1 });
      if (host.playing && G) { conn.send(lobbyMsg()); conn.send({ t: "st", G }); } else hostLobby();
      if (host.playing) { lobbyInfo = lobbyMsg(); sendAll(lobbyInfo); render(); }
      return;
    }
    host.conns.set(id, conn); host.seats.push({ pid: id, name: conn.pname }); conn.send({ t: "welcome", you: id }); hostLobby(); return;
  }
  if (m.t === "act" && !conn.spec && G && host.playing) {
    const s = G.ps.findIndex(p => !p.bot && p.pid === conn.pid);
    if (s < 0) return;
    const err = doAct(s, m.a);
    if (err) { try { conn.send({ t: "err", msg: err }); } catch (e) {} }
  }
}
function hostDrop(conn) {
  if (!conn.pid) return;
  if (host.specs.get(conn.pid) === conn) { host.specs.delete(conn.pid); lobbyInfo = lobbyMsg(); if (!host.playing) hostLobby(); else sendAll(lobbyInfo); return; }
  if (host.conns.get(conn.pid) !== conn) return;
  host.conns.delete(conn.pid);
  if (host.playing && G) {
    // 試合中にぬけた人の席は、CPU（ふつう）が代わりに続ける

    if (s >= 0) { G.ps[s].bot = true; G.ps[s].diff = "norm"; if (G.offer && G.offer.resp[s] === null) G.offer.resp[s] = cpuRespond(s, G.offer) ? "ok" : "no";
      if (G.phase === "discard" && G.disc[s] > 0) { discard(s, cpuDiscard(s, G.disc[s])); if (!G.disc.some(x => x)) G.phase = "crow"; }
      addLog(`${G.ps[s].name} がぬけたので CPU が代わります`); G.ver++; afterChange(); }

}
function hostAddCpu() { if (host.playing || host.seats.length >= 4) return; const n = host.seats.filter(s => s.bot).length; host.seats.push({ pid: null, name: "CPU-" + "ABC"[n], bot: true, diff: host.diff || "norm" }); hostLobby(); }
// 2026-11-28: 名前の右の ✕ で、その CPU をはずす（のこりの CPU は A, B, C と付け直す）
function hostDelCpuAt(i) { if (host.playing || !host.seats[i] || !host.seats[i].bot) return; host.seats.splice(i, 1); let n = 0; host.seats.forEach(s => { if (s.bot) s.name = "CPU-" + "ABC"[n++]; }); hostLobby(); }
function hostDelCpu() { if (host.playing) return; const i = host.seats.map(s => !!s.bot).lastIndexOf(true); if (i >= 0) host.seats.splice(i, 1); hostLobby(); }

  host.seats = host.seats.filter(s => s.bot || s.pid === 0 || host.conns.has(s.pid));

}
function joinRoom(code) {
  code = String(code).replace(/\D/g, "");

  if (!peerOk()) return;
  mode = "client"; screen = "connecting"; errMsg = ""; host.code = code; G = null; renderUI();
  try { peer = new Peer(); } catch (e) { netFail(); return; }
  peer.on("open", () => {

    if (PARTY && e.type === "peer-unavailable") return;   // パーティ: 上の時間切れで探し直す

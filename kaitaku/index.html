<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b2a44">
<title>カイタク島</title>
<!-- ミニゲーム集「you know games」のゲーム（kakutou/kaitaku/）。2026-11-09 作成:
     六角形の土地が並ぶ島で、サイコロで資源をあつめ、道・村・町をつくって点数を競う（オリジナルのルール）。 -->
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="you know games">
<link rel="manifest" href="../manifest.json"><link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png?v=3"><link rel="apple-touch-icon" href="../apple-touch-icon.png?v=3">
<style>
:root{--bg:#0b2a44;--panel:#10304d;--card:#173c5e;--line:#2a5577;--tx:#eef6ff;--sub:#9fb8cf;--acc:#f6b93b;--btn:#24527a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:12px;background:var(--btn);padding:10px 12px;min-height:44px;font-weight:700;touch-action:manipulation}
button:disabled{opacity:.38;cursor:default}
button.on{background:var(--acc);color:#2a1a05}
button.main{background:var(--acc);color:#2a1a05;font-size:18px}
input{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0c2238;color:var(--tx);width:100%}
.hidden{display:none!important}
/* ---- メニュー・部屋 ---- */
.scr{position:fixed;inset:0;overflow-y:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:flex-start}
.card{max-width:460px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card h1{margin:0;font-size:30px;text-align:center;letter-spacing:2px}
.card h1 small{display:block;font-size:13px;color:var(--sub);letter-spacing:0;font-weight:400;margin-top:4px}
.card h3{margin:8px 0 0;font-size:14px;color:var(--sub)}
.seg{display:flex;gap:6px}.seg>*{flex:1}
.row{display:flex;gap:8px}.row>*{flex:1}
.note{font-size:13px;color:var(--sub);line-height:1.5}
.err{color:#ffb4a8;font-size:14px}
.code{font-size:44px;font-weight:800;text-align:center;letter-spacing:8px;color:var(--acc)}
.mem{display:flex;flex-wrap:wrap;gap:6px}
.mem span{background:#0c2238;border-radius:99px;padding:6px 12px;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.mem small{color:var(--sub);font-size:12px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid #0008;flex:none}
/* ---- ゲーム画面: たて持ちは上から 人・案内・盤・手もと。よこ持ちは盤を左、ほかを右に ---- */
#game{position:fixed;inset:0;display:grid;grid-template-columns:100%;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"top" "ban" "board" "panel";
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
@media (orientation:landscape) and (min-width:560px){
  #game{grid-template-columns:minmax(0,1fr) minmax(270px,40%);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"board top" "board ban" "board panel"}
  #panel{overflow-y:auto}
}
#top{grid-area:top;display:flex;gap:4px;padding:4px 6px;align-items:stretch}
#pls{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:4px}
.pl{background:var(--panel);border:2px solid transparent;border-radius:10px;padding:3px 6px;font-size:12px;line-height:1.25;min-width:0}
.pl.cur{border-color:var(--acc);background:#1d4569}
.pl .nm{display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.pl .st{color:var(--sub);white-space:nowrap}
.pl .st b{color:#fff;font-size:14px}
#menuBtn{min-height:0;padding:0 12px;font-size:20px;background:var(--panel)}
#ban{grid-area:ban;margin:2px 6px;padding:8px 12px;border-radius:12px;background:var(--panel);font-size:15px;font-weight:700;text-align:center;min-height:38px;display:flex;align-items:center;justify-content:center;gap:8px}
#ban.my{background:var(--acc);color:#2a1a05}
#boardWrap{grid-area:board;position:relative;min-height:0;min-width:0}
#board{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
#dice{position:absolute;left:8px;top:6px;display:flex;gap:6px;pointer-events:none;align-items:center}
.die{width:36px;height:36px;background:#fff;border-radius:8px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:4px;box-shadow:0 2px 6px #0007}
.die i{display:block;margin:2px;border-radius:50%}.die i.on{background:#222}
#dice.big .die{width:54px;height:54px;padding:6px}
#dice .sum{font-size:22px;font-weight:800;text-shadow:0 2px 4px #000}
#dice .sum.seven{color:#ffb4a8}
#panel{grid-area:panel;padding:4px 6px 6px;display:flex;flex-direction:column;gap:6px}
#hand{display:flex;gap:4px}
.rc{flex:1;background:var(--panel);border-radius:10px;padding:4px 2px;text-align:center;font-size:12px;color:var(--sub);position:relative;min-width:0}
.rc .ic{font-size:20px;line-height:1.1}
.rc b{display:block;color:#fff;font-size:18px;line-height:1.1}
.rc .rt{position:absolute;right:3px;top:2px;font-size:10px;color:var(--acc)}
.rc.cards{background:#2c2550}
#acts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
#acts button{padding:5px 2px;min-height:50px;font-size:14px;line-height:1.15}
#acts button .cost{display:block;font-size:12px;font-weight:400;letter-spacing:-1px}
#acts .wide{grid-column:span 2}
#acts .full{grid-column:1/-1}
#log{font-size:12px;color:var(--sub);line-height:1.45;min-height:3.2em;padding:0 4px}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log div:last-child{color:var(--tx)}
/* ---- 盤 ---- */
.hl{animation:pulse .8s infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
/* ---- 小窓 ---- */
#modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:12px;z-index:50}
#modal .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;max-width:440px;width:100%;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
#modal h2{margin:0;font-size:20px;text-align:center}
#modal .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#modal .g4 button{padding:6px 2px;font-size:13px;line-height:1.2}
#modal .g4 .ic{font-size:22px;display:block}
.rules{font-size:14px;line-height:1.7}
.rules b{color:var(--acc)}
.cl{display:flex;align-items:center;gap:8px;background:#0c2238;border-radius:12px;padding:8px}
.cl .ci{font-size:26px}
.cl .cd{flex:1;font-size:13px;line-height:1.4}
.cl .cd b{font-size:15px}
.cl button{flex:none}
.rank{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:#0c2238;font-size:16px}
.rank.win{background:#5a4512}
#toast{position:fixed;left:50%;top:40%;transform:translateX(-50%);background:rgba(0,0,0,.85);padding:10px 18px;border-radius:12px;font-size:15px;transition:opacity .3s;opacity:0;pointer-events:none;z-index:60;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="menu" class="scr hidden"></div>
<div id="lobby" class="scr hidden"></div>
<div id="game" class="hidden">
  <div id="top"><div id="pls"></div><button id="menuBtn" aria-label="メニュー">≡</button></div>
  <div id="ban"></div>
  <div id="boardWrap"><svg id="board" xmlns="http://www.w3.org/2000/svg"></svg><div id="dice"></div></div>
  <div id="panel"><div id="hand"></div><div id="acts"></div><div id="log"></div></div>
</div>
<div id="modal" class="hidden"><div class="box"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="../party-beacon.js?v=5"></script>
<script>
"use strict";
// ================= カイタク島（2026-11-09 作成） =================
// ・盤は毎回ランダム（土地の種類・数字・港の場所）。土地の形（六角形 19 まい）はいつも同じ。
// ・資源は 4 種類（木・石・魚・くだもの）。7 が出るとカラスが来る。先に 8 点で勝ち。
// ・通信はホストが正しい状態（G）を持ち、ゲストは「やりたいこと」を送るだけ。CPU もホストが動かす。
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

const TARGET = 8;   // 勝ちの点数
const RES = ["wood", "stone", "fish", "fruit"];
const RN = { wood: "木", stone: "石", fish: "魚", fruit: "くだもの" };
const RI = { wood: "🌲", stone: "⛰️", fish: "🐟", fruit: "🍎" };
const TT = {
  forest: { res: "wood", name: "森", col: "#3f8f3a", ic: "🌲" },
  hill: { res: "stone", name: "岩山", col: "#8d8f96", ic: "⛰️" },
  lake: { res: "fish", name: "湖", col: "#2fa7c0", ic: "🐟" },
  orchard: { res: "fruit", name: "果樹園", col: "#e3a034", ic: "🍎" },
  volcano: { res: null, name: "火山", col: "#6b2d2d", ic: "🌋" },
};
const COST = { road: { wood: 1, stone: 1 }, vil: { wood: 1, stone: 1, fish: 1, fruit: 1 }, town: { stone: 2, fruit: 2 }, card: { wood: 1, fish: 1, fruit: 1 } };
const BN = { road: "道", vil: "村", town: "町", card: "カード" };
const LIM = { road: 15, vil: 5, town: 4 };
const CARD = {
  scare: { name: "カカシ", ic: "👒", txt: "カラスを好きな土地へ動かして、そこの人から1まいもらう" },
  harvest: { name: "大豊作", ic: "🧺", txt: "好きな資源を2まいもらう" },
  bridge: { name: "橋づくり", ic: "🌉", txt: "道を2本タダでつくる（サイコロのあと）" },
  map: { name: "宝の地図", ic: "🗺️", txt: "買ったらすぐ +1点" },
};
const COLS = ["#ef4444", "#3b82f6", "#facc15", "#c084fc"];
const DIFF = { weak: "よわい", norm: "ふつう", strong: "つよい" };
const costHtml = c => RES.filter(r => c[r]).map(r => RI[r].repeat(c[r])).join("");

// ================= 盤の形（いつも同じ。土地の種類と数字だけ毎回ランダム） =================
const SQ3 = Math.sqrt(3);
const GEO = (() => {
  const hex = [], verts = [], edges = [], vmap = new Map(), emap = new Map();
  for (let r = -2; r <= 2; r++) for (let q = -2; q <= 2; q++) if (Math.abs(q + r) <= 2) hex.push({ q, r, x: SQ3 * (q + r / 2), y: 1.5 * r, c: [] });
  const vid = (x, y) => {
    const k = Math.round(x * 100) + "," + Math.round(y * 100);
    if (!vmap.has(k)) { vmap.set(k, verts.length); verts.push({ x, y, h: [], v: [], e: [] }); }
    return vmap.get(k);
  };
  hex.forEach((h, i) => {
    for (let k = 0; k < 6; k++) { const a = Math.PI / 180 * (60 * k - 30); const v = vid(h.x + Math.cos(a), h.y + Math.sin(a)); h.c.push(v); verts[v].h.push(i); }
    for (let k = 0; k < 6; k++) {
      const a = Math.min(h.c[k], h.c[(k + 1) % 6]), b = Math.max(h.c[k], h.c[(k + 1) % 6]), key = a + "-" + b;
      if (!emap.has(key)) { const id = edges.length; emap.set(key, id); edges.push({ a, b, h: [] }); verts[a].v.push(b); verts[b].v.push(a); verts[a].e.push(id); verts[b].e.push(id); }
      edges[emap.get(key)].h.push(i);
    }
  });
  hex.forEach(h => { h.n = []; hex.forEach((o, j) => { const dq = o.q - h.q, dr = o.r - h.r; if (Math.abs(dq) + Math.abs(dr) + Math.abs(dq + dr) === 2) h.n.push(j); }); });
  const mid = i => ({ x: (verts[edges[i].a].x + verts[edges[i].b].x) / 2, y: (verts[edges[i].a].y + verts[edges[i].b].y) / 2 });
  const coast = edges.map((e, i) => i).filter(i => edges[i].h.length === 1).sort((i, j) => Math.atan2(mid(i).y, mid(i).x) - Math.atan2(mid(j).y, mid(j).x));
  return { hex, verts, edges, coast, mid };
})();

// ================= ゲームの状態とルール（ホスト・ひとり用で使う） =================
let G = null;
function newGame(seats) {
  const types = shuffle([..."FFFF"].map(() => "forest").concat([..."HHHHH"].map(() => "hill"), [..."LLLL"].map(() => "lake"), [..."OOOOO"].map(() => "orchard"), ["volcano"]));
  const tiles = types.map(t => ({ t, n: 0 }));
  // 数字: 6 と 8（よく出る数）どうし、同じ数どうしがとなりにならないように並べ直す
  for (let tries = 0; tries < 800; tries++) {
    const nums = shuffle([2, 3, 3, 4, 4, 5, 5, 6, 6, 8, 8, 9, 9, 10, 10, 11, 11, 12]); let k = 0;
    tiles.forEach(t => { t.n = t.t === "volcano" ? 0 : nums[k++]; });
    const red = n => n === 6 || n === 8;
    if (!GEO.hex.some((h, i) => h.n.some(j => { const a = tiles[i].n, b = tiles[j].n; return a && b && ((red(a) && red(b)) || a === b); }))) break;
  }
  const kinds = shuffle(["any", "any", "wood", "stone", "fish", "fruit"]), off = Math.floor(Math.random() * 5), step = GEO.coast.length / 6;
  const harbors = kinds.map((k, i) => ({ e: GEO.coast[(off + Math.round(i * step)) % GEO.coast.length], k }));
  const n = seats.length, order = [...Array(n).keys(), ...[...Array(n).keys()].reverse()];
  const deck = shuffle([..."123456789"].map(() => "scare").concat(["harvest", "harvest", "harvest", "bridge", "bridge", "bridge", "map", "map", "map", "map", "map"]));
  return {
    tiles, crow: tiles.findIndex(t => t.t === "volcano"), harbors, vb: Array(GEO.verts.length).fill(null), er: Array(GEO.edges.length).fill(-1),
    ps: seats.map((s, i) => ({ name: s.name, pid: s.pid == null ? null : s.pid, bot: !!s.bot, diff: s.diff || "norm", col: i, hand: { wood: 0, stone: 0, fish: 0, fruit: 0 }, cards: [], newC: [], vpC: 0, used: 0, roads: 0, vils: 0, towns: 0, lr: 0 })),
    cur: order[0], phase: "setup", su: { i: 0, order, step: "v", lastV: -1 }, dice: [0, 0], rollN: 0, log: [], winner: -1, free: 0, cardUsed: false, back: "main", victims: [], deck, roadHolder: -1, turnN: 1, trades: 0, ver: 0,
  };
}
const tot = h => RES.reduce((s, r) => s + h[r], 0);
const afford = (p, c) => RES.every(r => p.hand[r] >= (c[r] || 0));
const pay = (p, c) => RES.forEach(r => { p.hand[r] -= (c[r] || 0); });
const resOf = ti => TT[G.tiles[ti].t].res;
function addLog(s) { G.log.push(s); if (G.log.length > 40) G.log.shift(); }
function vp(i) { const p = G.ps[i]; return p.vils + 2 * p.towns + p.vpC + (G.roadHolder === i ? 2 : 0); }
function canVil(s, v, setup) {
  if (G.vb[v] || GEO.verts[v].v.some(u => G.vb[u])) return false;   // となりの角に村・町があるところには置けない
  return setup || GEO.verts[v].e.some(e => G.er[e] === s);
}
function canRoad(s, e) {
  if (G.er[e] !== -1) return false;
  const E = GEO.edges[e];
  if (G.phase === "setup") return E.a === G.su.lastV || E.b === G.su.lastV;
  return [E.a, E.b].some(u => { const b = G.vb[u]; if (b) return b.p === s; return GEO.verts[u].e.some(f => f !== e && G.er[f] === s); });
}
const validVils = s => GEO.verts.map((_, v) => v).filter(v => canVil(s, v, false));
const validRoads = s => GEO.edges.map((_, e) => e).filter(e => canRoad(s, e));
const validTowns = s => G.vb.map((b, v) => b && b.p === s && b.lv === 1 ? v : -1).filter(v => v >= 0);
// 交換のレート: ふつうは 4→1。港にくっついた村・町があれば 3→1（どれでも）や 2→1（その資源）
function ratio(s, r) {
  let x = 4;
  for (const h of G.harbors) {
    const E = GEO.edges[h.e];
    if ([E.a, E.b].some(u => G.vb[u] && G.vb[u].p === s)) { if (h.k === "any") x = Math.min(x, 3); else if (h.k === r) x = 2; }
  }
  return x;
}
// いちばん長い道（ほかの人の村・町のところで切れる）
function longest(s) {
  let best = 0; const used = new Set();
  const dfs = v => {
    best = Math.max(best, used.size);
    const b = G.vb[v]; if (used.size && b && b.p !== s) return;
    for (const e of GEO.verts[v].e) {
      if (G.er[e] !== s || used.has(e)) continue;
      used.add(e); const E = GEO.edges[e]; dfs(E.a === v ? E.b : E.a); used.delete(e);
    }
  };
  for (let e = 0; e < G.er.length; e++) if (G.er[e] === s) { dfs(GEO.edges[e].a); dfs(GEO.edges[e].b); }
  return best;
}
// 「長い道ボーナス」（5本以上つながった、いちばん長い道 = +2点）。同じ長さなら、いま持っている人のまま
function updRoad() {
  G.ps.forEach((p, i) => { p.lr = longest(i); });
  const mx = Math.max(...G.ps.map(p => p.lr)), h = G.roadHolder;
  let nh = -1;
  if (mx >= 5) { if (h >= 0 && G.ps[h].lr === mx) nh = h; else { const c = G.ps.map((p, i) => p.lr === mx ? i : -1).filter(i => i >= 0); nh = c.length === 1 ? c[0] : -1; } }
  if (nh !== h) { G.roadHolder = nh; if (nh >= 0) addLog(`🛤️ ${G.ps[nh].name} が長い道ボーナス（+2点）`); }
}
function produce(sum) {
  const gains = G.ps.map(() => ({}));
  GEO.hex.forEach((h, i) => {
    const t = G.tiles[i]; if (t.n !== sum || i === G.crow) return;
    const r = TT[t.t].res;
    for (const v of h.c) { const b = G.vb[v]; if (b) { G.ps[b.p].hand[r] += b.lv; gains[b.p][r] = (gains[b.p][r] || 0) + b.lv; } }
  });
  const parts = gains.map((g, i) => { const k = Object.keys(g); return k.length ? G.ps[i].name + " " + k.map(r => RI[r] + g[r]).join("") : ""; }).filter(Boolean);
  addLog(parts.length ? "　→ " + parts.join("、") : "　→ だれも資源なし");
}
function doRoll(s) {
  const d1 = 1 + Math.floor(Math.random() * 6), d2 = 1 + Math.floor(Math.random() * 6), sum = d1 + d2;
  G.dice = [d1, d2]; G.rollN++;
  addLog(`🎲 ${G.ps[s].name}: ${sum}`);
  if (sum === 7) {
    // カラスが来る: 10まい以上持っている人は半分なくす（えらばずに自動）
    G.ps.forEach(p => {
      const n = tot(p.hand); if (n < 10) return;
      for (let k = 0; k < Math.floor(n / 2); k++) { const pool = RES.flatMap(r => Array(p.hand[r]).fill(r)); p.hand[pool[Math.floor(Math.random() * pool.length)]]--; }
      addLog(`🌪️ ${p.name} は ${Math.floor(n / 2)}まい なくした`);
    });
    addLog("🐦‍⬛ カラスが来た！"); G.back = "main"; G.phase = "crow";
  } else { produce(sum); G.phase = "main"; }
  return "";
}
function steal(s, v) {
  const p = G.ps[v], pool = RES.flatMap(r => Array(p.hand[r]).fill(r));
  if (!pool.length) return;
  const r = pool[Math.floor(Math.random() * pool.length)];
  p.hand[r]--; G.ps[s].hand[r]++;
  addLog(`${G.ps[s].name} が ${p.name} から1まいもらった`);
}
function endTurn() {
  const p = G.ps[G.cur];
  p.cards.push(...p.newC); p.newC = [];

function lobbyMsg() { return { t: "lobby", code: host.code, seats: host.seats.map(s => ({ name: s.name, bot: !!s.bot, pid: s.pid })), specs: [...host.specs.values()].map(c => c.pname), diff: host.diff }; }

function startHost() {
  if (!peerOk()) return;

  host.seats = [{ pid: 0, name: myName() }]; host.conns.clear(); host.specs.clear(); host.nextId = 1; host.playing = false;
  renderUI();
  const code = PARTY ? PARTY.code : randCode();
  try { peer = new Peer(netId(code)); } catch (e) { netFail(); return; }
  peer.on("open", () => { host.code = code; hostTries = 0; screen = "lobby"; hostLobby(); });
  peer.on("error", e => {
    if (e.type === "unavailable-id" && ++hostTries < (PARTY ? 90 : 20)) { try { peer.destroy(); } catch (x) {} setTimeout(startHost, PARTY ? 1000 : 50); return; }   // 前の部屋がまだ残っている・番号がかぶった
    if (screen === "game" || screen === "lobby") { toast("通信エラー: " + e.type); return; }
    errMsg = "接続エラー: " + e.type; cleanupNet(); mode = "none"; screen = "menu"; renderUI();
  });

    conn.on("close", () => hostDrop(conn));

}
function hostMsg(conn, m) {

  if (m.t === "hello") {
    const id = host.nextId++; conn.pid = id; conn.pname = String(m.name || "ゲスト").slice(0, 12); conn.wantSpec = !!m.spec;

    if (m.spec || host.playing || host.seats.length >= 4) {
      conn.spec = true; host.specs.set(id, conn); conn.send({ t: "welcome", you: id, spec: 1 });
      if (host.playing && G) { conn.send(lobbyMsg()); conn.send({ t: "st", G }); } else hostLobby();
      if (host.playing) { lobbyInfo = lobbyMsg(); sendAll(lobbyInfo); render(); }
      return;
    }
    host.conns.set(id, conn); host.seats.push({ pid: id, name: conn.pname }); conn.send({ t: "welcome", you: id }); hostLobby(); return;
  }
  if (m.t === "act" && !conn.spec && G && host.playing) {
    const s = G.ps.findIndex(p => !p.bot && p.pid === conn.pid);
    if (s < 0) return;
    const err = doAct(s, m.a);
    if (err) { try { conn.send({ t: "err", msg: err }); } catch (e) {} }
  }
}
function hostDrop(conn) {

  if (host.specs.get(conn.pid) === conn) { host.specs.delete(conn.pid); lobbyInfo = lobbyMsg(); if (!host.playing) hostLobby(); else sendAll(lobbyInfo); return; }
  if (host.conns.get(conn.pid) !== conn) return;

  if (host.playing && G) {
    // 試合中にぬけた人の席は、CPU（ふつう）が代わりに続ける
    const s = G.ps.findIndex(p => !p.bot && p.pid === conn.pid);
    if (s >= 0) { G.ps[s].bot = true; G.ps[s].diff = "norm"; addLog(`${G.ps[s].name} がぬけたので CPU が代わります`); afterChange(); }

}

function joinRoom(code) {

}

    if (t.n) {
      const red = t.n === 6 || t.n === 8, pp = pips(t.n);
      s += `<g pointer-events="none" opacity="${i === G.crow ? 0.45 : 1}"><circle cx="${x}" cy="${y + 6}" r="15" fill="#f8f0dc" stroke="#00000055"/>`
        + `<text x="${x}" y="${y + 11}" font-size="16" font-weight="800" text-anchor="middle" fill="${red ? "#c81e1e" : "#222"}">${t.n}</text>`
        + [...Array(pp)].map((_, k) => `<circle cx="${x + (k - (pp - 1) / 2) * 4}" cy="${y + 16}" r="1.4" fill="${red ? "#c81e1e" : "#333"}"/>`).join("") + `</g>`;
    }
    if (i === G.crow) s += `<g transform="translate(${x + (t.n ? 14 : 0)},${y + (t.n ? -2 : 8)})" pointer-events="none">${CROW_SVG}</g>`;
  });
  // タップできる土地は上にもう一度（当たり判定）
  for (const i of hl.t) s += `<polygon points="${poly(GEO.hex[i])}" fill="#ffffff22" data-t="${i}"/>`;
  // 道
  G.er.forEach((p, e) => {
    if (p < 0) return; const E = GEO.edges[e], [x1, y1] = P(E.a), [x2, y2] = P(E.b);
    const sx = x1 + (x2 - x1) * 0.14, sy = y1 + (y2 - y1) * 0.14, ex = x2 - (x2 - x1) * 0.14, ey = y2 - (y2 - y1) * 0.14;
    s += `<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="#111" stroke-width="10" stroke-linecap="round"/><line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${COLS[p]}" stroke-width="6.5" stroke-linecap="round"/>`;
  });
  // 置ける道
  for (const e of hl.e) {
    const E = GEO.edges[e], [x1, y1] = P(E.a), [x2, y2] = P(E.b), mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#fff" stroke-width="6" stroke-dasharray="6 5" class="hl" pointer-events="none"/>`
      + `<circle cx="${mx}" cy="${my}" r="9" fill="#fff" class="hl" pointer-events="none"/><circle cx="${mx}" cy="${my}" r="20" fill="transparent" data-e="${e}"/>`;
  }
  // 村・町
  G.vb.forEach((b, v) => {
    if (!b) return; const [x, y] = P(v);
    s += `<path d="${b.lv === 2 ? TOWN_PATH : VIL_PATH}" transform="translate(${x},${y})" fill="${COLS[b.p]}" stroke="#111" stroke-width="2.2" stroke-linejoin="round"/>`;
  });
  for (const v of hl.v) { const [x, y] = P(v); s += `<circle cx="${x}" cy="${y}" r="10" fill="#ffffffcc" stroke="#111" stroke-width="2" class="hl" pointer-events="none"/><circle cx="${x}" cy="${y}" r="21" fill="transparent" data-v="${v}"/>`; }
  $("board").innerHTML = s;
}
$("board").addEventListener("click", e => {
  const el = e.target.closest("[data-v],[data-e],[data-t]"); if (!el || !G) return;
  if (el.dataset.t != null) { act({ k: "crow", t: +el.dataset.t }); return; }
  if (el.dataset.e != null) { ui.mode = G.free > 1 ? "road" : null; act({ k: "build", w: "road", at: +el.dataset.e }); return; }
  if (el.dataset.v != null) {
    const w = G.phase === "setup" ? "vil" : ui.mode; ui.mode = null;
    act({ k: "build", w, at: +el.dataset.v });
  }
});

// ---------------- サイコロ ----------------
let shownRoll = -1, diceT = null;
const DOTS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
const dieHtml = n => `<div class="die">${[...Array(9)].map((_, i) => `<i class="${DOTS[n].includes(i) ? "on" : ""}"></i>`).join("")}</div>`;
function updDice() {
  const el = $("dice");
  if (!G.rollN) { el.innerHTML = ""; shownRoll = 0; return; }
  if (G.rollN === shownRoll) return;
  const first = shownRoll < 0; shownRoll = G.rollN;
  const fin = () => { const t = G.dice[0] + G.dice[1]; el.classList.remove("big"); el.innerHTML = dieHtml(G.dice[0]) + dieHtml(G.dice[1]) + `<span class="sum ${t === 7 ? "seven" : ""}">${t}</span>`; };
  clearInterval(diceT);
  if (first || FAST) { fin(); return; }
  let k = 0; el.classList.add("big");
  diceT = setInterval(() => {
    if (++k >= 9 || !G) { clearInterval(diceT); if (G) fin(); return; }
    el.innerHTML = dieHtml(1 + Math.floor(Math.random() * 6)) + dieHtml(1 + Math.floor(Math.random() * 6));
  }, 70);
}

// ---------------- 案内・手もと ----------------
function bannerText() {
  const s = mySeat(), cp = G.ps[G.cur], who = `<i class="dot" style="background:${COLS[G.cur]}"></i>${esc(cp.name)}`;
  if (G.phase === "over") return { my: false, h: `🏆 ${esc(G.ps[G.winner].name)} の勝ち！` };
  if (s < 0 || G.cur !== s) {
    const what = G.phase === "setup" ? "はじめの村と道を置いています" : G.phase === "roll" ? "サイコロをふります" : G.phase === "crow" || G.phase === "steal" ? "カラスを動かしています" : "の番です";
    return { my: false, h: `${spectating || s < 0 ? "観戦中 ・ " : ""}${who} ${what}` };
  }
  if (G.phase === "setup") return { my: true, h: G.su.step === "v" ? `村を置く角をタップ（${G.su.i < G.ps.length ? "1" : "2"}つめ）` : "村からのびる道をタップ" };
  if (G.phase === "roll") return { my: true, h: "あなたの番！ サイコロをふろう" };
  if (G.phase === "crow") return { my: true, h: "🐦‍⬛ カラスを置く土地をタップ" };
  if (G.phase === "steal") return { my: true, h: "だれから1まいもらう？" };
  if (G.free > 0) return { my: true, h: `🌉 タダで道をつくれる（あと${G.free}本）` };
  if (ui.mode) return { my: true, h: `${BN[ui.mode]}をつくる場所をタップ` };
  return { my: true, h: "つくる・交換する → おわったら「おわり」" };
}
function render() {
  if (!G || screen !== "game") return;
  const s = mySeat(), me = s >= 0 ? G.ps[s] : null, myTurn = s >= 0 && G.cur === s && G.phase !== "over";
  if (!myTurn || G.phase !== "main") ui.mode = null;
  if (myTurn && G.phase === "main" && G.free > 0) ui.mode = "road";
  // 人
  $("pls").innerHTML = G.ps.map((p, i) => `<div class="pl ${i === G.cur && G.phase !== "over" ? "cur" : ""}"><div class="nm"><i class="dot" style="background:${COLS[i]}"></i>${esc(p.name)}${p.bot ? "🤖" : ""}</div>
    <div class="st">★<b>${vp(i)}</b> ✋${tot(p.hand)}${p.cards.length + p.newC.length ? ` 🃏${p.cards.length + p.newC.length}` : ""}${G.roadHolder === i ? " 🛤️" : p.lr >= 3 ? ` 道${p.lr}` : ""}</div></div>`).join("");
  const bt = bannerText();
  $("ban").className = bt.my ? "my" : ""; $("ban").innerHTML = bt.h;
  renderBoard(); updDice();
  // 手もと
  if (me) {
    $("hand").innerHTML = RES.map(r => { const x = ratio(s, r); return `<div class="rc"><div class="ic">${RI[r]}</div><b>${me.hand[r]}</b>${RN[r]}${x < 4 ? `<span class="rt">${x}:1</span>` : ""}</div>`; }).join("")
      + `<div class="rc cards" data-g="cards"><div class="ic">🃏</div><b>${me.cards.length + me.newC.length}</b>カード</div>`;
  } else $("hand").innerHTML = `<div class="rc" style="padding:8px">観戦中: みんなの手は見えません</div>`;
  // ボタン
  let h = "";
  if (!me) h = `<button class="full" data-g="leave">${PARTY ? "ゲーム一覧へ" : "ぬける"}</button>`;
  else if (G.phase === "over") h = `<button class="main full" data-g="result">🏆 結果を見る</button>`;   // 2026-11-10: 「盤を見る」で閉じたあとも結果（部屋にもどる）を開き直せる
  else if (!myTurn) h = `<button class="full" disabled>ほかの人の番です…</button>`;
  else if (G.phase === "setup") h = `<button class="full" disabled>${G.su.step === "v" ? "光っている角をタップ" : "光っている道をタップ"}</button>`;
  else if (G.phase === "roll") h = `<button class="main wide" data-g="roll" style="grid-column:span 3">🎲 サイコロをふる</button><button data-g="cards" ${me.cards.length && !G.cardUsed ? "" : "disabled"}>🃏カード</button>`;
  else if (G.phase === "crow") h = `<button class="full" disabled>光っている土地をタップ</button>`;
  else if (G.phase === "steal") h = G.victims.map(i => `<button class="wide" data-g="steal" data-p="${i}"><i class="dot" style="background:${COLS[i]}"></i> ${esc(G.ps[i].name)}（${tot(G.ps[i].hand)}まい）</button>`).join("");
  else if (G.free > 0) h = `<button class="full" data-g="nofree">道づくりをやめる</button>`;
  else {
    const can = {
      road: (afford(me, COST.road)) && me.roads < LIM.road && validRoads(s).length > 0,
      vil: afford(me, COST.vil) && me.vils < LIM.vil && validVils(s).length > 0,
      town: afford(me, COST.town) && me.towns < LIM.town && validTowns(s).length > 0,
      card: afford(me, COST.card) && G.deck.length > 0,
    };
    h = ["road", "vil", "town", "card"].map(w => `<button data-g="b-${w}" class="${ui.mode === w ? "on" : ""}" ${can[w] || ui.mode === w ? "" : "disabled"}>${ui.mode === w ? "やめる" : BN[w]}<span class="cost">${costHtml(COST[w])}</span></button>`).join("")
      + `<button data-g="trade">🔁交換</button><button data-g="cards" ${me.cards.length && !G.cardUsed ? "" : "disabled"}>🃏カード</button><button class="main wide" data-g="end">おわり ▶</button>`;
  }
  $("acts").innerHTML = h;
  $("log").innerHTML = G.log.slice(-3).map(l => `<div>${esc(l)}</div>`).join("");
  // 勝負がついたら結果を出す（1 回だけ）
  if (G.phase === "over" && ui.overSeen !== G.ver) { ui.overSeen = G.ver; ui.modal = "over"; }
  renderModal();
}
$("panel").addEventListener("click", e => {
  const b = e.target.closest("[data-g]"); if (!b || b.disabled || !G) return;
  const g = b.dataset.g;
  if (g === "roll") act({ k: "roll" });
  else if (g === "end") { ui.mode = null; act({ k: "end" }); }
  else if (g === "nofree") act({ k: "nofree" });
  else if (g === "steal") act({ k: "steal", p: +b.dataset.p });
  else if (g === "trade") { ui.give = ui.get = null; openModal("trade"); }
  else if (g === "cards") openModal("cards");
  else if (g === "leave") leave();
  else if (g === "result") openModal("over");
  else if (g.startsWith("b-")) {
    const w = g.slice(2);
    if (w === "card") { act({ k: "build", w: "card" }); return; }
    ui.mode = ui.mode === w ? null : w; render();
  }
});
$("menuBtn").addEventListener("click", () => openModal("menu"));

// ---------------- 小窓 ----------------
function openModal(k) { ui.modal = k; ui.picks = []; renderModal(); }
function renderModal() {
  const box = document.querySelector("#modal .box"), k = ui.modal;
  $("modal").classList.toggle("hidden", !k);
  if (!k) return;
  const s = mySeat(), me = G && s >= 0 ? G.ps[s] : null, myTurn = G && s >= 0 && G.cur === s;
  let h = "";
  if (k === "rules") h = `<h2>あそびかた</h2>${RULES_HTML}<button data-m="close">とじる</button>`;
  else if (k === "menu") h = `<h2>メニュー</h2><button data-m="rules">あそびかた</button><button data-m="log">これまでのできごと</button>
      <button data-m="quit">${PARTY ? "ゲーム一覧へ" : mode === "local" ? "やめてメニューへ" : "部屋をぬける"}</button><button data-m="close">とじる</button>`;
  else if (k === "log") h = `<h2>できごと</h2><div class="note" style="max-height:50vh;overflow-y:auto">${G.log.slice().reverse().map(l => `<div>${esc(l)}</div>`).join("")}</div><button data-m="close">とじる</button>`;
  else if (k === "trade") {
    if (!me || !myTurn || G.phase !== "main") { ui.modal = null; $("modal").classList.add("hidden"); return; }
    const g = ui.give, x = g ? ratio(s, g) : 0;
    h = `<h2>🔁 銀行と交換</h2><div class="note">出す資源（この数で1まいもらえる）</div>
      <div class="g4">${RES.map(r => `<button data-m="give" data-r="${r}" class="${g === r ? "on" : ""}" ${me.hand[r] >= ratio(s, r) ? "" : "disabled"}><span class="ic">${RI[r]}</span>${RN[r]}<br>${ratio(s, r)}→1（${me.hand[r]}）</button>`).join("")}</div>
      <div class="note">もらう資源</div>
      <div class="g4">${RES.map(r => `<button data-m="get" data-r="${r}" class="${ui.get === r ? "on" : ""}" ${r === g ? "disabled" : ""}><span class="ic">${RI[r]}</span>${RN[r]}</button>`).join("")}</div>
      <button class="main" data-m="dotrade" ${g && ui.get && g !== ui.get ? "" : "disabled"}>${g && ui.get ? `${RI[g]}${x}まい → ${RI[ui.get]}1まい` : "えらんでね"}</button><button data-m="close">とじる</button>`;
  } else if (k === "cards") {
    if (!me) { ui.modal = null; $("modal").classList.add("hidden"); return; }
    const canUse = c => myTurn && !G.cardUsed && (G.phase === "main" || (G.phase === "roll" && c !== "bridge"));
    const cnt = {}; me.cards.forEach(c => { cnt[c] = (cnt[c] || 0) + 1; });
    h = `<h2>🃏 ふしぎカード</h2>` + (Object.keys(cnt).length ? Object.entries(cnt).map(([c, n]) => `<div class="cl"><span class="ci">${CARD[c].ic}</span><div class="cd"><b>${CARD[c].name}</b> ×${n}<br>${CARD[c].txt}</div><button data-m="use" data-c="${c}" ${canUse(c) ? "" : "disabled"}>つかう</button></div>`).join("") : `<div class="note">使えるカードはありません</div>`)
      + (me.newC.length ? `<div class="note">買ったばかり（つぎの番から使える）: ${me.newC.map(c => CARD[c].ic + CARD[c].name).join("、")}</div>` : "")
      + (me.vpC ? `<div class="note">🗺️ 宝の地図: ${me.vpC}まい（+${me.vpC}点）</div>` : "")
      + `<div class="note">カードは ${costHtml(COST.card)} で買える。1番に1まいだけ使える。</div><button data-m="close">とじる</button>`;
  } else if (k === "harvest") {
    h = `<h2>🧺 大豊作</h2><div class="note">好きな資源を2まいえらぼう（同じのを2回でもOK）</div>
      <div class="g4">${RES.map(r => `<button data-m="pick" data-r="${r}" ${ui.picks.length >= 2 ? "disabled" : ""}><span class="ic">${RI[r]}</span>${RN[r]}</button>`).join("")}</div>
      <div style="text-align:center;font-size:28px;min-height:36px">${ui.picks.map(r => RI[r]).join(" ")}</div>
      <button class="main" data-m="doharvest" ${ui.picks.length === 2 ? "" : "disabled"}>もらう</button><button data-m="repick">えらびなおす</button><button data-m="close">やめる</button>`;
  } else if (k === "over") {
    const order = G.ps.map((p, i) => i).sort((a, b) => (b === G.winner) - (a === G.winner) || vp(b) - vp(a));
    h = `<h2>🏆 ${esc(G.ps[G.winner].name)} の勝ち！</h2>` + order.map(i => `<div class="rank ${i === G.winner ? "win" : ""}"><i class="dot" style="background:${COLS[i]}"></i><span style="flex:1">${esc(G.ps[i].name)}${i === s ? "（あなた）" : ""}</span><b>${vp(i)}点</b></div>`).join("")
      + `<div class="note" style="text-align:center">${G.turnN}ターン</div>`
      + (mode === "local" ? `<button class="main" data-m="again">もう一度</button><button data-m="tomenu">メニューへ</button>`
        : mode === "host" ? `<button class="main" data-m="lobby">部屋にもどる</button><button data-m="close">盤を見る</button>`
          : `<div class="note" style="text-align:center">ホストが部屋にもどるのを待っています…</div><button data-m="close">盤を見る</button><button data-m="quit">${PARTY ? "ゲーム一覧へ" : "ぬける"}</button>`);
  }
  box.innerHTML = h;
}
$("modal").addEventListener("click", e => {
  if (e.target.id === "modal" && ui.modal !== "harvest") { ui.modal = null; renderModal(); return; }
  const b = e.target.closest("[data-m]"); if (!b || b.disabled) return;
  const m = b.dataset.m;
  if (m === "close") { ui.modal = null; renderModal(); return; }
  if (m === "rules" || m === "log") { ui.modal = m; renderModal(); return; }
  if (m === "quit") { ui.modal = null; renderModal(); if (PARTY || mode === "local" || confirm("部屋をぬけますか？")) leave(); return; }
  if (m === "give") { ui.give = b.dataset.r; if (ui.get === ui.give) ui.get = null; renderModal(); return; }
  if (m === "get") { ui.get = b.dataset.r; renderModal(); return; }
  if (m === "dotrade") { act({ k: "trade", give: ui.give, get: ui.get }); ui.give = ui.get = null; renderModal(); return; }
  if (m === "use") {
    const c = b.dataset.c;
    if (c === "harvest") { ui.modal = "harvest"; ui.picks = []; renderModal(); return; }
    ui.modal = null; act({ k: "play", c }); renderModal(); return;
  }
  if (m === "pick") { if (ui.picks.length < 2) ui.picks.push(b.dataset.r); renderModal(); return; }
  if (m === "repick") { ui.picks = []; renderModal(); return; }
  if (m === "doharvest") { const r = ui.picks.slice(); ui.modal = null; act({ k: "play", c: "harvest", r }); renderModal(); return; }
  if (m === "again") { ui.modal = null; const seats = G.ps.map(p => ({ pid: p.pid, name: p.name, bot: p.bot, diff: p.diff })); startGame(shuffle(seats)); return; }
  if (m === "tomenu") { ui.modal = null; leave(); return; }
  if (m === "lobby") { hostBackToLobby(); return; }
});

// ================= はじまり =================
renderUI();
if (PARTY) {
  if (isOffline()) { errMsg = "オフラインのためパーティに入れません。CPUと対戦で遊べます"; renderUI(); }
  else if (PARTY.role === "host") startHost(); else joinRoom(PARTY.code);
}
// 電波が切れた・もどったら、メニューを出し直す（オフラインなら部屋のボタンを隠す）
for (const ev of ["online", "offline"]) addEventListener(ev, () => { if (screen === "menu") { renderMenu(); keepName(); } });
try { if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) navigator.serviceWorker.register("../sw.js").catch(() => {}); } catch (e) {}

// テスト用: CPU だけの試合を早送りできる
window.__dbg = {
  get G() { return G; }, set G(g) { G = g; }, get mode() { return mode; }, get screen() { return screen; }, get ui() { return ui; }, host, GEO,
  applyAct, cpuAction, cpuStep, vp, longest, ratio, validVils, validRoads, newGame, render, renderUI, isOffline, mySeat, doAct, act,
  set fast(v) { FAST = !!v; }, get fast() { return FAST; },
  // CPU だけの試合をはじめる（見るだけ）
  cpuOnly(n = 4, diff = "norm") { clearTimeout(cpuTimer); mode = "local"; myPid = -99; startGame([...Array(n)].map((_, i) => ({ name: "CPU-" + "ABCD"[i], bot: true, diff: Array.isArray(diff) ? diff[i] : diff }))); },
  // CPU の番を、人間の番になるか終わるまで（または max 手）一気に進める
  ff(max = 20000) {
    let k = 0;
    while (G && G.phase !== "over" && G.ps[G.cur].bot && k++ < max) { cpuStep(); G.ver++; checkWin(); }
    afterChange(); return { steps: k, phase: G && G.phase, winner: G && G.winner, turn: G && G.turnN, vp: G && G.ps.map((p, i) => vp(i)) };
  },
};
</script>

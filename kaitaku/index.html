<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7a4520">
<title>カイタク島</title>
<!-- ミニゲーム集「you know games」のゲーム（kakutou/kaitaku/）。2026-11-09 作成:
     六角形の土地が並ぶ島で、サイコロで資源をあつめ、道・村・町をつくって点数を競う（オリジナルのルール）。 -->
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="you know games">
<link rel="manifest" href="../manifest.json"><link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png?v=3"><link rel="apple-touch-icon" href="../apple-touch-icon.png?v=3">
<style>
:root{--bg:#a8622f;--panel:rgba(36,20,9,.86);--card:#3a2416;--line:#6b4a30;--tx:#fff7ec;--sub:#d8c0a0;--acc:#f6b93b;--btn:#6b4426;--deep:#24150a;
  /* 2026-11-11: 木のテーブル（板のつなぎ目・木目） */
  --wood:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 2px,transparent 2px 86px),repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 9px),repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 3px,transparent 3px 23px),linear-gradient(90deg,#a85f2c,#c27a3e 50%,#a35b2a)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--wood);background-color:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-bottom:3px solid #0006;border-radius:12px;background:var(--btn);padding:10px 12px;min-height:44px;font-weight:700;touch-action:manipulation}
button:disabled{opacity:.38;cursor:default}
button.on{background:var(--acc);color:#2a1a05}
button.main{background:var(--acc);color:#2a1a05;font-size:18px}
input{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--deep);color:var(--tx);width:100%}
.hidden{display:none!important}
/* ---- メニュー・部屋 ---- */
.scr{position:fixed;inset:0;overflow-y:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:flex-start}
.card{max-width:460px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card h1{margin:0;font-size:30px;text-align:center;letter-spacing:2px}
.card h1 small{display:block;font-size:13px;color:var(--sub);letter-spacing:0;font-weight:400;margin-top:4px}
.card h3{margin:8px 0 0;font-size:14px;color:var(--sub)}
.seg{display:flex;gap:6px}.seg>*{flex:1}
.row{display:flex;gap:8px}.row>*{flex:1}
.note{font-size:13px;color:var(--sub);line-height:1.5}
.err{color:#ffb4a8;font-size:14px}
.code{font-size:44px;font-weight:800;text-align:center;letter-spacing:8px;color:var(--acc)}
.mem{display:flex;flex-wrap:wrap;gap:6px}
.mem span{background:var(--deep);border-radius:99px;padding:6px 12px;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.mem small{color:var(--sub);font-size:12px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid #0008;flex:none}
/* ---- ゲーム画面（2026-11-11 作り直し: 横画面が基本）----
   上に人の帯、左はしにアイコン、まん中に盤、下に手札、右下にサイコロとボタン、右はしに交換のよびかけ。
   たて持ちのときは画面ごと 90° まわして横画面にする（スマホを横にして遊ぶ）。 */
#stage{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;pointer-events:none;z-index:10}
#stage>*{pointer-events:auto}
#stage>#toast{pointer-events:none}
body.rot #stage{width:100vh;width:100dvh;height:100vw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg)}
#game{position:absolute;top:0;bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left);right:env(safe-area-inset-right);overflow:hidden}
body.rot #game{top:0;bottom:0;left:0;right:0}
#top{position:absolute;top:3px;left:6px;right:6px;height:44px;display:flex}
#pls{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;min-width:0;max-width:900px;margin:0 auto}
/* 人の帯: 丸い点数バッジ + その人の色のリボン（名前・手札・カード・道の長さ） */
.pl{display:flex;align-items:center;min-width:0;position:relative}
.vpb{flex:none;width:34px;height:34px;border-radius:50%;background:#2b1a0e;border:3px solid var(--pc);color:#fff;font-weight:800;font-size:17px;display:grid;place-items:center;box-shadow:0 2px 5px #0009;z-index:1}
.pi{flex:1;min-width:0;margin-left:-12px;padding:2px 10px 3px 15px;background:linear-gradient(#ffffff26,#0000 45%,#0003),var(--pc);clip-path:polygon(0 0,100% 0,calc(100% - 7px) 50%,100% 100%,0 100%);box-shadow:0 2px 4px #0006}
.pi .nm{font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi .st{display:flex;gap:5px;font-size:11px;color:#fff;background:#0007;border-radius:5px;padding:0 4px;width:max-content;max-width:100%;overflow:hidden}
.pi .st .lr{color:var(--acc);font-weight:800}
.pl.cur .vpb{border-color:#ffd54a;box-shadow:0 0 0 2px #ffd54a,0 0 12px #ffd54a}
.pl.cur::after{content:"";position:absolute;left:12px;bottom:-7px;border:5px solid transparent;border-top-color:#ffd54a}
#side{position:absolute;left:5px;top:54px;display:flex;flex-direction:column;gap:6px;z-index:4}
#side button{width:40px;height:40px;min-height:0;padding:0;font-size:18px;border-radius:9px;color:#2a1a05;background:linear-gradient(#f3b84f,#c9822a);border-bottom:3px solid #7a4a14;position:relative;box-shadow:0 2px 4px #0007}
#side .bd{position:absolute;right:-5px;top:-5px;min-width:18px;background:#c0392b;color:#fff;font-size:11px;line-height:18px;border-radius:9px;padding:0 4px}
#boardWrap{position:absolute;top:47px;bottom:56px;left:48px;right:4px;overflow:hidden}
#board{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation;overflow:visible}
#ban{position:absolute;top:50px;left:50%;transform:translateX(-50%);max-width:min(64%,560px);padding:4px 14px;border-radius:99px;background:var(--panel);font-size:13px;font-weight:700;z-index:4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;pointer-events:none;box-shadow:0 2px 6px #0007}
#ban:empty{display:none}
#ban.my{background:var(--acc);color:#2a1a05}
#bigDice{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:16px;z-index:6;pointer-events:none}
#bigDice .die{width:64px;height:64px;padding:8px;border-radius:12px;box-shadow:0 6px 16px #000a}
#log{position:absolute;left:52px;bottom:58px;max-width:42%;font-size:12px;line-height:1.4;color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000;pointer-events:none;z-index:2}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.7}
#log div:last-child{opacity:1}
/* 手札: 下の赤茶のトレイに資源カード */
#hand{position:absolute;bottom:3px;left:48px;right:240px;max-width:440px;display:flex;gap:4px;padding:4px;background:linear-gradient(#5a1f14,#2e0f0a);border:2px solid #8a5a3a;border-radius:12px;box-shadow:inset 0 2px 6px #000a,0 2px 8px #0008;z-index:3}
.rc{flex:1;background:linear-gradient(#fffaf0,#ecdcbc);border-top:5px solid var(--rc,#999);border-radius:7px;padding:1px 1px 2px;text-align:center;font-size:9px;color:#6b4a30;position:relative;min-width:0;box-shadow:0 2px 3px #0007}
.rc .ic{font-size:16px;line-height:1.1}
.rc b{display:block;color:#2a170b;font-size:15px;line-height:1.05}
.rc .rt{position:absolute;right:2px;top:0;font-size:9px;font-weight:800;color:#b45309}
.rc.cards{background:linear-gradient(#5b3f8f,#3d2a63);border-top-color:#a78bfa;color:#ddd}.rc.cards b{color:#fff}
/* 右下: サイコロ、つくるボタン、おわり・やり直し・交換 */
#corner{position:absolute;right:5px;bottom:3px;display:flex;flex-direction:column;align-items:flex-end;gap:5px;z-index:4}
#dice{display:flex;gap:5px;align-items:center;pointer-events:none;min-height:30px}
.die{width:30px;height:30px;background:#fff;border-radius:6px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:3px;box-shadow:0 2px 6px #0007}
.die i{display:block;margin:1px;border-radius:50%}.die i.on{background:#222}
#dice .sum{font-size:20px;font-weight:800;text-shadow:0 2px 4px #000}
#dice .sum.seven{color:#ffb4a8}
#acts{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
#acts .r{display:flex;gap:5px}
#acts button{min-height:0;border-radius:10px;box-shadow:0 2px 5px #0008}
#acts .bb{width:54px;height:44px;padding:1px;font-size:13px;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center}
#acts .bb .cost{font-size:8px;font-weight:400;letter-spacing:-1px;white-space:nowrap}
#acts .sq{width:56px;height:56px;padding:0;font-size:26px;line-height:1;color:#2a1a05;background:linear-gradient(#f3b84f,#c9822a);border-bottom:4px solid #7a4a14;display:flex;flex-direction:column;align-items:center;justify-content:center}
#acts .sq small{font-size:9px;font-weight:800;margin-top:1px}
#acts .sq.on{background:linear-gradient(#ffe08a,#f6b93b);box-shadow:0 0 0 2px #fff,0 0 10px #ffd54a}
#acts .go{height:56px;min-width:96px;padding:0 10px;font-size:15px;line-height:1.15}
/* 番が来たときの知らせ・資源カードが飛ぶ演出 */
#turnPop{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:linear-gradient(#5a3a22,#3a2416);border:2px solid #c9a06a;border-radius:12px;padding:10px 28px;font-size:20px;font-weight:800;z-index:7;pointer-events:none;white-space:nowrap;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px #000a;animation:tp 1.5s forwards}
@keyframes tp{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
#fx{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:hidden}
.fc{position:absolute;width:34px;height:46px;margin:-23px 0 0 -17px;border-radius:6px;background:linear-gradient(#fffaf0,#ecdcbc);border:3px solid var(--rc);display:grid;place-items:center;font-size:20px;box-shadow:0 3px 8px #000a;transition:left .55s cubic-bezier(.5,0,.3,1),top .55s cubic-bezier(.5,0,.3,1),transform .4s,opacity .3s}
.fc b{position:absolute;right:-8px;top:-9px;background:#2f9a48;color:#fff;font-size:11px;border-radius:9px;padding:0 4px;border:1px solid #fff}
.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.2)}}
/* ---- 盤 ---- */
.hl{animation:pulse .8s infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
/* ---- 小窓 ---- */
#modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:12px;z-index:50}
#modal .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;max-width:440px;width:100%;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
#modal h2{margin:0;font-size:20px;text-align:center}
#modal .g4{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
#modal .g4 button{padding:6px 1px;font-size:12px;line-height:1.2;min-width:0}
#modal .g4 .ic{font-size:22px;display:block}
.rules{font-size:14px;line-height:1.7}
/* 交換のよびかけ（右はし）: もらう +1 / 出す −1 のカードと ✕ ✓ */
#offerBox{position:absolute;right:0;top:50%;transform:translateY(-50%);min-width:170px;padding:10px 10px 10px 26px;background:linear-gradient(90deg,#0000,#000b 22%);display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:6;animation:slide .25s}
@keyframes slide{from{opacity:0;margin-right:-40px}to{opacity:1;margin-right:0}}
#offerBox .ot{font-size:14px;font-weight:700;color:#fff;border-bottom:1px solid #fff5;padding-bottom:4px;display:flex;align-items:center;gap:5px;white-space:nowrap}
#offerBox .orow{display:flex;align-items:center;gap:6px}
#offerBox .orow.sm{font-size:14px}
.n{font-size:24px;font-weight:800;text-shadow:0 1px 3px #000}.n.p{color:#5ee07a}.n.m{color:#ff6b6b}
.ocard{display:inline-grid;place-items:center;width:34px;height:46px;border-radius:6px;border:3px solid var(--rc);background:linear-gradient(#fffaf0,#ecdcbc);font-size:20px;box-shadow:0 2px 4px #0008}
#offerBox .ob{display:flex;gap:8px;margin-top:2px}
#offerBox .ob button{width:52px;height:46px;min-height:0;font-size:24px;padding:0;border-radius:10px;color:#fff}
[data-o="no"]{background:linear-gradient(#e0533f,#b02f22)!important}
[data-o="ok"]{background:linear-gradient(#4cc35f,#2a8a3c)!important}
#offerBox [data-o="open"]{width:auto;padding:0 14px;font-size:14px}
/* 交換の画面（下のまん中）: 上の列 = ほしい / 下の列 = 出す（自分の手札の数つき） */
#tradeBox{position:absolute;left:48px;right:240px;bottom:3px;max-width:600px;margin:0 auto;background:linear-gradient(#2a3442,#1b222c);border:3px solid #c9a06a;border-radius:12px;padding:18px 8px 6px;z-index:7;box-shadow:0 6px 20px #000c}
#tradeBox .tt{position:absolute;top:-15px;left:50%;transform:translateX(-50%);background:linear-gradient(#4a5568,#2d3748);border:2px solid #c9a06a;border-radius:6px;padding:2px 22px;font-weight:800;font-size:15px;white-space:nowrap}
#tradeBox .th{font-size:11px;color:#cbd5e1;text-align:center;font-style:italic;margin-bottom:3px}
#tradeBox .trow{display:flex;align-items:center;gap:5px;padding:4px 0;border-top:1px solid #fff1}
#tradeBox .who{width:46px;flex:none;text-align:center;font-size:10px;line-height:1.2;color:#e2e8f0}
#tradeBox .who .av{width:36px;height:36px;margin:0 auto 1px;border-radius:7px;display:grid;place-items:center;font-size:20px;border:2px solid #c9a06a}
.tc{flex:1;min-width:0;height:58px;min-height:0;padding:0;border-radius:7px;border:3px solid var(--rc);border-bottom-width:3px;background:linear-gradient(#fffaf0,#e8d6b0);position:relative;font-size:24px;color:#2a170b;box-shadow:0 2px 4px #0008;transition:transform .1s}
.tc.dim{opacity:.45}
.tc.on{background:linear-gradient(#fffaf0,#e8d6b0);transform:translateY(-3px);box-shadow:0 0 0 2px #ffd54a,0 4px 8px #000a}
.tc .hc{position:absolute;left:3px;bottom:2px;font-size:12px;font-weight:800;background:#000a;color:#fff;border-radius:5px;padding:0 4px;line-height:1.3}
.tc .rt{position:absolute;left:2px;top:1px;font-size:9px;font-weight:800;color:#b45309}
.tc .sel{position:absolute;right:-6px;top:-8px;min-width:22px;background:#2f9a48;color:#fff;font-size:13px;font-weight:800;border-radius:11px;padding:0 5px;border:2px solid #fff;line-height:18px}
#tradeBox .tbar{display:flex;align-items:center;gap:7px;margin-top:5px}
#tradeBox .sp{flex:1}
#tradeBox .pc{width:30px;height:30px;min-height:0;padding:0;border-radius:50%;border:3px solid #fff;background:var(--pc)}
#tradeBox .pc.off{opacity:.3;border-color:#fff4}
#tradeBox .tab{width:40px;height:38px;min-height:0;padding:0;font-size:19px;border-radius:8px;background:#334155}
#tradeBox .tab.on{background:linear-gradient(#4cc35f,#2a8a3c)}
#tradeBox .tab.bk.on{background:linear-gradient(#f3b84f,#c9822a)}
#tradeBox .tx{width:46px;height:38px;min-height:0;padding:0;font-size:20px;border-radius:8px;color:#fff;background:#475569}
#tradeBox .tx.no{background:linear-gradient(#e0533f,#b02f22)}
#tradeBox .tx.ok{background:linear-gradient(#4cc35f,#2a8a3c)}
#tradeBox .tsum{display:flex;align-items:center;justify-content:center;gap:4px;margin:2px 0 4px}
#tradeBox .tsum>span{font-size:22px;margin:0 8px;color:#cbd5e1}
#tradeBox .tsum b{font-size:15px}#tradeBox .tsum b.m{color:#ff6b6b}#tradeBox .tsum b.p{color:#5ee07a}
#tradeBox .tst{display:flex;align-items:center;gap:8px;padding:4px 8px;background:#0003;border-radius:8px;margin-top:4px;font-size:13px}
#tradeBox .tst span{flex:1;color:#cbd5e1}
#tradeBox .tst button{min-height:0;height:34px;padding:0 14px;font-size:13px;background:linear-gradient(#4cc35f,#2a8a3c)}
/* 7 のときの「だれからもらう？」 */
.stealRow{display:flex;gap:10px;justify-content:center}
.stb{flex:1;max-width:150px;min-height:76px;background:var(--pc)!important;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid #fff9;color:#fff;text-shadow:0 1px 3px #000}
.stb small{font-weight:400}
.tline{font-size:26px;text-align:center;line-height:1.5}
.tline span{font-size:14px;color:var(--sub);margin:0 6px}
#modal .g4 small{color:var(--sub);font-weight:400}
.rules b{color:var(--acc)}
.cl{display:flex;align-items:center;gap:8px;background:var(--deep);border-radius:12px;padding:8px}
.cl .ci{font-size:26px}
.cl .cd{flex:1;font-size:13px;line-height:1.4}
.cl .cd b{font-size:15px}
.cl button{flex:none}
.rank{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:var(--deep);font-size:16px}
.rank.win{background:#5a4512}
#toast{position:fixed;left:50%;top:40%;transform:translateX(-50%);background:rgba(0,0,0,.85);padding:10px 18px;border-radius:12px;font-size:15px;transition:opacity .3s;opacity:0;pointer-events:none;z-index:60;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="menu" class="scr hidden"></div>
<div id="lobby" class="scr hidden"></div>
<div id="stage">
<div id="game" class="hidden">
  <div id="top"><div id="pls"></div></div>
  <div id="boardWrap"><svg id="board" xmlns="http://www.w3.org/2000/svg"></svg><div id="bigDice"></div></div>
  <div id="ban"></div>
  <div id="side"><button data-g="menu" aria-label="メニュー">≡</button><button data-g="rules" aria-label="あそびかた">📖</button><button data-g="log" aria-label="できごと">📜</button><button data-g="cards" aria-label="ふしぎカード">🃏<span class="bd hidden" id="cardBd"></span></button></div>
  <div id="log"></div>
  <div id="hand"></div>
  <div id="corner"><div id="dice"></div><div id="acts"></div></div>
  <div id="offerBox" class="hidden"></div>
  <div id="tradeBox" class="hidden"></div>
  <div id="turnPop" class="hidden"></div>
  <div id="fx"></div>
</div>
<div id="modal" class="hidden"><div class="box"></div></div>
<div id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="../party-beacon.js?v=5"></script>
<script>
"use strict";
// ================= カイタク島（2026-11-09 作成） =================
// ・盤は毎回ランダム（土地の種類・数字・港の場所）。土地の形（六角形 19 まい）はいつも同じ。
// ・資源は 5 種類（木材・レンガ・羊毛・小麦・鉄）。2026-11-11 に 4 種類から 5 種類へ。7 が出るとカラスが来る。先に 8 点で勝ち。
// ・通信はホストが正しい状態（G）を持ち、ゲストは「やりたいこと」を送るだけ。CPU もホストが動かす。
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

const TARGET = 8;   // 勝ちの点数
const RES = ["wood", "brick", "sheep", "wheat", "ore"];

  else if (x === "close") ui.trade = false;
  else if (x === "ok") { if (bank) { act({ k: "trade", give: ui.give, get: ui.get }); ui.give = ui.get = null; } else act({ k: "offer", give: cleanAmt(ui.pg), get: cleanAmt(ui.pw), to: ui.to.slice() }); }
  else if (x === "accept") { act({ k: "accept", p: +b.dataset.p }); ui.trade = false; ui.pg = {}; ui.pw = {}; }
  else if (x === "cancel") act({ k: "cancel" });
  render();
});
// 画面のボタン（左はしのアイコン・手札・右下）
$("game").addEventListener("click", e => {
  const b = e.target.closest("[data-g]"); if (!b || b.disabled || !G) return;
  const g = b.dataset.g;
  if (g === "roll") act({ k: "roll" });
  else if (g === "end") { ui.mode = null; ui.trade = false; act({ k: "end" }); }
  else if (g === "nofree") act({ k: "nofree" });
  else if (g === "undo") { ui.mode = null; act({ k: "undo" }); }
  else if (g === "trade") { if (ui.trade) ui.trade = false; else { ui.mode = null; openTrade(); } render(); }
  else if (g === "cards") openModal("cards");
  else if (g === "menu" || g === "rules" || g === "log") openModal(g);
  else if (g === "leave") leave();
  else if (g === "result") openModal("over");
  else if (g.startsWith("b-")) {
    const w = g.slice(2); ui.trade = false;
    if (w === "card") { act({ k: "build", w: "card" }); return; }
    ui.mode = ui.mode === w ? null : w; render();
  }
});
$("offerBox").addEventListener("click", e => {
  const b = e.target.closest("[data-o]"); if (!b || !G) return;
  const k = b.dataset.o, o = G.offer;
  if (k === "open") { openTrade(); render(); return; }
  if (o) act({ k: "respond", id: o.id, ok: k === "ok" });
});
// ---------------- 小窓 ----------------
function openModal(k) { ui.modal = k; ui.picks = []; renderModal(); }
function renderModal() {
  const box = document.querySelector("#modal .box"), k = ui.modal;
  $("modal").classList.toggle("hidden", !k);
  if (!k) return;
  const s = mySeat(), me = G && s >= 0 ? G.ps[s] : null, myTurn = G && s >= 0 && G.cur === s;
  let h = "";
  if (k === "rules") h = `<h2>あそびかた</h2>${RULES_HTML}<button data-m="close">とじる</button>`;
  else if (k === "menu") h = `<h2>メニュー</h2><button data-m="rules">あそびかた</button><button data-m="log">これまでのできごと</button>
      <button data-m="quit">${PARTY ? "ゲーム一覧へ" : mode === "local" ? "やめてメニューへ" : "部屋をぬける"}</button><button data-m="close">とじる</button>`;
  else if (k === "log") h = `<h2>できごと</h2><div class="note" style="max-height:50vh;overflow-y:auto">${G.log.slice().reverse().map(l => `<div>${esc(l)}</div>`).join("")}</div><button data-m="close">とじる</button>`;
  else if (k === "steal") {
    if (!G || G.phase !== "steal") { ui.modal = null; $("modal").classList.add("hidden"); return; }
    h = `<h2>だれから1まいもらう？</h2><div class="stealRow">${G.victims.map(i => `<button class="stb" data-m="steal" data-p="${i}" style="--pc:${COLS[i]}"><b>${esc(G.ps[i].name)}</b><small>${tot(G.ps[i].hand)}まい</small></button>`).join("")}</div>`;
  } else if (k === "cards") {
    if (!me) { ui.modal = null; $("modal").classList.add("hidden"); return; }
    const canUse = c => myTurn && !G.cardUsed && (G.phase === "main" || (G.phase === "roll" && c !== "bridge"));
    const cnt = {}; me.cards.forEach(c => { cnt[c] = (cnt[c] || 0) + 1; });
    h = `<h2>🃏 ふしぎカード</h2>` + (Object.keys(cnt).length ? Object.entries(cnt).map(([c, n]) => `<div class="cl"><span class="ci">${CARD[c].ic}</span><div class="cd"><b>${CARD[c].name}</b> ×${n}<br>${CARD[c].txt}</div><button data-m="use" data-c="${c}" ${canUse(c) ? "" : "disabled"}>つかう</button></div>`).join("") : `<div class="note">使えるカードはありません</div>`)
      + (me.newC.length ? `<div class="note">買ったばかり（つぎの番から使える）: ${me.newC.map(c => CARD[c].ic + CARD[c].name).join("、")}</div>` : "")
      + (me.vpC ? `<div class="note">🗺️ 宝の地図: ${me.vpC}まい（+${me.vpC}点）</div>` : "")
      + `<div class="note">カードは ${costHtml(COST.card)} で買える。1番に1まいだけ使える。</div><button data-m="close">とじる</button>`;
  } else if (k === "harvest") {
    h = `<h2>🧺 大豊作</h2><div class="note">好きな資源を2まいえらぼう（同じのを2回でもOK）</div>
      <div class="g4">${RES.map(r => `<button data-m="pick" data-r="${r}" ${ui.picks.length >= 2 ? "disabled" : ""}><span class="ic">${RI[r]}</span>${RN[r]}</button>`).join("")}</div>
      <div style="text-align:center;font-size:28px;min-height:36px">${ui.picks.map(r => RI[r]).join(" ")}</div>
      <button class="main" data-m="doharvest" ${ui.picks.length === 2 ? "" : "disabled"}>もらう</button><button data-m="repick">えらびなおす</button><button data-m="close">やめる</button>`;
  } else if (k === "over") {
    const order = G.ps.map((p, i) => i).sort((a, b) => (b === G.winner) - (a === G.winner) || vp(b) - vp(a));
    h = `<h2>🏆 ${esc(G.ps[G.winner].name)} の勝ち！</h2>` + order.map(i => `<div class="rank ${i === G.winner ? "win" : ""}"><i class="dot" style="background:${COLS[i]}"></i><span style="flex:1">${esc(G.ps[i].name)}${i === s ? "（あなた）" : ""}</span><b>${vp(i)}点</b></div>`).join("")
      + `<div class="note" style="text-align:center">${G.turnN}ターン</div>`
      + (mode === "local" ? `<button class="main" data-m="again">もう一度</button><button data-m="tomenu">メニューへ</button>`
        : mode === "host" ? `<button class="main" data-m="lobby">部屋にもどる</button><button data-m="close">盤を見る</button>`
          : `<div class="note" style="text-align:center">ホストが部屋にもどるのを待っています…</div><button data-m="close">盤を見る</button><button data-m="quit">${PARTY ? "ゲーム一覧へ" : "ぬける"}</button>`);
  }
  box.innerHTML = h;
}
$("modal").addEventListener("click", e => {
  if (e.target.id === "modal" && ui.modal !== "harvest" && ui.modal !== "steal") { ui.modal = null; renderModal(); return; }
  const b = e.target.closest("[data-m]"); if (!b || b.disabled) return;
  const m = b.dataset.m;
  if (m === "close") { ui.modal = null; renderModal(); if (G) render(); return; }
  if (m === "rules" || m === "log") { ui.modal = m; renderModal(); return; }
  if (m === "quit") { ui.modal = null; renderModal(); if (PARTY || mode === "local" || confirm("部屋をぬけますか？")) leave(); return; }
  if (m === "steal") { ui.modal = null; act({ k: "steal", p: +b.dataset.p }); renderModal(); return; }
  if (m === "use") {
    const c = b.dataset.c;
    if (c === "harvest") { ui.modal = "harvest"; ui.picks = []; renderModal(); return; }
    ui.modal = null; act({ k: "play", c }); renderModal(); return;
  }
  if (m === "pick") { if (ui.picks.length < 2) ui.picks.push(b.dataset.r); renderModal(); return; }
  if (m === "repick") { ui.picks = []; renderModal(); return; }
  if (m === "doharvest") { const r = ui.picks.slice(); ui.modal = null; act({ k: "play", c: "harvest", r }); renderModal(); return; }
  if (m === "again") { ui.modal = null; const seats = G.ps.map(p => ({ pid: p.pid, name: p.name, bot: p.bot, diff: p.diff })); startGame(shuffle(seats)); return; }
  if (m === "tomenu") { ui.modal = null; leave(); return; }
  if (m === "lobby") { hostBackToLobby(); return; }
});

// ================= はじまり =================
renderUI();
if (PARTY) {
  if (isOffline()) { errMsg = "オフラインのためパーティに入れません。CPUと対戦で遊べます"; renderUI(); }
  else if (PARTY.role === "host") startHost(); else joinRoom(PARTY.code);
}
// 電波が切れた・もどったら、メニューを出し直す（オフラインなら部屋のボタンを隠す）
for (const ev of ["online", "offline"]) addEventListener(ev, () => { if (screen === "menu") { renderMenu(); keepName(); } });
try { if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) navigator.serviceWorker.register("../sw.js").catch(() => {}); } catch (e) {}

// テスト用: CPU だけの試合を早送りできる
window.__dbg = {
  get G() { return G; }, set G(g) { G = g; }, get mode() { return mode; }, get screen() { return screen; }, get ui() { return ui; }, host, GEO,
  applyAct, cpuAction, cpuStep, cpuRespond, vp, longest, ratio, validVils, validRoads, newGame, render, renderUI, isOffline, mySeat, doAct, act,
  set fast(v) { FAST = !!v; }, get fast() { return FAST; },
  // CPU だけの試合をはじめる（見るだけ）
  cpuOnly(n = 4, diff = "norm") { clearTimeout(cpuTimer); mode = "local"; myPid = -99; startGame([...Array(n)].map((_, i) => ({ name: "CPU-" + "ABCD"[i], bot: true, diff: Array.isArray(diff) ? diff[i] : diff }))); },
  // CPU の番を、人間の番になるか終わるまで（または max 手）一気に進める
  ff(max = 20000) {
    let k = 0;
    while (G && G.phase !== "over" && G.ps[G.cur].bot && k++ < max) { cpuStep(); G.ver++; checkWin(); }
    afterChange(); return { steps: k, phase: G && G.phase, winner: G && G.winner, turn: G && G.turnN, vp: G && G.ps.map((p, i) => vp(i)) };
  },
};
</script>

<style>
  :root { --bg:#10131b; --panel:rgba(20,24,34,.94); --line:#2f3646; --text:#e8ebf2; --sub:#9aa3b5; --accent:#f0b25a; --blue:#4fa3ff; --red:#ff5a5a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; overflow:hidden; overscroll-behavior:none; }

  #hud { position:fixed; left:0; right:0; top:calc(6px + env(safe-area-inset-top)); display:flex; justify-content:center; pointer-events:none; }

  #shot { position:fixed; right:calc(16px + env(safe-area-inset-right)); bottom:14px; font-size:14px; font-weight:800; pointer-events:none; text-shadow:0 2px 6px rgba(0,0,0,.7); opacity:0; transition:opacity .3s; }
  #hint { position:fixed; left:0; right:0; bottom:12px; text-align:center; font-size:14px; color:#fff; pointer-events:none; text-shadow:0 2px 6px rgba(0,0,0,.8); }
  #pause { position:fixed; left:calc(10px + env(safe-area-inset-left)); top:calc(8px + env(safe-area-inset-top)); width:44px; height:44px; border-radius:12px; border:0; background:rgba(10,12,18,.7); color:#fff; font-size:20px; font-weight:900; }

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script type="module">
// ゆび卓球（2026-11-18 作成）: 3D の卓球。CPU と対戦。横画面専用。
// 左の指＝体の移動（スティック方式／ダイレクト方式＝指を動かした分だけ体も動く）、右の指＝スワイプでラケットを振る。
// 単位はメートル・秒。台の中心が原点、台の長さ方向が z（手前＝自分＝+z、奥＝CPU＝-z）。
import * as THREE from "three";
const $ = id => document.getElementById(id);
const Sfx = window.YkgSfx || new Proxy({}, { get: () => () => {} });

// ===== 台とボール =====
const TL = 2.74, TW = 1.525, TH = 0.76, NETH = 0.1525, R = 0.02, G = 9.8;
const HL = TL / 2, HW = TW / 2;
const KM = 0.0045;   // 回転で曲がる強さ（マグヌス効果）
const KD = 0.11;     // 空気の抵抗
const TS = 0.72;     // ゲームの時間の速さ（本物より少しゆっくり）
const SUB = 1 / 240;
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const UP = V(0, 1, 0);
const _a = V(), _t = V();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const sideOf = z => z > 0 ? 0 : 1;   // 0 = 自分の台, 1 = CPU の台

function integrate(b, h) {
  const s = b.v.length();
  _a.set(0, -G, 0);
  _t.copy(b.w).cross(b.v).multiplyScalar(KM); _a.add(_t);
  _a.addScaledVector(b.v, -KD * s);
  b.v.addScaledVector(_a, h); b.p.addScaledVector(b.v, h);
  b.w.multiplyScalar(1 - 0.25 * h);
}
function tableBounce(b) {
  b.v.y = -b.v.y * 0.88;
  // 回転と台の摩擦: 前回転は前に伸び、下回転は止まる
  const sx = b.v.x + R * b.w.z, sz = b.v.z - R * b.w.x;
  b.v.x -= 0.3 * sx; b.v.z -= 0.3 * sz;
  b.w.x *= 0.55; b.w.z *= 0.55;
}
// 1 ステップ進める。ev(type, side) で「台・ネット・床」に当たったことを知らせる
function stepBall(b, h, ev, net = true) {
  const py = b.p.y, pz = b.p.z;
  integrate(b, h);
  if (net && (pz > 0) !== (b.p.z > 0) && Math.abs(b.p.x) < HW + 0.15 && b.p.y < TH + NETH + R && b.p.y > TH - 0.03) {
    b.p.z = pz > 0 ? R * 1.05 : -R * 1.05;
    b.v.z *= -0.12; b.v.x *= 0.5; b.v.y *= 0.3; b.w.multiplyScalar(0.3);
    if (ev) ev("net", sideOf(pz));
  }
  if (b.v.y < 0 && b.p.y <= TH + R && py > TH + R - 0.05 && Math.abs(b.p.x) <= HW + R && Math.abs(b.p.z) <= HL + R) {
    b.p.y = TH + R; tableBounce(b);
    if (ev) ev("table", sideOf(b.p.z));
  }
  if (b.v.y < 0 && b.p.y <= R) {
    b.p.y = R; b.v.y *= -0.7; b.v.x *= 0.75; b.v.z *= 0.75; b.w.multiplyScalar(0.5);
    if (ev) ev("floor", sideOf(b.p.z));
  }
}
const copyBall = b => ({ p: b.p.clone(), v: b.v.clone(), w: b.w.clone() });

// 回転のベクトルを作る。top: 前回転(+)/下回転(-) [rad/s]、side: 打った人から見て右に曲がる(+)
function makeSpin(dir, top, side) {
  const d = V(dir.x, 0, dir.z).normalize();
  return V().crossVectors(UP, d).multiplyScalar(top).addScaledVector(UP, -side);
}
// 台の高さを下向きに通る点（bounces 回目までは台ではねさせる。サーブは 1）
function flightSim(p0, v, w, bounces) {
  const b = { p: p0.clone(), v: v.clone(), w: w.clone() };
  let t = 0, n = 0;
  while (t < 3) {
    const py = b.p.y; integrate(b, SUB); t += SUB;
    if (b.v.y < 0 && py > TH + R && b.p.y <= TH + R) {
      if (n < bounces) { n++; b.p.y = TH + R; tableBounce(b); }
      else return { x: b.p.x, z: b.p.z, t };
    }
  }
  return { x: b.p.x, z: b.p.z, t };
}
// 打つ位置 p0 から、台の上の (tx, tz) に、だいたい T 秒で落ちる初速を求める
function solveShot(p0, tx, tz, T, w, serve) {
  const v = serve
    ? V((tx - p0.x) / T, -0.8, (tz - p0.z) / T)
    : V((tx - p0.x) / T, (TH + R - p0.y + 0.5 * G * T * T) / T, (tz - p0.z) / T);
  for (let i = 0; i < 7; i++) {
    const r = flightSim(p0, v, w, serve ? 1 : 0);
    v.x += (tx - r.x) / T * 0.9; v.z += (tz - r.z) / T * 0.9;
    if (!serve) v.y += (T - r.t) * G * 0.45;
  }
  return v;
}
// 打った球がどこで終わるか（ネット・アウトの判定に使う）
function shotOutcome(p0, v, w, serve) {
  const b = { p: p0.clone(), v: v.clone(), w: w.clone() }, from = sideOf(-v.z) === 0 ? 0 : 1;
  // from: 打った人の側（v.z < 0 なら自分 = 0）
  const hitter = v.z < 0 ? 0 : 1;
  let res = null, n = 0, t = 0;
  const ev = (type, side) => {
    if (res) return;
    if (type === "net") return;
    if (type === "floor") { res = "out"; return; }
    n++;
    if (serve && n === 1) { if (side !== hitter) res = "fault"; return; }
    res = side !== hitter ? "in" : "fault";
  };
  while (!res && t < 3) { stepBall(b, SUB, ev); t += SUB; }
  return res || "out";
}

// ===== 設定 =====
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const cfg = Object.assign({ move: "stick", cpu: "1", games: "1" }, (() => { try { return JSON.parse(store.get("pp-cfg") || "{}"); } catch (e) { return {}; } })());
const MOVE_DESC = {
  stick: "左の指をおいた所がスティックの中心。倒した方向に走る",
  direct: "左の指を動かした分だけ、体もそのまま同じように動く",
};
function refreshSeg() {
  document.querySelectorAll(".seg[data-k]").forEach(s => s.querySelectorAll("button").forEach(b => b.classList.toggle("on", cfg[s.dataset.k] === b.dataset.v)));
  $("moveDesc").textContent = MOVE_DESC[cfg.move];
}
document.querySelectorAll(".seg[data-k]").forEach(s => s.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  cfg[s.dataset.k] = b.dataset.v; store.set("pp-cfg", JSON.stringify(cfg)); refreshSeg();
  moveP.id = null;
}));
refreshSeg();
if (window.YkgSfx) {
  $("titleBtns").appendChild(YkgSfx.toggleButton(""));
  $("menuSnd").appendChild(YkgSfx.toggleButton(""));
}

// ===== 3D の場面 =====
const renderer = new THREE.WebGLRenderer({ canvas: $("c"), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2033);
scene.fog = new THREE.Fog(0x1a2033, 9, 22);
const camera = new THREE.PerspectiveCamera(48, 2, 0.05, 60);

scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x3a2a26, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(2.5, 7, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 5, bottom: -5, near: 1, far: 16 });
scene.add(sun);

const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.75 });
// 床（試合場の赤いマットと、まわりの暗い床）
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), mat(0x232a3d));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const court = new THREE.Mesh(new THREE.PlaneGeometry(7, 12), mat(0x9a3b2f));
court.rotation.x = -Math.PI / 2; court.position.y = 0.002; court.receiveShadow = true; scene.add(court);
// フェンス
for (const [x, z, w, d] of [[0, -6, 7, 0.05], [0, 6, 7, 0.05], [-3.5, 0, 0.05, 12], [3.5, 0, 0.05, 12]]) {
  const f = new THREE.Mesh(new THREE.BoxGeometry(w, 0.7, d), mat(0x1b3f7a)); f.position.set(x, 0.35, z); scene.add(f);
}
// 台
const top = new THREE.Mesh(new THREE.BoxGeometry(TW, 0.03, TL), mat(0x1f5fae));
top.position.y = TH - 0.015; top.castShadow = true; top.receiveShadow = true; scene.add(top);
const white = new THREE.MeshBasicMaterial({ color: 0xffffff });
const line = (w, d, x, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.002, d), white); m.position.set(x, TH + 0.001, z); scene.add(m); };
line(0.02, TL, -HW + 0.01, 0); line(0.02, TL, HW - 0.01, 0); line(TW, 0.02, 0, -HL + 0.01); line(TW, 0.02, 0, HL - 0.01); line(0.004, TL, 0, 0);
for (const [x, z] of [[-0.6, -1.1], [0.6, -1.1], [-0.6, 1.1], [0.6, 1.1]]) {
  const l = new THREE.Mesh(new THREE.BoxGeometry(0.06, TH - 0.03, 0.06), mat(0x222222)); l.position.set(x, (TH - 0.03) / 2, z); l.castShadow = true; scene.add(l);
}
const net = new THREE.Mesh(new THREE.BoxGeometry(TW + 0.3, NETH, 0.006), new THREE.MeshStandardMaterial({ color: 0x111418, transparent: true, opacity: 0.55 }));
net.position.set(0, TH + NETH / 2, 0); scene.add(net);
const tape = new THREE.Mesh(new THREE.BoxGeometry(TW + 0.3, 0.012, 0.01), white); tape.position.set(0, TH + NETH, 0); scene.add(tape);
for (const s of [-1, 1]) { const p = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, NETH + 0.02), mat(0x333333)); p.position.set(s * (HW + 0.15), TH + NETH / 2, 0); scene.add(p); }

// ボール（見やすいように少し大きく描く）と影
const ballMesh = new THREE.Mesh(new THREE.SphereGeometry(R * 1.5, 16, 12), new THREE.MeshStandardMaterial({ color: 0xfff4e0, emissive: 0x332a10, roughness: 0.4 }));
scene.add(ballMesh);
const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.45, depthWrite: false });
const ballShadow = new THREE.Mesh(new THREE.CircleGeometry(R * 1.6, 16), shadowMat);
ballShadow.rotation.x = -Math.PI / 2; scene.add(ballShadow);
// ボールの軌跡
const TRAIL = 14;
const trailGeo = new THREE.BufferGeometry(); trailGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(TRAIL * 3), 3));
const trail = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({ color: 0xffe8a0, transparent: true, opacity: 0.45 }));
trail.frustumCulled = false; scene.add(trail);
const trailPts = [];

// 選手
function makeChar(shirt) {
  const g = new THREE.Group();
  const skin = mat(0xf1c7a3), dark = mat(0x22252e), sh = mat(shirt);
  const add = (m, x, y, z) => { m.position.set(x, y, z); m.castShadow = true; g.add(m); return m; };
  const legs = [add(new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.055, 0.78), dark), -0.1, 0.39, 0), add(new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.055, 0.78), dark), 0.1, 0.39, 0)];
  add(new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.2, 0.2), dark), 0, 0.82, 0);
  const torso = add(new THREE.Mesh(new THREE.CapsuleGeometry(0.17, 0.32, 4, 10), sh), 0, 1.16, 0);
  const head = add(new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 12), skin), 0, 1.58, 0);
  add(new THREE.Mesh(new THREE.SphereGeometry(0.125, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), mat(0x2a1c14)), 0, 1.6, 0.01);
  const lArm = add(new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.035, 0.5), sh), -0.24, 1.12, -0.06);
  lArm.rotation.set(-0.5, 0, 0.25);
  // 右腕は肩からラケットまで毎回のばす（+z 方向に長さ 1 の棒）
  const armGeo = new THREE.CylinderGeometry(0.04, 0.035, 1); armGeo.rotateX(Math.PI / 2); armGeo.translate(0, 0, 0.5);
  const arm = add(new THREE.Mesh(armGeo, sh), 0.22, 1.32, 0);
  const racket = new THREE.Group();
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.1), mat(0x8a5a2b)); handle.position.y = -0.1; racket.add(handle);
  const blade = new THREE.Mesh(new THREE.CylinderGeometry(0.078, 0.078, 0.012, 24), [mat(0x6b4a2a), mat(0xd42a2a), mat(0x111111)]);
  blade.rotation.x = Math.PI / 2; racket.add(blade);
  racket.traverse(o => { o.castShadow = true; });
  g.add(racket);

const moveP = { id: null, sx: 0, sy: 0, x: 0, y: 0, bx: 0, bz: 0 };

const keys = {};

  if (st.phase === "title" || st.paused) return;
  e.preventDefault();
  if (e.clientX < W * 0.45) {
    if (moveP.id !== null) return;
    Object.assign(moveP, { id: e.pointerId, sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY, bx: P.pos.x, bz: P.pos.z });

function fireSwipe(now) {
  const pts = swP.pts, f = pts[0], l = pts[pts.length - 1];
  const dx = l.x - f.x, dy = l.y - f.y, L = Math.hypot(dx, dy) || 1;
  const dur = Math.max(16, l.t - f.t);
  const speed = L / dur * 1000 / H;   // 1 秒に画面の高さ何個ぶん
  let px = -dy / L, py = dx / L; if (px < 0) { px = -px; py = -py; }   // 画面の右寄りを向いた横方向
  let dev = 0;
  for (const p of pts) { const d = (p.x - f.x) * px + (p.y - f.y) * py; if (Math.abs(d) > Math.abs(dev)) dev = d; }
  const params = { dx, dy, sn: clamp((speed - 1.0) / 4.0, 0, 1.15), curve: clamp(dev / L * 4, -1, 1) };
  swP.cool = now + 230; swP.pts = [];
  playerSwing(params);
}
addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; if (e.key === "Escape" && st.phase !== "title") togglePause(); });
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

function updatePlayer(dt) {
  const prev = P.pos.clone();
  if (moveP.id !== null && cfg.move === "direct") {
    const k = DIRECT_K();
    P.pos.x = moveP.bx + (moveP.x - moveP.sx) * k;
    P.pos.z = moveP.bz + (moveP.y - moveP.sy) * k;
  } else {
    let ix = 0, iz = 0;
    if (moveP.id !== null) {
      const R0 = Math.min(70, H * 0.14);
      ix = clamp((moveP.x - moveP.sx) / R0, -1, 1); iz = clamp((moveP.y - moveP.sy) / R0, -1, 1);
      const m = Math.hypot(ix, iz); if (m > 1) { ix /= m; iz /= m; }
    }
    if (keys.a || keys.arrowleft) ix -= 1; if (keys.d || keys.arrowright) ix += 1;
    if (keys.w || keys.arrowup) iz -= 1; if (keys.s || keys.arrowdown) iz += 1;
    P.pos.x += ix * 3.2 * dt; P.pos.z += iz * 3.2 * dt;
  }
  P.pos.x = clamp(P.pos.x, -1.9, 1.9); P.pos.z = clamp(P.pos.z, HL + 0.25, HL + 2.4);
  // ダイレクトで端にぶつかったら、指の基準をずらして「指と体が同じ動き」を保つ
  if (moveP.id !== null && cfg.move === "direct") {
    const k = DIRECT_K();
    moveP.bx = P.pos.x - (moveP.x - moveP.sx) * k; moveP.bz = P.pos.z - (moveP.y - moveP.sy) * k;
  }
  P.vel.subVectors(P.pos, prev).divideScalar(Math.max(dt, 1e-4));
  P.hand = playerZone().fh ? 1 : -1;
  // 右の指の位置でラケットが少し動く（振る前の構え）
  if (swP.id !== null) P.fing.set(clamp((swP.x - swP.sx) * 0.0016, -0.2, 0.2), clamp(-(swP.y - swP.sy) * 0.0012, -0.15, 0.2), clamp((swP.y - swP.sy) * 0.0012, -0.15, 0.15));
  else P.fing.multiplyScalar(0.8);
  P.swingT += dt;
  // 振っている間にボールが来たら当たる
  if (!swing.used) {
    swing.t += dt;
    if (swing.t > 0.26) swing.used = true;
    else if (tryPlayerHit()) swing.used = true;
  }
}

// ===== メインループ =====
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min(0.05, (now - last) / 1000); last = now;
  const dt = rdt * TS;
  if (!st.paused && st.phase !== "title" && st.phase !== "over") update(dt, rdt);
  render(rdt);
}
function update(dt, rdt) {
  updatePlayer(dt);
  updateCpu(dt);
  if (st.phase === "serve") {
    st.serveT += dt;
    ball.p.copy(serveBallPos(st.server));
  } else {
    let t = dt;
    while (t > 1e-6) { const h = Math.min(SUB, t); t -= h; stepBall(ball, h, onBallEvent); }
    if (st.phase === "rally") {
      st.rallyT += dt;
      // 止まった・遠くへ行った
      if (st.rallyT > 5 || Math.abs(ball.p.z) > 7 || Math.abs(ball.p.x) > 5) {
        const h = st.hitter;
        point(st.bounced && st.serveStage !== 1 ? h : 1 - h, st.bounced ? "" : "アウト");
      }
    }
    if (st.phase === "dead") { st.deadT += rdt; if (st.deadT > 1.4) afterDead(); }
  }
}
const camPos = V(0, 1.9, HL + 2.6), camLook = V(0, 0.8, -0.8);
function render(rdt) {
  poseChar(P, rdt); poseChar(C, rdt);
  ballMesh.position.copy(ball.p);
  const overTable = Math.abs(ball.p.x) <= HW && Math.abs(ball.p.z) <= HL && ball.p.y >= TH;
  ballShadow.position.set(ball.p.x, overTable ? TH + 0.002 : 0.003, ball.p.z);
  ballShadow.material.opacity = 0.45 * clamp(1 - (ball.p.y - (overTable ? TH : 0)) * 0.6, 0.15, 1);
  // 軌跡
  if (st.phase === "rally" || st.phase === "dead") { trailPts.push(ball.p.clone()); if (trailPts.length > TRAIL) trailPts.shift(); }
  else trailPts.length = 0;
  const arr = trailGeo.attributes.position.array;
  for (let i = 0; i < TRAIL; i++) { const p = trailPts[Math.max(0, trailPts.length - 1 - i)] || ball.p; arr[i * 3] = p.x; arr[i * 3 + 1] = p.y; arr[i * 3 + 2] = p.z; }
  trailGeo.attributes.position.needsUpdate = true;
  // カメラ: 自分の後ろから
  const tp = st.phase === "title" ? V(2.6, 2.2, HL + 2.6) : V(P.pos.x * 0.5 + 0.25, 2.5, P.pos.z + 1.7);
  const tl = st.phase === "title" ? V(0, TH, 0) : V(P.pos.x * 0.2, 0.55, -0.85);
  const k = 1 - Math.pow(0.002, rdt);
  camPos.lerp(tp, k); camLook.lerp(tl, k);
  camera.position.copy(camPos); camera.lookAt(camLook);
  renderer.render(scene, camera);
  drawOverlay();
}
function drawOverlay() {
  octx.clearRect(0, 0, W, H);
  if (st.phase === "title" || st.phase === "over") return;
  // 左の指
  if (moveP.id !== null) {
    if (cfg.move === "stick") {
      const R0 = Math.min(70, H * 0.14);
      let dx = moveP.x - moveP.sx, dy = moveP.y - moveP.sy; const m = Math.hypot(dx, dy); if (m > R0) { dx *= R0 / m; dy *= R0 / m; }
      octx.fillStyle = "rgba(255,255,255,.12)"; octx.strokeStyle = "rgba(255,255,255,.35)";
      octx.beginPath(); octx.arc(moveP.sx, moveP.sy, R0, 0, Math.PI * 2); octx.fill(); octx.stroke();
      octx.fillStyle = "rgba(79,163,255,.75)"; octx.beginPath(); octx.arc(moveP.sx + dx, moveP.sy + dy, R0 * 0.42, 0, Math.PI * 2); octx.fill();
    } else {
      octx.strokeStyle = "rgba(79,163,255,.6)"; octx.lineWidth = 3;
      octx.beginPath(); octx.arc(moveP.x, moveP.y, 30, 0, Math.PI * 2); octx.stroke();
    }
  } else {
    octx.fillStyle = "rgba(255,255,255,.25)"; octx.font = "bold 13px system-ui"; octx.textAlign = "center";
    octx.fillText(cfg.move === "stick" ? "左の指：スティック" : "左の指：ダイレクト移動", W * 0.2, H - 40);
  }
  if (swP.id === null) { octx.fillStyle = "rgba(255,255,255,.25)"; octx.textAlign = "center"; octx.font = "bold 13px system-ui"; octx.fillText("右の指：スワイプで打つ", W * 0.75, H - 40); }
  // スワイプの軌跡
  const now = performance.now();
  while (swipeTrail.length && now - swipeTrail[0].t > 260) swipeTrail.shift();
  if (swipeTrail.length > 1) {
    octx.lineCap = "round";
    for (let i = 1; i < swipeTrail.length; i++) {
      const a = swipeTrail[i - 1], b = swipeTrail[i], al = 1 - (now - b.t) / 260;
      octx.strokeStyle = `rgba(255,220,120,${al * 0.8})`; octx.lineWidth = 3 + al * 8;
      octx.beginPath(); octx.moveTo(a.x, a.y); octx.lineTo(b.x, b.y); octx.stroke();
    }
  }
}
requestAnimationFrame(frame);

// ===== 画面のボタン =====
function tryLandscape() {
  try {
    const el = document.documentElement;
    const lock = () => { try { const p = screen.orientation && screen.orientation.lock && screen.orientation.lock("landscape"); if (p && p.catch) p.catch(() => {}); } catch (e) {} };
    if (!document.fullscreenElement && el.requestFullscreen && matchMedia("(pointer:coarse)").matches) {
      const p = el.requestFullscreen(); if (p && p.then) p.then(lock).catch(() => {});
    } else lock();
  } catch (e) {}
}
function togglePause() {
  if (st.phase === "over") return;
  st.paused = !st.paused; $("menu").hidden = !st.paused;
  moveP.id = null; swP.id = null;
}
function toTitle() {
  st.phase = "title"; st.paused = false;
  $("menu").hidden = true; $("result").hidden = true; $("pause").hidden = true; $("title").hidden = false;
  hint(""); updHud();
  ball.p.set(0, TH + 0.4, 0); ball.v.set(0, 0, 0);
  resetPositions();
}
$("start").onclick = startMatch;
$("again").onclick = startMatch;
$("toTitle").onclick = toTitle;
$("quit").onclick = toTitle;
$("resume").onclick = togglePause;
$("pause").onclick = togglePause;
$("toGames").onclick = () => { location.href = "../"; };
document.addEventListener("visibilitychange", () => { if (document.hidden && !st.paused && (st.phase === "rally" || st.phase === "serve" || st.phase === "dead")) togglePause(); });
toTitle();

// 動作確認用
window.__pp = { st, ball, P, C, cfg, playerSwing, run(sec, fast) { for (let i = 0; i < sec * 60; i++) { if (!st.paused && st.phase !== "title" && st.phase !== "over") update(TS / 60, 1 / 60); if (!fast) render(1 / 60); } if (fast) render(1 / 60); }, startMatch, solveShot, shotOutcome, flightSim, makeSpin, V, get cpuPlan() { return cpuPlan; } };
</script>

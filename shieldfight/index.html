<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<!-- ホーム画面に追加して開くと、アドレスバーなしで起動する（iPhone は全画面の機能がないので、これが画面を広く使う唯一の方法） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="you know games">
<meta name="theme-color" content="#111827">
<!-- アプリとしてインストールできるようにする（Android の Chrome など）。インストールしたアイコンから開くと、最初から全画面で起動し、全画面のお知らせも出ない -->
<!-- 2026-11-06 からミニゲーム集「you know games」の中の 1 本。アプリの設定・アイコンは 1 つ上のフォルダにある -->
<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png?v=3">
<title>シールドファイト</title>
<style>
  html,body{margin:0;height:100%;background:#1c2636;color:#e5e7eb;font-family:system-ui,"Yu Gothic",sans-serif;overflow:hidden}
  /* iPhone の Safari は user-scalable=no を無視するので、ボタンやその間をすばやく 2 回たたくと拡大されてしまう。manipulation で、どこでもダブルタップの拡大をしない（スクロールはできる） */
  html,body{touch-action:manipulation}
  #cv{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  /* 戦闘中は、どこを長押ししても文字の選択（青い選択とコピーのメニュー）を出さない。出ると指の動きが選択に取られ、ボタンを離したことが届かず押しっぱなしになるため */
  body.battle, body.battle *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  :root{--b:min(21vw,92px);--g:8px;--sh:124px}   /* 操作ボタンの大きさ / ボタン同士のすき間 / 下のプレイヤー情報の高さ（縦持ちで固定） */
  /* 画面構成: 上=戦闘画面 / 中=操作ボタン（スマホのみ）/ 下=プレイヤー情報 */
  #wrap{position:relative;display:flex;flex-direction:column;width:100%;height:100vh;height:100dvh}
  #stats{display:none;flex:none;align-items:center;box-sizing:border-box;width:min(100%,620px);min-height:var(--sh);margin:0 auto;padding:4px 3px calc(6px + env(safe-area-inset-bottom))}
  /* 戦闘中のプレイヤー情報: 1 人ぶんのカードを横に並べ、カードの中は縦に（名前 / キャラ / 攻撃 / 防御 / スピード）。
     文字と棒の大きさはカードの幅に合わせて変わる（cqw）。人数が少ないほど大きく、4 人でも読める大きさにする */
  .pcs{flex:1 1 auto;display:flex;justify-content:center;gap:3px;min-width:0}
  .pc{container-type:inline-size;flex:1 1 0;min-width:0;max-width:230px;box-sizing:border-box;padding:4px 3px 5px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid transparent;font-size:11px;line-height:1.25}
  .pc.me{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28)}
  .pc b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-size:clamp(11px,13.8cqw,16px)}
  .pc .sub{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:3px;color:#9ca3af;white-space:nowrap;font-size:11px;font-size:clamp(9.5px,11.7cqw,13px)}
  .pc .sub span:first-child{overflow:hidden;text-overflow:ellipsis}
  .pc .wn{flex:none;display:flex;align-items:center}
  .pc .wn i{display:block;width:.62em;height:.62em;margin-left:.22em;box-sizing:border-box;border:1px solid currentColor;border-radius:50%}
  .pc .wn i.on{background:currentColor}
  .pc .pr{display:flex;align-items:center;gap:3px;height:17px;height:clamp(15px,18cqw,20px)}
  .pc .lb{flex:0 0 4.1em;white-space:nowrap;font-size:10.5px;font-size:clamp(9px,11.2cqw,12.5px)}
  .pc .g{flex:1 1 0;min-width:0;display:flex;gap:1px}
  .pc .g i{flex:1;height:10px;height:clamp(8px,10.6cqw,12px);border-radius:1px;background:#374151}
  .pc .g i.on{background:var(--c)}
  .pc .g i.up{background:#fff;box-shadow:0 0 5px var(--c),inset 0 0 0 2px var(--c)}   /* 狂化・巨大化の上乗せぶん */
  .pc .g i.dn{background:#450a0a;box-shadow:inset 0 0 0 1px #ef4444}                     /* 狂化で下がったぶん */
  #box{position:relative;flex:1 1 0;min-height:0;width:100%}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  /* 画面の上のボタン。ホーム画面から開いた iPhone などでは、時計・電池の帯やカメラの切り欠き（safe-area）を避ける */
  #mute{position:absolute;top:calc(6px + env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));z-index:3;width:34px;height:34px;padding:0;margin:0;border-radius:50%;background:rgba(255,255,255,.14);font-size:16px;line-height:1}
  #fs{display:none;position:absolute;top:calc(6px + env(safe-area-inset-top));right:calc(max(8px,env(safe-area-inset-right)) + 40px);z-index:3;width:34px;height:34px;padding:0;margin:0;border-radius:50%;background:rgba(255,255,255,.14);line-height:0}
  #fs svg{width:18px;height:18px}
  body.fsok #fs{display:block}
  #rot{display:none;position:absolute;top:calc(6px + env(safe-area-inset-top));right:calc(max(8px,env(safe-area-inset-right)) + 80px);z-index:3;width:34px;height:34px;padding:0;margin:0;border-radius:50%;background:rgba(255,255,255,.14);line-height:0}
  #rot svg{width:18px;height:18px}
  body.rotok:not(.battle) #rot{display:block}                          /* 縦横の切り替えは、戦闘中以外に出す */
  #quit{display:none;position:absolute;top:calc(6px + env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));z-index:3;height:34px;padding:0 12px;margin:0;border-radius:17px;background:rgba(255,255,255,.14);font-size:13px;line-height:1}
  body.solo.battle #quit{display:block}
  /* タイトルへ戻るボタン（家のマーク）: タイトル画面以外ではいつも左上に出す。2 回押すと戻る（1 回目で「もう一度押すとタイトルへ」と出る）。「やめる」はその右 */
  #home{display:none;position:absolute;top:calc(6px + env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));z-index:4;min-width:34px;height:34px;padding:0;margin:0;border-radius:17px;background:rgba(255,255,255,.14);line-height:0}
  #home svg{width:18px;height:18px}
  /* 操作ボタンを自分で置いた配置（z-index 5）が重なっても、音・全画面・向き・タイトルへ・やめるのボタンが押せるよう、それより上に出す（配置の編集中は下に戻す） */
  body.customlayout #mute, body.customlayout #fs, body.customlayout #rot, body.customlayout #quit{z-index:6}
  body.customlayout #home{z-index:7}
  body.editing #mute, body.editing #fs, body.editing #rot, body.editing #quit{z-index:3}

  #home.ask{padding:0 12px;background:rgba(239,68,68,.75);font-size:12px;line-height:1}
  body.inapp #home{display:block}
  /* 操作ボタンの配置の編集画面: 操作ボタンを出して、ドラッグで動かす。選んでいるボタンは黄色の枠 */
  body.editing #touch{display:flex}
  body.editing #home, body.editing #stats, body.editing #skillhint{display:none}
  body.editing .tb{touch-action:none;cursor:grab}
  .tb.sel{outline:3px solid #facc15;outline-offset:3px}
  .panel.layoutbar{position:absolute;top:calc(6px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:6;width:min(92%,460px);padding:8px 12px;text-align:left}
  .panel.layoutbar h1{font-size:15px;margin:0 0 2px}
  .panel.layoutbar p{margin:2px 0;font-size:12px}
  .panel.layoutbar .lrow{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}
  .panel.layoutbar input[type=range]{flex:1;padding:0}
  .panel.layoutbar button{margin:4px 4px 0 0;padding:7px 14px}
  body.inapp #quit{left:calc(max(8px,env(safe-area-inset-left)) + 42px)}
  #skillhint{display:none;position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:3;padding:4px 12px;border-radius:999px;background:rgba(0,0,0,.5);font-size:12px;pointer-events:none;white-space:nowrap}
  @media (pointer:fine){body.battle #skillhint{display:block}}

  /* メニュー共通 */
  .panel{pointer-events:auto;background:rgba(17,24,39,.94);border:1px solid #374151;border-radius:12px;padding:18px 24px;text-align:center;max-width:92%;max-height:calc(100% - 16px);overflow:auto;box-sizing:border-box}
  .panel h1{margin:0 0 8px;font-size:26px}
  .panel p{margin:6px 0;color:#9ca3af;font-size:13px}
  button{font:inherit;background:#3b82f6;color:#fff;border:0;border-radius:8px;padding:10px 20px;margin:6px 4px;cursor:pointer}
  button.sub{background:#4b5563}
  button:disabled{background:#4b5563;opacity:.55;cursor:default}
  input{font:inherit;width:100%;box-sizing:border-box;padding:8px;border-radius:6px;border:1px solid #4b5563;background:#111827;color:#e5e7eb}
  .code{font-size:48px;font-weight:bold;letter-spacing:12px;line-height:1.1}
  .pl{margin:3px 0;font-size:15px}
  .pl .ok{color:#4ade80;font-size:12px;margin-left:6px}
  .pl .wt{color:#9ca3af;font-size:12px;margin-left:6px}

  /* キャラ選択画面 */
  .panel.setup{width:min(92%,420px)}
  .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
  .chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 4px;margin:0;border-radius:10px;background:#1f2937;border:2px solid transparent;font-size:10px;line-height:1.2;color:#e5e7eb}
  .chip canvas{position:static;inset:auto;width:36px;height:50px}
  .chip.on{border-color:#facc15;background:#374151}
  .detail{text-align:left;background:#111827;border:1px solid #374151;border-radius:10px;padding:10px 12px;margin:6px 0}
  .detail h2{margin:0;font-size:17px}
  .detail .tag{color:#9ca3af;font-size:12px;margin:2px 0 6px}
  .detail .skl{font-size:12px;margin-top:8px;line-height:1.5;color:#d1d5db}
  .detail .skl b{color:#facc15}
  .detail .trait{color:#fca5a5}

  /* CPU 戦の設定 */
  .cpuset{text-align:left;background:#111827;border:1px solid #374151;border-radius:10px;padding:6px 12px;margin:6px 0}
  .cpuset .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0;font-size:13px;color:#d1d5db}
  .cpuset .hint{margin:-2px 0 6px;font-size:11px;color:#9ca3af;text-align:left}
  .seg{display:inline-flex;gap:4px}
  .seg button{margin:0;padding:6px 12px;background:#374151;font-size:13px}
  .seg button.on{background:#3b82f6}
  .seg button:disabled{opacity:.4}
  .wrv{display:inline-block;min-width:2.4em;text-align:center;align-self:center;font-weight:bold;color:#e5e7eb}   /* 何本先取か（− 3 ＋） */
  .rounds{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0 2px;font-size:13px;color:#d1d5db}
  select{font:inherit;font-size:13px;background:#1f2937;color:#e5e7eb;border:1px solid #4b5563;border-radius:6px;padding:5px 6px;max-width:60%}

  /* 戦闘中: 画面上部のステータス表（横向きの棒グラフ） */
  .st-r{display:flex;align-items:center;gap:6px;height:30px;padding:0 4px;border-radius:5px}
  .st-r.me{background:rgba(255,255,255,.08)}
  .st-r .nm{flex:0 0 84px;overflow:hidden;line-height:1.15;font-size:13px;font-weight:bold}
  .st-r .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .st-r .nm small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;font-weight:normal;color:#9ca3af}
  .st-r .g{flex:1 1 0;min-width:0;display:flex;gap:2px}
  .st-r .g i{flex:1;height:9px;border-radius:2px;background:#374151}
  .st-r .g i.on{background:var(--c)}
  .st-r .g i.up{background:#fff;box-shadow:0 0 5px var(--c),inset 0 0 0 2px var(--c)}   /* 狂化・巨大化の上乗せぶん */
  .st-r .wn{flex:0 0 42px;text-align:right;font-size:11px;letter-spacing:1px}
  .st-r.st-h{height:16px}
  .st-r.st-h .g{font-size:11px;line-height:16px;display:block}
  .detail .st-r{height:20px;padding:0}
  .detail .st-r .nm{flex-basis:64px}

  /* 操作ボタン（スマホのみ・戦闘中だけ表示）。ジャンプと攻撃を横に並べ、スキルをその上の真ん中に置く（3つの中心が正三角形） */
  #touch{display:none;flex:none;justify-content:space-between;align-items:flex-end;box-sizing:border-box;padding:0 16px calc(20px + env(safe-area-inset-bottom));pointer-events:none}
  #touch>div{pointer-events:auto}
  #dpad{display:flex;gap:10px}
  .tb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:var(--b);height:var(--b);background:rgba(255,255,255,.18);border-radius:18px;font-size:calc(var(--b)*.38);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
  .tb:active{background:rgba(255,255,255,.35)}
  #rbtns{position:relative;width:calc(var(--b)*2 + var(--g));height:calc(var(--b) + (var(--b) + var(--g))*.866)}
  #rbtns .tb{position:absolute;border-radius:50%}
  .tb.jump{right:0;bottom:0;background:rgba(59,130,246,.4);font-size:11px;font-weight:bold;gap:2px}
  .tb.jump svg{width:calc(var(--b)*.44);height:calc(var(--b)*.44)}
  .tb.atk{left:0;bottom:0;font-size:calc(var(--b)*.4);background:rgba(239,68,68,.4)}
  .tb.skill{left:calc((var(--b) + var(--g))/2);top:0;background:rgba(168,85,247,.45);font-weight:bold;overflow:hidden;gap:0}
  .tb.skill b{font-size:11px;line-height:1.1;max-width:88%;text-align:center}
  .tb.skill i{font-style:normal;font-size:calc(var(--b)*.28);line-height:1.1;min-height:1em}
  .tb.skill::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.6) calc(var(--p,0)*1turn),transparent 0);pointer-events:none}
  .tb.skill[data-state="none"]{opacity:.28}
  .tb.skill[data-state="ready"]{box-shadow:0 0 0 3px rgba(250,204,21,.65)}
  .tb.skill[data-state="charge"]{background:rgba(250,204,21,.6)}
  @media (pointer:coarse){body.battle #touch{display:flex}}
  /* スマホ縦持ち: ボタンを画面の下端から持ち上げる（親指が届きやすいように）。ぶんだけ戦闘画面は縦に縮む */
  @media (pointer:coarse) and (orientation:portrait){
    /* 操作ボタンの下端を、画面の下から「プレイヤー情報の高さ + 持ち上げ分」の位置に置く。持ち上げ分は画面の高さに比例（840px の画面で約 109px） */
    #touch{padding-bottom:calc(20px + clamp(0px, 25dvh - var(--sh) + 23px, 130px))}
  }
  /* スマホ横持ち: 画面の下端に重ねる */
  @media (pointer:coarse) and (orientation:landscape){
    :root{--b:min(12vw,64px)}
    #touch{position:absolute;left:0;right:0;bottom:6px;padding:0 16px}
    #dpad{gap:8px}
  }
  /* 4 人戦をスマホの縦持ち（高さに余裕のある画面）で遊ぶときは、カードを 2×2 に並べて大きくする（操作ボタンの下の余白を使う） */
  @media (pointer:coarse) and (orientation:portrait) and (min-height:700px){
    body.q4{--sh:218px}
    body.q4 .pcs{display:grid;grid-template-columns:1fr 1fr;gap:4px;align-content:center}
    body.q4 .pc{max-width:none;padding:4px 8px 5px}
    body.q4 .pc b{font-size:15px}
    body.q4 .pc .sub{font-size:12px}
    body.q4 .pc .pr{height:18px}
    body.q4 .pc .lb{font-size:11.5px}
    body.q4 .pc .g i{height:11px}
  }
  /* 高さが足りない横長画面: プレイヤー情報は画面の下の中央に小さく重ねる（スマホなら左右の操作ボタンのあいだ） */
  @media (orientation:landscape) and (max-height:520px){
    #stats{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:min(70%,520px);min-height:0;z-index:3;padding:2px 3px;background:rgba(17,24,39,.6);border-radius:8px;pointer-events:none}
    .pc{padding:2px 3px}
    .pc b{font-size:10px}
    .pc .sub{font-size:9px;margin-bottom:1px}
    .pc .pr{height:11px}
    .pc .lb{font-size:8.5px}
    .pc .g i{height:6px}
  }
  @media (pointer:coarse) and (orientation:landscape) and (max-height:520px){
    #stats{width:calc(100% - 340px);max-width:520px}
  }
  /* 横画面モード（スマホの横持ち。JS が body.land を付ける）: 戦闘画面を画面いっぱいに使い、操作ボタンとプレイヤー情報は半透明で上に重ねる。
     ボタンは大きく（画面の高さに比例）、左下に ◀ ▶、右下に ジャンプ・攻撃・スキル（正三角形）。プレイヤー情報は上部に小さく、名前・キャラ名・勝ち数だけ */
  body.land{--b:clamp(62px,27vh,116px);--g:10px;--bin:7vw}         /* --bin: 左右の端から、中央へ寄せるぶん */
  body.land.battle #touch{display:flex}
  body.land #touch{position:absolute;left:0;right:0;bottom:0;padding:0 calc(max(20px,env(safe-area-inset-right)) + var(--bin)) calc(12px + env(safe-area-inset-bottom)) calc(max(20px,env(safe-area-inset-left)) + var(--bin))}
  body.land #dpad{gap:calc(var(--g)*1.2)}
  body.land .tb{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 2px rgba(255,255,255,.26)}
  body.land .tb:active{background:rgba(255,255,255,.32)}
  body.land .tb.jump{background:rgba(59,130,246,.28);font-size:calc(var(--b)*.16)}
  body.land .tb.atk{background:rgba(239,68,68,.28)}
  body.land .tb.skill{background:rgba(168,85,247,.3)}
  /* 横画面の右のボタン: 画面の右下の角を中心とする円（半径 --R）の上に、下から 攻撃（15 度）・スキル（43 度）・ジャンプ（72 度）の順に並べる。
     親指を右下の角あたりに置いたまま、弧を描くように届く。数字は cos / sin（例: 15 度 → 0.966 / 0.259） */
  body.land{--R:calc(var(--b)*2.4)}
  body.land #rbtns{position:absolute;right:0;bottom:0;width:0;height:0}
  body.land #rbtns .tb{left:auto;top:auto}
  body.land .tb.atk{right:calc(var(--R)*.966 - var(--b)/2 + env(safe-area-inset-right));bottom:calc(var(--R)*.259 - var(--b)/2 + env(safe-area-inset-bottom))}
  body.land .tb.skill{right:calc(var(--R)*.731 - var(--b)/2 + env(safe-area-inset-right));bottom:calc(var(--R)*.682 - var(--b)/2 + env(safe-area-inset-bottom))}
  body.land .tb.jump{right:calc(var(--R)*.309 - var(--b)/2 + env(safe-area-inset-right));bottom:calc(var(--R)*.951 - var(--b)/2 + env(safe-area-inset-bottom))}
  body.land .tb.skill b{font-size:calc(var(--b)*.16)}
  body.land .tb.jump:active{background:rgba(59,130,246,.55)}
  body.land .tb.atk:active{background:rgba(239,68,68,.55)}
  body.land .tb.skill:active{background:rgba(168,85,247,.55)}
  body.land .tb.skill[data-state="ready"]{box-shadow:0 0 0 3px rgba(250,204,21,.7),inset 0 0 0 2px rgba(250,204,21,.4)}
  body.land .tb.skill[data-state="charge"]{background:rgba(250,204,21,.5)}
  body.land #stats{position:absolute;top:0;left:0;right:0;bottom:auto;transform:none;width:auto;max-width:none;min-height:0;margin:0;z-index:2;
    padding:max(4px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left));
    background:none;border-radius:0;align-items:flex-start;justify-content:space-between;pointer-events:none}

<script>
"use strict";
// LINE の中のブラウザ（アプリ内ブラウザ）は、全画面にも横画面にもできない。LINE は URL に openExternalBrowser=1 が付いていると、
// いつものブラウザ（Chrome / Safari）で開くので、LINE の中で開かれたら、それを付けて開き直す（1 回だけ。付いていても LINE の中に残ったら、タイトル画面で案内する）
const isLineApp = /\bLine\//i.test(navigator.userAgent);
const extUrl = () => { const u = new URL(location.href); u.searchParams.set("openExternalBrowser", "1"); return u.toString(); };
if (isLineApp && !new URLSearchParams(location.search).has("openExternalBrowser")) location.replace(extUrl());
// ---------- 定数 ----------
const W = 960, H = 540;                       // 場外判定に使うワールド基準サイズ
const PX = 190, PW = 580, PY = 400;           // メインステージ（上面の高さが PY）
const UP_GAP = 150, UP_H = 14;                // 上の台: メインの上面からの高さ / 厚み
const MAIN_PLAT = { x: PX, y: PY, w: PW, main: true };
// 戦う人数に応じたステージ（上にあるものから順に並べる）
//   2人: メインだけ / 3人: 上に台が1つ（漢字の「二」の形）/ 4人: 上に台が2つ

function connectedSlots() {

}
const readySlots = () => connectedSlots().filter(i => game.p[i].rd);

  for (const s of connectedSlots()) {

function toLobby() {
  const slots = connectedSlots();
  slots.forEach((s, idx) => { const p = game.p[s]; p.w = 0; p.lk = false; p.lv = 0; spawn(p, idx, slots.length); p.al = true; });
  game.ph = "lobby"; game.win = -1; game.wt = 0; game.nf = 0; game.st = 0; game.stT = 0;   // ロビーはいつものステージ

  const r = [];

    if (p && p.c && p.al) { p.own = i; r.push(p); }
    const c = game.cl[i];
    if (c && c.al) r.push(c);
  }
  return r;
}

// ---- 魔法使い: 魔法 ----
// 詠唱が終わった瞬間に撃つ。魔法書の耐久を減らし、0 以下なら本が壊れる（BOOK_REGEN 後に新しい本）
function fireMagic(p) {

// 拘束魔法が当たった: 盾に関係なく、その場で MAGIC_BIND だけ止める（騎士の構えには返される）
function bindMagic(o, e, dir) {

// 魔法が人に当たった
function magicHit(b, o, e, dir) {

  if (M.pierce) {                                            // 究極魔法: 盾は壊れ、さらに強く吹っ飛ぶ（騎士の構えには返される）
    if (e.cn > 0 && o.al) { counterHit(e, o); return; }

// ---- 吸血鬼: 吸血 ----
// 吸血鬼がダッシュでつかんだ敵に噛みつく（盾もカウンターの構えも効かない）
function startBite(p, t) {

// 噛みついている間（毎フレーム）: 相手を前に寄せたまま、VAMP_TICK ごとに % を少しずつ移す。終わる・相手が離れた（殴られた等）ら放す

// ---- 波動士: 波動弾 ----
const hwPos = p => { const sz = szOf(p), c = hwC(p.hw), r = hwRad(c, p) * sz; return { x: ecx(p), y: p.y, r, c }; };   // 頭のてっぺんが玉の中心（2026-10-18 に、名前と % の表示より上から下げた）   // ためている玉の位置（体の後ろ）と大きさ
function fireHadou(p) {

// ためている玉の当たり判定（ためている間だけ）。盾で受けられる。触れている相手には HW_HIT_GAP フレームごとに当たり続ける（hwh: [相手, もう一度当たれるまでの残り]）
function updateHadouOrbs(list) {

      const last = p.hwh.find(h => h[0] === e);

// ---- CF: ムーンサルト ----
// 体の前（少し体に食い込むところから CF_REACH 先まで）・体の高さに重なる、いちばん近い敵を真上へ蹴り上げる。盾も騎士の構えも効かない。自分は宙返りして少し浮く

// ---- キャンピングシェルター: 傘 ----
const umBox = p => { const front = p.f > 0 ? p.x + pwOf(p) : p.x, sz = szOf(p); return { x0: p.f > 0 ? front : front - UMB_W * sz, x1: p.f > 0 ? front + UMB_W * sz : front, y0: p.y + phOf(p) - UMB_H * sz, y1: p.y + phOf(p) }; };
// 開いている間（毎フレーム）: 押している長さを数え、触れた敵に UMB_TICK ごとに弱く当てる。UMB_LAUNCH で傘を飛ばす
function umbrellaStep(p) {
  p.um++;

  p.umh = p.umh.filter(h => --h[1] > 0);
  for (const e of ents()) {
    if (e === p || ally(e.own, p.own) || !e.al || untouchable(e) || p.umh.some(h => h[0] === e)) continue;
    if (hbR(e) < b.x0 - 4 || hbL(e) > b.x1 + 4 || e.y > b.y1 || e.y + phOf(e) < b.y0) continue;
    p.umh.push([e, UMB_TICK]);

  }
  hitObjs(p.own, b.x0, b.y0, b.x1, b.y1, null, true);
  if (p.um >= UMB_LAUNCH) {                                    // 傘を飛ばす（新しい傘が生えるまで、攻撃ボタンはふつうの通常攻撃）
    game.pj.push({ k: 8, x: (b.x0 + b.x1) / 2, y: (b.y0 + b.y1) / 2, vx: p.f * UMB_V, vy: 0, own: p.own, t: 0, pw: p.f, hit: [] });   // pw: 進む向き（崖で止まっても向きを覚えておく）
    p.um = 0; p.umR = UMB_REGEN; p.umh = []; p.cd = ATK_COOLDOWN;

// 前から来た攻撃を傘で受ける（strike から）。受けたら true
function umbrellaBlock(att, t, o) {
  if (!(t.um > 0) || t.f !== -o.dir) return false;
  t.umHp -= o.breaker ? UMB_HP : 1; t.bf = 10; t.vx += o.dir * 2;
  const b = umBox(t), x = (b.x0 + b.x1) / 2, y = ecy(t);
  if (t.umHp <= 0) { t.um = 0; t.umR = Math.max(t.umR, UMB_BREAK_LOCK); t.umHp = UMB_HP; t.umh = []; emit("umx", x, y, o.dir); }   // 傘が壊れた（しばらく新しい傘が生えない）
  else emit("b", x, y, o.dir, 0);

}

// ---- スパッタリー: サメライド ----
// 乗っている間（毎フレーム）: 前へ進み、体の前にぶつかった敵に 1 回ずつ当てる。地上では足場の端で止まって、そこで爆発する
function sharkStep(p) {
  const sz = szOf(p), pl = platformUnder(p);
  p.vx = p.f * SR_V;
  if (!p.ground) p.vy = Math.min(p.vy, 1);                     // 空中では真横へ進む（少しずつ下がる）
  let end = --p.srT <= 0;
  if (pl && (p.f > 0 ? p.x + pwOf(p) + p.vx > pl.x + pl.w : p.x + p.vx < pl.x)) { p.vx = p.f > 0 ? pl.x + pl.w - pwOf(p) - p.x : pl.x - p.x; end = true; }

  const x0 = p.f > 0 ? p.x : front - SR_REACH * sz, x1 = p.f > 0 ? front + SR_REACH * sz : p.x + pwOf(p), y0 = p.y + 10 * sz, y1 = p.y + phOf(p) + 6 * sz;
  for (const e of ents()) {
    if (e === p || ally(e.own, p.own) || !e.al || untouchable(e) || p.srHit.includes(e)) continue;
    if (hbR(e) < x0 || hbL(e) > x1 || e.y > y1 || e.y + phOf(e) < y0) continue;
    p.srHit.push(e);
    const s0 = e.s;
    strike(p, e, { dir: p.f, frac: SR_HIT, recoil: false });
    if (p.s > 0) { p.srT = 0; return; }                         // 騎士のカウンターで返された
    if (e.s > 0 && e.s !== s0) p.srCar.push(e);                 // 盾なしで当たった: 最後の爆発までサメが押していく
  }
  for (const e of p.srCar) if (e.al && e.s > 0 && !untouchable(e)) { e.vx = p.f * SR_V; e.s = Math.max(e.s, 3); }
  hitObjs(p.own, x0, y0, x1, y1, p.srHit);
  if (end) sharkBlast(p, p.x + p.vx);
}
// 進み終わり: サメの鼻先でインクを撒き散らして爆発（盾は効かない。自分は飛ばない）
function sharkBlast(p, px) {
  const x = px + pwOf(p) / 2 + p.f * 26 * szOf(p), y = p.y + phOf(p) - 14;
  p.srT = 0; p.vx = 0;

  explode({ x, y, own: p.own }, ents(), SR_BLAST, SR_KNOCK, SR_LIFT);
}

// ---- 勝負師: ハンマー ----
// 出目ごとの当たり方（1 は何も起きない。2・3 は通常攻撃と同じで盾に止められる。4・5 は盾を壊す。騎士の構えには返される）

  if (n <= 3) { strike(p, t, { dir, frac: 1, recoil: true }); return; }
  if (shieldUp(t)) { breakShield(t); impact("k", p, t, 0, dir); }
  if (n === 4) {
    if (!t.ground) { t.hf = 12; addDmg(t, HM_DMG4); emit("hm4", ecx(t), ecy(t), dir); return; }   // 空中の相手は止まらない（% だけ）
    grabBroken(t); releaseGrab(t); stopWeb(t); freeBind(t);
    t.a = 0; t.ak = 0; t.cd = 0; t.ks = 0; t.cn = 0; t.mc = 0; t.vx = 0;
    t.fz = Math.max(t.fz, bindLen(t, HM_BIND)); t.bnd = 1; t.hf = 12; addDmg(t, HM_DMG4);

// ---- 天狗: 風の場 ----
// 場の中（体の中心が入っている）では、敵は遅く・低く、持ち主は速く・高くなる。透過中・復活直後・巻き戻し中は受けない
// 風の場の中の吹っ飛び（2026-11-21）: 天狗の敵は WIND_FOE_KB 倍飛びやすく、天狗本人は WIND_SELF_KB 倍（飛びにくい）
function windKb(t) {
  if (!game.wd.length) return 1;
  const x = ecx(t), y = ecy(t); let k = 1;
  for (const w of game.wd) { if (x < w.x || x > w.x + w.w || y < w.y || y > w.y + w.h) continue; if (w.own === t.own && !t.isClone) k *= WIND_SELF_KB; else if (!ally(w.own, t.own)) k *= WIND_FOE_KB; }

}
function windMul(p) {

  const x = ecx(p), y = ecy(p);
  for (const w of game.wd) {
    if (x < w.x || x > w.x + w.w || y < w.y || y > w.y + w.h) continue;
    if (w.own === p.own) { mv *= WIND_SELF_MV; jp *= WIND_SELF_JP; } else if (ally(w.own, p.own)) continue; else {   // 味方（チーム）は、遅くも速くもならない

}
function updateWinds() {
  for (let i = game.wd.length - 1; i >= 0; i--) if (++game.wd[i].t >= WIND_FRAMES) game.wd.splice(i, 1);
}

// ---- 蜘蛛: 糸 ----
const mainPlat = () => platforms().find(q => q.main) || null;     // メインの足場（サドンデスで崩れたら null）
// 蜘蛛の居場所（= 使う効果の番号）: 0 = 崖の外（体の中心がメインの左右の端より外、または足もとがメインの上面より下）/ 1 = 地上 / 2 = ステージの上の空中
// ステージの上の空中は「\＿/」の形: メインの左右の端から、高さと同じだけ外側（斜め 45 度。急降下の角度と同じ）まで広がる。ただし急降下の糸が届く高さまで
// 体の中心が、ステージの上の「\＿/」の範囲（メインの左右の端から、足もとの高さと同じだけ外側まで広がる。足もとがメインの上面より下なら外）にあるか。高さの上限はない
function overStage(p) {
  const m = mainPlat();
  if (!m) return false;
  const h = m.y - (p.y + phOf(p)), x = ecx(p);
  return h >= -2 && x >= m.x - Math.max(0, h) && x <= m.x + m.w + Math.max(0, h);
}
function webMode(p) {
  if (p.ground) return 1;
  const m = mainPlat(), x = ecx(p);
  if (!m) return 0;
  const h = m.y - (p.y + phOf(p));                                  // メインの上面からの高さ（足もと）
  if (h < -2) return 0;
  const out = Math.max(0, h) - 8;                                     // 端の外へ広がる幅（端ぎりぎりで急降下が空振りしないよう、少し内側にする）
  if (x >= m.x && x <= m.x + m.w) return 2;

    if (p.ach > 0) spm = 0;                                     // ため攻撃をためている間も動けない
    if (lock) spm = 0;
    if (p.ks > 0 && !tpAim) spm = Math.min(spm, 0.45);      // ためている間は動きが鈍る（テレポーターは 2026-11-22 から、ふつうに歩ける。ジャンプはできない）
    if (p.um > 0) spm = Math.min(spm, UMB_SLOW); // 傘を開いている間も少し遅い
    if (p.bsl > 0) spm *= BREATH_SLOW;           // ヤニ猫の臭い息
    if (p.cn > 0) spm = 0;                       // カウンターの構え中は動かない
    const sp = spm * MOVE_BASE * moveMul(S) * wm.mv;
    // 向きを変えられるのは地面にいるとき（ため・構え中は固定）。ジャンプした直後の JUMP_TURN フレームだけは、空中でも向きを変えられ、
    // 横の動きも地上と同じくらい素早く切り返せる（右へ走ってジャンプ＋左、が少しずれても左を向く「反転ジャンプ」）
    const turnOk = p.ground || p.jg > 0;
    const ff = p.ground && !neutral ? foeSide(p) : 0;   // 2026-11-21: 地上では、いつもいちばん近い敵の方を向く（敵の通常攻撃を盾で受けられる）。空中では向かない（押した方向だけ）
    if (p.a === 0 && p.ks === 0 && p.cn === 0 && p.um === 0) { if (ff) p.f = ff; else if (dir && turnOk) p.f = dir; }   // 傘を開いている間は向きを変えられない（2026-11-21 から）
    const acc = turnOk ? 0.4 : 0.12;
    p.vx += (dir * sp - p.vx) * acc;
    if (p.jh > 0) {                                // 小ジャンプ: 押したフレームを 1 として、SHORT_HOP_F フレーム目までに離したら、上がる勢いを弱める
      if (!u) { const rem = jumpHeight(S) * wm.jp * klJump(p) * SHORT_HOP_H -(p.jy0 - p.y), v = rem > 0 ? -jumpVel(rem) : 0; if (p.vy < v) p.vy = v; p.jh = 0; }   // 跳び始めから数えて、ふつうの SHORT_HOP_H 倍の高さで止まる
      else if (++p.jh > SHORT_HOP_F) p.jh = 0;
    }
    // スパッタリー: 地上で左右＋ジャンプボタン（CPU は頭脳の指示）でステップ。使えないとき（2 回目のあとの待ち）はふつうのジャンプになる
    const stepDir = chd.id === "splat" && !p.isClone && !neutral ? (p.cpu ? p.aiStp : (jrise || p.bu > 0) ? dir : 0) : 0;
    if (p.cpu) p.aiStp = 0;
    if (dtap && chd.id !== "splat" && !p.isClone && p.ground && p.dsC === 0 && p.a === 0 && p.cn === 0 && p.ks === 0 && p.um === 0 && !lock) {
      startStep2(p, dtap);                                 // 2 回押しのステップ（1 回目の出だしが終わってから 2 回目を押したとき）
    } else if (stepDir && p.ground && p.spC === 0 && p.a === 0 && p.cn === 0 && p.ks === 0 && !lock) {
      p.sp = STEP_F; p.spD = stepDir; p.f = stepDir; p.bu = 0; p.jh = 0; p.spU = u ? 1 : 0;

    } else if (upress && p.ground && p.cn === 0 && !lock && !p.spU && !tpAim) {

      const airH = chd.id === "vamp" && !p.isClone && !neutral ? VAMP_AIR_H : jumpHeight(S) * AIR_JUMP;   // 吸血鬼の羽: スピード 6 の地上ジャンプと同じ高さ
      p.jh = 0;
      p.vy = Math.min(p.vy, -jumpVel(airH * wm.jp * klJump(p))); p.dj = 1; p.bu = 0;   // 上昇中に押しても、いまの勢いより弱くはならない
      if (chd.id === "vamp" && !p.isClone) p.wgT = VAMP_WING;   // 吸血鬼: 羽を広げて跳ぶ
      if (dir && p.a === 0 && p.ks === 0) p.f = dir;
      if (!p.isClone) emit("dj", ecx(p), p.y + phOf(p));
    }
    const camp = chd.id === "camp" && !p.isClone && !neutral;
    if (camp && p.um > 0) {                      // キャンピングシェルター: 押している間は傘を開いたまま。離すと閉じる
      if (a) umbrellaStep(p); else { p.um = 0; p.umh = []; p.cd = ATK_COOLDOWN; }
    } else if (apress && camp && !p.nsw && p.umR === 0 && !umbOut(p) && p.a === 0 && p.cd === 0 && p.ks === 0 && p.cn === 0 && p.mc === 0) {   // 飛ばした傘が残っている間は開けない（ふつうの通常攻撃になる）
      p.ba = 0; p.um = 1; p.umh = [];
      if (!p.ground && dir) p.f = dir;

    } else if (apress && !p.nsw && p.a === 0 && p.cd === 0 && p.ks === 0 && p.cn === 0 && p.mc === 0) {   // nsw: 剣を奪われている間は攻撃できない
      p.ba = 0;
      const bair = !p.ground && (!chd.atk || chd.atk === 2) && dir === -p.f;   // 空中後ろ攻撃（剣の人と槍兵。振り向かない）
      if (!p.ground && dir && !bair) p.f = dir;                 // 空中では、移動ボタンを押しながら攻撃すると、その方向へ振り向いて攻撃する（剣の人は、後ろを押すと空中後ろ攻撃）
      if (zone && inZone(zone, p)) zoneWarp(p, zone);           // 円の中なら、敵の背後へ回り込んでから攻撃する
      if (chd.id === "wizard" && !p.isClone) { p.msA = p.msw > 0 ? 1 : 0; if (p.msw > 0 && --p.msw === 0) p.mswT = MSW_REGEN; }   // 魔法の剣で振る（1 回減る）
      p.a = 1; p.ak = chd.atk === 2 ? (p.ground ? 2 : bair ? LANCE_BAIR_AK : LANCE_AIR_AK) : chd.atk || (p.ground ? 0 : bair ? BAIR_AK : AIR_AK); p.hit = [];   // 通常攻撃（槍兵は長い槍）。剣は空中なら空中攻撃

  }
  if (canSkill && sk && !neutral && !p.isClone && chd.id !== "clock" && skillInput(p, chd, kin, kpress, dir, zone)) p.bk = 0;   // スキル（時計師は上で処理する）
  const ak = ATKS[p.ak] || ATKS[0];

    if (!p.ach && p.a === ACH_START && a && p.ak === 0 && p.ground && !p.isClone && !neutral && (chd.id === "samurai" || chd.id === "knight")) p.ach = 1;   // 押したまま: ために変わる
    if (p.ach > 0) achStep(p, chd, a);           // ためている間は p.a は進まない（離すと、ため攻撃が p.a = 1 から始まる）

    if (ak.dash && p.a === ak.dashFrom) { emit("sl", ecx(p), ecy(p), p.ak); }      // 踏み込み・突進の始まり（向きは変えない）
    if (ak.dash && p.a >= ak.dashFrom && p.a <= ak.dashTo) {                         // 居合斬りの踏み込み・突進突きの突進
      p.vx = p.f * ak.dash;

    if (p.a > ak.total) { p.a = 0; p.ak = 0; p.cd = ak.cd !== undefined ? ak.cd : ATK_COOLDOWN; p.wa = 0; p.sl = p.ahit ? 0 : ak.total + 2 * (ak.total - ak.off); }   // 当てたときは盾がすぐ戻る   // sl: 盾が戻るまで（2026-11-21: 押してから盾が戻るまでを、その前の 2 倍に。通常攻撃は 45 → 90 フレーム）   // スパッタリーは攻撃後の待ちも半分
  }
  if (p.cd > 0) p.cd--;
  const gk = ((chd.id === "wizard" && (p.mgr || p.mc > 0 || p.bm > 0)) || (chd.id === "hadou" && p.hwr)) && !p.ground ? 0.6
    : chd.id === "vamp" && !p.isClone && !neutral && !p.ground && p.vy > 0 ? VAMP_FALL : 1;   // 吸血鬼: 落ちている間は、ゆっくり落ちる（2026-10-18）   // 魔法使い・波動士: 空中でためている（詠唱している）間は、落ちる速さが 0.6 倍
  p.vy += 0.6 * gk;
  if (d && !p.ground && p.s === 0) p.vy += 0.4 * gk;

    p.tl.push([p.x, p.y, p.f, p.dj, p.ground]);

}

// スキルボタンの処理（ふつうのときと、吹っ飛ばされている最中）。何か発動したら true（先行入力を消す）
// 空中・吹っ飛び中は、左右を押しながら使うと、その方向を向いてから放つ（ためるスキルは、離す瞬間の向き）
function skillInput(p, chd, kin, kpress, dir, zone) {
  const sk = chd.skill;

    return false;
  }
  if (chd.id === "wizard") {                     // 魔法使い: 1 回目で ため始め、2 回目で詠唱（0.2 秒後に撃つ）。魔法書が壊れている間・詠唱中は何もしない
    if (!kpress || p.mc > 0 || p.bd <= 0 || p.cn > 0) return false;
    if (!p.mg) { p.mg = 1; p.mgr = 1; emit("sc", ecx(p), ecy(p), p.ch); return true; }
    if (!p.mgr && p.mg < MAGIC_FULL) { p.mgr = 1; emit("sc", ecx(p), ecy(p), p.ch); return true; }   // 止まっていたためを、その段階から再開する
    if (p.a > 0) return false;                   // 攻撃の途中では撃てない

    emit("mgc", ecx(p), ecy(p), p.f, p.ml);
    return true;
  }

    if (!kpress || p.cn > 0) return false;

    if (!p.hwr) { if (p.a > 0) return false; p.hwr = 1; p.hwh = []; emit("sc", ecx(p), ecy(p), p.ch); return true; }
    if (p.a > 0 || p.hw < HW_MIN) return false;

  }

    if (!p.ground) { if (p.kz < KL_NK_COST) return false; aim(); narukami(p); return true; }
    if (!p.kr && p.kz < KL_ON_MIN) return false;
    p.kr = p.kr ? 0 : 1; p.kc = p.km = KL_TOG;
    emit("klt", ecx(p), ecy(p), p.kr ? 1 : -1);
    return true;
  }

    if (p.ks > 0) { if (kin) p.ks = Math.min(p.ks + 1, sk.maxCharge); else { if (chd.id !== "bomber") aim(); fireHold(p); } return false; }

      aim(); p.ks = 1;
      if (chd.id === "bomber") { const h = bombHand(p); p.bcl = dir === 0 ? 0 : dir === p.f ? 1 : -1; game.pj.push({ k: 0, x: h.x, y: h.y, vx: 0, vy: 0, own: p.own, t: 0, hold: 1 }); }   // 爆弾を手に持つ（導火線はもう燃えている）
      else emit("sc", ecx(p), ecy(p), p.ch);

function breakShield(t) { t.sh = 0; t.sbk = SHIELD_BREAK_FRAMES; t.shi = 0; t.bf = 14; }

  if (att.wa) { frac *= ZONE_WARP_MUL; att.wa = 0; }               // スワッパーの回り込み攻撃
  frac = Math.min(cap || 1.3, frac);
  if (att.kr && isKillua(att)) frac *= KL_POW;                   // キルアのカンムル中は、攻撃の威力（吹っ飛ばし・たまる %）が 1.2 倍
  const mul = dzMul(t);                                         // 土下座中は飛びにくい（2026-10-18 まであった「透過中の攻撃は 1.5 倍」はなくした）
  t.vx = (dir === undefined ? att.f : dir) * KNOCK_BASE * atkMul(effA(att)) * defMul(effD(t)) * frac * mul * dmgMul(t) * windKb(t);   // windKb: 天狗の風の場
  addDmg(t, dmgAmt !== undefined ? dmgAmt : DMG_BASE * atkMul(effA(att)) * defMul(effD(t)) * frac * mul);
  if (ang !== undefined) {                                       // 角度つき: 横も上も強さに比例する（硬直は今までと同じく、横の強さ × STUN_SPEED）
    const M = Math.abs(t.vx), r = ang * Math.PI / 180, sg = Math.sign(t.vx) || 1;

  } else { t.vy = -9; t.s = Math.max(1, Math.round(Math.abs(t.vx) * STUN_SPEED)); }   // 攻撃力・防御力・ため量・透過・土下座などで速さが変わると、硬直もそのぶん変わる
  grabBroken(t);

  t.ground = false; t.hf = 12; releaseGrab(t); t.hd = 0; t.wa = 0; stopWeb(t); t.bnd = 0;   // 吹っ飛ばされたら、回り込み攻撃・糸の動きも取り消し

    if (att.own === t.mbo) {                                     // かけた魔法使い（と分身）の攻撃: 吹っ飛びをためておき、拘束が解けた瞬間にまとめて飛ばす

    } else { const v = freeBind(t); if (v) { t.vx += v.vx; t.vy = Math.min(t.vy, v.vy); t.s = Math.max(t.s, v.s); } }   // ほかの人の攻撃: 拘束が解けて、たまっていたぶんも足して飛ぶ

}
// 拘束魔法を解く（ほかの人の攻撃・つかみ・糸など）。たまっていた吹っ飛び（なければ null）を返す
function freeBind(t) { const v = t.mbv; t.mb = 0; t.mbv = null; return v; }
// 拘束が時間切れで解けた: たまっていた吹っ飛びで飛ぶ
function releaseBind(p) {
  const v = freeBind(p);

  if (!v) return;
  p.vx = v.vx; p.vy = v.vy; p.s = Math.max(1, v.s); p.ground = false; p.hf = 12;
  emit("h", ecx(p), ecy(p), Math.sign(v.vx) || 1, Math.min(1.5, 0.5 + 0.25 * v.n));
  if (flyOut(p)) game.hs = Math.max(game.hs, 10);
}

// 吹っ飛ばされた人が、足場に戻れず崖の外まで飛ぶか（いまの速度で、何も操作しなかったときの軌道を先に計算する）
function flyOut(t) {
  const pls = platforms(), w = pwOf(t), h = phOf(t);
  let x = t.x, y = t.y, vx = t.vx, vy = t.vy;
  for (let f = 0; f < 180; f++) {
    vx *= f < t.s ? 0.985 : 0.88;                // 硬直が解けたら、何も押さなければ横の勢いは止まる
    vy = Math.min(18, vy + 0.6);
    const pb = y + h; x += vx; y += vy;
    if (vy >= 0) for (const pl of pls) if (pb <= pl.y + 0.01 && y + h >= pl.y && x + w > pl.x && x < pl.x + pl.w) return false;   // 足場に着地する
    if (x + w / 2 < KO_L || x + w / 2 > KO_R || y > KO_B || y + h < KO_T) return true;
  }
  return true;
}
// 当たった瞬間: 効果音と演出を出す。全員の動きを一瞬止める（ヒットストップ）のは、崖の外まで飛ぶような当たりだけ（多すぎて重く感じるため）
// kind: b=盾で受けた / k=盾が割れた / h=当たった
function impact(kind, att, t, frac, dir) {
  const d = dir === undefined ? att.f : dir;
  const x = kind === "h" ? ecx(t) : (t.f > 0 ? t.x + pwOf(t) + 4 : t.x - 4), y = ecy(t);   // 体の中心 / 盾の位置
  emit(kind, x, y, d, frac);
  if (kind === "h" && flyOut(t)) game.hs = Math.max(game.hs, 8 + Math.round(3 * frac));
}

// 騎士のカウンター: 受けた攻撃を、相手自身の攻撃力の 200% で相手に返す
function counterHit(kn, att) {
  const dir = Math.sign(ecx(att) - ecx(kn)) || -kn.f;

    } else if (b.k === 6) {                                  // 究極魔法のビーム: 魔法使いの手もとから前へ射程いっぱいに伸び、0.5 秒残る。その間に重なった敵に 1 回ずつ当たる（人も置き物も貫通）
      const o = game.p[b.own];

    } else if (b.k === 7) {                                  // 波動弾: 真横へ飛び、最初に当たった人（盾なら盾）で消える。射程を過ぎたら消える
      const o = game.p[b.own], dir = Math.sign(b.vx) || 1, r = hwRad(b.pw, o);

      for (const e of list) {

    } else if (b.k === 5) {                                  // 魔法使いの魔法: 真横へ飛ぶ。射程を過ぎたら消える。究極魔法は人を貫通する

      const ox = b.x;

        for (const e of list) { if (ally(e.own, b.own) || !e.al || untouchable(e) || Math.sign(ecx(e) - b.x) !== dir) continue; const d = Math.abs(ecx(e) - b.x) + Math.abs(ecy(e) - b.y); if (d < bd) { bd = d; tg = e; } }

      b.x += b.vx; b.d += Math.abs(b.vx);

      const hits = [];

function updateFlowers(list) {
  const pls = platforms();

    if (f.air) {                                             // おくれたんが空中から落とした花: 落ちながら、当たった敵を動けなくする。足場に落ちたら、ふつうの花になる（そこから咲く）
      const oy = f.y, s = f.big ? FLOWER_BIG_SCALE : 1, hw = (f.big ? FLOWER_BIG_HALF : FLOWER_HALF) + 4, rt = f.big ? FLOWER_BIG_ROOT : FLOWER_ROOT;

        if (e.x < f.x + hw && e.x + pwOf(e) > f.x - hw && f.y >= e.y && oy - 16 * s <= e.y + phOf(e)) { hit = e; break; }
      }

        const e = hit;
        e.fz = e.dz = bindLen(e, rt); e.bnd = 1; e.rk = 0; e.a = 0; e.ak = 0; e.ks = 0; e.cn = 0; e.vx = 0; e.mc = 0; if (e.vy < 0) e.vy = 0;

// ---- 体の当たり判定（2026-10-18）: やわらかく押し合う ----
// 体が横に重なった 2 人（分身も）を、毎フレーム重なりの PUSH_K 倍（最大 PUSH_MAX px）ずつ左右へ離す。走り抜けようとすると、相手はわずかに押されるが、自分は通り抜けられる。
// 上から乗っても止まらず（体の上には立てない）、横へずれて落ちる。吹っ飛ばされている人・透過中・復活直後・巻き戻し中・つかまれている人・糸で動いている人には働かない（吹っ飛びが人に当たって弱まらない）。
// 地上の人は、立っている足場の端から外へは押し出さない
const PUSH_K = 0.12, PUSH_MAX = 0.9, PUSH_W = 0.85;   // 押す強さ / 1 フレームに押す上限 / 体の幅のうち、重なりとみなす割合（少しの重なりは許す）
function softPush() {
  const list = ents().filter(e => e.s === 0 && e.gh === 0 && e.iv === 0 && e.rw === 0 && e.hd === 0 && e.yk === 0 && e.wb === 0 && !(e.gr > 0 && e.grT));
  const pls = platforms();
  const nudge = (e, dx) => {
    if (e.ground) {                                    // 足場の端から外へは押さない
      const cxp = ecx(e), pl = pls.find(q => Math.abs(e.y + phOf(e) - q.y) < 2 && cxp >= q.x && cxp <= q.x + q.w);
      if (pl) { const lo = pl.x + 4 - cxp, hi = pl.x + pl.w - 4 - cxp; dx = Math.max(Math.min(0, lo), Math.min(Math.max(0, hi), dx)); }
    }
    e.x += dx;
  };
  for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
    const a = list[i], b = list[j];
    const dyo = Math.min(a.y + phOf(a), b.y + phOf(b)) - Math.max(a.y, b.y);
    if (dyo < 6) continue;                              // 高さがほとんど重ならない
    const dx = ecx(b) - ecx(a), ov = (pwOf(a) + pwOf(b)) / 2 * PUSH_W - Math.abs(dx);
    if (ov <= 0) continue;
    const sgn = dx !== 0 ? Math.sign(dx) : (a.own <= b.own ? 1 : -1), m = Math.min(PUSH_MAX, ov * PUSH_K);
    nudge(a, -sgn * m); nudge(b, sgn * m);
  }
}

// ---- ヤク猫の注射器・ヤニ猫の臭い息とタバコ ----
// 地面の小さな置き物（注射器・タバコ。足もとの中心 x・足場の面 y、横 ±half・高さ 12px）に、体が重なっているか
const touchesItem = (e, x, y, half) => e.x < x + half && e.x + pwOf(e) > x - half && e.y < y && e.y + phOf(e) > y - 12;
const itemOnPlatform = (x, y) => platforms().some(pl => Math.abs(pl.y - y) < 1 && x > pl.x + 2 && x < pl.x + pl.w - 2);
const syMax = () => late() ? LATE_SYRINGES : SY_MAX;
function dropSyringe(p) {                    // おくれたんの花と同じく、体の前 52px に落とす（地上で足場があればその上、足場の外や空中なら真下へ落ちていく）。置けるのは 2 本まで（ラストスパート中は 4 本。古いものから消える）
  const mine = game.sy.filter(s => s.own === p.own);
  while (mine.length >= syMax()) game.sy.splice(game.sy.indexOf(mine.shift()), 1);
  const x = ecx(p) + p.f * 52;
  const pl = p.ground ? platforms().find(q => Math.abs(p.y + phOf(p) - q.y) < 2 && x > q.x + 4 && x < q.x + q.w - 4) : null;
  if (pl) game.sy.push({ x, y: pl.y, own: p.own, t: 0, air: 0, vy: 0, away: false });
  else game.sy.push({ x, y: p.y + phOf(p), own: p.own, t: 0, air: 1, vy: Math.max(2, p.vy), away: false });
}
function badBreath(p) {                      // 臭い息: 体の前に雲を置く（体の高さの中心に合わせる）。持ち主ごとに 1 つまで（新しく吐くと古い雲は消える）
  const sz = szOf(p), front = p.f > 0 ? p.x + pwOf(p) : p.x, w = BREATH_W * sz, h = BREATH_H * sz;
  game.bc = game.bc.filter(c => c.own !== p.own);
  const c = { own: p.own, x: p.f > 0 ? front : front - w, y: ecy(p) - h / 2, w, h, d: p.f, t: 0, hit: [] };

}
function breathTouch(c, list) {              // 雲に重なっている敵: 初めて入った人は 1.5 秒動けなくする（盾・カウンターの構えは効かない）。0.25 秒ごとにダメージ
  const tick = c.t > 0 && c.t % BREATH_TICK === 0;

}
function updateBreaths(list) {
  for (let i = game.bc.length - 1; i >= 0; i--) {
    const c = game.bc[i];
    if (++c.t > BREATH_LIFE) { game.bc.splice(i, 1); continue; }

}
function updateSyringes(list) {
  const pls = platforms();

    if (s.air) {                                             // 落ちている途中: 足場に着いたら置かれる（触れても何も起きない）
      const oy = s.y; s.vy = Math.min(14, s.vy + 0.6); s.y += s.vy;
      for (const pl of pls) if (oy <= pl.y + 0.01 && s.y >= pl.y && s.x > pl.x + 2 && s.x < pl.x + pl.w - 2) { s.y = pl.y; s.air = 0; s.vy = 0; s.t = 0; break; }
      if (s.air && s.y > KO_B) game.sy.splice(i, 1);

    }
    if (++s.t > SY_LIFE || !itemOnPlatform(s.x, s.y)) { game.sy.splice(i, 1); continue; }   // 時間切れ・足場が縮んで無くなった

const LAYOUT_KEY = "shieldfight-layout", BTN_KEYS = ["l", "r", "a", "k", "u"], LAYOUT_PROPS = ["position", "left", "top", "right", "bottom", "--b", "width", "height", "z-index"];
const SIZE_MIN = 0.5, SIZE_MAX = 2;
const btnEl = k => document.querySelector('#touch .tb[data-k="' + k + '"]');
const clamp01 = v => Math.max(0, Math.min(1, v));
function sanitizeLayouts(j) {
  const out = { land: null, port: null };
  for (const m of ["land", "port"]) {
    const o = j && j[m]; if (!o) continue;
    const r = {}; let ok = true;
    for (const k of BTN_KEYS) {
      const e = o[k];
      if (!e || ![e.x, e.y, e.s].every(v => typeof v === "number" && Number.isFinite(v))) { ok = false; break; }
      r[k] = { x: clamp01(e.x), y: clamp01(e.y), s: Math.max(SIZE_MIN, Math.min(SIZE_MAX, e.s)) };
    }
    if (ok) out[m] = r;
  }

}
let layouts = { land: null, port: null };
try { layouts = sanitizeLayouts(JSON.parse(localStorage.getItem(LAYOUT_KEY) || "null")); } catch (e) {}
const saveLayouts = () => { try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(layouts)); } catch (e) {} };
const layoutMode = () => land ? "land" : "port";
let editing = false, editLayout = null, editMode = "", editSel = "a", editDefault = false;
function baseBtnPx() {                       // 標準のボタンの大きさ（--b を px にしたもの。縦・横で違う）
  const pr = document.createElement("div"); pr.style.cssText = "position:absolute;visibility:hidden;width:var(--b);height:1px";
  document.body.appendChild(pr); const w = pr.offsetWidth; pr.remove(); return w || 80;
}
function clearLayoutStyles() { for (const k of BTN_KEYS) { const el = btnEl(k); for (const pr of LAYOUT_PROPS) el.style.removeProperty(pr); } }
function applyLayout() {
  clearLayoutStyles();

  document.body.classList.toggle("customlayout", !!L);
  BTN_KEYS.forEach(k => btnEl(k).classList.toggle("sel", editing && k === editSel));
  if (!L) return;
  const W = window.innerWidth, H = window.innerHeight, b = baseBtnPx();
  for (const k of BTN_KEYS) {
    const e = L[k], el = btnEl(k), sz = Math.round(b * e.s);
    const x = Math.max(sz / 2, Math.min(W - sz / 2, e.x * W)), y = Math.max(sz / 2, Math.min(H - sz / 2, e.y * H));   // 画面からはみ出さない
    const st = el.style;
    st.setProperty("position", "fixed"); st.setProperty("left", Math.round(x - sz / 2) + "px"); st.setProperty("top", Math.round(y - sz / 2) + "px");
    st.setProperty("right", "auto"); st.setProperty("bottom", "auto"); st.setProperty("--b", sz + "px");      // --b を変えると、文字や印の大きさも一緒に変わる
    st.setProperty("width", sz + "px"); st.setProperty("height", sz + "px"); st.setProperty("z-index", "5");

}

  const W = window.innerWidth, H = window.innerHeight, b = baseBtnPx(), L = {};

function openLayoutEditor() {

  applyLayout(); uiKey = ""; renderUI();

function startBtnDrag(e, k) {

  const r = el.getBoundingClientRect(), ox = e.clientX - (r.left + r.width / 2), oy = e.clientY - (r.top + r.height / 2);
  const move = ev => { editLayout[k].x = clamp01((ev.clientX - ox) / window.innerWidth); editLayout[k].y = clamp01((ev.clientY - oy) / window.innerHeight); applyLayout(); };
  const up = () => {
    el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up);

    editLayout[k].x = clamp01((rr.left + rr.width / 2) / window.innerWidth); editLayout[k].y = clamp01((rr.top + rr.height / 2) / window.innerHeight);

    <p>ボタンをドラッグして動かします。縦画面と横画面は別々に覚えます（スマホを回すと、もう一方を編集できます）</p>
    <div class="lrow"><span><b id="lszName"></b> の大きさ</span><input type="range" id="lsz" min="${SIZE_MIN * 100}" max="${SIZE_MAX * 100}" step="5"><span id="lszv"></span></div>
    <button id="lDone">完了</button><button id="lReset" class="sub">標準に戻す</button></div>`;
  ui.querySelector("#lsz").oninput = e => { editLayout[editSel].s = Number(e.target.value) / 100; editDefault = false; applyLayout(); ui.querySelector("#lszv").textContent = e.target.value + "%"; };

  if (editing || layouts.land || layouts.port) applyLayout();

setInterval(() => { if (role === "client") { sentKeys = -1; pushKeys(); } }, 500);   // 取りこぼし対策

// 色: 0 = いつもの色（キャラごと）/ 1 赤 / 2 黄 / 3 青 / 4 緑。チーム戦はチームの色
const PAL_COLS = ["", "#e8463c", "#f2c12e", "#2f7df5", "#2fb44a"], PAL_NAMES = ["いつもの色", "赤", "黄", "青", "緑"];
const charStd = idx => CDRAW.std((CHARS[idx] || CHARS[0]).id);
const bodyCol = (idx, pc) => pc > 0 && PAL_COLS[pc] ? PAL_COLS[pc] : charStd(idx);
// 文字に使う色: 暗い色（黒いコートなど）は、暗い背景でも読めるよう明るくする
function textCol(hex) {
  const n = parseInt(String(hex).slice(1), 16); if (!Number.isFinite(n)) return hex;
  const r = n >> 16, g = (n >> 8) & 255, b = n & 255, l = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  if (l > 0.45) return hex;
  const k = 0.55; return `rgb(${Math.round(r + (255 - r) * k)},${Math.round(g + (255 - g) * k)},${Math.round(b + (255 - b) * k)})`;
}
function drawChar(c, idx, x, y, f, col, flash, o) {
  c.save(); c.translate(x, y); if (f < 0) { c.translate(PLW, 0); c.scale(-1, 1); }
  CDRAW.draw(c, (CHARS[idx] || CHARS[0]).id, flash ? "#ffffff" : col, o || {});
  c.restore();
  const id = (CHARS[idx] || CHARS[0]).id;
  if (id === "yani" && o && (o.cs | 0) >= 4) { c.fillStyle = "#fde047"; c.font = "bold 10px sans-serif"; c.textAlign = "center"; c.fillText("×" + (o.cs | 0), x + 20, y + 62); }   // タバコが 4 本以上: 数（文字は反転しない）
}

const barHtml = (v, c, base) => {
  const b = base === undefined ? v : base;             // up: 上がったぶん / dn: 下がったぶん（狂化の防御）
  return `<span class="g" style="--c:${c}">${[1, 2, 3, 4, 5, 6].map(n => `<i class="${n <= v ? (n > b ? "on up" : "on") : (n <= b ? "dn" : "")}"></i>`).join("")}</span>`;
};

const LAND_STATS = true;

  const ids = [];

    const bars = LAND_STATS ? `<div class="hs">${STATS.map((st, k) => barHtml(vals[k], st.color, bases[k])).join("")}</div>` : "";
    return `<div class="hc${i === myId ? " me" : ""}" style="--c:${textCol(colOf(i))}"><div><b>${esc(nameOf(i))}</b>` +
      `<div class="sub"><span>${esc(c.name)}${p.lv > 0 ? " ♥" + p.lv : ""}</span><span class="wn">${wins}</span></div></div>${bars}</div>`;

// 戦闘中だけ、画面の下に全員のキャラと性能と勝ち数を、1 人ずつのカード（縦並び）で表示する
function statsHtml() {
  if (land) return landStatsHtml();
  let html = "";
  for (let i = 0; i < MAX_PLAYERS; i++) {
    const p = game.p[i];

    const c = chOf(p), wins = Array.from({ length: game.wr }, (_, k) => `<i class="${k < p.w ? "on" : ""}"></i>`).join("");
    const vals = [effA(p), effD(p), effS(p)], bases = [baseStat(p, "A"), baseStat(p, "D"), baseStat(p, "S")];   // もとの値（リバーシは今の形態）

// 横画面モード: タッチ操作の端末（スマホ・タブレット）を横持ちしているとき。URL に ?land=1 で強制オン、?land=0 で強制オフ（PC で見た目を確かめる用）
let landForce = new URLSearchParams(location.search).get("land");

  const v = landForce === "1" || (landForce !== "0" && coarseMq.matches && window.innerWidth > window.innerHeight);
  if (v === land) return;
  land = v; cam.init = false; lastHud = "";
  document.body.classList.toggle("land", land);

}
let lastHud = "";
function refreshHud() {
  const me = game.p[myId];
  const inBattle = !!(role && net === "ready" && me && game.ph !== "lobby");
  const sig = (inBattle ? 1 : 0) + "|" + (land ? 1 : 0) + "|" + (late() ? 1 : 0) + "|" + game.ph + "|" + game.wr + "|" + myId + "|" +
    game.p.map(p => p ? [p.c ? 1 : 0, p.lk ? 1 : 0, p.ch, p.lv, p.w, p.n, p.tg | 0, p.bz > 0 ? 1 : 0, p.gt > 0 ? 1 : 0, p.fm ? 1 : 0, p.slw > 0 ? 1 : 0, p.ub > 0 ? 1 : 0, p.nc > 0 ? 1 : 0, (p.ybs || []).join("/"), withdrawn(p) ? 1 : 0, Math.floor(effA(p)) + "/" + Math.floor(effD(p)) + "/" + Math.floor(effS(p))].join(",") : "-").join("|");
  if (sig === lastHud) return;

  stats.style.display = inBattle ? "flex" : "none";
  if (inBattle) stats.innerHTML = statsHtml();
}

  else if ((CHARS[idx] || CHARS[0]).id === "wizard") c.setTransform(1.15, 0, 0, 1.15, 12, 22);   // 魔法使いは、帽子の先が欠けないよう少し小さく、下げて描く

// ステージの小さい絵: 本物の足場（stageBase）・ゲート・ばねの位置で描く
function ymDrawStage(cv, st, nf) {
  const c = cv.getContext("2d"), Wc = cv.width, Hc = cv.height;
  if (st < 0) { c.fillStyle = "#8b5cf6"; c.fillRect(0, 0, Wc, Hc); c.fillStyle = "#fff"; c.font = `900 ${Hc * 0.6}px sans-serif`; c.textAlign = "center"; c.fillText("?", Wc / 2, Hc * 0.72); return; }
  drawStageBg(c, Wc, Hc, st, 0);
  const pls = stageBase(st, nf, FLOAT_T * 0.15);
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const p of pls) { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x + p.w); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y + 50); }
  if (st === 2) for (const w of WARPS) { x0 = Math.min(x0, w[0] - 40); x1 = Math.max(x1, w[0] + 40); y0 = Math.min(y0, w[1] - 40); y1 = Math.max(y1, w[1] + 40); }
  const s = Math.min(Wc / (x1 - x0 + 160), Hc / (y1 - y0 + 200)), ox = Wc / 2 - (x0 + x1) / 2 * s, oy = Hc * 0.55 - (y0 + y1) / 2 * s;
  c.save(); c.translate(ox, oy); c.scale(s, s);
  if (st === 2) WARPS.forEach((w, k) => { c.strokeStyle = WARP_COL[k]; c.lineWidth = 5; c.globalAlpha = w[2] < 0 ? 0.5 : 1; c.beginPath(); c.ellipse(w[0], w[1], WARP_R * 0.75, WARP_R, 0, 0, 6.3); c.stroke(); });
  c.globalAlpha = 1;
  for (const pl of pls) drawPlat(c, st, pl, 0);
  if (st === 3) for (const sp of SPRINGS) { const half = sp[2] / 2; c.fillStyle = "#f97316"; c.fillRect(sp[0] - half, sp[1] - 12, sp[2], 6); }
  c.restore();
}

function ymOnClick(e) {

    st.insertAdjacentHTML("beforeend", `<div class="ym-pop" style="left:${Math.min(x, ymPort() ? 360 : 760)}px;top:${y}px"><h3>CPU を追加：強さは？</h3>`
      + AI_LEVELS.map((l, v) => `<div class="b" data-lv="${v}" style="background:${["#6fbf4a", "#f0a020", "#e8463c"][v] || "#888"}">${esc(l.name)}<small>${esc(l.desc)}</small></div>`).join("") + `</div>`);
    return;
  }
  if (A === "rm") { if (host && p && p.cpu) removeRoomCpu(i); return; }
  if (e.target.closest(".plate")) return;
  const mine = i === myId, cpu = host && p && p.cpu;
  if (!mine && !cpu) return;
  // パネル: 色（チーム戦ならチーム）を順に変える
  if (game.tmd) { const nx = (tgOf(i) % 4) + 1; if (mine) ymSendProf({ tg: nx }); else { p.tg = nx; renderUI(); } return; }
  // いつもの色 → 赤 → 黄 → 青 → 緑。同じキャラを同じ色で選んでいる人（分かる範囲）がいれば飛ばす
  const pcOf = j => (game.p[j] && game.p[j].pc) | 0, chOfS = j => ymSeen(j);
  const myC = chOfS(i), others = connectedSlots().filter(j => j !== i && myC != null && chOfS(j) === myC).map(pcOf), cur = pcOf(i);
  let nx = cur; for (let n = 1; n <= 5; n++) { const c = (cur + n) % 5; if (!others.includes(c)) { nx = c; break; } }
  if (mine) ymSendProf({ pc: nx }); else { p.pc = nx; renderUI(); }
}

let uiKey = "";
function renderUI() {
  refreshHud();
  const me = game.p[myId];
  let key;
  if (editing) key = "layout";
  else if (role === null) key = ymCharInfo ? "chars" : "title";
  else if (net === "error") key = "error";
  else if (spectating && net === "ready") key = "spectate";
  else if (net !== "ready" || !me) key = "connecting";
  else if (solo && game.ph === "lobby") key = soloStage ? "stage" : "solo";
  else if (game.ph === "lobby") key = role === "host" && soloStage ? "stage" : "online";   // オンラインの部屋（2026-11-27: 新しいキャラ選択）
  else if (!me.rd) key = "setup";
  else if (game.ph === "lobby") key = "lobby";
  else key = "none";
  if (key === uiKey && key === "online") { ymOnPaint(); return; }   // 部屋の様子が変わった: 中身だけ塗り直す
  if (key === uiKey && (key === "setup" || key === "solo" || key === "stage" || key === "chars" || key === "title" || key === "none" || key === "layout")) return;   // 入力中の画面を作り直さない
  uiKey = key;
  document.body.classList.toggle("inapp", key !== "title");
  document.body.classList.toggle("ym", key === "title" || key === "solo" || key === "stage" || key === "chars" || key === "online");   // 新しいメニュー（2026-11-27）     // タイトル画面以外では、タイトルへ戻るボタンを出す
  if (key === "title") showHome();   // 2026-11-27: 新しいホーム画面（ymHomeSvg）
  else if (key === "layout") {
    showLayoutEditor();
  } else if (key === "connecting") {
    ui.innerHTML = `<div class="panel"><h1>接続中…</h1></div>`;
  } else if (key === "error") {
    ui.innerHTML = `<div class="panel"><h1>エラー</h1><p>${esc(netMsg)}</p><button id="bTop">トップへ</button></div>`;
    document.getElementById("bTop").onclick = goTitle;
  } else if (key === "setup") showSelect();
  else if (key === "solo") showSoloSelect();
  else if (key === "stage") showStageSelect();
  else if (key === "chars") showCharInfo();
  else if (key === "online") showOnlineSelect();
  else if (key === "lobby") showLobby();
  else if (key === "spectate") ui.innerHTML = game.ph === "lobby" ? `<div class="panel"><h1>観戦</h1><p>試合が始まるのを待っています（遊ぶ人がキャラを選んでいます）</p></div>` : "";
  else ui.innerHTML = "";
}

// 自分のスキルボタン（スマホ）と、キーボード用の表示を更新する
const skBtn = document.querySelector(".tb.skill"), skHint = document.getElementById("skillhint");
let lastSk = "";
function updateSkillUI() {
  const me = game.p[myId];
  let state = "none", label = "なし", sec = "", ratio = 0, bg = "", wizHint = "";   // bg: ボタンの色（魔法使いの段階）/ wizHint: 魔法使いの説明
  if (role && net === "ready" && me && game.ph !== "lobby" && me.yr && !me.al) {   // 幽霊: スキルボタンも爆弾（攻撃ボタンでも落とせる）
    label = "爆弾";
    if (me.yrc > 0) { state = "cool"; ratio = Math.min(1, me.yrc / YUREI_CD); sec = String(Math.ceil(me.yrc / 60)); } else state = "ready";
  } else if (role && net === "ready" && me && game.ph !== "lobby") {
    const sk = chOf(me).skill;
    if (sk) {
      label = sk.name;
      const id = chOf(me).id, zone = id === "swapper" ? zoneOf(me) : null;
      if (id === "spider") {                                     // 蜘蛛: 今の居場所で使う効果の名前と、その効果のクールタイム
        const m = role === "client" ? (me.wm | 0) : webMode(me), k = me.wk[m] | 0;
        label = ["崖へ", "引き寄せ", "急降下"][m] || sk.name;
        if (k > 0) { state = "cool"; ratio = Math.min(1, k / (me.wkm[m] || Math.round(WEB_CD[m] * cdMul()))); sec = String(Math.ceil(k / 60)); } else state = "ready";
      }
      else if (id === "wizard") {                                // 魔法使い: 魔法書の耐久（📖）と、ためている魔法の段階
        if (me.bd <= 0) { state = "cool"; label = "本なし"; ratio = Math.min(1, me.bdT / BOOK_REGEN); sec = String(Math.ceil(me.bdT / 60)); }
        else if (me.mc > 0) { state = "charge"; label = "詠唱"; sec = "📖" + me.bd; bg = MAGIC[Math.max(1, me.ml) - 1].btn; }
        else if (me.mg > 0) {                                     // ためている（mgr）/ 止まっている。ボタンの色は段階の色
          const M = MAGIC[magicLv(me.mg) - 1], full = me.mg >= MAGIC_FULL;
          state = me.mgr ? "charge" : "ready"; label = M.name; sec = "📖" + me.bd; bg = M.btn;
          wizHint = me.mgr ? "もう一度押すと発射（動くと止まる）" : full ? "押すと発射" : "止まっている  押すとため再開";
        }
        else { state = "ready"; label = "ため始め"; sec = "📖" + me.bd; wizHint = "押すとため始める（地上で動くと止まる。空中では横に動いてもたまる）"; }

      }
      else if (id === "killua") {                                // キルア: 地上はカンムルのオン/オフ、空中はナルカミ。数字はカミナリの量（⚡）
        const kz = me.kz | 0, air = role === "client" ? !!me.ka : !me.ground;
        label = air ? "ナルカミ" : me.kr ? "カンムル解除" : "カンムル"; sec = "⚡" + kz;
        if (me.kc > 0) { state = "cool"; ratio = Math.min(1, me.kc / (me.km || KL_TOG)); }
        else if (air ? kz < KL_NK_COST : (!me.kr && kz < KL_ON_MIN)) { state = "cool"; ratio = 1 - kz / (air ? KL_NK_COST : KL_ON_MIN); }
        else state = me.kr ? "charge" : "ready";
      }
      else if (zone) { state = "ready"; label = "入れ替え"; sec = String(Math.ceil(zone.t / 60)); }   // スワッパーの ゾーンがある間（数字は円が消えるまでの秒数）
      else if (me.ks > 0) { state = "charge"; label = "ため中"; }
      else if (id === "archer" && me.am <= 0) { state = "cool"; label = "矢なし"; ratio = 1 - me.amT / ARROW_REGEN; sec = "0"; }   // 矢がないとき: 次の 1 本までを円で出す
      else if (me.kc > 0) { state = "cool"; ratio = Math.min(1, me.kc / (me.km || skCd(me))); sec = String(Math.ceil(me.kc / 60)); }
      else if (id === "boomer" && me.sbk > 0) { state = "cool"; label = "盾なし"; ratio = Math.min(1, me.sbk / SHIELD_BREAK_FRAMES); sec = String(Math.ceil(me.sbk / 60)); }   // 盾が壊れている間は投げられない
      else if (id === "boomer" && me.bt > 0) { state = "cool"; label = "盾なし"; ratio = Math.max(0, 1 - me.bt / BOOM_REGEN); sec = String(Math.max(1, Math.ceil((BOOM_REGEN - me.bt) / 60))); }   // 投げている間（受け止めるか、5 秒で新しい盾）
      else if (id === "bomber" && bombsOf(me).length >= bombMax()) {   // 爆弾が画面に 2 個（ラストスパート中は 4 個）: いちばん古い爆弾が爆発するまで
        const t = Math.max(0, BOMB_FUSE - bombsOf(me)[0].t);
        state = "cool"; label = "爆弾2個"; ratio = Math.min(1, t / BOMB_FUSE); sec = String(Math.max(1, Math.ceil(t / 60)));
      }
      else state = "ready";
      if (chOf(me).id === "archer" && state !== "cool") sec = "×" + me.am;      // アーチャー: 残りの矢の本数
      if (id === "bomber" && state === "ready") sec = "×" + (bombMax() - bombsOf(me).length);   // ボマー: あと何個投げられるか
    }
  }
  const key = [state, label, sec, Math.round(ratio * 50), bg, wizHint].join("|");
  if (key === lastSk) return;
  lastSk = key;
  skBtn.dataset.state = state; skBtn.style.setProperty("--p", ratio.toFixed(3));
  if (bg) skBtn.style.background = bg; else skBtn.style.removeProperty("background");
  skBtn.querySelector("b").textContent = label; skBtn.querySelector("i").textContent = sec;
  const wiz = sec && sec.startsWith("📖");                       // 魔法使い（数字は魔法書の耐久）
  skHint.textContent = state === "none" ? "スキルなし" : "[X] " + label + (wiz ? (wizHint ? "  " + wizHint : "") + "  耐久 " + sec.slice(2) : sec && sec[0] === "×" ? (label === "ボム" ? "  あと " + sec.slice(1) + " 個" : "  矢 " + sec) : state === "ready" ? (sec ? "  円が消えるまで " + sec + " 秒" : "  準備OK") : state === "charge" ? "  ためて離す" : label === "矢なし" ? "  1本回復するまで待つ" : "  あと " + sec + " 秒");

}

// ---------- 効果音と演出 ----------
// 効果音は WebAudio で合成する（音声ファイルは使わない）。ブラウザの決まりで、最初の操作のあとから鳴る
const Sfx = (() => {
  let ac = null, master = null, buf = null, muted = false;
  try { muted = localStorage.getItem("shieldfight-muted") === "1"; } catch (e) {}
  function init() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { ac = new AC(); } catch (e) { ac = null; return; }
      master = ac.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(ac.destination);
      buf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);              // ノイズの素材（1 秒）
      const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === "suspended") ac.resume();
  }
  const env = (g, t0, dur, vol) => {                                       // すぐ立ち上がって減衰する音量の形
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0002), t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  };
  function tone(f0, f1, dur, type, vol, delay) {                           // f0 → f1 に音程が動く音
    if (!ac || muted || document.hidden) return;                           // 裏にいる間は鳴らさない（止まった AudioContext に予約がたまって、戻ったときに一斉に鳴らないように）
    const t0 = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    env(g, t0, dur, vol); o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function noise(dur, vol, type, f0, f1, delay) {                          // フィルターを通したノイズ
    if (!ac || muted || document.hidden) return;
    const t0 = ac.currentTime + (delay || 0), s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = buf; f.type = type; f.Q.value = 1; f.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    env(g, t0, dur, vol); s.connect(f); f.connect(g); g.connect(master); s.start(t0, Math.random() * 0.3); s.stop(t0 + dur + 0.03);
  }
  // 裏（タブ・アプリが見えない）になったら AudioContext を止め、表に戻ったら再開する
  function suspend() { try { if (ac && ac.state === "running") { const r = ac.suspend(); if (r && r.catch) r.catch(() => {}); } } catch (e) {} }
  function resume() { try { if (ac && ac.state === "suspended") { const r = ac.resume(); if (r && r.catch) r.catch(() => {}); } } catch (e) {} }
  return {
    init, suspend, resume,
    get muted() { return muted; },
    setMuted(m) {
      muted = !!m;
      try { localStorage.setItem("shieldfight-muted", muted ? "1" : "0"); } catch (e) {}
      if (master) master.gain.value = muted ? 0 : 0.6;
    },
    swing() { noise(0.12, 0.10, "bandpass", 700, 2600); },
    jump() { tone(280, 560, 0.09, "sine", 0.07); },
    block() { tone(920, 900, 0.14, "triangle", 0.18); tone(1380, 1350, 0.10, "square", 0.05); noise(0.04, 0.12, "highpass", 3500, 3500); },
    hit(f) { f = f || 1; tone(190, 45, 0.18 + 0.10 * f, "sine", 0.45); noise(0.09, 0.20, "lowpass", 2600, 500); tone(540, 150, 0.08, "square", 0.07); },
    shieldBreak() { noise(0.5, 0.26, "highpass", 2500, 7000); tone(1900, 320, 0.30, "triangle", 0.16); tone(1250, 220, 0.25, "square", 0.06, 0.04); },
    ko() { tone(720, 90, 0.5, "sine", 0.16); noise(0.25, 0.10, "lowpass", 1600, 300); },
    beep(go) { if (go) tone(990, 990, 0.32, "square", 0.10); else tone(660, 660, 0.12, "square", 0.09); },
    tick(urgent) { const f = urgent ? 1180 : 880; tone(f, f, 0.07, "square", 0.07); },
    // 決着の落下音（ko）と重ならないよう、少し遅らせて鳴らす
    roundEnd(win) { (win ? [523, 659, 784] : [392, 330, 262]).forEach((f, i) => tone(f, f, 0.15, "triangle", 0.18, 0.45 + i * 0.11)); },
    matchEnd(win) { (win ? [523, 659, 784, 1047, 784, 1047] : [523, 440, 392, 330, 294, 262]).forEach((f, i) => tone(f, f, 0.17, "triangle", 0.18, 0.45 + i * 0.12)); },   // 負けた側は下がっていく曲
    siren() { tone(260, 520, 0.45, "sawtooth", 0.10); tone(520, 260, 0.45, "sawtooth", 0.10, 0.45); },
    rumble() { noise(0.6, 0.22, "lowpass", 260, 70); tone(70, 40, 0.5, "sine", 0.25); },
    // スキル
    throwBomb() { noise(0.18, 0.12, "bandpass", 300, 1100); tone(220, 440, 0.12, "sine", 0.06); },

  if (shakeAmp > 0.25) { ox = (Math.random() * 2 - 1) * shakeAmp; oy = (Math.random() * 2 - 1) * shakeAmp; shakeAmp *= Math.pow(0.86, dt); }
  else shakeAmp = 0;
  // 注射器に触れた: 自分の画面だけが、ぐらぐら揺れて傾き、ぼやけて色が変わる（終わりの 0.5 秒で弱まる）
  const meP = myId >= 0 ? game.p[myId] : null, drug = meP && meP.al && meP.dr > 0 && game.ph === "play" ? Math.min(1, meP.dr / 30) : 0;
  setDrugView(drug > 0);
  cx.save();
  if (drug) {
    ox += (Math.sin(now / 95) * 16 + (Math.random() * 2 - 1) * 5) * drug; oy += Math.cos(now / 130) * 10 * drug;
    cx.translate(cw / 2, ch / 2); cx.rotate(Math.sin(now / 260) * 0.09 * drug); cx.scale(1 + 0.06 * drug, 1 + 0.06 * drug); cx.translate(-cw / 2, -ch / 2);
  }
  cx.translate(ox + cw / 2 - cam.x * cam.s, oy + ch / 2 - cam.y * cam.s);
  cx.scale(cam.s, cam.s);
  // ステージ（メイン＋人数に応じた上の台）。サドンデス中は縮んでいく端が赤く点滅する
  const sdOn = game.sd > 0, blink = Math.floor(now / 250) % 2 === 0;
  drawStageBack(now);                              // ゲートの輪・ばね（足場の前に描くと人と重なるので、ここで）
  for (const pl of platforms()) {
    drawPlat(cx, game.st | 0, pl, now);                               // 足場（ステージごとの色と飾り）
    if (sdOn) {
      cx.fillStyle = blink ? "#ef4444" : "#b91c1c";
      const th = pl.main ? 22 : UP_H;
      cx.fillRect(pl.x, pl.y, 5, th); cx.fillRect(pl.x + pl.w - 5, pl.y, 5, th);
    }
  }
  // 撃墜ライン: この外へ出ると脱落する。崖の外まで映っているときだけ、うっすら見える
  if (game.ph !== "lobby" && (camView.x0 < KO_L || camView.x1 > KO_R || camView.y1 > KO_B || camView.y0 < KO_T)) {
    const v = camView, top = Math.max(KO_T, Math.min(v.y0, KO_B));
    cx.save(); cx.strokeStyle = "rgba(248,113,113,0.38)"; cx.lineWidth = 2 / cam.s; cx.setLineDash([12 / cam.s, 9 / cam.s]);
    cx.beginPath();
    if (v.x0 < KO_L) { cx.moveTo(KO_L, top); cx.lineTo(KO_L, KO_B); }
    if (v.x1 > KO_R) { cx.moveTo(KO_R, top); cx.lineTo(KO_R, KO_B); }
    if (v.y1 > KO_B) { cx.moveTo(Math.max(v.x0, KO_L), KO_B); cx.lineTo(Math.min(v.x1, KO_R), KO_B); }
    if (v.y0 < KO_T) { cx.moveTo(Math.max(v.x0, KO_L), KO_T); cx.lineTo(Math.min(v.x1, KO_R), KO_T); }   // 上の撃墜ライン
    cx.stroke(); cx.restore();
  }
  for (const k of inks) {                          // スパッタリーのインクの跡（足場の上面に平たく。終わりの 1 秒で薄くなる）
    cx.globalAlpha = Math.min(0.85, (240 - k.t) / 60); cx.fillStyle = k.c;
    cx.beginPath(); cx.ellipse(k.x, k.y, k.r, k.r * 0.32, 0, 0, 6.2832); cx.fill();
  }
  cx.globalAlpha = 1;
  for (const w of game.wd) drawWind(w, now);
  for (const f of game.fl) drawFlower(f, now);
  for (const sy of game.sy) drawSyringe(sy, now);
  for (const cg of game.cg) drawCig(cg, now);
  for (const bc of game.bc) drawBreath(bc, now);
  for (const m of game.rm) drawPlacedZone(m, now);
  for (const c of game.cb) drawCb(c, now);
  for (const p of game.p) if (p && p.c && p.al && p.ks > 0 && chOf(p).id === "swapper") drawZone(p);
  drawRewindGhosts(dt);
  // プレイヤーと分身（吹っ飛んでいる間は残像を引く。巻き戻し中は、通った場所に青い残像を残す）
  const drawWithTrail = (p, i, me) => {
    if (!p.al && p.yr) { drawYurei(p, i, me, now); return; }
    const h = p.hist || (p.hist = []);
    h.push(p.x, p.y); if (h.length > 14) h.splice(0, 2);
    if (p.al && p.rw > 0 && rwGhosts.length < 80) rwGhosts.push({ x: p.x, y: p.y, f: p.f, ch: p.ch, t: 0 });
    if (p.al && (p.s > 0 || p.sp > 0)) {                                 // 吹っ飛び中と、スパッタリーのステップ中
      cx.save(); cx.fillStyle = p.isClone ? CLONE_COLOR : colOf(i);
      const tz = p.gt > 0 ? GIANT_SCALE : 1;
      for (let k = 0; k < h.length - 2; k += 2) { cx.globalAlpha = 0.05 + 0.2 * (k / h.length); cx.fillRect(h[k], h[k + 1], PLW * tz, PLH * tz); }
      cx.restore();
    }
    drawPlayer(p, i, me, now);
  };
  for (let i = 0; i < MAX_PLAYERS; i++) { const c = game.cl[i]; if (c) drawWithTrail(c, i, false); }
  for (let i = 0; i < MAX_PLAYERS; i++) { const p = game.p[i]; if (p && p.c) drawWithTrail(p, i, i === myId); }
  for (const m of game.mn) drawMinion(m, now);
  for (const b of game.pj) { if (b.k === 0) drawBomb(b, now); else if (b.k === 2) drawThrownShield(b); else if (b.k === 3) drawYureiBomb(b, now); else if (b.k === 4) drawSpear(b); else if (b.k === 5) drawMagic(b, now); else if (b.k === 6) drawBeam(b, now); else if (b.k === 7) drawHadou(b, now); else if (b.k === 8) drawUmbrella(b.x, b.y, Math.sign(b.pw) || 1, 1, b.t > UMB_LIFE - 40 && Math.floor(now / 80) % 2 === 0, UMB_HP * (1 - (b.dm || 0) / UMB_DMG_MAX)); else if (b.k === 9) drawUltra(b, now)
; else drawArrow(b); }
  drawFx();
  cx.restore();
  if (drug) { cx.fillStyle = "rgba(168,85,247," + ((0.12 + 0.08 * Math.sin(now / 150)) * drug).toFixed(3) + ")"; cx.fillRect(0, 0, cw, ch); }
  if (flashA > 0.02) { cx.fillStyle = "rgba(255,255,255," + flashA.toFixed(3) + ")"; cx.fillRect(0, 0, cw, ch); flashA *= Math.pow(0.8, dt); }
  else flashA = 0;
  // メッセージ
  drawTimer(now);
  if (role === "client" && pingMs > 0 && net === "ready") {             // 参加者だけ: 通信の往復時間（緑 < 80ms / 黄 < 150ms / 赤）と、補間の遅らせ方
    const ms = Math.round(pingMs), y = land ? 56 : Math.max(16, Math.min(34, cw / 13)) + 24;
    cx.save(); cx.font = "11px sans-serif"; cx.textAlign = "center";
    cx.fillStyle = ms < 80 ? "rgba(134,239,172,0.8)" : ms < 150 ? "rgba(253,224,71,0.8)" : "rgba(248,113,113,0.85)";
    cx.fillText("通信 " + ms + "ms" + (interpOn ? " ・補間 " + Math.round(interpD * STEP_MS) + "ms" : ""), cw / 2, y);
    cx.restore();
  }
  if (game.ph === "count") banner(String(Math.ceil(game.tm / 60)), "ラウンド開始！" + ((game.st | 0) || game.ss < 0 ? " ステージ「" + stageName(game.st | 0) + "」" : ""));
  else if (game.ph === "round") banner(game.win >= 0 ? (game.wt ? teamWord(game.wt) : nameOf(game.win)) + " の勝ち！" : "引き分け");
  else if (game.ph === "match") banner((game.wt ? teamWord(game.wt) : nameOf(game.win)) + " 優勝！", "まもなくロビーに戻ります");

  else if (game.ph === "play") {
    if (fxSdT > 0) banner("サドンデス！", "足場が縮みます");
    else if (fxGoT > 0) banner("GO!");
    const yr = myId >= 0 && game.p[myId] && !game.p[myId].al && game.p[myId].yr;
    if (!yr) yureiSince = 0; else if (!yureiSince) yureiSince = now;
    const hintY = land ? 96 : Math.max(16, Math.min(34, cw / 13)) + 34;
    let lateY = hintY;                                     // ラストスパートの文の位置（幽霊の説明が出ているときは、その下）
    if (myId >= 0 && game.p[myId] && !game.p[myId].al && (!yr || now - yureiSince < 4000)) {   // 幽霊の説明は、なってから 4 秒だけ
      cx.fillStyle = "rgba(255,255,255,.6)"; cx.textAlign = "center";
      if (yr) {
        cx.font = Math.min(15, cw / 28) + "px sans-serif";
        cx.fillText("幽霊になった！ 攻撃ボタンで爆弾を置く（1秒後に爆発）", cw / 2, hintY);
        cx.fillText("落ちても幽霊で復活", cw / 2, hintY + 18); lateY = hintY + 40;
      } else { cx.font = "18px sans-serif"; cx.fillText("観戦中", cw / 2, hintY); lateY = hintY + 26; }
    }
    if (fxLateT > 0) {                                      // ラストスパート突入の知らせ（約 3 秒。最後の 0.5 秒で消える）
      const a = Math.min(1, fxLateT / 30), pop = 1 + 0.25 * Math.max(0, 1 - (180 - fxLateT) / 8), fs = Math.min(26, cw / 15) * pop;
      cx.save(); cx.globalAlpha = a; cx.textAlign = "center"; cx.lineJoin = "round"; cx.lineWidth = 4; cx.strokeStyle = "rgba(0,0,0,0.55)";
      cx.font = "bold " + fs + "px sans-serif"; cx.strokeText("ラストスパート！", cw / 2, lateY + 6); cx.fillStyle = "#fb923c"; cx.fillText("ラストスパート！", cw / 2, lateY + 6);
      cx.font = Math.min(15, cw / 26) + "px sans-serif"; cx.lineWidth = 3;
      cx.strokeText("スキルのクールタイムが半分に", cw / 2, lateY + 28); cx.fillStyle = "#fed7aa"; cx.fillText("スキルのクールタイムが半分に", cw / 2, lateY + 28);
      cx.restore();
    }
  }
  if (role === "client" && hostPause) {                    // ホストが画面を離れている間は、ゲームが止まっている
    cx.fillStyle = "rgba(0,0,0,0.55)"; cx.fillRect(0, 0, cw, ch);
    cx.fillStyle = "#fff"; cx.textAlign = "center"; cx.font = "bold " + Math.max(12, Math.min(24, (cw - 20) / 21)) + "px sans-serif";
    cx.fillText("ホストが画面を離れているため一時停止中", cw / 2, ch / 2);
  }
}
function loop() { render(); requestAnimationFrame(loop); }

applyLayout();
renderUI();
loop();
</script>
</body>
</html>

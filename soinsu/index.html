<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from "three";

// ================= 設定 =================
const PREFIX = "soinsu-battle-v1-";
const MAX_PLAYERS = 8;
const ARENA = 30;        // 半径（フィールドは 60×60）
const RANGE = 14;        // 打ち込める距離
const SPEED = 6;
const RADIUS = 0.5;
const EYE = 1.6;
const COOLDOWN = 1.0;    // 打ち込み後に待つ秒数
const COLORS = [0xff5a5a, 0x4aa3ff, 0x5ad16a, 0xffc23a, 0xc77dff, 0xff8fc8, 0x3ad6d0, 0xff8a3a];
const OBST = [
  { x: 0, z: 0, w: 4, d: 4, h: 3 },
  { x: -12, z: -8, w: 6, d: 2, h: 2.2 }, { x: 12, z: 8, w: 6, d: 2, h: 2.2 },
  { x: -10, z: 12, w: 2, d: 6, h: 2.5 }, { x: 10, z: -12, w: 2, d: 6, h: 2.5 },
  { x: -20, z: -20, w: 3, d: 3, h: 3 }, { x: 20, z: 20, w: 3, d: 3, h: 3 },
  { x: 20, z: -20, w: 3, d: 3, h: 3 }, { x: -20, z: 20, w: 3, d: 3, h: 3 },
  { x: 0, z: -20, w: 8, d: 1.5, h: 1.6 }, { x: 0, z: 20, w: 8, d: 1.5, h: 1.6 },
  { x: -22, z: 0, w: 1.5, d: 8, h: 1.6 }, { x: 22, z: 0, w: 1.5, d: 8, h: 1.6 },
];

// ================= 数学 =================
const isPrime = n => { if (!Number.isInteger(n) || n < 2) return false; for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
const prod = f => f.reduce((a, b) => a * b, 1);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function genFactors() {
  for (;;) {
    const f = [pick([11, 13, 17, 19, 23, 29, 31, 37])];
    const n = 3 + (Math.random() < 0.5 ? 1 : 0);
    for (let i = 0; i < n; i++) f.push(pick([2, 2, 2, 3, 3, 3, 5, 5, 7, 7]));
    if (Math.random() < 0.4) f.push(pick([11, 13, 17]));
    const p = prod(f);
    if (p >= 100 && p <= 20000) return f.sort((a, b) => a - b);
  }
}
function collide(p) {
  const lim = ARENA - RADIUS;
  p.x = clamp(p.x, -lim, lim); p.z = clamp(p.z, -lim, lim);
  for (const o of OBST) {
    const hx = o.w / 2, hz = o.d / 2;
    const cx = clamp(p.x, o.x - hx, o.x + hx), cz = clamp(p.z, o.z - hz, o.z + hz);
    const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
    if (d2 >= RADIUS * RADIUS) continue;
    if (d2 > 1e-8) { const d = Math.sqrt(d2); p.x = cx + dx / d * RADIUS; p.z = cz + dz / d * RADIUS; }
    else {
      const gaps = [o.x + hx - p.x, p.x - (o.x - hx), o.z + hz - p.z, p.z - (o.z - hz)];
      const i = gaps.indexOf(Math.min(...gaps));
      if (i === 0) p.x = o.x + hx + RADIUS; else if (i === 1) p.x = o.x - hx - RADIUS;
      else if (i === 2) p.z = o.z + hz + RADIUS; else p.z = o.z - hz - RADIUS;
    }
  }
}
const dist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);

// ================= 状態 =================
let mode = "none";        // local / host / client
let screen = "menu";      // menu / connecting / lobby / game
let peer = null, hostConn = null, hostSeen = 0;
const host = { code: "", conns: new Map(), nextId: 1, playing: false, bots: 0 };
let myId = 0, errMsg = "";
let lobbyPs = [];
let G = null;             // ホストだけが持つ正式な状態
const view = new Map();   // 画面に出す全員の状態
const me = { x: 0, z: 0, yaw: 0, pitch: 0 };
let selId = null, inp = "", lastAtk = -99, overInfo = null, practiceBots = 3;
const feed = [];

// ================= 通信 =================
function broadcast(m) {
  for (const c of host.conns.values()) { try { c.send(m); } catch (e) {} }
  onMsg(m);
}
function sendTo(id, m) {
  if (id === myId) { onMsg(m); return; }
  const c = host.conns.get(id); if (c) { try { c.send(m); } catch (e) {} }
}
function sendHost(m) {
  if (mode === "client") { try { hostConn?.send(m); } catch (e) {} }
  else hostHandle(myId, m);
}

// ---------- ホスト側 ----------
function hostLobby() {
  lobbyPs = [{ id: 0, name: myName() }];
  for (const [id, c] of host.conns) lobbyPs.push({ id, name: c.pname });
  for (let i = 0; i < host.bots; i++) lobbyPs.push({ id: 100 + i, name: "CPU-" + "ABCDEFGH"[i], bot: true });
  broadcast({ t: "lobby", ps: lobbyPs, code: host.code });
}
function hostStart() {
  const list = lobbyPs.slice();
  const n = list.length, base = Math.random() * Math.PI * 2;
  const order = list.map((_, i) => i).sort(() => Math.random() - 0.5);
  G = { players: new Map(), over: false, lastSt: 0 };
  list.forEach((p, i) => {
    const a = base + order[i] / n * Math.PI * 2;
    const q = { id: p.id, name: p.name, bot: !!p.bot, color: COLORS[i % COLORS.length], x: Math.cos(a) * 17, z: Math.sin(a) * 17, yaw: 0, f: genFactors(), alive: true, kills: 0, cd: 0 };
    collide(q); q.yaw = Math.atan2(q.x, q.z); q.max = q.f.length;
    G.players.set(q.id, q);
  });
  host.playing = true;
  for (const c of host.conns.values()) c.seen = performance.now();
  broadcast({ t: "start", ps: [...G.players.values()].map(p => ({ id: p.id, name: p.name, bot: p.bot, color: p.color, x: p.x, z: p.z, yaw: p.yaw, f: p.f, max: p.max })) });
}
function hostHandle(id, m) {
  if (!G || !m) return;
  const p = G.players.get(id); if (!p) return;
  if (m.t === "pos") {
    if (![m.x, m.z, m.yaw].every(Number.isFinite)) return;
    p.x = clamp(m.x, -ARENA, ARENA); p.z = clamp(m.z, -ARENA, ARENA); p.yaw = m.yaw;
  } else if (m.t === "atk") doAttack(id, m.to, m.p);
}
function doAttack(aid, tid, primes) {
  const a = G.players.get(aid), t = G.players.get(tid);
  if (!a || !t || G.over || !a.alive || !t.alive || aid === tid) return;
  if (!Array.isArray(primes) || !primes.length || primes.length > 20 || !primes.every(isPrime)) return;
  const now = performance.now() / 1000;
  if (now < a.cd) return;
  if (dist(a, t) > RANGE + 1.5) { sendTo(aid, { t: "msg", s: "遠すぎます" }); return; }
  a.cd = now + COOLDOWN * 0.8;
  const before = prod(t.f), abefore = prod(a.f);
  const rest = t.f.slice(); let ok = true;
  for (const q of primes) { const i = rest.indexOf(q); if (i < 0) { ok = false; break; } rest.splice(i, 1); }
  let dead = false;
  if (ok) { t.f = rest; if (!rest.length) { t.alive = false; dead = true; a.kills++; } }
  else if (a.f.length > 1) a.f.splice(a.f.lastIndexOf(Math.max(...a.f)), 1);
  broadcast({ t: "ev", a: aid, to: tid, p: primes, ok, fa: a.f, ft: t.f, dead, b: before, ab: abefore });
  checkOver();
}
function checkOver() {
  if (!G || G.over) return;
  const alive = [...G.players.values()].filter(p => p.alive);
  if (alive.length > 1) return;
  G.over = true;
  const g = G;
  setTimeout(() => {
    if (G !== g) return;
    const ps = [...g.players.values()].map(p => ({ id: p.id, name: p.name, kills: p.kills, alive: p.alive, n: prod(p.f) }))
      .sort((x, y) => (y.alive - x.alive) || (y.kills - x.kills));
    broadcast({ t: "over", win: alive[0]?.id ?? null, ps });
  }, 1500);
}
function hostDrop(id) {
  host.conns.delete(id);
  if (G && G.players.has(id)) { const p = G.players.get(id); p.alive = false; broadcast({ t: "gone", id }); checkOver(); }
  else if (!host.playing) hostLobby();
}

// ---------- CPU ----------
function botUpdate(p, dt, now) {
  if (!p.alive) return;
  const b = p.bs || (p.bs = { tgt: null, next: now + 2 + Math.random() * 2, re: 0, dir: Math.random() < 0.5 ? 1 : -1, wander: Math.random() * 6.28, stuck: 0, lx: p.x, lz: p.z, unstick: 0 });
  if (now > b.re) {
    const others = [...G.players.values()].filter(o => o.alive && o.id !== p.id).sort((x, y) => dist(p, x) - dist(p, y));
    b.tgt = others.length ? (Math.random() < 0.7 ? others[0] : pick(others)).id : null;
    b.re = now + 4 + Math.random() * 4; b.dir = Math.random() < 0.5 ? 1 : -1;
  }
  const t = G.players.get(b.tgt);
  let mx = 0, mz = 0;
  if (now < b.unstick) { mx = Math.cos(b.wander); mz = Math.sin(b.wander); }
  else if (t && t.alive) {
    const dx = t.x - p.x, dz = t.z - p.z, d = Math.hypot(dx, dz) || 1;
    if (d > RANGE * 0.6) { mx = dx / d; mz = dz / d; }
    else { mx = -dz / d * b.dir * 0.6; mz = dx / d * b.dir * 0.6; }
    p.yaw = Math.atan2(-dx, -dz);
    if (d < RANGE && now > b.next) {
      b.next = now + 2.5 + Math.random() * 3;
      let primes;
      if (Math.random() < 0.7) {
        const k = Math.min(t.f.length, Math.random() < 0.6 ? 1 : 2);
        const pool = t.f.slice(); primes = [];
        for (let i = 0; i < k; i++) primes.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
      } else {
        const wrong = [2, 3, 5, 7, 11, 13, 17, 19].filter(q => !t.f.includes(q));
        primes = [wrong.length ? pick(wrong) : 41];
      }
      doAttack(p.id, t.id, primes);
    }
  } else { mx = Math.cos(b.wander); mz = Math.sin(b.wander); if (Math.random() < dt * 0.5) b.wander = Math.random() * 6.28; }
  p.x += mx * SPEED * 0.7 * dt; p.z += mz * SPEED * 0.7 * dt;
  collide(p);
  if (now - b.stuck > 1) {
    if ((mx || mz) && Math.hypot(p.x - b.lx, p.z - b.lz) < 0.8) { b.wander = Math.random() * 6.28; b.unstick = now + 1.2; }
    b.stuck = now; b.lx = p.x; b.lz = p.z;
  }
}

// ---------- 受信（全員） ----------
function onMsg(m) {
  if (!m || typeof m !== "object") return;
  switch (m.t) {
    case "welcome": myId = m.you; return;
    case "reject": errMsg = m.why; cleanupNet(); screen = "menu"; break;
    case "lobby": lobbyPs = m.ps; host.code = m.code; screen = "lobby"; overInfo = null; clearGame(); break;
    case "start": startView(m.ps); break;
    case "st":
      for (const [id, x, z, yaw] of m.p) { const v = view.get(id); if (v && id !== myId) { v.tx = x; v.tz = z; v.tyaw = yaw; } }
      return;
    case "ev": applyEv(m); return;
    case "gone": { const v = view.get(m.id); if (v) { v.alive = false; addFeed(`${v.name} が抜けました`); } if (selId === m.id) closePad(); return; }
    case "msg": toast(m.s); return;
    case "over": overInfo = m; closePad(); break;
  }
  renderUI();
}
function applyEv(m) {
  const a = view.get(m.a), t = view.get(m.to); if (!a || !t) return;
  a.f = m.fa; t.f = m.ft;
  const ps = m.p.join("×");
  if (m.ok) {

  peer.on("open", () => { host.code = code; hostTries = 0; hostLobby(); });

    if (screen === "game" || screen === "lobby") { toast("通信エラー: " + e.type); return; }

        if (lobbyPs.length >= MAX_PLAYERS) { conn.send({ t: "reject", why: `満員です（${MAX_PLAYERS}人まで）` }); setTimeout(() => conn.close(), 500); return; }

}

      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (actx.state === "suspended") actx.resume();
  } catch (e) {}
}
addEventListener("pointerdown", initAudio, true);
addEventListener("keydown", initAudio, true);
function setParam(p, v, t) { if (p.setValueAtTime) p.setValueAtTime(v, t); else p.value = v; }
function updListener() {
  if (!actx) return;
  const L = actx.listener, t = actx.currentTime, fx = -Math.sin(me.yaw), fz = -Math.cos(me.yaw);
  if (L.positionX) { setParam(L.positionX, me.x, t); setParam(L.positionY, EYE, t); setParam(L.positionZ, me.z, t); setParam(L.forwardX, fx, t); setParam(L.forwardY, 0, t); setParam(L.forwardZ, fz, t); setParam(L.upX, 0, t); setParam(L.upY, 1, t); setParam(L.upZ, 0, t); }
  else { L.setPosition(me.x, EYE, me.z); L.setOrientation(fx, 0, fz, 0, 1, 0); }
}
function stepSound(x, z, mine) {
  if (!actx || !soundOn || actx.state !== "running") return;
  const t = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noiseBuf; src.playbackRate.value = 0.7 + Math.random() * 0.5;
  const f = actx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 350 + Math.random() * 250; f.Q.value = 1.5;
  const g = actx.createGain(), vol = mine ? 0.35 : 1.6;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
  src.connect(f); f.connect(g);
  if (mine) g.connect(actx.destination);
  else {
    const p = actx.createPanner();
    p.panningModel = "HRTF"; p.distanceModel = "linear"; p.refDistance = 1.5; p.maxDistance = 26; p.rolloffFactor = 1;
    if (p.positionX) { p.positionX.value = x; p.positionY.value = 0.2; p.positionZ.value = z; } else p.setPosition(x, 0.2, z);
    g.connect(p); p.connect(actx.destination);
  }
  src.start(t); src.stop(t + 0.16);
}
const STRIDE = 1.7;

let meName = "";
function myName() { if (meName) return meName; return (document.getElementById("name")?.value || store.get("soinsu-name") || "ゲスト").trim().slice(0, 12) || "ゲスト"; }
function fixName() { meName = ""; meName = myName(); store.set("soinsu-name", meName); }
const urlRoom = (new URLSearchParams(location.search).get("room") || "").replace(/\D/g, "").slice(0, 4);
function shareUrl() { const u = new URL(location.href); u.search = "?room=" + host.code + "&openExternalBrowser=1"; u.hash = ""; return u.toString(); }

const RULES = `<div class="rules">
・みんなの頭に<b>数字</b>が書いてある<br>
・相手をタップして、その数字の<b>素因数</b>を打ち込む（例 <b>2×3</b>）<br>
・全部正しければ相手の数字がその分割られる。<b>1</b>になったら撃破<br>
・1つでも間違えると<b>自分の一番大きい素因数</b>が消えて弱くなる<br>
・白い円の中（射程内）の相手にしか打ち込めない<br>
・相手の数字は頭の上にしか出ない。一瞬で覚えよう<br>
・足音で近くの相手に気づける（イヤホン推奨）<br>
・最後の1人になったら勝ち</div>`;

function renderUI() {
  const s = $("screen");
  $("hud").classList.toggle("hidden", screen !== "game" && screen !== "layout");
  $("hud").classList.toggle("editing", screen === "layout");
  s.classList.toggle("clear", screen === "game");
  s.classList.toggle("toolbar", screen === "layout"); if (screen !== "layout") s.classList.remove("bottom");
  checkRotate(); applyLayout();
  if (screen === "game" && !overInfo) { s.classList.add("hidden"); s.innerHTML = ""; return; }
  s.classList.remove("hidden");
  let h = "";
  if (screen === "menu") {
    h = `<div class="card"><h1>素因数バトル<small>頭の数字を素因数分解して打ち込め</small></h1>${RULES}
      <label>なまえ</label><input id="name" class="in" maxlength="12" value="${esc(store.get("soinsu-name") || "")}" placeholder="ゲスト">
      <button class="btn" data-a="host">部屋をつくる</button>
      <div class="row"><input id="code" class="in" inputmode="numeric" maxlength="4" placeholder="部屋番号（4けた）" value="${esc(urlRoom)}"><button class="btn sub" style="width:40%;margin-top:0" data-a="join">入る</button></div>
      <div style="margin-top:14px"><label>ひとりで練習（CPUの数）</label>
      <div class="seg">${[1, 3, 5, 7].map(n => `<button class="${n === practiceBots ? "on" : ""}" data-a="pb-${n}">${n}体</button>`).join("")}</div>
      <button class="btn sub" data-a="practice">CPUと練習する</button></div>
      <div class="row" style="margin-top:14px"><button class="btn sub" style="margin-top:0" data-a="layout">ボタン配置を変える</button><button class="btn sub" style="margin-top:0" data-a="sound">足音：${soundOn ? "ON" : "OFF"}</button></div>
      ${window.IN_HUB ? `<button class="btn sub" data-a="games">← ゲーム一覧へ（you know games）</button>` : ""}
      ${errMsg ? `<div class="err">${esc(errMsg)}</div>` : ""}</div>`;
  } else if (screen === "layout") {
    h = `<div class="card"><span class="lbl">${LAY_NAMES[editSel]} ${Math.round(LAY[editSel].s * 100)}%</span>
      <button class="btn sub" data-a="lay-">小さく</button><button class="btn sub" data-a="lay+">大きく</button>
      <button class="btn sub" data-a="layreset">元にもどす</button><button class="btn sub" data-a="laymove">⇅</button><button class="btn" data-a="laydone">完了</button></div>`;
  } else if (screen === "connecting") {
    h = `<div class="card"><h2>接続中…</h2><button class="btn sub" data-a="leave">やめる</button></div>`;
  } else if (screen === "lobby") {
    const isHost = mode === "host";
    h = `<div class="card"><h2>部屋番号</h2><div class="code">${esc(host.code)}</div>
      ${isHost ? `<button class="btn sub" data-a="share">招待リンクを送る</button>` : ""}
      <ul class="plist">${lobbyPs.map(p => `<li><span>${esc(p.name)}${p.id === myId ? "（自分）" : ""}</span><span>${p.id === 0 ? "ホスト" : p.bot ? "CPU" : ""}</span></li>`).join("")}</ul>
      <div class="note">${lobbyPs.length} / ${MAX_PLAYERS}人</div>
      ${isHost ? `<div class="row"><button class="btn sub" style="margin-top:0" data-a="bot+" ${lobbyPs.length >= MAX_PLAYERS ? "disabled" : ""}>CPUを追加</button><button class="btn sub" style="margin-top:0" data-a="bot-" ${host.bots ? "" : "disabled"}>CPUを減らす</button></div>
        <button class="btn red" data-a="start" ${lobbyPs.length < 2 ? "disabled" : ""}>スタート</button>
        ${lobbyPs.length < 2 ? `<div class="note">2人以上（CPUを含む）で始められます</div>` : ""}`
        : `<div class="note">ホストがスタートするのを待っています…</div>`}
      <button class="btn sub" data-a="leave">退出</button></div>`;
  } else if (screen === "game" && overInfo) {
    const w = overInfo.ps.find(p => p.id === overInfo.win);
    const iWon = overInfo.win === myId;
    h = `<div class="card"><h2>${iWon ? "🏆 あなたの勝ち！" : w ? `${esc(w.name)} の勝ち` : "引き分け"}</h2>
      <table class="res">${overInfo.ps.map((p, i) => `<tr><td>${i + 1}. ${esc(p.name)}${p.id === myId ? "（自分）" : ""}</td><td>撃破 ${p.kills}</td></tr>`).join("")}</table>
      ${mode === "local" ? `<button class="btn red" data-a="again">もう一度</button>`
        : mode === "host" ? `<button class="btn red" data-a="tolobby">部屋にもどる</button>` : `<div class="note">ホストが部屋にもどるのを待っています…</div>`}
      <button class="btn sub" data-a="leave">メニューへ</button></div>`;
  }
  s.innerHTML = h;
}
$("screen").addEventListener("click", async e => {
  const b = e.target.closest("[data-a]"); if (!b || b.disabled) return;
  const a = b.dataset.a;
  if (a === "host") { fixName(); goLandscape(); startHost(); }
  else if (a === "join") { fixName(); goLandscape(); joinRoom($("code").value); }
  else if (a === "practice") { fixName(); goLandscape(); startPractice(); renderUI(); }
  else if (a === "layout") { fixName(); enterLayout(); }
  else if (a === "games") location.href = "../";   // ミニゲーム集のゲーム一覧へ
  else if (a === "laydone") exitLayout();
  else if (a === "laymove") $("screen").classList.toggle("bottom");
  else if (a === "lay+" || a === "lay-") { const L = LAY[editSel]; L.s = clamp(Math.round((L.s + (a === "lay+" ? 0.1 : -0.1)) * 10) / 10, 0.5, 2); saveLayout(); renderUI(); }
  else if (a === "layreset") { LAY = JSON.parse(JSON.stringify(LAY_DEF)); saveLayout(); renderUI(); }
  else if (a === "sound") { fixName(); soundOn = !soundOn; store.set("soinsu-sound", soundOn ? "1" : "0"); renderUI(); }
  else if (a.startsWith("pb-")) { const nm = $("name")?.value; practiceBots = Number(a.slice(3)); renderUI(); if (nm != null) $("name").value = nm; }
  else if (a === "leave") leave();
  else if (a === "bot+") { host.bots++; hostLobby(); }
  else if (a === "bot-") { host.bots = Math.max(0, host.bots - 1); hostLobby(); }
  else if (a === "start") { hostStart(); renderUI(); }
  else if (a === "again") { startPractice(); renderUI(); }
  else if (a === "tolobby") { G = null; host.playing = false; hostLobby(); }
  else if (a === "share") {
    const url = shareUrl();
    try { if (navigator.share) { await navigator.share({ title: "素因数バトル", text: `部屋番号 ${host.code} で遊ぼう`, url }); return; } } catch (err) { return; }
    try { await navigator.clipboard.writeText(url); toastScreen("リンクをコピーしました"); } catch (err) { prompt("このリンクを送ってください", url); }
  }
});
function toastScreen(s) { const n = document.querySelector("#screen .note"); if (n) n.textContent = s; }

// ================= ループ =================
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); applyLayout(); checkRotate(); }
addEventListener("resize", resize); resize();
let last = performance.now(), sendT = 0;
function frame(nowMs) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (nowMs - last) / 1000); last = nowMs;
  if (screen === "game") {
    // 自分の移動
    let fwd = -joy.y, str = joy.x;
    if (keys.has("w") || keys.has("arrowup")) fwd += 1;
    if (keys.has("s") || keys.has("arrowdown")) fwd -= 1;
    if (keys.has("d") || keys.has("arrowright")) str += 1;
    if (keys.has("a") || keys.has("arrowleft")) str -= 1;
    const l = Math.hypot(fwd, str); if (l > 1) { fwd /= l; str /= l; }
    const sy = Math.sin(me.yaw), cy = Math.cos(me.yaw);
    const ox = me.x, oz = me.z;
    me.x += (-sy * fwd + cy * str) * SPEED * dt; me.z += (-cy * fwd - sy * str) * SPEED * dt;
    collide(me);
    me.step = (me.step || 0) + Math.hypot(me.x - ox, me.z - oz);
    if (me.step > STRIDE) { me.step = 0; stepSound(me.x, me.z, true); }
    updListener();
    const mine = view.get(myId); if (mine) { mine.x = me.x; mine.z = me.z; }
    sendT += dt;
    if (sendT > 0.1) {
      sendT = 0;
      sendHost({ t: "pos", x: +me.x.toFixed(2), z: +me.z.toFixed(2), yaw: +me.yaw.toFixed(3) });
      if (G && mode !== "client") broadcast({ t: "st", p: [...G.players.values()].map(p => [p.id, +p.x.toFixed(2), +p.z.toFixed(2), +p.yaw.toFixed(3)]) });
    }
    if (G && mode !== "client" && !G.over) for (const p of G.players.values()) if (p.bot) botUpdate(p, dt, nowMs / 1000);
    // 応答のない相手を切る（タブを閉じた・電波が切れた）
    if (mode === "host" && G) for (const [id, c] of [...host.conns]) if (nowMs - (c.seen || nowMs) > 10000) { hostDrop(id); try { c.close(); } catch (e) {} }
    if (mode === "client" && nowMs - hostSeen > 10000) { errMsg = "ホストとの接続が切れました"; leave(); return; }
    // 見た目
    camera.position.set(me.x, EYE, me.z); camera.rotation.set(me.pitch, me.yaw, 0);
    rangeRing.position.x = me.x; rangeRing.position.z = me.z; rangeRing.visible = !!(mine && mine.alive);
    const k = Math.min(1, dt * 12);
    for (const [id, av] of avatars) {
      const v = view.get(id);
      const px = v.x, pz = v.z;
      v.x += (v.tx - v.x) * k; v.z += (v.tz - v.z) * k;
      if (v.alive) {
        const mv = Math.hypot(v.x - px, v.z - pz);
        v.step = (v.step || 0) + (mv < 2 ? mv : 0);
        if (v.step > STRIDE) { v.step = 0; stepSound(v.x, v.z, false); }
      }
      let dy = v.tyaw - v.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); v.yaw += dy * k;
      av.g.position.set(v.x, 0, v.z); av.g.rotation.y = v.yaw;
      if (!v.alive) {
        const t = v.deadAt ? (nowMs - v.deadAt) / 600 : 1;
        av.g.visible = t < 1; av.g.scale.setScalar(Math.max(0.01, 1 - t)); continue;
      }
      const d = distTo(v);
      drawLabel(av, v, d <= RANGE, id === selId);
      const s = clamp(d / 10, 1, 2.6); av.label.scale.set(1.6 * s, s, 1);
    }
    const sv = selId != null && view.get(selId);
    selRing.visible = !!(sv && sv.alive); if (sv) selRing.position.set(sv.x, 0.04, sv.z);
    for (let i = fxList.length - 1; i >= 0; i--) {
      const f = fxList[i], t = (nowMs - f.t0) / 1200;
      if (t >= 1) { f.el.remove(); fxList.splice(i, 1); continue; }
      tmpV.set(f.v.x, 3.3 + t * 1.2, f.v.z).project(camera);
      f.el.style.display = tmpV.z > 1 ? "none" : "";
      f.el.style.left = (tmpV.x + 1) / 2 * innerWidth + "px"; f.el.style.top = (1 - tmpV.y) / 2 * innerHeight + "px";
      f.el.style.opacity = 1 - t;
    }
    updPad(false); updHud(nowMs);
  } else {
    const t = nowMs / 6000;
    camera.position.set(Math.cos(t) * 26, 14, Math.sin(t) * 26); camera.lookAt(0, 0, 0);
    rangeRing.visible = false; selRing.visible = false;
  }
  renderer.render(scene, camera);
}
renderUI();
requestAnimationFrame(frame);
try { if (window.IN_HUB && "serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) navigator.serviceWorker.register("../sw.js").catch(() => {}); } catch (e) {}
window.__dbg = { view, get G() { return G; }, me, get myId() { return myId; }, step(n = 1) { for (let i = 0; i < n; i++) frame(last + 16); }, get actx() { return actx; } };
</script>
</body>

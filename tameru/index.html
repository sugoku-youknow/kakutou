<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ためる・バリア・攻撃</title>
<!-- ミニゲーム集「you know games」の中の 1 本（2026-11-06 にリポジトリ ----- から移した）。アプリの設定・アイコンは 1 つ上のフォルダにある -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="you know games">
<meta name="theme-color" content="#0b0e14">
<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png?v=3">
<link rel="apple-touch-icon" href="../apple-touch-icon.png?v=3">
<style>
  :root{
    --bg:#0b0e14;
    --panel:#12161f;
    --panel-2:#171c27;
    --line:#232a38;
    --text:#e8ecf4;
    --sub:#8b93a7;
    --charge:#e8b339;
    --barrier:#3ec9d6;
    --attack:#e0435a;
    --good:#5fd98a;
  }
  html, body { height: 100%; margin: 0; padding: 0; }
  #app, #app *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  #app{
    background:var(--bg);
    color:var(--text);
    font-family:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
    min-height:640px;
    padding:28px 20px 36px;
    border-radius:14px;
    position:relative;
    overflow:hidden;
  }
  #app::before{
    content:'';
    position:absolute; inset:0;
    background:
      radial-gradient(600px 300px at 15% -10%, rgba(232,179,57,0.08), transparent 60%),
      radial-gradient(600px 300px at 85% 110%, rgba(224,67,90,0.08), transparent 60%);
    pointer-events:none;
  }
  .wrap{ position:relative; max-width:640px; margin:0 auto; }
  .brand{
    text-align:center; margin-bottom:22px;
  }
  .brand .mark{
    font-size:11px; letter-spacing:.28em; color:var(--sub); text-transform:uppercase;
  }
  .brand h1{
    margin:6px 0 0; font-size:28px; font-weight:800; letter-spacing:.02em;
  }
  .brand h1 .a{color:var(--charge)} .brand h1 .b{color:var(--barrier)} .brand h1 .c{color:var(--attack)}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:22px;
  }
  .row{ display:flex; gap:12px; }
  .btn{
    flex:1; padding:13px 10px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); font-size:15px; font-weight:700;
    cursor:pointer; transition:transform .12s, border-color .12s, background .12s;
    letter-spacing:.02em;
  }
  .btn:hover:not(:disabled){ transform:translateY(-1px); border-color:#3a4356; }
  .btn:disabled{ opacity:.35; cursor:not-allowed; }
  .btn.primary{ background:linear-gradient(135deg,#2a3244,#1b2130); border-color:#3a4356; }
  input[type=text]{
    width:100%; padding:12px 14px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); font-size:16px; letter-spacing:.08em;
  }
  input[type=text]:focus{ outline:none; border-color:#5a6478; }
  .label{ font-size:12px; color:var(--sub); margin-bottom:6px; letter-spacing:.05em; }
  .center{ text-align:center; }
  .muted{ color:var(--sub); font-size:13px; }
  .code{
    font-size:34px; font-weight:800; letter-spacing:.22em; text-align:center;
    padding:16px 0; color:var(--charge);
  }

  /* --- battle screen --- */
  .actions{ display:flex; gap:10px; margin-top:16px; }
  .abtn{
    flex:1; padding:16px 8px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel-2); cursor:pointer; text-align:center;
    transition:transform .12s, border-color .12s;
  }
  .abtn:hover:not(.disabled):not(.picked){ transform:translateY(-2px); }
  .abtn .ic{ font-size:22px; display:block; margin-bottom:4px; }
  .abtn .tt{ font-size:13px; font-weight:700; }
  .abtn.charge{ border-color:#4a4326; } .abtn.charge:hover:not(.disabled):not(.picked){ border-color:var(--charge); }
  .abtn.barrier{ border-color:#264247; } .abtn.barrier:hover:not(.disabled):not(.picked){ border-color:var(--barrier); }
  .abtn.attack{ border-color:#472129; } .abtn.attack:hover:not(.disabled):not(.picked){ border-color:var(--attack); }
  .special-wrap{ width:100%; max-width:600px; margin-top:8px; }
  .abtn, .special-btn{ touch-action:manipulation; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  .special-btn{ width:100%; padding:14px 10px; border-radius:10px; border:2px solid #9a5f16; background:#fff0c2; color:#16202c; cursor:pointer; text-align:center; font-weight:800; transition:transform .12s, border-color .12s, background .12s; }
  .special-btn:hover:not(.disabled){ transform:translateY(-2px); border-color:#c27a1d; background:#ffe7a0; }
  .special-btn .tt{ font-size:15px; }
  .special-btn .sub{ font-size:10px; margin-top:3px; color:#6b5a32; }
  .special-btn.disabled{ opacity:.35; cursor:not-allowed; }
  .abtn.picked.charge{ background:rgba(232,179,57,.15); border-color:var(--charge); }
  .abtn.picked.barrier{ background:rgba(62,201,214,.15); border-color:var(--barrier); }
  .abtn.picked.attack{ background:rgba(224,67,90,.15); border-color:var(--attack); }
  .abtn.disabled{ opacity:.3; cursor:not-allowed; }
  .abtn.startbtn{ background:#eafff0; border-color:#2f9e52; }
  .abtn.startbtn .tt{ color:#1f7a3d; font-size:16px; }

  .hpsetter{
    display:flex; align-items:center; justify-content:center; gap:12px;
    margin-top:10px; width:100%; max-width:600px;
  }
  .hpsetter-label{ font-size:12px; font-weight:700; color:#16202c; }
  .setting-panel{ margin:18px auto 0; max-width:420px; padding:14px; border:1px solid var(--line); border-radius:10px; background:var(--panel-2); }
  .battle-setting-panel{ margin-top:10px; background:#fff; border:2px solid #16202c; }
  /* 準備画面のホスト操作はレイアウトの流れから切り離す。
     チャージ枠が何段になっても位置が押し下げられない。 */
  .ready-start-float{
    position:absolute;
    z-index:50;
    top:32%;
    left:50%;
    width:min(600px, calc(100% - 32px));
    transform:translate(-50%, -50%);
    pointer-events:auto;
  }
  .ready-start-float .abtn{
    width:100%; box-sizing:border-box;
    padding:48px 8px;
    box-shadow:0 4px 14px rgba(0,0,0,.18);
  }
  .host-ready-settings{
    position:fixed;
    z-index:60;
    left:50%;
    bottom:14px;
    width:min(520px, calc(100% - 32px));
    transform:translateX(-50%);
    margin:0;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
  }
  .setting-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:8px 0; }
  .setting-row + .setting-row{ border-top:1px solid var(--line); }
  .setting-label{ font-size:13px; font-weight:700; text-align:left; }
  .setting-ctrl{ display:flex; align-items:center; gap:10px; }
  .setting-note{ margin-top:8px; font-size:11px; color:var(--sub); }
  .hpbtn{ min-width:44px; min-height:44px; }
  .hpbtn{
    width:30px; height:30px; border-radius:6px; border:2px solid #16202c;
    background:#fff; color:#16202c; font-size:16px; font-weight:800; cursor:pointer; line-height:1;
  }
  .hpbtn:active{ transform:scale(0.95); }
  .hpval{ font-size:16px; font-weight:800; color:#16202c; min-width:34px; text-align:center; }

  .waitline{ text-align:center; font-size:12px; color:var(--sub); margin-top:12px; }

  /* --- split duel layout --- */
  #app.mode-duel{ padding:0; background:var(--bg); height:100vh; height:100dvh; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; border-radius:0; overflow-y:auto; }
  #app.mode-duel::before{ display:none; }

  .duel-wrap{
    display:flex; flex-direction:column;
    border:none; border-radius:0; overflow:hidden;
    flex:1;
  }
  .duel-half{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:18px 16px; gap:10px; flex:1;
  }
  .duel-half.opp{ background:#ffd7dd; }
  .duel-half.me{ background:#d6f0fb; }

  .namebox, .hpbox-outer, .actionbox{
    width:100%; max-width:600px;
    background:#fff; border:2.5px solid #16202c; border-radius:5px;
    color:#16202c;
  }
  .namebox{ padding:10px 14px; text-align:center; font-weight:700; font-size:15px; }
  .namebox.debug-btn{ cursor:pointer; transition:transform .12s, background .12s; }
  .namebox.debug-btn:hover{ background:#fff7d6; }
  .namebox.debug-btn:active{ transform:scale(0.98); }
  .hpbox-outer{ height:24px; position:relative; overflow:hidden; }
  .hpbox-fill{ height:100%; background:#ffe14d; transition:width .5s ease; }
  .hpbox-num{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; }

  .actionbox{
    min-height:64px; display:flex; align-items:center; justify-content:center; gap:8px;
    font-weight:800; font-size:17px; padding:10px;
  }
  .actionbox .ic{ font-size:22px; }
  .actionbox .ph{ color:#9aa3ad; font-weight:600; font-size:14px; }
  .actionbox.charge{ background:#fff4d8; }
  .actionbox.barrier{ background:#dbf7fa; }
  .actionbox.attack{ background:#fbdde1; }

  .pipsrow{ display:flex; gap:7px; flex-wrap:wrap; justify-content:center; }
  .pip2{ width:26px; height:26px; border:2.5px solid #16202c; background:#fff; border-radius:5px; }
  .pip2.on{ background:#ffe14d; }

  .divider2{
    height:21px; position:relative; background:var(--bg);
    border-top:2.5px dashed #38424f; border-bottom:2.5px dashed #38424f;
  }
  .timerbar{
    position:absolute; top:0; left:0; height:100%; width:0%;
    background:linear-gradient(90deg,#ff6b7a,#e0435a);
    box-shadow:0 0 10px rgba(224,67,90,.7);
  }

  .duel-half .actions{ margin-top:6px; width:100%; max-width:600px; }
  .duel-half .abtn{
    background:#fff; border:2px solid #16202c; color:#16202c; padding:24px 8px;
  }
  .duel-half .abtn.charge:hover:not(.disabled):not(.picked){ border-color:#c9971f; }
  .duel-half .abtn.barrier:hover:not(.disabled):not(.picked){ border-color:#1f8f9c; }
  .duel-half .abtn.attack:hover:not(.disabled):not(.picked){ border-color:#b8283c; }
  .duel-half .special-wrap{ margin-top:4px; }
  .duel-half .special-btn{ border:2px solid #16202c; background:#fff; }
  .duel-half .special-btn:hover:not(.disabled){ border-color:#9a5f16; background:#fff0c2; }
  .duel-half .abtn.picked.charge{ background:#fff0c2; }
  .duel-half .abtn.picked.barrier{ background:#c8f2f6; }
  .duel-half .abtn.picked.attack{ background:#fac9d0; }

  .meta-line{ text-align:center; font-size:12px; color:var(--sub); margin:0; line-height:1.6; padding:8px; background:var(--bg); }

  @media (max-width: 480px){
    #app.mode-duel{ padding:0; }
    .duel-half{ padding:14px 10px; gap:8px; }
    .namebox{ font-size:13px; padding:8px 10px; }
    .actionbox{ min-height:54px; font-size:15px; }
    .actionbox .ic{ font-size:19px; }
    .pip2{ width:20px; height:20px; }
    .hpsetter{ gap:8px; }
    .meta-line{ font-size:11px; }
  }

  .toast{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    background:#1c2230; border:1px solid var(--line); padding:8px 16px; border-radius:8px;
    font-size:12px; color:var(--good);
  }
  .footer-actions{ display:flex; justify-content:center; margin-top:16px; }
  .link{ color:var(--barrier); font-size:12px; cursor:pointer; background:none; border:none; }

  @media (max-width: 480px){
    #app{ padding:18px 12px 24px; min-height:0; }
    .brand{ margin-bottom:16px; }
    .brand h1{ font-size:21px; }
    .card{ padding:16px; }
    .actions{ gap:7px; }
    .abtn{ padding:14px 4px; border-radius:9px; }
    .abtn .ic{ font-size:20px; }
    .abtn .tt{ font-size:12px; }
    .code{ font-size:28px; letter-spacing:.16em; }
    .row{ gap:8px; }
    .btn{ padding:14px 8px; font-size:14px; }
    input[type=text]{ font-size:16px; padding:12px; } /* 16px prevents iOS auto-zoom */
  }

  @media (hover: none){
    .abtn:hover:not(.disabled):not(.picked){ transform:none; }
    .btn:hover:not(:disabled){ transform:none; }
    .abtn:active:not(.disabled):not(.picked){ transform:scale(0.97); border-color:#5a6478; }
    .btn:active:not(:disabled){ transform:scale(0.98); }
  }

  /* --- 通常勝敗演出：0.0〜1.8秒 --- */
  .normal-result-fx{position:absolute;inset:0;z-index:999;pointer-events:none;overflow:hidden;background:rgba(0,0,0,.82);opacity:0;animation:normal-result-bg 1.8s linear forwards;animation-delay:calc(0s - var(--normal-elapsed-ms));}
  .normal-result-word{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.55);text-align:center;white-space:nowrap;font-size:clamp(58px,14vw,150px);font-weight:1000;font-style:italic;letter-spacing:.04em;opacity:0;animation:normal-result-pop 1.2s ease forwards;animation-delay:calc(.35s - var(--normal-elapsed-ms));}
  .normal-result-word.win{color:#fff;text-shadow:0 0 12px #fff,0 0 35px #ffe14d,0 0 70px #ffb000;}
  .normal-result-word.lose{color:#bbb;text-shadow:0 0 10px #fff,0 0 30px #777;}
  .normal-result-word.draw{color:#fff;text-shadow:0 0 12px #fff,0 0 35px #8aa0b8;}
  @keyframes normal-result-bg{0%,100%{opacity:1}}
  @keyframes normal-result-pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}35%,100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}

  /* --- 必殺技演出：指定タイムライン 0.0〜2.6秒 --- */
  /* render()でDOMが作り直されても、--sfx-elapsed-msで演出位置を再同期する。 */
  .special-fx{position:absolute;inset:0;z-index:1000;pointer-events:none;overflow:hidden;background:#000;opacity:0;animation:sfx-bg 2.6s linear forwards;animation-delay:calc(0s - var(--sfx-elapsed-ms));}
  .special-fx::before{content:'';position:absolute;inset:0;background:#fff;opacity:0;animation:sfx-flash 2s linear forwards;animation-delay:calc(0s - var(--sfx-elapsed-ms));}

  /* 0.3〜0.8秒だけ中央に「必殺技!!」を表示 */
  .sfx-title{position:absolute;left:50%;top:50%;width:100%;text-align:center;font-weight:1000;font-style:italic;letter-spacing:.04em;color:#fff;font-size:clamp(58px,14vw,150px);opacity:0;transform:translate(-50%,-50%) scale(.4);text-shadow:0 0 10px #fff,0 0 30px #ffe14d,0 0 60px #ff7a00;animation:sfx-title .5s ease forwards;animation-delay:calc(.3s - var(--sfx-elapsed-ms));}
  .sfx-title:after{content:'';position:absolute;left:50%;top:50%;width:18vmin;height:18vmin;border:8px solid #fff;border-radius:50%;transform:translate(-50%,-50%) scale(.1);opacity:0;animation:sfx-ring .6s ease forwards;animation-delay:calc(.3s - var(--sfx-elapsed-ms));}

  /* 0.8〜1.4秒：巨大な光・衝撃波 */
  .sfx-light{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 20px 10px #fff,0 0 70px 30px #ffe14d,0 0 150px 70px #ff8a00;transform:translate(-50%,-50%) scale(.1);opacity:0;animation:sfx-light .6s ease-out forwards;animation-delay:calc(.8s - var(--sfx-elapsed-ms));}
  .sfx-shockwave{position:absolute;left:50%;top:50%;width:20vmin;height:20vmin;border:8px solid #fff;border-radius:50%;transform:translate(-50%,-50%) scale(.1);opacity:0;box-shadow:0 0 35px #fff,inset 0 0 25px #fff;animation:sfx-shock .6s ease-out forwards;animation-delay:calc(.8s - var(--sfx-elapsed-ms));}
  .sfx-shockwave:nth-of-type(3){animation-delay:calc(.8s - var(--sfx-elapsed-ms));}

  /* 1.4〜2.6秒：自分の勝敗だけを中央に表示。それ以前は完全に非表示 */
  .sfx-result{position:absolute;inset:0;width:100%;height:100%;font-weight:1000;font-style:italic;letter-spacing:.04em;opacity:0;animation:sfx-result 1.2s ease forwards;animation-delay:calc(1.4s - var(--sfx-elapsed-ms));}
  .sfx-result .result-word{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;font-size:clamp(42px,10vw,120px);font-weight:1000;}
  .sfx-result .win{color:#fff;text-shadow:0 0 12px #fff,0 0 35px #ffe14d,0 0 70px #ffb000;}
  .sfx-result .lose{color:#bbb;text-shadow:0 0 10px #fff,0 0 30px #777;}

  .special-fx.shaking{animation-name:sfx-bg,sfx-shake;animation-duration:2.6s,.06s;animation-timing-function:linear,ease;animation-iteration-count:1,10;animation-fill-mode:forwards,none;animation-delay:calc(0s - var(--sfx-elapsed-ms)),calc(.8s - var(--sfx-elapsed-ms));}
  @keyframes sfx-bg{0%,10%{opacity:1}15%,100%{opacity:1}}
  @keyframes sfx-flash{0%,5%{opacity:0}5.1%,10%{opacity:1}10.1%,100%{opacity:0}}
  @keyframes sfx-title{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
  @keyframes sfx-ring{0%{opacity:0;transform:translate(-50%,-50%) scale(.1)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(5)}}
  @keyframes sfx-light{0%{opacity:0;transform:translate(-50%,-50%) scale(.1)}20%{opacity:1;transform:translate(-50%,-50%) scale(2)}100%{opacity:0;transform:translate(-50%,-50%) scale(35)}}
  @keyframes sfx-shock{0%{opacity:0;transform:translate(-50%,-50%) scale(.1)}10%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(18)}}
  @keyframes sfx-result{0%,100%{opacity:1}}
  @keyframes sfx-shake{0%{transform:translate(0,0)}25%{transform:translate(-8px,5px)}50%{transform:translate(7px,-6px)}75%{transform:translate(-5px,-4px)}100%{transform:translate(4px,3px)}}
  body.ykg-spec #app button, body.ykg-spec #app [data-move]{pointer-events:none;opacity:.75}
  #ykgSpecBar{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);text-align:center;font-size:13px;font-weight:700;background:rgba(62,201,214,.92);color:#06222a}
  #ykgBack{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:8px;z-index:50;font:inherit;font-size:13px;font-weight:700;padding:7px 12px;border-radius:99px;border:1px solid #232a38;background:rgba(18,22,31,.92);color:#e8ecf4}
</style>

<body>
<div id="app"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="../party-beacon.js?v=5"></script>
<script>
(function(){
  "use strict";

  var MAX_HP = 100;
  var MAX_CHARGE = 30;
  var START_HP = 20;
  var START_MAX_CHARGE = 8;
  var BASE_DMG = 10;
  var ID_PREFIX = 'cbs-duel-';
  // パーティ（you know games のゲーム一覧で作るグループ）から開いたとき（?party=1）は、番号を入れずに自動で部屋を作る・入る。
  // ホストはモードを選ぶとパーティの番号で部屋を作り、ゲストはその部屋が開くまで探し続ける。2人用なので、3人目以降は入れない。
  var PARTY = (function(){
    try { if(!new URLSearchParams(location.search).has('party')) return null; var j = JSON.parse(sessionStorage.getItem('ykg-party') || 'null'); return (j && /^\d$/.test(j.code)) ? j : null; } catch(e){ return null; }
  })();
  function netId(code){ return (PARTY ? 'cbs-party-' : ID_PREFIX) + code; }   // パーティは、ふつうの部屋と別の ID を使う
  function toGames(){ ykgToGames(); }   // ゲーム一覧へ
  var partyTries = 0;
  // 観戦: 観戦を選んだ人と、2人そろったあとに来た人は観戦になる。ホストが相手に送るものを観戦の人にも同じく送り、ゲストと同じ画面を見せる（操作はできない）
  var spectators = [], spectating = false, lastSentStatus = null;
  // パーティの成績: 勝ち負けが決まったら、ゲーム一覧で集計するために置いておく（ホストだけ）
  function partyReport(w, l){
    if(!PARTY || PARTY.role !== 'host') return;
    try { var a = JSON.parse(sessionStorage.getItem('ykg-results') || '[]'); a.push({ game:'tameru', w:w, l:l }); sessionStorage.setItem('ykg-results', JSON.stringify(a)); } catch(e){}
  }
  // ホスト: 相手への送信を、観戦の人にも配る。勝負がついた state を送るときに成績も記録する
  function wrapSend(c){
    var orig = c.send.bind(c);
    c.send = function(d){
      orig(d);
      if(!d || d.type === 'clock-sync' || d.type === 'clock-sync-reply') return;
      spectators.forEach(function(sc){ if(sc.open){ try { sc.send(d); } catch(e){} } });

  function startRoundTimer(){

  function handleRoundDeadline(){
    if(!state || state.status !== 'playing') return;
    if(roundClosed) return;
    if(role === 'host'){
      if(hostLocalClosed) return;

    var tms = turnMsFor();
    var start = state.roundStartAt || (state.roundEndsAt - tms);

  function resolveRound(p1, p2, m1, m2){
    var hp1=p1.hp, hp2=p2.hp, c1=p1.charge, c2=p2.charge;

    var a1=moveAction(m1), a2=moveAction(m2);

    // 2026-11-06: バリアを 3 回続けると、3 回目のバリアは割れて攻撃を防げない（バリアだけで粘って終わらないのを防ぐ）
    var brk1 = a1==='barrier' && (p1.bs||0) >= 2, brk2 = a2==='barrier' && (p2.bs||0) >= 2;

    if(a1==='attack' && a2!=='attack') dmg1to2=(a2==='barrier' && !brk2)?0:BASE_DMG*n1;
    if(a2==='attack' && a1!=='attack') dmg2to1=(a1==='barrier' && !brk1)?0:BASE_DMG*n2;
    if(brk1) lines.push('P1のバリアは3回続けて割れた！');
    if(brk2) lines.push('P2のバリアは3回続けて割れた！');
    if(brk1 && a2==='attack') lines.push('P2の'+n2+'回攻撃が割れたバリアを貫いて'+dmg2to1+'ダメージ！');
    if(brk2 && a1==='attack') lines.push('P1の'+n1+'回攻撃が割れたバリアを貫いて'+dmg1to2+'ダメージ！');
    hp2=Math.max(0,hp2-dmg1to2);
    hp1=Math.max(0,hp1-dmg2to1);

    if(a1==='charge' && a2==='charge') lines.push('二人とも「ためる」を選択。両者のチャージが1溜まった。');
    else if(a1==='barrier' && a2==='barrier') lines.push('二人とも「バリア」。何も起こらなかった。');
    else if(a1==='charge' && a2==='barrier') lines.push('P1はチャージ、P2はバリア。P1のチャージが1溜まった。');
    else if(a1==='barrier' && a2==='charge') lines.push('P2はチャージ、P1はバリア。P2のチャージが1溜まった。');
    else if(a1==='attack' && a2==='attack') lines.push('両者「攻撃」が激突！ 相殺してダメージなし。');
    else if(a1==='attack' && a2==='barrier') lines.push('P1の'+n1+'回攻撃はP2の「バリア」に防がれた。');
    else if(a1==='barrier' && a2==='attack') lines.push('P2の'+n2+'回攻撃はP1の「バリア」に防がれた。');
    else if(a1==='attack' && a2==='charge') lines.push('P2が「ためる」の隙をP1が'+n1+'回攻撃！ '+dmg1to2+'ダメージ！');
    else if(a1==='charge' && a2==='attack') lines.push('P1が「ためる」の隙をP2が'+n2+'回攻撃！ '+dmg2to1+'ダメージ！');

    return {hp1:hp1,hp2:hp2,c1:c1,c2:c2,text:lines.join(' '),

  // PeerJSの通信遅延と端末時計のずれを補正する。
  // 1回だけではなく複数回測定し、最もRTTが短かったサンプルを採用する。
  function startClockSync(){

  function handleClockSync(msg){
    if(role === 'host' && msg.type === 'clock-sync'){
      if(!conn) return;

      return;
    }
    if(role === 'guest' && msg.type === 'clock-sync-reply'){
      if(clockSyncReady) return;
      var t3 = Date.now();

      var offset = msg.th - (msg.t0 + rtt / 2);
      if(!clockSyncPending){
        clockSyncPending = { count:0, bestRtt:Infinity, bestOffset:0 };
      }
      clockSyncPending.count++;
      if(rtt < clockSyncPending.bestRtt){

        clockSyncPending.bestOffset = offset;
      }

  // ---------- host ----------
  function createRoom(){
    if(typeof Peer === 'undefined'){
      showToast('通信ライブラリの読み込みに失敗しました。回線を確認して再読み込みしてください', 4000);
      return;
    }
    var code = PARTY ? PARTY.code : randCode();
    role = 'host';
    ui.screen = 'creating';
    render();

    peer = new Peer(netId(code));

    peer.on('open', function(){
      ui.roomCode = code;
      ui.screen = 'battle-wait';
      render();
    });

    peer.on('connection', function(c){
      // 同じタブ（同じ人）からのつなぎ直し: 前のつながりと入れかえる（前は観戦にされて、準備完了などが押せなくなっていた）
      var sameTab = !!(c.metadata && c.metadata.tab && conn && conn.metadata && conn.metadata.tab === c.metadata.tab);
      if(PARTY && ((c.metadata && c.metadata.spec) || (conn && conn.open && !sameTab))){   // 観戦を選んだ人・3 人目以降は観戦
        c.on('open', function(){

        });
        c.on('close', function(){ spectators = spectators.filter(function(x){ return x !== c; }); });
        return;
      }
      if(conn && conn !== c){ conn.__replaced = true; try { conn.close(); } catch(e){} }
      conn = c;
      wrapSend(c);
      conn.on('open', function(){ /* wait for join message */ });
      conn.on('data', function(msg){ if(conn === c) handleHostData(msg); });
      conn.on('close', function(){
        if(c.__replaced || conn !== c) return;   // つなぎ直しで入れかえた古いつながり
        if(PARTY && !state){ partyGuestName = null; render(); return; }   // パーティの待ち合わせ中: 相手が抜けただけ（始まっていない）
        // 相手が抜けた: ラウンドを止めて終わりにする（いつまでも自動バリアで続かないように）
        clearRoundTimer(); stopTimerBarAnimation();
        if(graceTimer){ clearTimeout(graceTimer); graceTimer = null; }
        if(resolveTimer){ clearTimeout(resolveTimer); resolveTimer = null; }
        if(state && state.status === 'playing'){ state.status = 'finished'; state.winner = null; }
        showToast('相手との接続が切れました' + (PARTY ? '（ゲーム一覧へ戻ります）' : ''), 3000);
        if(PARTY) setTimeout(toGames, 2500);
      });
    });

    peer.on('error', function(err){
      console.error(err);
      if(PARTY && err.type === 'unavailable-id' && ++partyTries < 90){   // 前の部屋がまだ残っている: 空くのを待つ

        return;
      }

      ui.screen = 'home';
      render();
    });
  }

  function handleHostData(msg){
    if(msg.type === 'clock-sync') { handleClockSync(msg); return; }
    if(msg.type === 'join'){
      if(PARTY){

        partyGuestName = String(msg.name || 'Player 2').slice(0, 12);
        if(state){ if(state.players && state.players.p2) state.players.p2.name = partyGuestName; conn.send({ type:'state', state: state }); }
        else { sendPartyMode(); render(); }
        return;
      }
      state = freshState(ui.nameInput.trim() || 'Player 1', msg.name || 'Player 2', ui.hostHp, ui.hostMaxCharge, ui.selectedMode, {
        turnMs: ui.hostTurnMs,
        showOppHp: ui.hostShowOppHp,
        showOppCharge: ui.hostShowOppCharge,
        showMyHp: ui.hostShowMyHp,
        showMyCharge: ui.hostShowMyCharge
      });
      hostPending = { p1:null, p2:null };
      ui.screen = 'battle';
      render();
      conn.send({ type:'state', state: state });
      return;
    }
    if(msg.type === 'ready'){
      if(!state || state.status !== 'ready') return;
      state.ready.p2 = true;
      checkReadyStart();
      if(conn){ conn.send({ type:'state', state: state }); }
      render();
      return;
    }
    if(msg.type === 'move'){
      if(!state || msg.round !== state.round || roundClosed) return;
      var guestMove=msg.move;
      var guestAction=moveAction(guestMove);
      if(['charge','barrier','attack'].indexOf(guestAction)===-1) return;
      if(guestAction==='attack'){
        var guestCount=moveAttackCount(guestMove);
        if(guestCount<1 || guestCount>state.players.p2.charge) return;
        guestMove=moveForAction('attack',guestCount);
      } else { guestMove=moveForAction(guestAction); }
      hostPending.p2=guestMove;
      render();
      return;
    }
    if(msg.type === 'special-win'){
      if(!state || state.status!=='playing' || msg.round!==state.round || roundClosed || specialAnimating) return;
      if(state.players.p2.charge < state.players.p2.maxCharge) return;
      clearRoundTimer(); stopTimerBarAnimation();
      state.status='special';
      state.winner='p2';
      state.specialEndsAt=Date.now()+SPECIAL_TOTAL_MS;
      startSpecialAnimation('p2',SPECIAL_TOTAL_MS);
      if(conn) conn.send({type:'state',state:state});
      return;
    }
    if(msg.type === 'debug-max-charge'){
      return;   // 2026-11-06: 確認用のチャージ満タンは公開版では使わない
      if(!state || state.status !== 'playing') return;
      state.players.p2.charge = state.players.p2.maxCharge;
      if(conn){ conn.send({type:'state', state:state}); }
      render();
      return;
    }
    if(msg.type === 'restart-request'){
      if(!state || (state.status !== 'finished' && state.status !== 'normal-finish')) return;   // 勝負がついてからだけ
      doRestart();
      return;
    }
  }

  function checkReadyStart(){
    if(state.status === 'ready' && state.ready.p1 && state.ready.p2){
      state.status = 'playing';
      // ホストが未来の開始時刻を確定する。通信遅延中にバーが途中から始まらないよう、
      // 500msの余裕を持たせ、両者が同じ開始時刻を迎える。
      state.roundStartAt = Date.now() + ROUND_START_LEAD_MS;
      state.roundEndsAt = state.roundStartAt + turnMsFor();
      roundClosed = false;
      startRoundTimer();
    }
  }

  function tryResolveHost(){
    // 両者が選択しても、1秒が終わるまでは確定しない。
    // タイムバーの表示をホスト・ゲストで同じにするため、確定時刻を一本化する。
    render();
  }

  function finishResolveHost(m1, m2){
    var res = resolveRound(state.players.p1, state.players.p2, m1, m2);
    state.players.p1.hp = res.hp1; state.players.p1.charge = res.c1; state.players.p1.bs = res.bs1;
    state.players.p2.hp = res.hp2; state.players.p2.charge = res.c2; state.players.p2.bs = res.bs2;
    state.log = state.log.concat([{ round: state.round, text: res.text }]);
    if(res.hp1<=0 || res.hp2<=0){
      state.status = 'normal-finish';
      state.winner = (res.hp1<=0 && res.hp2<=0) ? 'draw' : (res.hp1<=0 ? 'p2' : 'p1');
      state.normalFinishEndsAt = Date.now() + NORMAL_RESULT_TOTAL_MS;
    } else {
      state.round = state.round + 1;
      // 次ラウンドも未来の開始時刻を共有し、両者が同じ時刻から1秒を進める。
      state.roundStartAt = Date.now() + ROUND_START_LEAD_MS;
      state.roundEndsAt = state.roundStartAt + turnMsFor();
      roundClosed = false;
    }
    hostPending = { p1:null, p2:null };
    reveal = null;
    myMove = null;
    if(conn){ conn.send({ type:'state', state: state }); }
    render();
    if(state.status === 'playing'){
      startRoundTimer();
    } else if(state.status === 'normal-finish'){
      startNormalResultAnimation(state.winner, NORMAL_RESULT_TOTAL_MS);
    }
  }

  function doRestart(){
    var hostName = state.players.p1.name, guestName = state.players.p2.name;
    var hpSetting = state.hpSetting;
    var maxChargeSetting = state.maxChargeSetting;
    var mode = state.mode;
    var custom = {
      turnMs: state.turnMsSetting,
      showOppHp: state.showOppHp,
      showOppCharge: state.showOppCharge,
      showMyHp: state.showMyHp,
      showMyCharge: state.showMyCharge
    };
    resetSpecialAnimation();
    resetNormalResultAnimation();
    if(resolveTimer){ clearTimeout(resolveTimer); resolveTimer = null; }   // 結果を出す途中だった分は捨てる
    if(graceTimer){ clearTimeout(graceTimer); graceTimer = null; }
    hostLocalClosed = false;
    state = freshState(hostName, guestName, hpSetting, maxChargeSetting, mode, custom);
    hostPending = { p1:null, p2:null };
    reveal = null;
    myMove = null;
    clearRoundTimer();
    stopTimerBarAnimation();
    roundClosed = false;
    if(conn){ conn.send({ type:'state', state: state }); }
    render();
  }

  // ---------- guest ----------
  function joinRoom(){
    if(typeof Peer === 'undefined'){
      showToast('通信ライブラリの読み込みに失敗しました。回線を確認して再読み込みしてください', 4000);
      return;
    }
    var code = PARTY ? PARTY.code : ui.codeInput.trim().toLowerCase();
    if(!code){ showToast('部屋コードを入力してください'); return; }

    role = 'guest';
    clockSyncReady = false;
    clockSyncPending = null;
    hostClockOffset = 0;
    ui.screen = 'joining';
    render();

    peer = new Peer();

    // ホストの部屋へつなぐ。パーティでホストの部屋がまだ開いていないときは、2.5 秒たってもつながらなければつなぎ直す
    // （PeerJS は 2 回目以降の「相手が見つからない」を知らせないことがあるので、エラーを待たずに時間で判断する）
    function connectHost(){
      var c = conn = peer.connect(netId(code), { reliable:true, metadata: { spec: !!(PARTY && PARTY.spec), tab: window.ykgTabId || '' } });

      c.on('open', function(){
        c.__opened = true;
        if(PARTY && PARTY.spec){ enterSpectate(); render(); return; }   // 観戦: 参加の知らせは送らない
        c.send({ type:'join', name: ui.nameInput.trim() || 'Player 2' });
        setTimeout(startClockSync, 100);
      });
      c.on('data', function(msg){ handleGuestData(msg); });
      c.on('close', function(){
        if(PARTY){ if(conn === c && c.__opened) toGames(); return; }   // パーティ: ホストがいなくなったらゲーム一覧へ
        showToast('相手との接続が切れました', 3000);
      });
      c.on('error', function(err){
        if(PARTY) return;   // パーティ: 下の時間切れで探し直す
        console.error(err);
        showToast('接続に失敗しました。コードを確認してください', 3500);
        ui.screen = 'join';
        render();
      });
      if(PARTY) setTimeout(function(){
        if(conn !== c || c.open) return;
        try { c.close(); } catch(e){}
        if(++partyTries > 150){ showToast('ホストが見つかりません（ゲーム一覧へ戻ります）', 3000); setTimeout(toGames, 3000); return; }
        if(partyTries % 6 === 0){ try { peer.destroy(); } catch(e){} joinRoom(); }   // ときどき peer から作り直す
        else connectHost();
      }, 2500);
    }
    peer.on('open', connectHost);

    peer.on('error', function(err){
      if(PARTY && err.type === 'peer-unavailable') return;   // パーティ: ホストがまだモードを選んでいる。connectHost の時間切れで探し直す
      console.error(err);
      var msg = (err.type === 'peer-unavailable')
        ? '部屋が見つかりません。コードをご確認ください'
        : '接続エラーが発生しました(' + err.type + ')';
      showToast(msg, 4000);
      ui.screen = 'join';
      render();
    });
  }

  function handleGuestData(msg){
    if(msg.type === 'clock-sync-reply') { handleClockSync(msg); return; }
    if(msg.type === 'spectate'){ enterSpectate(); render(); return; }   // ホストが観戦にした（2人そろっていた）
    if(msg.type === 'party-mode'){ partyModeSeen = msg.mode; render(); return; }   // パーティ: ホストが選んでいるモード
    if(msg.type === 'full'){ showToast('2人用のゲームです。いまは遊べません（ゲーム一覧へ戻ります）', 3500); setTimeout(toGames, 3500); return; }
    if(msg.type === 'reveal'){
      clearRoundTimer();
      stopTimerBarAnimation();
      reveal = msg.reveal;
      render();
      return;
    }
    // 必殺技演出はstate.status='special'だけを正規の同期情報として使う。
    // special-effectは旧版との互換用に受信しても何もしない。
    if(msg.type === 'special-effect') return;
    if(msg.type === 'state'){
      state = msg.state;
      reveal = null;
      myMove = null;
      ui.screen = 'battle';
      roundClosed = false;

      // 必殺技演出中に勝敗確定のstateを受信した場合、
      // ゲスト側の演出オーバーレイを必ず終了する。
      // これを行わないとスマホでWIN/LOSE演出が残り続け、
      // 勝敗画面の再戦ボタンを覆って操作できなくなる。
      if(state.status === 'special'){
        clearRoundTimer();
        stopTimerBarAnimation();
        resetNormalResultAnimation();
        var specialRemain = state.specialEndsAt ? Math.max(0, state.specialEndsAt - (Date.now() + hostClockOffset)) : SPECIAL_TOTAL_MS;
        if(!specialAnimating || specialWinner !== state.winner){
          startSpecialAnimation(state.winner, specialRemain);
        }
      } else if(state.status === 'normal-finish'){
        clearRoundTimer();
        stopTimerBarAnimation();
        resetSpecialAnimation();
        var normalRemain = state.normalFinishEndsAt ? Math.max(0, state.normalFinishEndsAt - (Date.now() + hostClockOffset)) : NORMAL_RESULT_TOTAL_MS;
        if(!normalResultAnimating || normalResultWinner !== state.winner){
          startNormalResultAnimation(state.winner, normalRemain);
        }
      } else {
        resetSpecialAnimation();
        resetNormalResultAnimation();
      }

      render();
      if(state.status === 'playing'){
        if(role === 'guest' && !clockSyncReady){ startClockSync(); }
        else { startRoundTimer(); }
      } else { clearRoundTimer(); }
    }
  }

  // ---------- shared ----------
  function pressStart(){
    if(spectating) return;
    if(!state || state.status !== 'ready') return;
    if(role === 'host'){
      state.ready.p1 = true;
      checkReadyStart();
      if(conn){ conn.send({ type:'state', state: state }); }
      render();
    } else {
      if(!clockSyncReady){
        showToast('時計を同期しています。少し待ってからスタートしてください', 1800);
        startClockSync();
        return;
      }
      state.ready.p2 = true; // optimistic local update
      if(conn){ conn.send({ type:'ready' }); }
      render();
    }
  }

  function adjustHostHp(delta){
    if(role !== 'host' || !state || state.status !== 'ready') return;
    var next = Math.max(10, Math.min(MAX_HP, state.hpSetting + delta));
    state.hpSetting = next;
    state.players.p1.hp = next;
    state.players.p2.hp = next;
    ui.hostHp = next;
    if(conn){ conn.send({ type:'state', state: state }); }
    render();
  }

  function adjustHostMaxCharge(delta){
    if(role !== 'host' || !state || state.status !== 'ready') return;
    var next = Math.max(1, Math.min(MAX_CHARGE, state.maxChargeSetting + delta));
    state.maxChargeSetting = next;
    state.players.p1.maxCharge = next;
    state.players.p2.maxCharge = next;
    ui.hostMaxCharge = next;
    if(conn){ conn.send({ type:'state', state: state }); }
    render();
  }

  function adjustHostTurnMs(delta){
    if(role !== 'host' || !state || state.status !== 'ready' || state.mode !== 'custom') return;
    var next = Math.max(MIN_TURN_MS, Math.min(MAX_TURN_MS, state.turnMsSetting + delta));
    state.turnMsSetting = next;
    ui.hostTurnMs = next;
    if(conn){ conn.send({ type:'state', state: state }); }
    render();
  }

  function toggleHostSetting(key){
    if(role !== 'host' || !state || state.status !== 'ready' || state.mode !== 'custom') return;
    var uiKey = 'host' + key.charAt(0).toUpperCase() + key.slice(1);
    state[key] = !state[key];
    ui[uiKey] = state[key];
    if(conn){ conn.send({ type:'state', state: state }); }
    render();
  }

  // 相手の名前を押すと、自分のチャージを最大まで満タンにする。
  function debugMaxCharge(){
    if(!state || state.status !== 'playing') return;
    if(role === 'host'){
      state.players.p1.charge = state.players.p1.maxCharge;
      if(conn){ conn.send({type:'state', state:state}); }
      render();
    }else{
      if(conn){ conn.send({type:'debug-max-charge'}); }
    }
  }

  function resetNormalResultAnimation(){
    normalResultGeneration++;
    clearTimeout(normalResultFinishTimer);
    normalResultFinishTimer = null;
    normalResultAnimating = false;
    normalResultWinner = null;
    normalResultStartedAt = 0;
  }

  function startNormalResultAnimation(winner, duration){
    resetNormalResultAnimation();
    normalResultAnimating = true;
    normalResultWinner = winner;
    var ms = Math.max(0, Number(duration) || NORMAL_RESULT_TOTAL_MS);
    normalResultStartedAt = Date.now() - Math.max(0, NORMAL_RESULT_TOTAL_MS - ms);
    var generation = normalResultGeneration;
    render();
    normalResultFinishTimer = setTimeout(function(){
      if(generation !== normalResultGeneration) return;
      if(role === 'host') finishNormalResult(winner);
      else if(state && state.status === 'normal-finish') finishNormalResultGuest(winner);
    }, ms);
  }

  function finishNormalResultGuest(winner){
    clearTimeout(normalResultFinishTimer);
    normalResultFinishTimer = null;
    if(!state || state.status !== 'normal-finish') return;
    state.status = 'finished';
    state.winner = winner;
    resetNormalResultAnimation();
    render();
  }

  function finishNormalResult(winner){
    clearTimeout(normalResultFinishTimer);
    normalResultFinishTimer = null;
    if(!state || state.status !== 'normal-finish') return;
    state.status = 'finished';
    state.winner = winner;
    resetNormalResultAnimation();
    if(conn) conn.send({type:'state', state:state});
    render();
  }

  function resetSpecialAnimation(){
    specialFxGeneration++;
    clearTimeout(specialFinishTimer);
    specialFinishTimer = null;
    specialAnimating = false;
    specialWinner = null;
    specialStartedAt = 0;
  }

  function startSpecialAnimation(winner, duration){
    resetSpecialAnimation();
    specialAnimating = true;
    specialWinner = winner;
    var ms = Math.max(0, Number(duration) || SPECIAL_TOTAL_MS);
    specialStartedAt = Date.now() - Math.max(0, SPECIAL_TOTAL_MS - ms);
    var generation = specialFxGeneration;
    render();

    // CSS animationだけに終了処理を任せず、JSでも必ず終了させる。
    // iOS/Safariではバックグラウンド復帰時などにCSS/JSのタイミングがずれることがあるため、
    // 余裕を持ったフェイルセーフも入れる。
    specialFinishTimer = setTimeout(function(){
      if(generation !== specialFxGeneration) return;
      if(role === 'host') finishSpecial(winner);
      else if(state && state.status === 'special') finishSpecialGuest(winner);
    }, ms);
  }

  function finishSpecialGuest(winner){
    clearTimeout(specialFinishTimer);
    specialFinishTimer=null;
    if(!state || state.status !== 'special') return;
    state.status='finished';
    state.winner=winner;
    resetSpecialAnimation();
    render();
  }

  function finishSpecial(winner){
    clearTimeout(specialFinishTimer);
    specialFinishTimer=null;
    if(!state) { resetSpecialAnimation(); return; }
    if(state.status !== 'playing' && state.status !== 'special') {
      resetSpecialAnimation();
      render();
      return;
    }
    clearRoundTimer(); stopTimerBarAnimation();
    state.status='finished'; state.winner=winner;
    state.log=state.log.concat([{round:state.round,text:(winner==='p1'?'P1':'P2')+'が上限チャージを使い、バリアを貫通する必殺技で問答無用の勝利！'}]);
    hostPending={p1:null,p2:null}; reveal=null; myMove=null;
    resetSpecialAnimation();
    if(conn) conn.send({type:'state',state:state});
    render();
  }

  function useSpecialWin(){
    if(!state || state.status!=='playing' || specialAnimating) return;
    var myKey=role==='host'?'p1':'p2'; var me=state.players[myKey];
    if(me.charge < me.maxCharge) return;
    if(role==='host'){
      if(roundClosed) return;
      clearRoundTimer(); stopTimerBarAnimation();
      // 必殺技演出中であることをホストのstateにも即時反映し、
      // ゲスト側が「playing」のまま取り残されないようにする。
      state.status='special';
      state.winner='p1';
      state.specialEndsAt=Date.now()+SPECIAL_TOTAL_MS;
      startSpecialAnimation('p1',SPECIAL_TOTAL_MS);
      if(conn) conn.send({type:'state',state:state});
    }else{
      conn.send({type:'special-win',round:state.round});
      showToast('必殺技を発動しました',1500);
    }
  }

  function pickMove(action){
    if(spectating) return;
    if(!state || state.status!=='playing' || reveal || roundClosed || (role==='host' && hostLocalClosed)) return;
    var myKey=role==='host'?'p1':'p2';
    var me=state.players[myKey];
    var currentAction=moveAction(myMove);
    var currentCount=moveAttackCount(myMove);
    var nextMove;

    if(action==='attack'){
      var nextCount=(currentAction==='attack')?currentCount+1:1;
      // そのラウンドで押せる攻撃回数は、現在のチャージ数まで。
      if(nextCount>me.charge || nextCount>me.maxCharge) return;
      nextMove=moveForAction('attack',nextCount);
    } else {
      // 「ためる」「バリア」を押したら、それまでの攻撃回数をリセット。
      nextMove=moveForAction(action);
    }

    myMove=nextMove;
    if(role==='host'){
      hostPending.p1=nextMove;
      tryResolveHost();
    } else {
      conn.send({type:'move',round:state.round,move:nextMove});
      render();
    }
  }

  function requestRestart(){
    if(spectating) return;
    if(role === 'host'){
      doRestart();
    } else {
      conn.send({ type:'restart-request' });
      showToast('再戦をリクエストしました', 1800);
    }
  }

  function copyCode(){
    var text = ui.roomCode;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        showToast('コードをコピーしました', 1800);
      }).catch(function(){ showToast(text, 2500); });
    } else {
      showToast(text, 2500);
    }
  }

  // ---------- render ----------
  function render(){
    if(PARTY) partyLobby();
    app.classList.remove('mode-duel');
    if(ui.screen === 'home'){
      app.innerHTML =
        (ui.toast ? '<div class="toast">'+esc(ui.toast)+'</div>' : '') +
        '<div class="wrap">' +
          '<div class="brand">' +
            '<div class="mark">3-way duel</div>' +
            '<h1><span class="a">ためる</span> / <span class="b">バリア</span> / <span class="c">攻撃</span></h1>' +
          '</div>' +
          '<div class="card">' +
            '<div class="label">プレイヤー名</div>' +
            '<input type="text" id="nameField" placeholder="名前を入力" maxlength="12" value="'+esc(ui.nameInput)+'" />' +
            '<div style="height:16px"></div>' +
            '<div class="row">' +
              '<button class="btn primary" id="btnCreate">部屋を作る</button>' +
              '<button class="btn primary" id="btnJoin">部屋に入る</button>' +
            '</div>' +
          '</div>' +
          '<div class="footer-actions"><button class="link" id="btnGames">← ゲーム一覧へ（you know games）</button></div>' +
        '</div>';
      document.getElementById('nameField').addEventListener('input', function(e){ ui.nameInput = e.target.value; });
      document.getElementById('btnCreate').addEventListener('click', goCreate);
      document.getElementById('btnJoin').addEventListener('click', goJoin);
      document.getElementById('btnGames').addEventListener('click', toGames);
      return;
    }

    if(ui.screen === 'mode-select'){
      app.innerHTML =
        (ui.toast ? '<div class="toast">'+esc(ui.toast)+'</div>' : '') +
        '<div class="wrap">' +
          '<div class="brand"><div class="mark">play mode</div><h1>プレイモードを選択</h1></div>' +
          '<div class="card">' +
            '<p class="muted center" style="line-height:1.7;margin-top:0">部屋を作る側だけがモードを選択できます。<br>参加する側は、部屋主が選択したモードで開始します。</p>' +
            '<div class="row" style="margin-top:16px">' +
              '<button class="btn primary" id="btnNormal">通常モード</button>' +
              '<button class="btn primary" id="btnCustom">カスタマイズモード</button>' +
            '</div>' +
            '<p class="muted center" style="line-height:1.7">通常モード：これまで通りの標準設定<br>カスタマイズモード：表示項目・選択時間・HP・チャージ上限を自由に設定できます</p>' +
            '<div class="footer-actions"><button class="link" id="btnModeBack">戻る</button></div>' +
          '</div>' +
        '</div>';
      document.getElementById('btnNormal').addEventListener('click', function(){ selectMode('normal'); });
      document.getElementById('btnCustom').addEventListener('click', function(){ selectMode('custom'); });
      document.getElementById('btnModeBack').addEventListener('click', goHome);
      return;
    }

    if(ui.screen === 'creating'){
      app.innerHTML =
        '<div class="wrap"><div class="card center"><p class="muted">部屋を準備しています…</p></div></div>';
      return;
    }

    if(ui.screen === 'battle-wait'){
      app.innerHTML =
        (ui.toast ? '<div class="toast">'+esc(ui.toast)+'</div>' : '') +
        '<div class="wrap">' +
          '<div class="brand"><div class="mark">waiting</div><h1>相手を待っています</h1></div>' +
          '<div class="card center">' +
            '<div class="code">' + esc(ui.roomCode) + '</div>' +
            '<p class="muted">' + (PARTY ? 'パーティの相手が入ると自動でバトルが始まります。' : 'このコードを友人に共有してください。参加すると自動でバトルが始まります。') + '</p>' +
            '<div class="footer-actions"><button class="link" id="btnCopy">コードをコピー</button></div>' +
          '</div>' +
        '</div>';
      document.getElementById('btnCopy').addEventListener('click', copyCode);
      return;
    }

    if(ui.screen === 'join'){
      app.innerHTML =
        (ui.toast ? '<div class="toast">'+esc(ui.toast)+'</div>' : '') +
        '<div class="wrap">' +
          '<div class="brand"><div class="mark">guest</div><h1>部屋に入る</h1></div>' +
          '<div class="card">' +
            '<div class="label">部屋コード</div>' +
            '<input type="text" id="codeField" placeholder="例: 7" maxlength="1" inputmode="numeric" value="'+esc(ui.codeInput)+'" style="text-align:center;letter-spacing:.3em;font-size:20px" />' +
            '<div class="row" style="margin-top:16px">' +
              '<button class="btn" id="btnBack">戻る</button>' +
              '<button class="btn primary" id="btnGo">参加する</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      document.getElementById('codeField').addEventListener('input', function(e){ ui.codeInput = e.target.value.toLowerCase(); });
      document.getElementById('btnBack').addEventListener('click', goHome);
      document.getElementById('btnGo').addEventListener('click', joinRoom);
      return;
    }

    if(ui.screen === 'joining'){
      app.innerHTML =
        (ui.toast ? '<div class="toast">'+esc(ui.toast)+'</div>' : '') +
        '<div class="wrap"><div class="card center"><p class="muted">' + (PARTY ? (spectating ? '観戦: バトルが始まるのを待っています…' : 'ホストがモードを選ぶのを待っています…') : '接続しています…') + '</p></div></div>';
      return;
    }

    // battle
    if(!state){
      app.innerHTML = '<div class="wrap center muted">読み込み中…</div>';
      return;
    }

    var myKey = role === 'host' ? 'p1' : 'p2';
    var oppKey = role === 'host' ? 'p2' : 'p1';
    var me = state.players[myKey];
    var opp = state.players[oppKey];
    var lastLog = state.log[state.log.length-1];

    app.classList.add('mode-duel');

    // action box contents (mirrors around the divider)
    var oppActionHtml, myActionHtml;
    if(state.status === 'ready'){
      oppActionHtml = state.ready[oppKey] ? '<span class="tt">準備完了</span>' : '<span class="ph">準備中…</span>';
      myActionHtml  = state.ready[myKey]  ? '<span class="tt">準備完了</span>' : '<span class="ph">未準備</span>';
    } else if(reveal){
      var oa = ACTIONS[moveAction(reveal[oppKey])], ma = ACTIONS[moveAction(reveal[myKey])];
      oppActionHtml = '<span class="ic">'+oa.icon+'</span><span class="tt">'+oa.label+'</span>';
      myActionHtml  = '<span class="ic">'+ma.icon+'</span><span class="tt">'+ma.label+'</span>';
    } else {
      oppActionHtml = '<span class="ph">？</span>';
      if(myMove){
        var pa = ACTIONS[moveAction(myMove)];
        var attackSuffix = moveAction(myMove)==='attack' ? ' ×'+moveAttackCount(myMove) : '';
        myActionHtml = '<span class="ic">'+pa.icon+'</span><span class="tt">'+pa.label+attackSuffix+'</span>';
      } else {
        myActionHtml = '<span class="ph">未選択</span>';
      }
    }

    var showTimerBar = (state.status === 'playing' && !reveal);
    var timerPercent = showTimerBar ? getTimerPercent() : 0;

    var html = (ui.toast ? '<div class="toast">'+esc(ui.toast)+'</div>' : '');

    // スタートボタンはプレイヤー情報の通常レイアウトから切り離して固定。
    // ホスト・ゲストのどちらも、チャージ枠が何段になっても位置が押し下げられない。
    if(state.status === 'ready' && !state.ready[myKey]){
      html += '<div class="ready-start-float">' +
        '<div class="abtn startbtn" id="btnStart"><span class="tt">▶ スタート</span></div>' +
      '</div>';
    }

    html += '<div class="duel-wrap">' +
        '<div class="duel-half opp">' +
          '<div class="namebox" id="oppNameBox">'+esc(opp.name)+'</div>' +
          (state.showOppHp !== false ? '<div class="hpbox-outer"><div class="hpbox-fill" style="width:'+Math.round(opp.hp/state.hpSetting*100)+'%"></div><div class="hpbox-num">'+opp.hp+' / '+state.hpSetting+'</div></div>' : '') +
          (state.showOppCharge !== false ? '<div class="pipsrow">' + pipsHtml(opp.charge) + '</div>' : '') +
          '<div class="actionbox '+(reveal?ACTIONS[moveAction(reveal[oppKey])].cls:'')+'">' + oppActionHtml + '</div>' +
        '</div>' +
        '<div class="divider2">' + (showTimerBar ? '<div class="timerbar" id="timerbar" style="width:'+timerPercent+'%"></div>' : '') + '</div>' +
        '<div class="duel-half me">' +
          '<div class="actionbox '+(reveal?ACTIONS[moveAction(reveal[myKey])].cls:(myMove?ACTIONS[moveAction(myMove)].cls:''))+'">' + myActionHtml + '</div>' +
          (state.showMyCharge !== false ? '<div class="pipsrow">' + pipsHtml(me.charge) + '</div>' : '') +
          (state.showMyHp !== false ? '<div class="hpbox-outer"><div class="hpbox-fill" style="width:'+Math.round(me.hp/state.hpSetting*100)+'%"></div><div class="hpbox-num">'+me.hp+' / '+state.hpSetting+'</div></div>' : '') +
          '<div class="namebox">'+esc(me.name)+'</div>';

    if(state.status === 'ready'){
      html += '<div class="actions">';
      Object.keys(ACTIONS).forEach(function(key){
        var a = ACTIONS[key];
        html += '<div class="abtn '+a.cls+' disabled" data-move="'+key+'">' +
          '<span class="ic">'+a.icon+'</span>' +
          '<span class="tt">'+a.label+'</span>' +
        '</div>';
      });
      html += '</div>';

      if(role === 'host'){
        /* 設定はduel-halfの通常レイアウトから切り離して固定表示。
           チャージ枠が30個で2段以上になっても、設定ボタンは移動しない。 */
        html += '<div class="setting-panel battle-setting-panel host-ready-settings">' +
          '<div class="setting-row">' +
            '<span class="setting-label">初期HP</span>' +
            '<div class="setting-ctrl"><button class="hpbtn" id="hostHpMinus" type="button">−</button><span class="hpval">'+state.hpSetting+'</span><button class="hpbtn" id="hostHpPlus" type="button">＋</button></div>' +
          '</div>' +
          '<div class="setting-row">' +
            '<span class="setting-label">最大チャージ（必殺技）</span>' +
            '<div class="setting-ctrl"><button class="hpbtn" id="hostChargeMinus" type="button">−</button><span class="hpval">'+state.maxChargeSetting+'</span><button class="hpbtn" id="hostChargePlus" type="button">＋</button></div>' +
          '</div>';

        if(state.mode === 'custom'){
          html +=
          '<div class="setting-row">' +
            '<span class="setting-label">選択する時間</span>' +
            '<div class="setting-ctrl"><button class="hpbtn" id="hostTurnMsMinus" type="button">−</button><span class="hpval">'+(state.turnMsSetting/1000).toFixed(1)+'秒</span><button class="hpbtn" id="hostTurnMsPlus" type="button">＋</button></div>' +
          '</div>' +
          '<div class="setting-row">' +
            '<span class="setting-label">相手のHP表示</span>' +
            '<div class="setting-ctrl"><button class="hpbtn" id="toggleShowOppHp" type="button" style="width:auto;padding:0 10px;">'+(state.showOppHp?'表示':'非表示')+'</button></div>' +
          '</div>' +
          '<div class="setting-row">' +
            '<span class="setting-label">相手のチャージ数表示</span>' +
            '<div class="setting-ctrl"><button class="hpbtn" id="toggleShowOppCharge" type="button" style="width:auto;padding:0 10px;">'+(state.showOppCharge?'表示':'非表示')+'</button></div>' +
          '</div>' +
          '<div class="setting-row">' +
            '<span class="setting-label">自分のHP表示</span>' +
            '<div class="setting-ctrl"><button class="hpbtn" id="toggleShowMyHp" type="button" style="width:auto;padding:0 10px;">'+(state.showMyHp?'表示':'非表示')+'</button></div>' +
          '</div>' +
          '<div class="setting-row">' +
            '<span class="setting-label">自分のチャージ数表示</span>' +
            '<div class="setting-ctrl"><button class="hpbtn" id="toggleShowMyCharge" type="button" style="width:auto;padding:0 10px;">'+(state.showMyCharge?'表示':'非表示')+'</button></div>' +
          '</div>' +
          '<div class="setting-note">HP：10〜100 ／ 最大チャージ：1〜30 ／ 選択時間：0.3〜3.0秒</div>';
        } else {
          html += '<div class="setting-note">HP：10〜100 ／ 最大チャージ：1〜30</div>';
        }

        html += '</div>';
      } else {
        html += '<div class="hpsetter">' +
          '<span class="hpsetter-label">初期HP：'+state.hpSetting+' ／ 最大チャージ：'+state.maxChargeSetting+(state.mode==='custom' ? ' ／ 選択時間：'+(state.turnMsSetting/1000).toFixed(1)+'秒' : '')+'</span>' +
        '</div>';
      }

      if(state.ready[myKey]){
        html += '<div class="waitline">準備完了！相手を待っています…</div>';
      }
    }

    // 対戦中は、公開中も含めて行動ボタンを常に表示する。
    // 公開中・自分が選択済み・攻撃不能時は押せないだけで、表示は消さない。
    if(state.status === 'playing'){
      html += '<div class="actions">';
      Object.keys(ACTIONS).forEach(function(key){
        var a=ACTIONS[key];
        var picked=moveAction(myMove)===key;
        var attackCount=moveAttackCount(myMove);
        var disabled=!!reveal || specialAnimating || (key==='attack' && (me.charge<=0 || attackCount>=me.charge));
        var label=a.label;
        if(key==='attack' && picked) label += ' ×'+attackCount+'（'+(BASE_DMG*attackCount)+'ダメージ）';
        html += '<div class="abtn '+a.cls+' '+(disabled?'disabled':'')+' '+(picked?'picked':'')+'" data-move="'+key+'">' +
          '<span class="ic">'+a.icon+'</span>' +
          '<span class="tt">'+label+'</span>' +
        '</div>';
      });
      html += '</div>';

      var specialDisabled = !!reveal || specialAnimating || me.charge < me.maxCharge;
      html += '<div class="special-wrap">' +
        '<button type="button" class="special-btn '+(specialDisabled?'disabled':'')+'" id="btnSpecial" '+(specialDisabled?'disabled':'')+'>' +
          '<div class="tt">必殺技（'+me.maxCharge+'チャージ）</div>' +
          '<div class="sub">バリアを貫通して、その場で問答無用の勝利</div>' +
        '</button>' +
      '</div>';
    }

    html += '</div></div>'; // .duel-half.me, .duel-wrap

    html += '<div class="meta-line">' + (state.mode === 'custom' ? 'カスタマイズモード' : '通常モード') + ' ・ ROUND ' + state.round + (lastLog ? ' ・ ' + esc(lastLog.text) : '') + '</div>';

    if(state.status === 'finished'){
      var title = state.winner === 'draw' ? '引き分け！' : (state.winner === myKey ? 'あなたの勝利！' : 'あなたの敗北…');
      html += '<div class="card center">' +
        '<h2 style="margin:0 0 8px">' + title + '</h2>' +
        '<button class="btn primary" id="btnRestart" style="margin-top:8px">もう一度対戦する</button>' +
      '</div>';
    }

    if(normalResultAnimating){
      var normalLocalIsWinner = (normalResultWinner === myKey);
      var normalResultClass = state.winner === 'draw' ? 'draw' : (normalLocalIsWinner ? 'win' : 'lose');
      var normalResultText = state.winner === 'draw' ? 'DRAW!!' : (normalLocalIsWinner ? 'WIN!!' : 'LOSE!!');
      var normalElapsed = Math.max(0, Date.now() - (normalResultStartedAt || Date.now()));
      html += '<div class="normal-result-fx" style="--normal-elapsed-ms:'+normalElapsed+'ms">' +
        '<div class="normal-result-word '+normalResultClass+'">'+normalResultText+'</div>' +
      '</div>';
    }

    if(specialAnimating){
      // 勝敗表示は「この端末のプレイヤー」に対して1個だけ生成する。
      // ゲスト側でもspecialWinner(p1/p2)とmyKey(p2)を比較するため、
      // 相手側のWIN/LOSE文字列はDOMに一切生成しない。
      var localIsWinner = (specialWinner === myKey);
      var localResultClass = localIsWinner ? 'win' : 'lose';
      var localResultText = localIsWinner ? 'WIN!!' : 'LOSE!!';
      var sfxElapsed = Math.max(0, Date.now() - (specialStartedAt || Date.now()));
      html += '<div class="special-fx shaking" data-local-result="'+localResultClass+'" style="--sfx-elapsed-ms:'+sfxElapsed+'ms">' +
        '<div class="sfx-title">必殺技!!</div>' +
        '<div class="sfx-light"></div>' +
        '<div class="sfx-shockwave"></div>' +
        '<div class="sfx-shockwave"></div>' +
        '<div class="sfx-result"><div class="result-word '+localResultClass+'">'+localResultText+'</div></div>' +
      '</div>';
    }
    app.innerHTML = html;

    // render()でDOMが作り直されても、同じラウンドの時刻をそのまま使う。
    if(showTimerBar){
      updateTimerBar();
      animateTimerBar();
    } else {
      stopTimerBarAnimation();
    }

    var startBtn = document.getElementById('btnStart');
    if(startBtn) startBtn.addEventListener('click', pressStart);

    var oppNameBox = document.getElementById('oppNameBox');
    // 2026-11-06: 相手の名前をタップするとチャージが満タンになる確認用の仕掛けを外した

    var hostHpMinus = document.getElementById('hostHpMinus');
    if(hostHpMinus) hostHpMinus.addEventListener('click', function(){ adjustHostHp(-10); });
    var hostHpPlus = document.getElementById('hostHpPlus');
    if(hostHpPlus) hostHpPlus.addEventListener('click', function(){ adjustHostHp(10); });
    var hostChargeMinus = document.getElementById('hostChargeMinus');
    if(hostChargeMinus) hostChargeMinus.addEventListener('click', function(){ adjustHostMaxCharge(-1); });
    var hostChargePlus = document.getElementById('hostChargePlus');
    if(hostChargePlus) hostChargePlus.addEventListener('click', function(){ adjustHostMaxCharge(1); });

    var hostTurnMsMinus = document.getElementById('hostTurnMsMinus');
    if(hostTurnMsMinus) hostTurnMsMinus.addEventListener('click', function(){ adjustHostTurnMs(-TURN_MS_STEP); });
    var hostTurnMsPlus = document.getElementById('hostTurnMsPlus');
    if(hostTurnMsPlus) hostTurnMsPlus.addEventListener('click', function(){ adjustHostTurnMs(TURN_MS_STEP); });

    var toggleShowOppHp = document.getElementById('toggleShowOppHp');
    if(toggleShowOppHp) toggleShowOppHp.addEventListener('click', function(){ toggleHostSetting('showOppHp'); });
    var toggleShowOppCharge = document.getElementById('toggleShowOppCharge');
    if(toggleShowOppCharge) toggleShowOppCharge.addEventListener('click', function(){ toggleHostSetting('showOppCharge'); });
    var toggleShowMyHp = document.getElementById('toggleShowMyHp');
    if(toggleShowMyHp) toggleShowMyHp.addEventListener('click', function(){ toggleHostSetting('showMyHp'); });
    var toggleShowMyCharge = document.getElementById('toggleShowMyCharge');
    if(toggleShowMyCharge) toggleShowMyCharge.addEventListener('click', function(){ toggleHostSetting('showMyCharge'); });

    var restartBtn = document.getElementById('btnRestart');
    if(restartBtn) restartBtn.addEventListener('click', requestRestart);

    var specialBtn = document.getElementById('btnSpecial');
    if(specialBtn) specialBtn.addEventListener('click', useSpecialWin);

    var abtns = app.querySelectorAll('.abtn:not(.startbtn)');
    abtns.forEach(function(el){
      el.addEventListener('click', function(){
        if(el.classList.contains('disabled')) return;
        pickMove(el.getAttribute('data-move'));
      });
    });

  }

  function pipsHtml(charge){
    var out = '';
    for(var i=0;i<(state && state.players ? ((role==='host'?state.players.p1:state.players.p2).maxCharge || MAX_CHARGE) : MAX_CHARGE);i++){
      out += '<div class="pip2 ' + (i<charge?'on':'') + '"></div>';
    }
    return out;
  }

  // パーティから開いたとき: 最初はパーティの待ち合わせ画面（ykgLobby）。ホストはすぐ部屋を作り、モードを選んで「スタート」。ゲストは自動で入る。
  // 対戦の画面では左上に「← 一覧」を出す
  if(PARTY){
    ui.nameInput = String(PARTY.name || ui.nameInput).slice(0, 12);
    var back = document.createElement('button');
    back.id = 'ykgBack'; back.textContent = '← 一覧';
    back.addEventListener('click', function(){ if(confirm('ゲーム一覧へ戻りますか？' + (role === 'host' ? '（相手も一覧へ戻ります）' : ''))) toGames(); });
    document.body.appendChild(back);
    if(PARTY.role === 'host'){ ui.selectedMode = ui.selectedMode === 'custom' ? 'custom' : 'normal'; createRoom(); }
    else joinRoom();
  } else render();
  // アプリとして入れたときに使うサービスワーカー（ミニゲーム集で 1 つ。1 つ上のフォルダにある）
  try { if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) navigator.serviceWorker.register('../sw.js').catch(function(){}); } catch(e){}
})();
</script>
</body>
</html>

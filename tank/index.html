<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4a2c12">
<title>タンクファイト</title>
<!-- ミニゲーム集「you know games」のゲーム（kakutou/tank/）。2026-11-18 作成 -->
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="you know games">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="manifest" href="../manifest.json"><link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png?v=3"><link rel="apple-touch-icon" href="../apple-touch-icon.png?v=3">
<style>
/* 2026-11-28: 木のおもちゃ風のUI。木目は JS で canvas に描いて --wl（明るい板）/ --wf（床）/ --wd（こげ茶の台）に入れる */
:root{--ink:#4a2a10;--ink2:#7a5230;--cream:#fff7e6;--pine:#ecd3a2;--edge:#8a5a2b;--edgeD:#6b4320;--red:#d8473b;--blue:#3c7fd8;--wl:none;--wf:none;--wd:none}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#4a2c12;color:var(--ink);font-family:"M PLUS Rounded 1c",system-ui,-apple-system,"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hidden{display:none!important}
.ic{width:1em;height:1em;vertical-align:-.15em;fill:currentColor}

/* 木の部品 */
.pine{background:var(--wl) 0 0/360px auto,var(--pine)}
.blockbtn{border:3px solid var(--edge);border-radius:12px;color:var(--ink);background:var(--wl) 0 0/320px auto,#efd5a3;box-shadow:inset 0 2px 0 #fffb,inset 0 -3px 0 #0000001a,0 5px 0 #9a6a35,0 8px 12px #0004;transition:transform .06s,box-shadow .06s}
.blockbtn:active:not(:disabled){transform:translateY(4px);box-shadow:inset 0 2px 0 #fffb,0 1px 0 #9a6a35}

/* ---- HUD ---- */
#hud{position:fixed;inset:0;pointer-events:none;touch-action:none}
#quit{position:absolute;left:calc(env(safe-area-inset-left) + 8px);top:calc(env(safe-area-inset-top) + 8px);pointer-events:auto;padding:5px 12px;font-size:13px;font-weight:900;border-radius:10px;border-width:2px;box-shadow:inset 0 2px 0 #fffb,0 4px 0 #9a6a35,0 6px 8px #0004}
#scorebar{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 6px);transform:translateX(-50%);display:flex;gap:5px;justify-content:center;max-width:calc(100% - 180px)}
.sc{border:2px solid var(--edge);border-radius:10px;padding:2px 8px;font-size:12px;font-weight:800;white-space:nowrap;display:flex;align-items:center;gap:4px;min-width:0;color:var(--ink);background:var(--wl) 0 0/300px auto,var(--pine);box-shadow:0 3px 0 #9a6a35,0 5px 8px #0003}
.sc .nm{overflow:hidden;text-overflow:ellipsis;max-width:6em}
@media (max-width:900px){#scorebar.many .sc .nm{max-width:3.2em}}
@media (orientation:portrait){#scorebar{top:calc(env(safe-area-inset-top) + 56px);left:8px;right:8px;transform:none;max-width:none;flex-wrap:wrap}}
.sc i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1.5px solid #0005}
.sc b{color:#e39a00;letter-spacing:1px;-webkit-text-stroke:.6px #7a4a10}
.sc.dead{opacity:.5;filter:grayscale(.6)}
#timer{position:absolute;right:calc(env(safe-area-inset-right) + 8px);top:calc(env(safe-area-inset-top) + 8px);border:2px solid #2a180a;border-radius:10px;padding:3px 12px;font-size:17px;font-weight:900;color:var(--cream);background:var(--wd) 0 0/300px auto,#5a3618;box-shadow:inset 0 1px 0 #fff3,0 4px 0 #2a180a,0 6px 8px #0004;font-variant-numeric:tabular-nums}
#timer.hot{background:linear-gradient(#e85a4c,#c23a2f);border-color:#6e2018;box-shadow:inset 0 1px 0 #fff5,0 4px 0 #7d241b}
#feed{position:absolute;right:calc(env(safe-area-inset-right) + 8px);top:calc(env(safe-area-inset-top) + 50px);display:flex;flex-direction:column;align-items:flex-end;gap:3px}
#feed div{background:#fff7e6e6;color:var(--ink);font-size:12px;font-weight:700;padding:2px 9px;border-radius:8px;border:1.5px solid #b98a52;transition:opacity .6s}
#banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:68px;font-weight:900;color:#fff7e6;-webkit-text-stroke:7px #5a3416;paint-order:stroke fill;text-shadow:0 6px 0 #5a3416,0 10px 18px #0007;white-space:nowrap;letter-spacing:2px}
#banner.small{font-size:32px;-webkit-text-stroke:5px #5a3416;text-shadow:0 4px 0 #5a3416,0 8px 14px #0007}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);color:var(--cream);background:#3e240fe6;border:2px solid #a8783f;padding:7px 16px;border-radius:12px;font-size:14px;font-weight:700;transition:opacity .3s;opacity:0;white-space:nowrap}
.lay{position:absolute;left:0;top:0;transform-origin:center center}
.stick{width:120px;height:120px;border-radius:50%;border:4px solid #fff7e680;background:radial-gradient(circle,#5a341622 0 55%,#5a341638 70%);box-shadow:0 0 0 2px #5a341655;pointer-events:none}
#hud.editing .lay{pointer-events:auto;outline:3px dashed #fff7e6;outline-offset:3px;touch-action:none}
#hud.editing .lay.sel{outline:3px solid var(--red)}
#hud.editing .lay *{pointer-events:none}
#hud.editing .lay::after{content:attr(data-name);position:absolute;left:50%;top:-22px;transform:translateX(-50%);font-size:11px;font-weight:900;background:var(--pine);border:2px solid var(--edge);color:var(--ink);padding:0 8px;border-radius:7px;white-space:nowrap}
#screen.toolbar{inset:auto;left:50%;top:6px;transform:translateX(-50%);background:none;padding:0;overflow:visible}
#screen.toolbar .card{width:auto;padding:6px 10px;display:flex;align-items:center;gap:8px;white-space:nowrap}
#screen.toolbar .card .btn{width:auto;margin:0;padding:6px 10px;font-size:13px}
#screen.toolbar input[type=range]{width:min(150px,24vw);accent-color:var(--red)}
.rnd{position:fixed;z-index:2147483200;top:calc(env(safe-area-inset-top) + 8px);width:38px;height:38px;padding:0;border-radius:50%;display:grid;place-items:center;color:var(--ink);border:2px solid var(--edge);background:var(--wl) 0 0/200px auto,var(--pine);box-shadow:inset 0 2px 0 #fffb,0 4px 0 #9a6a35,0 6px 8px #0004}
.rnd:active{transform:translateY(3px);box-shadow:0 1px 0 #9a6a35}
.rnd svg{width:22px;height:22px}
#rotB{right:calc(env(safe-area-inset-right) + 84px)}
#layB{right:calc(env(safe-area-inset-right) + 130px)}
#screen.home~#rotB,#screen.home~#layB{display:none}
#hud.editing #quit,#hud.editing #timer,#hud.editing #scorebar,#hud.editing #feed,#hud.editing #hint,#hud.editing #banner,#hud.editing #spec{display:none}
#ask{position:fixed;inset:0;z-index:2147483300;display:flex;align-items:center;justify-content:center;background:#2a180a99;padding:16px}
#ask .card{text-align:center}
#ask .row .btn{margin-top:0}
.stick .knob{position:absolute;left:33px;top:33px;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff3d6,#e2bd80 55%,#b88748);border:2px solid #8a5a2b;box-shadow:0 4px 0 #6b4320aa,0 6px 10px #0005;opacity:.9}
#stR{border-color:#ffd9d0aa;box-shadow:0 0 0 2px #7d241b66}
#stR .knob{background:radial-gradient(circle at 38% 32%,#ffb3a6,#e0503f 55%,#a32c22);border-color:#6e2018;box-shadow:0 4px 0 #6e2018aa,0 6px 10px #0005}
#mineBtn{position:absolute;pointer-events:auto;width:70px;height:70px;border-radius:50%;border:3px solid var(--edge);color:var(--ink);background:radial-gradient(circle at 40% 30%,#fff5dc,#ecd3a2 60%,#d1ad72);box-shadow:inset 0 2px 0 #fffc,0 5px 0 #9a6a35,0 8px 12px #0005;font-weight:900;font-size:12px;line-height:1.15;touch-action:none;padding:0}
#mineBtn b{display:block;font-size:15px;color:var(--red);letter-spacing:2px}
#mineBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #9a6a35}
@keyframes glow{from{box-shadow:0 0 4px var(--c)}to{box-shadow:0 0 16px var(--c)}}
#hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 8px);transform:translateX(-50%);font-size:12px;font-weight:700;white-space:nowrap;color:var(--cream);background:#3e240fb3;padding:3px 12px;border-radius:8px}
#spec{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);transform:translateX(-50%);font-size:14px;font-weight:900;color:var(--cream);background:#3e240fd9;border:2px solid #a8783f;padding:4px 14px;border-radius:10px}

/* ---- 画面（部屋・準備・結果）: こげ茶の台の上に、明るい木の板 ---- */
#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#0000 35%,#1e0f0580 100%),var(--wd) 0 0/560px auto,#5a3618;overflow:auto;padding:16px}
#screen.clear{background:#2a180a59}
.card{width:min(440px,100%);margin:auto;padding:18px 16px 16px;border-radius:16px;color:var(--ink);background:var(--wl) 0 0/420px auto,var(--pine);border:3px solid var(--edge);box-shadow:inset 0 2px 0 #fffa,inset 0 0 0 2px #f8e3b8,inset 0 -5px 0 #0000001c,0 6px 0 var(--edgeD),0 14px 26px #0008}
h1{margin:0 0 6px;font-size:30px;text-align:center;letter-spacing:3px}
h2{margin:0 0 10px;font-size:21px;text-align:center;font-weight:900;letter-spacing:1px}
.rules{font-size:13.5px;line-height:1.7;background:#fffaf0;border:2px solid #d6b07a;border-radius:12px;padding:10px 12px;margin:10px 0;color:var(--ink)}
.rules b{color:#b8321f}
label{font-size:12.5px;font-weight:800;color:var(--ink2);display:block;margin-top:10px}
.row{display:flex;gap:8px;margin-top:8px}
.in{width:100%;background:#fffaf0;border:3px solid #b98a52;border-radius:10px;padding:9px 10px;color:var(--ink);font-size:16px;font-weight:700;box-shadow:inset 0 3px 0 #0000000f;outline:none}
.in:focus{border-color:var(--blue)}
.in::placeholder{color:#b49a7a}
.btn{display:block;width:100%;margin-top:10px;padding:10px 12px;border:3px solid #1f4d8f;border-radius:12px;font-size:17px;font-weight:900;letter-spacing:1px;color:#fff;background:linear-gradient(#5d98e8,#3772c8);text-shadow:0 2px 0 #0004;box-shadow:inset 0 2px 0 #fff6,0 5px 0 #22549c,0 8px 12px #0004;transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:inset 0 2px 0 #fff6,0 1px 0 #22549c}
.btn.red{border-color:#6e2018;background:linear-gradient(#ea5e50,#c83b30);box-shadow:inset 0 2px 0 #fff6,0 5px 0 #7d241b,0 8px 12px #0004}
.btn.red:active:not(:disabled){box-shadow:inset 0 2px 0 #fff6,0 1px 0 #7d241b}
.btn.gar{border-color:#8a5a08;color:#4a2a05;text-shadow:0 1px 0 #fff8;background:linear-gradient(#ffd75a,#f0ad1c);box-shadow:inset 0 2px 0 #fff8,0 5px 0 #a8700c,0 8px 12px #0004;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.gar:active:not(:disabled){box-shadow:inset 0 2px 0 #fff8,0 1px 0 #a8700c}
.btn.sub{border-color:var(--edge);color:var(--ink);text-shadow:none;background:var(--wl) 0 0/320px auto,#f2dcb0;box-shadow:inset 0 2px 0 #fffb,0 5px 0 #9a6a35,0 8px 12px #0003}
.btn.sub:active:not(:disabled){box-shadow:inset 0 2px 0 #fffb,0 1px 0 #9a6a35}
.btn:disabled{opacity:.45;filter:grayscale(.4)}
.btn .ic{width:1.2em;height:1.2em}
.err{color:#b8321f;font-size:13px;font-weight:800;margin-top:8px;text-align:center}
.code{font-size:44px;font-weight:900;text-align:center;letter-spacing:12px;padding-left:12px;color:var(--ink);background:#fffaf0;border:3px solid #b98a52;border-radius:12px;box-shadow:inset 0 3px 0 #0000000f;font-variant-numeric:tabular-nums}
.plist{list-style:none;padding:0;margin:8px 0}
.plist li{background:#fffaf0;border:2px solid #d6b07a;border-radius:10px;padding:7px 12px;margin-top:5px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.plist li span:last-child{font-size:12px;color:var(--ink2)}
.note{font-size:12.5px;font-weight:700;color:var(--ink2);text-align:center;margin-top:6px}
.seg{display:flex;gap:6px;margin-top:5px}
.seg button{flex:1;min-width:0;border:2px solid #a8783f;background:#f8e7c3;border-radius:10px;padding:7px 3px;font-size:14px;font-weight:800;color:var(--ink);box-shadow:inset 0 2px 0 #fff9,0 4px 0 #a8783f;transition:transform .06s}
.seg button.on{background:linear-gradient(#5d98e8,#3772c8);border-color:#1f4d8f;color:#fff;box-shadow:inset 0 3px 4px #0003,0 1px 0 #1f4d8f;transform:translateY(3px)}
.loadsum{font-size:12px;font-weight:700;color:var(--ink2);text-align:center;margin-top:6px}
.rdy{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.rdy span{background:#fffaf0;border:2px solid #d6b07a;border-radius:99px;padding:4px 11px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px;opacity:.7}
.rdy span.ok{opacity:1;border-color:#3f9a46;background:#eefbe6}
.rdy i{display:inline-block;width:10px;height:10px;border-radius:3px}
table.res{width:100%;border-collapse:collapse;margin:8px 0;font-size:15px;font-weight:700;background:#fffaf0;border:2px solid #d6b07a;border-radius:12px;overflow:hidden}
table.res td{padding:7px 10px;border-bottom:2px dashed #ecd3a2}
table.res tr:last-child td{border-bottom:0}
table.res td:last-child{text-align:right;color:#e39a00;letter-spacing:1px;-webkit-text-stroke:.6px #7a4a10;font-size:17px}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1.5px solid #0004}
.tmcols{display:flex;gap:8px;margin:8px 0}.tmcol{flex:1;border:3px solid;border-radius:12px;padding:6px;background:#fffaf0;min-width:0}.tmh{border-radius:8px;color:#fff;font-weight:900;text-align:center;padding:3px 0;font-size:13px}.tmp{padding:5px 4px;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis}.tmpb{background:#f8e7c3;color:var(--ink);border:2px solid #b98a52;border-radius:8px;padding:4px 8px;width:100%;text-align:left;font-weight:700}
.tmb{border:none;border-radius:8px;padding:2px 10px;font-weight:800;margin-left:6px;min-width:2.6em;color:#fff}
.tmb:disabled{opacity:1;cursor:default}
.ttl{display:flex;align-items:center;justify-content:center;gap:8px}
.trophy{width:30px;height:30px;color:#f0ad1c;filter:drop-shadow(0 2px 0 #7a4a10)}

/* ---- ホーム（案A）: 木の机に広げたカード・小物 ---- */
#screen.home{padding:0;display:block;overflow:hidden;background:var(--wf) 50% 50%/900px auto,#dcb57a}
#screen.home::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 45% 40%,#fff3 0,#0000 45%,#3e240f66 100%);pointer-events:none}
.desk{position:absolute;inset:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.desk .it{position:absolute;transform:rotate(var(--r,0deg));filter:drop-shadow(4px 8px 6px #3e240f55)}
.desk .prop svg{display:block;width:100%;height:100%;overflow:visible}
.dcard{padding:0;border:0;background:none;color:var(--ink);z-index:3;transition:transform .1s}
.dcard:active{transform:rotate(var(--r)) scale(.96) translateY(3px)}
.dcard .face{position:absolute;inset:0;border-radius:14px;background:#fffdf8;overflow:hidden;box-shadow:inset 0 0 0 2px #0000000d}
.dcard.tag .face{border-radius:6px;clip-path:polygon(13% 0,100% 0,100% 100%,13% 100%,0 50%)}
.dcard .art{position:absolute;inset:0;width:100%;height:100%;color:var(--c)}
.dcard .hole{position:absolute;left:8%;top:calc(50% - 7px);width:14px;height:14px;border-radius:50%;background:#c9a067;box-shadow:0 0 0 3px #fff}
.dcard .t{position:absolute;right:8%;top:24%;font-size:clamp(20px,4.6vmin,34px);font-weight:900;letter-spacing:2px;line-height:1.05;white-space:nowrap}
.dcard .dots{position:absolute;right:8%;top:61%;width:40%;height:3px;color:var(--c);background:radial-gradient(circle,currentColor 1.3px,#0000 1.6px) 0 0/10px 3px;opacity:.7}
.dcard .s{position:absolute;right:8%;top:69%;font-size:clamp(10px,1.9vmin,13px);font-weight:800;opacity:.75;white-space:nowrap}
.photo{z-index:2;background:#f4ecdc;padding:10px 10px 30px;border-radius:6px;box-shadow:0 0 0 1px #0001}
.photo .in{position:relative;width:100%;height:100%;border-radius:3px;overflow:hidden;background:var(--wf) 50% 50%/500px auto,#e9cf9c}
.photo .in .scenew{position:absolute;inset:0}
.photo .in .scene{position:absolute;inset:4% 0 0;width:100%;height:96%}
.photo .blks{position:absolute;left:50%;top:-16px;transform:translateX(-50%) rotate(-3deg);gap:3px}
.photo .blks span{width:30px;height:32px;font-size:20px;-webkit-text-stroke:4px var(--d);box-shadow:inset 0 2px 0 #fff7,0 4px 0 var(--d),0 6px 8px #0004}
.photo .blks span.sm{font-size:15px}
.photo p{position:absolute;left:0;right:0;bottom:7px;margin:0;text-align:center;font-weight:900;font-size:clamp(11px,2vmin,14px)}
.plogo{position:absolute;right:10px;top:16px;z-index:4}
.plogo .blks span{width:34px;height:36px;font-size:23px;-webkit-text-stroke:4px var(--d)}
.plogo .blks span.sm{font-size:17px}
@media (max-width:380px){.plogo .blks span{width:30px;height:32px;font-size:20px}}
.dback{left:12px;top:12px;width:96px;height:58px;z-index:9;border-radius:10px;background:linear-gradient(#f4dcae,#e2bf85);border:3px solid #8a5a2b;box-shadow:inset 0 2px 0 #fffb,0 5px 0 #8a5a2b;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:11px;color:var(--ink);filter:none;--r:-4deg;padding:0}
.dback svg{width:34px;height:20px}
.dback:active{transform:rotate(-4deg) translateY(4px);box-shadow:0 1px 0 #8a5a2b}
.dock{position:absolute;display:flex;gap:8px;z-index:8}
.dock.p{left:50%;bottom:10px;transform:translateX(-50%)}
.dock.l{left:61%;top:8px}
.dock button{width:60px;height:54px;border:0;border-radius:12px 12px 6px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#fff;font-size:10px;font-weight:900;white-space:nowrap;padding:0;box-shadow:inset 0 2px 0 #fff5,0 5px 0 #0004;transition:transform .06s}
.dock button:active{transform:translateY(4px);box-shadow:inset 0 2px 0 #fff5,0 1px 0 #0004}
.dock button:disabled{opacity:.45}
.dock button svg{width:26px;height:22px}
.derr{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);z-index:9;background:#fffaf0;border:2px solid #b8321f;color:#b8321f;font-weight:800;font-size:13px;padding:4px 10px;border-radius:8px;white-space:nowrap}
.blks{display:flex;justify-content:center;gap:4px;flex-wrap:nowrap}
.blks span{--c:#d8473b;--d:#7d241b;width:44px;height:46px;display:grid;place-items:center;font-size:30px;font-weight:900;color:#fff;border-radius:7px;background:linear-gradient(#fff3 0,#fff0 40%),var(--c);border:2px solid var(--d);box-shadow:inset 0 2px 0 #fff7,0 6px 0 var(--d),0 10px 12px #0005;-webkit-text-stroke:5px var(--d);paint-order:stroke fill;line-height:1}
.blks span:nth-child(4n+2){--c:#3c7fd8;--d:#1f4d8f}
.blks span:nth-child(4n+3){--c:#f0ad1c;--d:#8a5a08}
.blks span:nth-child(4n+4){--c:#3f9a46;--d:#1f5a24}
.blks span:nth-child(odd){transform:rotate(-3deg)}
.blks span:nth-child(3n){transform:rotate(4deg) translateY(2px)}
.blks span.sm{font-size:22px}
.play{min-width:150px;border-radius:14px;font-size:27px;font-weight:900;letter-spacing:3px;color:#fff;border:3px solid #6e2018;background:linear-gradient(#ee6a5a,#c83b30);box-shadow:inset 0 3px 0 #fff6,inset 0 -4px 0 #0002,0 6px 0 #7d241b,0 10px 14px #0005;text-shadow:0 2px 0 #0004;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;transition:transform .06s,box-shadow .06s}
.play:active:not(:disabled){transform:translateY(5px);box-shadow:inset 0 3px 0 #fff6,0 1px 0 #7d241b}

  b: [

    { id: "slick", name: "スリック", s: [5, 3, 2, 1], desc: "速いがよく滑る" },

  ],
};
const STAT_NAMES = ["スピード", "かそく", "まがりやすさ", "すべりにくさ"];
const fixPart = (v, k) => { const n = Math.floor(+v || 0); return n >= 0 && n < PARTS[k].length ? n : 0; };   // 範囲外（消したガトリングなど）は最初のパーツに
const fixLoad = l => ({ g: fixPart(l && l.g, "g"), b: fixPart(l && l.b, "b"), w: fixPart(l && l.w, "w") });
let LOAD = (() => { try { return fixLoad(JSON.parse(store.get("tank-load") || "{}")); } catch (e) { return fixLoad({}); } })();
const randLoad = () => fixLoad({ g: Math.floor(Math.random() * PARTS.g.length), b: Math.floor(Math.random() * PARTS.b.length), w: Math.floor(Math.random() * PARTS.w.length) });
const gunOf = t => PARTS.g[t.load.g];
function rawStats(load) { const b = PARTS.b[load.b], w = PARTS.w[load.w]; return b.s.map((v, i) => v + w.s[i]); }   // 2〜10
function tankStats(load) {
  // 合計 2〜10 を 0〜1 にして、はば広く割り当てる（2026-11-19: 差が体感できるように）
  const s = rawStats(load).map(v => clamp((v - 2) / 8, 0, 1)), lerp = (a, b, t) => a + (b - a) * t;
  return { spd: lerp(1.5, 3.9, s[0]), acc: lerp(2.2, 12, s[1]), turn: lerp(1.3, 6.5, s[2]), grip: lerp(0.5, 8, s[3]) };
}
const loadText = l => `${PARTS.g[l.g].name}弾・${PARTS.b[l.b].name}・${PARTS.w[l.w].name}`;

// ================= ステージ =================
// 上半分（8 行）だけ書き、下半分は 180° まわしてつくる（どの出発点も同じ条件になる）。# = 壁、x = 木箱、1〜4 = 出発点
// 2026-11-18: 広さを約半分（24×16 → 18×12）にし、壁は薄い板（厚さ 0.1）に。
// # は「そのマスの中心を通る壁」: となりの # とつながって、横・縦の線になる（ひとつだけの # は長さ 1 の板）
// 2026-11-19: 正方形（14×14）にして、画面のまん中に置く（左右のスティックとステージが重ならないように）
const MW = 14, MH = 14, WALL_T = 0.1;
const HALF = {
  plaza: [
    "##############",
    "#1..........2#",
    "#..##....##..#",
    "#..#......#..#",
    "#......x.....#",
    "#....#...x...#",
    "#............#",
  ],
  maze: [
    "##############",
    "#1...#......2#",
    "#.##.#..##.#.#",
    "#.#.......#..#",
    "#.#..###.....#",
    "#......#..##.#",
    "#..#.........#",
  ],
  crates: [
    "##############",
    "#1..x....x..2#",
    "#...x....x...#",
    "#xx.xx..xx.xx#",
    "#.....x......#",
    "#..x..x..xx..#",
    "#....x...x...#",
  ],
  cross: [
    "##############",
    "#1...#..#...2#",
    "#....#..#....#",
    "#..#.x..x.#..#",
    "#............#",
    "###.##....####",
    "#.....x......#",
  ],
};
const STAGES = { random: "ランダム", plaza: "広場", maze: "迷路", crates: "木箱だらけ", cross: "十字路" };
const STAGE_NOTE = { random: "ラウンドごとに変わる", plaza: "壁が少なく撃ち合いが中心", maze: "細い通路。跳ね返りを狙おう", crates: "木箱を壊すと開けていく", cross: "四すみに陣地。真ん中は広い" };
function fullMap(k) {
  const h = HALF[k] || HALF.plaza, sw = { "1": "4", "4": "1", "2": "3", "3": "2" };
  return h.concat(h.slice().reverse().map(r => [...r].reverse().map(c => sw[c] || c).join("")));
}
const grid = new Uint8Array(MW * MH), crateHp = new Uint8Array(MW * MH);
let spawnPts = {}, curStage = "plaza";
const wx = i => i - MW / 2 + 0.5, wz = j => j - MH / 2 + 0.5;
const ti = x => Math.floor(x + MW / 2), tj = z => Math.floor(z + MH / 2);
// 当たり判定は四角（壁の板・木箱）の一覧。マスごとに、近くの四角を覚えておいて速く調べる
let rects = [], cellR = [];
const crateRect = new Map();
const OUT = { x0: -1e9, x1: 1e9, z0: -1e9, z1: 1e9, kind: "w", out: true };
function addRect(x0, z0, x1, z1, kind, n) {
  const r = { x0, z0, x1, z1, kind, n, dead: false }; rects.push(r);
  for (let j = Math.max(0, tj(z0 - .3)); j <= Math.min(MH - 1, tj(z1 + .3)); j++)
    for (let i = Math.max(0, ti(x0 - .3)); i <= Math.min(MW - 1, ti(x1 + .3)); i++) cellR[j * MW + i].push(r);
  return r;
}
function buildRects() {
  rects = []; cellR = Array.from({ length: MW * MH }, () => []); crateRect.clear();
  const W = (i, j) => i >= 0 && j >= 0 && i < MW && j < MH && grid[j * MW + i] === 1, h = WALL_T / 2;
  for (let j = 0; j < MH; j++) for (let i = 0; i < MW;) {   // 横の線
    if (W(i, j) && W(i + 1, j)) {
      const i0 = i; while (W(i + 1, j)) i++;
      const e = ii => (W(ii, j - 1) || W(ii, j + 1)) ? h : .5;
      addRect(wx(i0) - e(i0), wz(j) - h, wx(i) + e(i), wz(j) + h, "w");
    }
    i++;
  }
  for (let i = 0; i < MW; i++) for (let j = 0; j < MH;) {   // 縦の線
    if (W(i, j) && W(i, j + 1)) {
      const j0 = j; while (W(i, j + 1)) j++;
      const e = jj => (W(i - 1, jj) || W(i + 1, jj)) ? h : .5;
      addRect(wx(i) - h, wz(j0) - e(j0), wx(i) + h, wz(j) + e(j), "w");
    }
    j++;
  }
  for (let j = 0; j < MH; j++) for (let i = 0; i < MW; i++)   // ひとつだけの # は長さ 1 の板
    if (W(i, j) && !W(i - 1, j) && !W(i + 1, j) && !W(i, j - 1) && !W(i, j + 1)) addRect(wx(i) - .5, wz(j) - h, wx(i) + .5, wz(j) + h, "w");
  for (let n = 0; n < MW * MH; n++) if (grid[n] === 2) { const i = n % MW, j = (n - i) / MW; crateRect.set(n, addRect(wx(i) - .46, wz(j) - .46, wx(i) + .46, wz(j) + .46, "c", n)); }
  navDirty = true;
}
function rectAt(x, z, pad = 0) {
  const i = ti(x), j = tj(z);
  if (i < 0 || j < 0 || i >= MW || j >= MH) return OUT;
  for (const r of cellR[j * MW + i]) if (!r.dead && x >= r.x0 - pad && x <= r.x1 + pad && z >= r.z0 - pad && z <= r.z1 + pad) return r;
  return null;
}
const solidAt = (x, z) => !!rectAt(x, z);
function loadMap(k) {
  curStage = HALF[k] ? k : "plaza"; spawnPts = {};
  const rows = fullMap(curStage);
  for (let j = 0; j < MH; j++) for (let i = 0; i < MW; i++) {
    const c = (rows[j] || "")[i] || "#", n = j * MW + i;
    grid[n] = c === "#" ? 1 : c === "x" ? 2 : 0; crateHp[n] = c === "x" ? CRATE_HP : 0;
    if ("1234".includes(c)) spawnPts[c] = [wx(i), wz(j)];
  }
  buildRects();
}
// 木箱の数が変わった（壊れた）
function setCrateLocal(n, hp) {
  crateHp[n] = hp; grid[n] = hp > 0 ? 2 : 0;
  const r = crateRect.get(n); if (r) r.dead = hp <= 0;
  navDirty = true;
}
// CPU の道さがし用の点（0.5 間隔。通路のまん中と壁の線の両方に点がくる）。戦車が置ける点だけ使える
const NX = MW * 2 + 1, NZ = MH * 2 + 1;
let navFree = new Uint8Array(NX * NZ), navWall = new Uint8Array(NX * NZ), navDirty = true;
const nodeX = a => -MW / 2 + a * .5, nodeZ = b => -MH / 2 + b * .5;
function clearOf(x, z, crates) {
  const i0 = ti(x - 1), i1 = ti(x + 1), j0 = tj(z - 1), j1 = tj(z + 1);
  for (let j = Math.max(0, j0); j <= Math.min(MH - 1, j1); j++) for (let i = Math.max(0, i0); i <= Math.min(MW - 1, i1); i++)
    for (const r of cellR[j * MW + i]) {
      if (r.dead || (!crates && r.kind === "c")) continue;
      const dx = Math.max(r.x0 - x, 0, x - r.x1), dz = Math.max(r.z0 - z, 0, z - r.z1);

// ---------- ホスト: 1 コマ ----------
function hostTick(dt) {
  if (!G) return;
  G.t += dt; G.time += dt;
  const all = [...G.tanks.values()];
  if (G.phase === "count") {
    if (G.t >= COUNT_SEC) { G.phase = "play"; G.t = 0; broadcast({ t: "go" }); }
  } else if (G.phase === "play") {
    G.tleft -= dt;
    if (G.endAt && G.time >= G.endAt) finishRound(false);
    else if (G.tleft <= 0) finishRound(true);
  } else if (G.phase === "end") {
    if (G.over && G.t >= 2.6) finishMatch();
    return;
  } else return;
  const play = G.phase === "play";
  // 戦車
  for (const t of all) {
    if (!t.alive) continue;
    if (t.bot) {
      const inp = play && !host.train ? botUpdate(t, dt) : { mx: 0, mz: 0 };
      driveTank(t, inp.mx, inp.mz, dt); sepTanks(t, all);
    } else if (t.id === myId && !spectating) {
      const inp = play ? localMove() : { mx: 0, mz: 0 };
      driveTank(t, inp.mx, inp.mz, dt); sepTanks(t, all);
      t.tu = IN.aimA;
    }
  }
  if (!play) return;
  // 弾
  const hooks = { crate: n => hitCrate(n, 1), bounce: bb => { bb.bd = true; bounceSfx(); } };
  const dead = new Set();
  for (const b of G.bullets) {
    b.age += dt;
    if (b.life && b.age > b.life) { dead.add(b); continue; }
    if (b.home && b.age > b.hd) {
      let best = null, bd = 1e9;
      for (const t of all) { if (!t.alive || t.id === b.ow || (G.team && t.tm === b.tm)) continue; const d = Math.hypot(t.x - b.x, t.z - b.z); if (d < bd) { bd = d; best = t; } }
      if (best) {
        const sp = Math.hypot(b.vx, b.vz), cur = Math.atan2(b.vz, b.vx), want = Math.atan2(best.z - b.z, best.x - b.x);
        const na = cur + clamp(angDiff(want, cur), -b.home * dt, b.home * dt);
        b.vx = Math.cos(na) * sp; b.vz = Math.sin(na) * sp;
      }
    }
    if (!moveBullet(b, dt, hooks)) { dead.add(b); continue; }
    for (const t of all) {
      // 2026-11-19: 弾がおそくなったので、自分で追いついてしまわないように、自分の弾は「1 回跳ね返ったあと」からあたる
      if (!t.alive || (t.id === b.ow && !b.bd)) continue;
      if (Math.hypot(t.x - b.x, t.z - b.z) < TANK_R + b.r) {
        dead.add(b);
        killSrc = "bullet";
        if (!(G.team && t.tm === b.tm && t.id !== b.ow)) killTank(t, b.ow);   // チーム戦: 味方の弾には当たらない（自分の弾は当たる）
        killSrc = "";
        break;
      }
    }
    if (dead.has(b)) continue;
    for (const m of G.mines) if (Math.hypot(m.x - b.x, m.z - b.z) < 0.22 + b.r) { dead.add(b); m.fuse = Math.min(m.fuse, G.time); break; }
  }
  // 弾どうし: 威力に関係なく両方消える
  for (let i = 0; i < G.bullets.length; i++) {
    const a = G.bullets[i]; if (dead.has(a)) continue;
    for (let k = i + 1; k < G.bullets.length; k++) {
      const b = G.bullets[k]; if (dead.has(b)) continue;
      if (Math.hypot(a.x - b.x, a.z - b.z) < a.r + b.r + 0.04) { dead.add(a); dead.add(b); broadcast({ t: "ev", e: "clash", x: r2((a.x + b.x) / 2), z: r2((a.z + b.z) / 2) }); break; }
    }
  }
  if (dead.size) G.bullets = G.bullets.filter(b => !dead.has(b));
  // 地雷
  for (const m of [...G.mines]) {
    if (!G.mines.includes(m)) continue;
    let go = G.time >= m.fuse;
    if (!go) for (const t of all) {
      if (!t.alive || Math.hypot(t.x - m.x, t.z - m.z) > MINE_TRIG) continue;
      if (t.id === m.ow) continue;   // 2026-11-19: 自分の地雷には反応しない
      const ow = G.tanks.get(m.ow); if (G.team && ow && ow.tm === t.tm) continue;   // チームメイトの地雷にも反応しない
      if (G.time - m.t0 > MINE_ARM) { go = true; break; }
    }
    if (go) explode(m);
  }
}

const LV = [

      for (const x of [-.31, .31]) { const e = part(cyl(.085, .085, .12, 14), mat(0x2a2a2e), g, x, .09, s * .28); e.rotation.x = PI / 2; }

let VW = innerWidth, VH = innerHeight;
const camR = new THREE.Vector3(1, 0, 0), camU = new THREE.Vector3(0, 0, -1);
function fitCamera() {
  const portrait = VH > VW * 1.05, el = 60 * PI / 180, az = 0;   // 2026-11-19: ステージは正方形なので回さない。まん中に置く
  camera.aspect = VW / VH; camera.updateProjectionMatrix();
  const dir = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
  const target = new THREE.Vector3(0, 0, portrait ? 0 : 0.25);
  const pts = []; for (const x of [-MW / 2 + .4, MW / 2 - .4]) for (const z of [-MH / 2 + .4, MH / 2 - .4]) for (const y of [0, .6]) pts.push(new THREE.Vector3(x, y, z));
  const topM = portrait ? .9 : .84, v = new THREE.Vector3();
  let lo = 4, hi = 150;
  for (let it = 0; it < 32; it++) {
    const mid = (lo + hi) / 2;
    camera.position.copy(target).addScaledVector(dir, mid); camera.lookAt(target); camera.updateMatrixWorld();
    let ok = true;
    for (const p of pts) { v.copy(p).project(camera); if (Math.abs(v.x) > .98 || v.y > topM || v.y < -.98) { ok = false; break; } }
    if (ok) hi = mid; else lo = mid;
  }
  camera.position.copy(target).addScaledVector(dir, hi); camera.lookAt(target); camera.updateMatrixWorld();
  camR.setFromMatrixColumn(camera.matrixWorld, 0); camR.y = 0; camR.normalize();
  camU.setFromMatrixColumn(camera.matrixWorld, 1); camU.y = 0; camU.normalize();
}

}

const IN = { keys: new Set(), mouse: false, mx: 0, my: 0, aimA: 0, tl: null, tr: null, aiming: false };

function localMove() {
  let sx = 0, sy = 0;
  const k = IN.keys;
  if (k.has("KeyW") || k.has("ArrowUp")) sy -= 1;
  if (k.has("KeyS") || k.has("ArrowDown")) sy += 1;
  if (k.has("KeyA") || k.has("ArrowLeft")) sx -= 1;
  if (k.has("KeyD") || k.has("ArrowRight")) sx += 1;
  if (IN.tl) { sx += IN.tl.dx; sy += IN.tl.dy; }
  const mag = Math.min(1, Math.hypot(sx, sy));
  if (mag < 0.12) return { mx: 0, mz: 0 };
  const [wxv, wzv] = screenToWorld(sx, sy), l = Math.hypot(wxv, wzv) || 1;
  return { mx: wxv / l * mag, mz: wzv / l * mag };
}

// ステージの見本（上から見た図）
function miniMap(k) {
  const vb = `-0.3 -0.3 ${MW + .6} ${MH + .6}`, frame = `<rect x="-.3" y="-.3" width="${MW + .6}" height="${MH + .6}" rx=".7" fill="#8a5a2b"/><rect x=".5" y=".5" width="${MW - 1}" height="${MH - 1}" fill="#f1d7a6"/>`;
  if (!HALF[k]) return `<svg class="mm" viewBox="${vb}">${frame}<text x="${MW / 2}" y="${MH / 2 + 2.4}" text-anchor="middle" font-size="7" font-weight="900" fill="#b98a52">?</text></svg>`;
  const rows = fullMap(k), W = (i, j) => (rows[j] || "")[i] === "#";
  let ln = "", cr = "", sp = "";
  for (let j = 0; j < MH; j++) for (let i = 0; i < MW; i++) {
    const c = (rows[j] || "")[i], cx = i + .5, cy = j + .5;
    if (W(i, j)) {
      if (W(i + 1, j)) ln += `M${cx} ${cy}H${cx + 1}`;
      if (W(i, j + 1)) ln += `M${cx} ${cy}V${cy + 1}`;
      if (!W(i - 1, j) && !W(i + 1, j) && !W(i, j - 1) && !W(i, j + 1)) ln += `M${i} ${cy}H${i + 1}`;
    } else if (c === "x") cr += `<rect x="${i + .1}" y="${j + .1}" width=".8" height=".8" rx=".12"/>`;
    else if ("1234".includes(c)) sp += `<circle cx="${cx}" cy="${cy}" r=".4" fill="${css(COLORS[+c - 1])}" stroke="#0007" stroke-width=".1"/>`;
  }
  return `<svg class="mm" viewBox="${vb}">${frame}<path d="${ln}" stroke="#7a4a22" stroke-width=".24" stroke-linecap="round" fill="none"/><g fill="#c98d4e" stroke="#7d4f22" stroke-width=".08">${cr}</g>${sp}</svg>`;
}

    if (Math.abs(mv) < 1) for (const w of m.wheels) w.g.rotation.z -= mv / w.r;
  }
  for (const b of S.bullets.values()) if (b.mesh) b.mesh.position.set(b.x, 0, b.z);
  for (const b of S.pred.values()) if (b.mesh) b.mesh.position.set(b.x, 0, b.z);
  const blink = Math.floor(performance.now() / 120) % 2 === 0;
  for (const m of S.mines.values()) {
    const on = m.bl ? blink : Math.floor(performance.now() / 600) % 2 === 0;
    m.lamp.material.color.setHex(on ? lighten(m.base, .6) : darken(m.base, .6));
  }
  for (let i = fxList.length - 1; i >= 0; i--) {
    const f = fxList[i]; f.t += dt; const k = Math.min(1, f.t / f.life);
    f.upd(f.obj, k, dt);
    if (k >= 1) { scene.remove(f.obj); fxList.splice(i, 1); }
  }
  // ねらいの線
  const me = S.tanks.get(myId);
  if (screen === "game" && me && me.alive && !spectating && S.phase !== "end" && S.phase !== "done") {
    if (IN.mouse) { mouseAim(me); updAimLine(me); }
    else if (IN.aiming) updAimLine(me);
    else aimLine.visible = false;
  } else aimLine.visible = false;
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if ((mode === "host" || mode === "local") && G) {
    if (layEdit && mode === "local") { syncFromG(); renderer.render(scene, camera); return; }   // ひとりで遊んでいるときは、配置を変えているあいだ試合も止める
    acc += dt; let n = 0;
    while (acc >= 1 / 60 && n < 5) { hostTick(1 / 60); acc -= 1 / 60; n++; if (G && mode === "host" && ++G.snapK % 2 === 0) sendSnap(); }
    if (n >= 5) acc = 0;
    syncFromG();
  } else if (mode === "client" && screen === "game") clientTick(dt);
  if (screen === "game") { updateView(dt); updHud(); }
  if (S.phase === "play" && S.lastCount) S.lastCount = 0;
  renderer.render(scene, camera);
  if (gR && !$("garage").classList.contains("hidden") && gTank) {
    gSpin += dt * .6; gTank.root.rotation.y = gSpin;
    gR.render(gScene, gCam);
  }
}

// 確認用（?debug=1 のときだけ）: 画面が止まっていても、時間を進めて様子を見られる
if (new URLSearchParams(location.search).has("debug")) window.__tank = {
  step(sec) {
    const t0 = performance.now(); let n = 0;
    for (let k = 0; k < Math.round(sec * 60); k++) {
      if (layEdit && mode === "local") break;
      if (G) { hostTick(1 / 60); n++; if (mode === "host" && ++G.snapK % 2 === 0) sendSnap(); }
      else if (mode === "client" && screen === "game") clientTick(1 / 60);
    }
    const t1 = performance.now(); syncFromG(); if (screen === "game") { updateView(1 / 60); updHud(); } renderer.render(scene, camera);
    return { simMsPerTick: n ? ((t1 - t0) / n).toFixed(3) : 0, drawMs: (performance.now() - t1).toFixed(1) };
  },
  fireAt(x, z) { const t = G && G.tanks.get(myId); return t ? hostFire(myId, Math.atan2(z - t.z, x - t.x)) : false; },
  mine(id) { return hostMine(id == null ? myId : id); },
  warp(id, x, z) { const t = G && G.tanks.get(id); if (t) { t.x = x; t.z = z; t.vx = t.vz = 0; } },
  tm() { return G && [...G.tanks.values()].map(t => [t.id, t.tm]); },
  grid(i, j) { return grid[j * MW + i]; },
  view() { return { mode, screen, phase: S.phase, tleft: S.tleft, tanks: [...S.tanks.values()].map(t => [t.name, t.alive, +t.x.toFixed(1), +t.z.toFixed(1)]), bullets: S.bullets.size, pred: S.pred.size, mines: S.mines.size, card: ($("screen").innerText || "").slice(0, 80) }; },
  state() { return G && { phase: G.phase, round: host.match && host.match.round, tleft: G.tleft.toFixed(1), tanks: [...G.tanks.values()].map(t => [t.name, t.alive, +t.x.toFixed(1), +t.z.toFixed(1)]), bullets: G.bullets.length, kinds: G.bullets.map(b => PARTS.g[b.ty].id).join(), bpos: G.bullets.map(b => [PARTS.g[b.ty].id, +b.x.toFixed(2), +b.z.toFixed(2)]), mines: G.mines.length, score: host.match && [...host.match.score], over: !!overInfo }; },
};

// ================= はじめ =================
loadMap("plaza"); buildStage(); resize();
renderUI();
requestAnimationFrame(frame);
if (PARTY) { if (PARTY.role === "host") startHost(); else joinRoom(PARTY.code); }
else if (urlRoom.length === 4 && !isOffline()) setTimeout(() => { const c = $("code"); if (c) c.focus(); }, 300);
for (const ev of ["online", "offline"]) addEventListener(ev, () => { if (screen === "menu") renderUI(); });
</script>

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1a17;color:#f2efe8;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hidden{display:none!important}

/* ---- HUD ---- */
#hud{position:fixed;inset:0;pointer-events:none;touch-action:none}
#quit{position:absolute;left:calc(env(safe-area-inset-left) + 8px);top:calc(env(safe-area-inset-top) + 8px);pointer-events:auto;background:rgba(20,18,14,.72);border:1px solid #665;border-radius:10px;padding:8px 14px;font-size:14px}
#scorebar{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 6px);transform:translateX(-50%);display:flex;gap:5px;justify-content:center;max-width:calc(100% - 180px)}
.sc{background:rgba(20,18,14,.72);border-radius:10px;padding:3px 8px;font-size:12px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:4px;min-width:0}
.sc .nm{overflow:hidden;text-overflow:ellipsis;max-width:6em}
@media (max-width:900px){#scorebar.many .sc .nm{max-width:3.2em}}
.sc i{display:inline-block;width:11px;height:11px;border-radius:50%}
.sc b{color:#ffd21a;letter-spacing:1px}
.sc.dead{opacity:.45}
#timer{position:absolute;right:calc(env(safe-area-inset-right) + 8px);top:calc(env(safe-area-inset-top) + 8px);background:rgba(20,18,14,.72);border-radius:10px;padding:6px 12px;font-size:16px;font-weight:800}
#timer.hot{color:#ffd21a}
#feed{position:absolute;right:calc(env(safe-area-inset-right) + 8px);top:calc(env(safe-area-inset-top) + 48px);display:flex;flex-direction:column;align-items:flex-end;gap:3px}
#feed div{background:rgba(20,18,14,.65);font-size:12px;padding:3px 8px;border-radius:8px;transition:opacity .6s}
#banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:64px;font-weight:900;color:#fff;text-shadow:0 4px 0 #000,0 0 18px rgba(0,0,0,.6);white-space:nowrap}
#banner.small{font-size:30px}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:rgba(0,0,0,.8);padding:8px 16px;border-radius:12px;font-size:14px;transition:opacity .3s;opacity:0;white-space:nowrap}
.lay{position:absolute;left:0;top:0;transform-origin:center center}
.stick{width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);pointer-events:none}
#hud.editing .lay{pointer-events:auto;outline:2px dashed rgba(255,210,26,.8);outline-offset:3px;touch-action:none}
#hud.editing .lay.sel{outline:3px solid #ffd21a}
#hud.editing .lay *{pointer-events:none}
#hud.editing .lay::after{content:attr(data-name);position:absolute;left:50%;top:-20px;transform:translateX(-50%);font-size:11px;font-weight:800;background:#ffd21a;color:#222;padding:1px 7px;border-radius:7px;white-space:nowrap}
#screen.toolbar{inset:auto;left:50%;top:6px;transform:translateX(-50%);background:none;padding:0;overflow:visible}
#screen.toolbar .card{width:auto;padding:6px 10px;display:flex;align-items:center;gap:8px;white-space:nowrap;background:rgba(38,35,29,.95)}
#screen.toolbar .card .btn{width:auto;margin:0;padding:8px 10px;font-size:13px}
#screen.toolbar input[type=range]{width:min(150px,24vw);accent-color:#ffd21a}
#rotB{position:fixed;z-index:2147483200;top:calc(env(safe-area-inset-top) + 8px);right:calc(env(safe-area-inset-right) + 84px);width:36px;height:36px;padding:0;border-radius:50%;border:1px solid #776;background:rgba(20,18,14,.75);line-height:0}
#rotB svg{width:20px;height:20px}
#hud.editing #quit,#hud.editing #timer,#hud.editing #scorebar,#hud.editing #feed,#hud.editing #hint,#hud.editing #banner,#hud.editing #spec{display:none}
#ask{position:fixed;inset:0;z-index:2147483300;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
#ask .card{text-align:center}
#ask .row .btn{margin-top:0}
.stick .knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.5)}
#stR{border-color:rgba(255,210,26,.6)}
#stR .knob{background:rgba(255,210,26,.65)}
.wbtn{pointer-events:auto;touch-action:none;width:86px;min-height:44px;border-radius:12px;border:2px solid rgba(255,255,255,.35);background:rgba(20,18,14,.6);font-size:12px;font-weight:800;line-height:1.15;padding:4px 4px;position:absolute;overflow:hidden}
.wbtn small{display:block;font-size:10px;font-weight:600;opacity:.75}
.wbtn.on{border-color:var(--c,#ffd21a);background:rgba(20,18,14,.85);box-shadow:0 0 10px var(--c,#ffd21a)}
.wbtn i{position:absolute;left:0;bottom:0;height:4px;background:var(--c,#ffd21a);width:0}
.wbtn.syn{border-style:dashed}
.wbtn.syn.ready{border-style:solid;animation:glow 1s infinite alternate}
.wbtn.off{opacity:.35}
@keyframes glow{from{box-shadow:0 0 4px var(--c)}to{box-shadow:0 0 16px var(--c)}}
#hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 8px);transform:translateX(-50%);font-size:12px;opacity:.7;white-space:nowrap;background:rgba(20,18,14,.5);padding:3px 10px;border-radius:8px}
#spec{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);transform:translateX(-50%);font-size:14px;font-weight:700;background:rgba(20,18,14,.7);padding:5px 12px;border-radius:10px}

/* ---- 画面（メニュー・部屋・結果） ---- */
#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(14,12,9,.84);overflow:auto;padding:16px}
#screen.clear{background:rgba(14,12,9,.35)}
.card{width:min(440px,100%);background:#26231d;border:1px solid #3d382e;border-radius:18px;padding:18px 18px 16px;box-shadow:0 10px 30px rgba(0,0,0,.45);margin:auto}
h1{margin:0 0 6px;font-size:30px;text-align:center;letter-spacing:3px}
h1 small{display:block;font-size:12px;letter-spacing:0;opacity:.6;font-weight:400}
h2{margin:0 0 10px;font-size:20px;text-align:center}
.rules{font-size:13px;line-height:1.65;background:#1a1814;border-radius:12px;padding:8px 12px;margin:10px 0}
.rules b{color:#ffd21a}
details.rd{margin-top:14px}details.rd summary{cursor:pointer;font-size:13px;font-weight:700;padding:6px 0;color:#ffd21a}
label{font-size:12px;opacity:.7;display:block;margin-top:8px}
.row{display:flex;gap:8px;margin-top:8px}
.in{width:100%;background:#15130f;border:1px solid #4a4436;border-radius:10px;padding:10px;color:#fff;font-size:16px}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:12px;font-size:16px;font-weight:700;background:#d9822b;margin-top:8px;color:#fff}
.btn.sub{background:#3a352b}
.btn.red{background:#c23b3b}
.btn.gar{background:#ffd21a;color:#2a2105}
.btn:disabled{opacity:.4}
.err{color:#ff8a80;font-size:13px;margin-top:8px;text-align:center}
.code{font-size:42px;font-weight:800;text-align:center;letter-spacing:8px;color:#ffd21a}
.plist{list-style:none;padding:0;margin:8px 0}
.plist li{background:#1a1814;border-radius:10px;padding:8px 12px;margin-top:5px;display:flex;justify-content:space-between;align-items:center}
.note{font-size:12px;opacity:.7;text-align:center;margin-top:6px}
.seg{display:flex;gap:6px;margin-top:4px}
.seg button{flex:1;border:1px solid #4a4436;background:#1a1814;border-radius:10px;padding:8px 4px;font-size:14px}
.seg button.on{background:#d9822b;border-color:#d9822b}
.loadsum{font-size:12px;opacity:.8;text-align:center;margin-top:4px}
.rdy{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.rdy span{background:#1a1814;border-radius:99px;padding:5px 11px;font-size:13px;display:flex;align-items:center;gap:5px;opacity:.65}
.rdy span.ok{opacity:1;outline:1px solid #6fcf6f}
.rdy i{display:inline-block;width:10px;height:10px;border-radius:50%}
table.res{width:100%;border-collapse:collapse;margin:8px 0;font-size:15px}
table.res td{padding:6px 4px;border-bottom:1px solid #3d382e}
table.res td:last-child{text-align:right;color:#ffd21a;letter-spacing:1px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.tmb{border:none;border-radius:8px;padding:2px 10px;font-weight:800;margin-left:6px;min-width:2.6em;color:#fff}
.tmb:disabled{opacity:1;cursor:default}

/* ---- ガレージ（パーツ選び） ---- */
#garage{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:
  radial-gradient(ellipse at 70% 55%,rgba(255,210,120,.18),transparent 60%),
  repeating-conic-gradient(#24221d 0 25%,#2c2a24 0 50%) 0 0/48px 48px;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.gtop{flex:none;display:flex;align-items:center;gap:10px;height:46px;padding:0 12px}
.gtop .t{flex:1;text-align:center;font-size:17px;font-weight:800;letter-spacing:1px}
.gtop .n{font-size:12px;opacity:.75;min-width:70px;text-align:right}
.gmain{flex:1;display:flex;gap:12px;padding:4px 12px 8px;min-height:0}
.gcols{flex:1.25;display:flex;gap:8px;padding:8px;background:linear-gradient(#5d6067,#44474d);border-radius:16px;border:3px solid #2b2d31;box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 8px 22px rgba(0,0,0,.5);min-height:0;min-width:0}
.gcol{flex:1;display:flex;flex-direction:column;background:linear-gradient(#e9ebee,#d3d6db);border-radius:10px;overflow:hidden;min-width:0;border:2px solid transparent}
.gcol.focus{border-color:#ffd21a}
.gcol h4{margin:0;padding:4px 0;font-size:13px;text-align:center;color:#2b2d31;background:rgba(0,0,0,.08);font-weight:900;letter-spacing:2px}
.garr{flex:none;border:0;background:transparent;color:#3c3f45;font-size:15px;height:24px;line-height:24px}
.garr:active{color:#d9822b}
.gwin{flex:1;position:relative;overflow:hidden;touch-action:none;min-height:0}
.gitem{position:absolute;left:7%;width:86%;display:flex;align-items:center;justify-content:center;border-radius:12px;transition:transform .18s ease,opacity .18s ease;background:rgba(255,255,255,.35)}
.gitem img{max-width:94%;max-height:92%;pointer-events:none;-webkit-user-drag:none}
.gitem span{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:10px;font-weight:800;color:#3c3f45}
.gitem.sel{outline:5px solid #ffd21a;outline-offset:-2px;background:#fff7cf;box-shadow:0 0 14px rgba(255,210,26,.7)}
.gside{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.gstats{flex:none;background:rgba(18,18,20,.82);border-radius:12px;padding:8px 12px;border:1px solid rgba(255,255,255,.12)}
.gst{display:flex;align-items:center;gap:8px;margin:2px 0}
.gst .gl{width:6.4em;font-size:12px;font-weight:800;flex:none}
.gb{flex:1;height:12px;background:#1d1d20;border:1px solid #55585e;position:relative;transform:skewX(-14deg);overflow:hidden}
.gb i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ffe46a,#f2b705);transition:width .2s}
.gb::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(20% - 2px),#1d1d20 calc(20% - 2px) 20%)}
.gb.bul i{background:linear-gradient(#ffb36a,#e8701a)}
.gsep{height:1px;background:rgba(255,255,255,.15);margin:5px 0}
.gprev{flex:1;position:relative;min-height:90px}
.gprev canvas{position:absolute;inset:0;width:100%;height:100%}
.gbot{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(#3a3d43,#26282c);border-top:2px solid #55585e}
.gback{border:0;border-radius:12px;padding:10px 14px;background:#4a4d54;font-weight:800;font-size:15px}
.gname{flex:1;text-align:center;min-width:0}
.gname b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gname small{display:block;font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gok{border:0;border-radius:12px;padding:10px 24px;background:#ffd21a;color:#2a2105;font-weight:900;font-size:17px}
@media (orientation:portrait){
  .gmain{flex-direction:column-reverse}
  .gcols{flex:1.2}
  .gside{flex:1;flex-direction:row}
  .gstats{flex:1.2;align-self:flex-start}
}
</style>

<script type="module">
import * as THREE from "three";

// ================= 共通 =================
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const PI = Math.PI, TAU = PI * 2;
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > PI) d -= TAU; if (d < -PI) d += TAU; return d; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const css = c => "#" + c.toString(16).padStart(6, "0");
const sfx = (n, ...a) => { try { if (window.YkgSfx && YkgSfx[n]) YkgSfx[n](...a); } catch (e) {} };

// ================= パーティ・通信の設定（素因数バトルと同じしくみ） =================
const PREFIX = "tankfight-v1-";
const PARTY = (() => {
  try { if (!new URLSearchParams(location.search).has("party")) return null; const j = JSON.parse(sessionStorage.getItem("ykg-party") || "null"); return j && /^\d$/.test(j.code) ? j : null; } catch (e) { return null; }
})();
const netId = code => (PARTY ? "tankfight-party-" : PREFIX) + code;
const toGames = () => { if (typeof ykgToGames === "function") ykgToGames(); else location.href = "../"; };
function partyReport(w, l) {
  if (!PARTY || PARTY.role !== "host" || (!w.length && !l.length)) return;
  try { const a = JSON.parse(sessionStorage.getItem("ykg-results") || "[]"); a.push({ game: "tank", w, l }); sessionStorage.setItem("ykg-results", JSON.stringify(a)); } catch (e) {}
}
// 落としてよい通り道（位置・スナップショットだけ。届き直しをせず、順番を待たない）
const UCH_ID = 8;
function openUch(conn, onMsg) {
  try {
    const pc = conn && conn.peerConnection;
    if (!pc || !pc.createDataChannel) return null;
    const ch = pc.createDataChannel("tank-u", { negotiated: true, id: UCH_ID, ordered: false, maxRetransmits: 0 });
    ch.onmessage = e => { if (typeof e.data === "string") { let m; try { m = JSON.parse(e.data); } catch (x) { return; } onMsg(m); } };
    return ch;
  } catch (e) { return null; }
}
const uchOpen = ch => !!ch && ch.readyState === "open";
const FORCE_OFF = new URLSearchParams(location.search).has("offline");
const isOffline = () => FORCE_OFF || !navigator.onLine || typeof Peer === "undefined";

// ================= ゲームの設定 =================
const MAX_PLAYERS = 4, WIN_ROUNDS = 3, ROUND_TIME = 90, COUNT_SEC = 3;
const TANK_R = 0.36;
const TANK_HP = 3;                        // 2026-11-18: HP 制（弾ごとにダメージがちがう）。地雷は削除
const CRATE_HP = 3;                       // 木箱: ダメージ 3 で壊れる
const SYN_TIME = 1.5;                     // 合成にかかる秒数
const COLORS = [0xe8463c, 0x3a7be8, 0x3cb55a, 0xf0b428];
const TEAM_COLS = [[0xe23b3b, 0xff8f6b], [0x2f74e8, 0x63c6ff]];
const TEAM_NAME = ["赤", "青"], TEAM_CSS = ["#ff5a5a", "#4a9bff"];

// 弾（2026-11-18 作り直し）: 4 種類から 2 つ選んで、ボタンで切り替える。壁では跳ね返らない（当たると消える）。
// dmg = 当たったときのダメージ / boom = 爆発のダメージ（br = 半径。壁・木箱・戦車に当たると爆発）/ path = えがいた道をなぞる /
// home = 追いかける強さ / avoid = 壁をよける / pierce = 壁を壊して進む。0〜3 は選べる弾、4〜7 は合成弾
const BUL = [
  { id: "ast", name: "アステロイド", sub: "通常弾", tur: "rifle", spd: 7, dmg: 3, max: 2, cd: .45, r: .1, col: 0xfff3a0, desc: "威力が一番高い（1発でやられる）。まっすぐしか飛ばない" },
  { id: "met", name: "メテオラ", sub: "炸裂弾", tur: "bound", spd: 4.2, boom: 2, br: 1.15, max: 2, cd: .6, r: .14, col: 0xff8a3a, desc: "壁や戦車に当たると爆発する（自分も巻きこまれる）" },
  { id: "vip", name: "バイパー", sub: "変化弾", tur: "std", spd: 11, dmg: 1, path: true, max: 2, cd: .45, r: .1, col: 0x7af0ff, desc: "ステージに指でえがいた道をなぞって飛ぶ" },
  { id: "hnd", name: "ハウンド", sub: "追尾弾", tur: "homing", spd: 4.4, dmg: 1, home: 2.2, life: 6, max: 2, cd: .5, r: .1, col: 0xa6ff7a, desc: "近くの相手を追いかける" },

// ---------- ホスト: 部屋 ----------

// 準備（2026-11-18）: バトルの前（1 ラウンド目の前と、ラウンドの合間）は、人間が全員「準備OK」を押すまで始めない。

// ---------- ホスト: 1 コマ ----------
function hostTick(dt) {
  if (!G) return;
  G.t += dt; G.time += dt;
  const all = [...G.tanks.values()];
  if (G.phase === "count") {
    if (G.t >= COUNT_SEC) { G.phase = "play"; G.t = 0; broadcast({ t: "go" }); }
  } else if (G.phase === "play") {
    G.tleft -= dt;
    if (G.endAt && G.time >= G.endAt) finishRound(false);
    else if (G.tleft <= 0) finishRound(true);
  } else if (G.phase === "end") {
    if (G.over && G.t >= 2.6) finishMatch();
    return;
  } else return;
  const play = G.phase === "play";
  // 戦車
  for (const t of all) {
    if (!t.alive) continue;
    if (t.bot) {
      const inp = play ? botUpdate(t, dt) : { mx: 0, mz: 0 };
      driveTank(t, inp.mx, inp.mz, dt); sepTanks(t, all);
    } else if (t.id === myId && !spectating) {
      const inp = play ? localMove() : { mx: 0, mz: 0 };
      driveTank(t, inp.mx, inp.mz, dt); sepTanks(t, all);
      t.tu = IN.aimA;
    }
  }
  if (!play) return;
  // 弾
  const hooks = {
    crate: (n, b) => hitCrate(n, BUL[b.ty].boom ? 0 : BUL[b.ty].dmg || 0),
    wall: (x, z) => { const n = wallCellAt(x, z); if (n < 0) return false; breakWall(n); return true; },
  };
  const dead = new Set();
  for (const b of G.bullets) {
    if (dead.has(b)) continue;
    b.age += dt;
    const B = BUL[b.ty], sp = Math.hypot(b.vx, b.vz);
    if (b.life && b.age > b.life) { dead.add(b); continue; }
    const steer = na => { b.vx = Math.cos(na) * sp; b.vz = Math.sin(na) * sp; };
    if (b.path) {   // えがいた道をなぞる（道が終わったら、そのまままっすぐ）
      while (b.pi < b.path.length && Math.hypot(b.path[b.pi][0] - b.x, b.path[b.pi][1] - b.z) < Math.max(.15, sp * dt * 1.5)) b.pi++;
      if (b.pi < b.path.length) steer(Math.atan2(b.path[b.pi][1] - b.z, b.path[b.pi][0] - b.x));
    } else if (b.home && b.age > 0.25) {
      let best = null, bd = 1e9;
      for (const t of all) { if (!t.alive || t.id === b.ow || (G.team && t.tm === b.tm)) continue; const d = Math.hypot(t.x - b.x, t.z - b.z); if (d < bd) { bd = d; best = t; } }
      if (best) { const cur = Math.atan2(b.vz, b.vx), want = Math.atan2(best.z - b.z, best.x - b.x); steer(cur + clamp(angDiff(want, cur), -b.home * dt, b.home * dt)); }
    }
    if (b.avoid) {   // ホーネット: 前に壁があればよける
      const cur = Math.atan2(b.vz, b.vx), look = .75;
      if (solidAt(b.x + Math.cos(cur) * look, b.z + Math.sin(cur) * look))
        for (const d of [.4, -.4, .8, -.8, 1.2, -1.2, 1.7, -1.7]) if (!solidAt(b.x + Math.cos(cur + d) * look, b.z + Math.sin(cur + d) * look)) { steer(cur + clamp(d, -7 * dt, 7 * dt)); break; }
    }
    if (!moveBullet(b, dt, hooks)) { dead.add(b); if (B.boom) boomAt(b, dead); continue; }
    for (const t of all) {
      if (!t.alive || (t.id === b.ow && b.age < 0.15)) continue;
      if (Math.hypot(t.x - b.x, t.z - b.z) < TANK_R + b.r) {
        dead.add(b);
        if (B.boom) boomAt(b, dead);
        else if (!(G.team && t.tm === b.tm && t.id !== b.ow)) damageTank(t, B.dmg, b.ow);   // チーム戦: 味方の弾には当たらない（自分の弾は当たる）
        break;
      }
    }
  }
  // 弾どうし: 威力に関係なく両方消える
  for (let i = 0; i < G.bullets.length; i++) {
    const a = G.bullets[i]; if (dead.has(a)) continue;
    for (let k = i + 1; k < G.bullets.length; k++) {
      const b = G.bullets[k]; if (dead.has(b)) continue;
      if (Math.hypot(a.x - b.x, a.z - b.z) < a.r + b.r + 0.04) { dead.add(a); dead.add(b); broadcast({ t: "ev", e: "clash", x: r2((a.x + b.x) / 2), z: r2((a.z + b.z) / 2) }); break; }
    }
  }
  if (dead.size) G.bullets = G.bullets.filter(b => !dead.has(b));
}

const LV = [
  { name: "よわい", think: .5, err: .17, fire: .5, dodge: .3, syn: .05, path: .4 },

function botUpdate(t, dt) {

  });

        if (lobbyPs.length >= MAX_PLAYERS) { conn.send({ t: "reject", why: `満員です（${MAX_PLAYERS}人まで）` }); setTimeout(() => conn.close(), 500); return; }
        const id = host.nextId++; conn.pid = id; conn.pname = nm;

  if (!peerOk()) return;
  mode = "client"; screen = "connecting"; errMsg = ""; host.code = code; renderUI();
  try { peer = new Peer(); } catch (e) { netFail(); return; }
  peer.on("open", () => {
    const hc = hostConn = peer.connect(netId(code), { reliable: true });
    if (PARTY) setTimeout(() => { if (hostConn === hc && !hc.open && screen === "connecting" && ++partyTries < 60) { cleanupNet(); joinRoom(code); } }, 2500);
    hc.on("open", () => {

function wheel(parent, r, w, x, z, opts = {}) {
  const g = new THREE.Group(); g.position.set(x, r, z); parent.add(g);
  const t = part(cyl(r, r, w, opts.seg || 18), mat(opts.tire || 0x232327), g); t.rotation.x = PI / 2;
  const hub = part(cyl(r * .5, r * .5, w + .012, 12), mat(opts.hub || 0xb8bcc4), g); hub.rotation.x = PI / 2;
  if (opts.knobs) for (let k = 0; k < 8; k++) { const a = k * TAU / 8, kb = part(box(.05, .05, w + .01), mat(0x232327), g, Math.cos(a) * r, Math.sin(a) * r, 0); kb.rotation.z = a; }
  return { g, r };
}
function buildTires(id, g, C) {
  const wheels = [];
  for (const s of [-1, 1]) {
    if (id === "normal") for (const x of [-.24, 0, .24]) wheels.push(wheel(g, .1, .08, x, s * .27));
    else if (id === "slick") for (const x of [-.22, .22]) wheels.push(wheel(g, .14, .12, x, s * .29, { hub: C }));
    else if (id === "off") for (const x of [-.22, .22]) wheels.push(wheel(g, .15, .11, x, s * .29, { seg: 8, knobs: true, hub: 0xe0a030 }));
    else {   // キャタピラ
      part(box(.62, .17, .12), mat(0x2a2a2e), g, 0, .09, s * .28);
      for (const x of [-.31, .31]) { const e = part(cyl(.085, .085, .12, 14), mat(0x2a2a2e), g, x, .09, s * .28); e.rotation.x = PI / 2; }
      for (const x of [-.2, 0, .2]) { const e = part(cyl(.05, .05, .13, 10), mat(0x9aa0a8), g, x, .09, s * .285); e.rotation.x = PI / 2; }
      for (let k = 0; k < 7; k++) part(box(.02, .012, .125), mat(0x4a4a50), g, -.27 + k * .09, .18, s * .28);
    }
  }
  return wheels;
}
function buildBody(id, g, C) {
  const L = mat(lighten(C, .35)), D = mat(darken(C, .35)), K = mat(0x2b2b30);
  if (id === "heavy") {
    part(box(.74, .22, .5), mat(C), g, 0, .22, 0);
    for (const s of [-1, 1]) part(box(.7, .13, .05), D, g, 0, .2, s * .3);
    const f = part(box(.12, .14, .46), D, g, .37, .2, 0); f.rotation.z = .55;
    part(box(.3, .05, .36), L, g, -.12, .355, 0);
    return .33;
  }
  if (id === "light") {
    part(box(.54, .13, .4), mat(C), g, 0, .17, 0);
    part(box(.06, .1, .36), D, g, -.25, .27, 0);
    part(box(.2, .03, .3), L, g, .12, .245, 0);
    return .235;
  }
  if (id === "sport") {
    part(box(.6, .12, .4), mat(C), g, -.02, .16, 0);
    const n = part(box(.22, .07, .38), mat(C), g, .33, .14, 0); n.rotation.z = -.32;
    part(box(.6, .02, .1), L, g, -.02, .225, 0);
    part(box(.1, .17, .04), D, g, -.28, .28, 0);
    part(box(.04, .03, .38), K, g, -.3, .37, 0);
    return .22;
  }
  part(box(.66, .17, .44), mat(C), g, 0, .19, 0);
  part(box(.4, .05, .38), L, g, -.04, .3, 0);
  for (const s of [-1, 1]) part(box(.04, .04, .06), mat(0xfff2a0, "b"), g, .33, .23, s * .15);
  return .3;
}
function barrel(g, r, len, x, y, z, m) { const b = part(cyl(r, r, len, 12), m, g, x + len / 2, y, z); b.rotation.z = -PI / 2; return b; }
function buildTurret(id, g, C) {
  const M = mat(0x8a8f98), D = mat(darken(C, .3)), CM = mat(C);
  if (id === "rifle") {
    part(box(.24, .09, .22), CM, g, -.02, .045, 0);
    barrel(g, .032, .54, .08, .05, 0, M);
    const m = part(cyl(.05, .05, .06, 12), D, g, .6, .05, 0); m.rotation.z = -PI / 2;
  } else if (id === "bound") {
    part(geo("hemi", () => new THREE.SphereGeometry(.15, 16, 10, 0, TAU, 0, PI / 2)), CM, g, 0, 0, 0);
    barrel(g, .075, .24, .08, .07, 0, M);
    const t = part(geo("bring", () => new THREE.TorusGeometry(.075, .026, 8, 16)), mat(0xffd21a), g, .33, .07, 0); t.rotation.y = PI / 2;
  } else if (id === "homing") {
    part(box(.24, .1, .24), CM, g, 0, .05, 0);
    barrel(g, .05, .28, .08, .06, 0, M);
    const d = part(geo("dish", () => new THREE.ConeGeometry(.09, .05, 16, 1, true)), mat(0xdfe3ea), g, -.05, .16, 0); d.rotation.z = .5;
    part(cyl(.008, .008, .22, 6), mat(0x333333), g, -.1, .2, .08);
    part(geo("tip", () => new THREE.SphereGeometry(.025, 8, 6)), mat(0xff3030, "b"), g, -.1, .31, .08);
  } else if (id === "gat") {
    part(cyl(.14, .15, .11), CM, g, 0, .055, 0);

    const r = part(cyl(.065, .065, .04, 12), D, g, .36, .06, 0); r.rotation.z = -PI / 2;

}

// ---------- カメラ（ななめ上から。たて画面ではステージを 90° まわして大きく見せる） ----------
let VW = innerWidth, VH = innerHeight;
const camR = new THREE.Vector3(1, 0, 0), camU = new THREE.Vector3(0, 0, -1);
function fitCamera() {
  const portrait = VH > VW * 1.05, el = 60 * PI / 180, az = 0;   // 2026-11-19: ステージは正方形なので回さない。まん中に置く
  camera.aspect = VW / VH; camera.updateProjectionMatrix();
  const dir = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
  const target = new THREE.Vector3(0, 0, portrait ? 0 : 0.25);
  const pts = []; for (const x of [-MW / 2 + .4, MW / 2 - .4]) for (const z of [-MH / 2 + .4, MH / 2 - .4]) for (const y of [0, .6]) pts.push(new THREE.Vector3(x, y, z));
  const topM = portrait ? .9 : .84, v = new THREE.Vector3();
  let lo = 4, hi = 150;
  for (let it = 0; it < 32; it++) {
    const mid = (lo + hi) / 2;
    camera.position.copy(target).addScaledVector(dir, mid); camera.lookAt(target); camera.updateMatrixWorld();
    let ok = true;
    for (const p of pts) { v.copy(p).project(camera); if (Math.abs(v.x) > .98 || v.y > topM || v.y < -.98) { ok = false; break; } }
    if (ok) hi = mid; else lo = mid;
  }
  camera.position.copy(target).addScaledVector(dir, hi); camera.lookAt(target); camera.updateMatrixWorld();
  camR.setFromMatrixColumn(camera.matrixWorld, 0); camR.y = 0; camR.normalize();
  camU.setFromMatrixColumn(camera.matrixWorld, 1); camU.y = 0; camU.normalize();
}
function resize() {
  VW = innerWidth; VH = innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(VW, VH, false);
  fitCamera(); applyLayout();
  if (screen === "layout") renderUI();
  if (!$("garage").classList.contains("hidden")) { sizePreview(); updGarage(); }
  const rb = $("rotBtn"); if (rb) rb.textContent = rotLabel();
  if (PARTY && window.ykgLobby && ykgLobby.active) ykgLobby.update({});
}

// ================= 入力 =================
// スマホ: 左のスティック = 移動、右のスティック = ねらう（はなすと発射。軽くタップでも今の向きに発射）。場所は決まっていて、配置を変えられる
// PC: WASD / 矢印で移動、マウスでねらってクリックで発射、1 / 2 / Q で弾、スペース・右クリック・E で合成
// slot: 今の弾（0 / 1、2 = 合成弾）。draw: バイパー系でえがいている道 { id, pts }
const IN = { keys: new Set(), mouse: false, mx: 0, my: 0, aimA: 0, tl: null, tr: null, aiming: false, slot: 0, prevSlot: 0, synLocal: 0, draw: null };

function localMove() {
  let sx = 0, sy = 0;
  const k = IN.keys;
  if (k.has("KeyW") || k.has("ArrowUp")) sy -= 1;
  if (k.has("KeyS") || k.has("ArrowDown")) sy += 1;
  if (k.has("KeyA") || k.has("ArrowLeft")) sx -= 1;
  if (k.has("KeyD") || k.has("ArrowRight")) sx += 1;
  if (IN.tl) { sx += IN.tl.dx; sy += IN.tl.dy; }
  const mag = Math.min(1, Math.hypot(sx, sy));
  if (mag < 0.12) return { mx: 0, mz: 0 };

  return { mx: wxv / l * mag, mz: wzv / l * mag };
}
const myTank = () => (mode === "client" ? S.tanks.get(myId) : G && G.tanks.get(myId));
const canPlay = () => screen === "game" && !spectating && S.phase === "play" && !overInfo && $("garage").classList.contains("hidden");
let predCid = 1, localCd = 0;
// 自分の合成の状態（0 なし / 1 合成中 / 2 撃てる）
function mySyn() { const t = myTank(); if (!t) return 0; return mode === "client" ? (t.syn || 0) : synState(t); }
function curSlot() { return IN.slot === 2 ? (mySyn() === 2 ? 2 : IN.prevSlot) : IN.slot; }
function curKind(t) { return slotKind(t, curSlot()); }
function fireLocal(path) {

  const t = myTank(); if (!t || !t.alive) return;
  const slot = curSlot(), kind = slotKind(t, slot), B = BUL[kind];
  const p = B.path && path && path.length > 1 ? path.map(q => [r2(q[0]), r2(q[1])]) : null;

  if (p) a = Math.atan2(p[0][1] - t.z, p[0][0] - t.x);
  const done = () => { if (slot === 2) { IN.slot = IN.prevSlot; if (mode === "client") { t.syn = 0; t.synHold = performance.now() + 500; } } };
  if (mode !== "client") { if (hostFire(myId, a, 0, slot, p)) done(); return; }
  const now = performance.now() / 1000;
  if (slot !== 2) {
    if (mySyn() === 1 || now < localCd) return;
    const mine = [...S.bullets.values()].filter(b => b.ow === myId && b.ty === kind).length + [...S.pred.values()].filter(b => b.ty === kind).length;
    if (mine >= B.max) return;

  if (!B.path && !B.home && !B.pierce) {
    const b = { id: -c, ow: myId, ty: kind, x: sx, z: sz, vx: Math.cos(a) * B.spd, vz: Math.sin(a) * B.spd, r: B.r, age: 0 };

// 合成ボタン: 合成していなければ合成を始める。できていれば合成弾を選ぶ
function synLocal() {
  if (!canPlay()) return;
  const t = myTank(); if (!t || !t.alive || synOf(t.load) < 0) return;
  const s = mySyn();
  if (s === 2) { if (IN.slot !== 2) { IN.prevSlot = IN.slot; IN.slot = 2; } sfx("select"); return; }
  if (s === 1) return;
  if (mode === "client") { sendHost({ t: "syn" }); t.syn = 1; } else if (!hostSyn(myId)) return;
  IN.synLocal = performance.now(); sfx("charge");
}
function selectSlot(k) { if (k === IN.slot) return; if (k === 2) { synLocal(); return; } IN.slot = k; IN.draw = null; sfx("select"); }
// バイパー系: ステージの上に指（マウス）でえがく
function groundAt(cx, cy) {
  ray.setFromCamera({ x: cx / VW * 2 - 1, y: -(cy / VH) * 2 + 1 }, camera);

}
const PATH_MAX = 22;
function drawStart(id, cx, cy) { const p = groundAt(cx, cy); IN.draw = { id, pts: p ? [p] : [], len: 0 }; }
function drawMove(cx, cy) {
  const d = IN.draw, p = groundAt(cx, cy); if (!d || !p) return;
  const t = myTank(), last = d.pts[d.pts.length - 1] || (t ? [t.x, t.z] : p);
  const step = Math.hypot(p[0] - last[0], p[1] - last[1]);
  if (step < .25 || d.len + step > PATH_MAX || d.pts.length >= AIM_MAX - 2) return;
  d.pts.push(p); d.len += step;
  const t2 = myTank(); if (t2 && d.pts.length === 2) IN.aimA = Math.atan2(d.pts[0][1] - t2.z, d.pts[0][0] - t2.x);
}
function drawEnd(fire) {
  const d = IN.draw; IN.draw = null; if (!d || !fire) return;

  else fireLocal();   // ちょんと押しただけ: 今の向きにまっすぐ

const isPathKind = () => { const t = myTank(); return !!(t && BUL[curKind(t)].path); };
function nearMyTank(cx, cy) {
  const t = myTank(); if (!t) return false;
  const v = new THREE.Vector3(t.x, .3, t.z).project(camera);

}
// ---------- ボタンの配置（2026-11-19）: スティックは決まった場所に固定。位置と大きさは自分で変えられる（縦画面・横画面で別々に覚える）
const LAY_IDS = ["stL", "stR", "wb0", "wb1", "wsyn"];
const LAY_DEF = {
  land: { stL: { x: .12, y: .7, s: 1 }, stR: { x: .88, y: .7, s: 1 }, wb0: { x: .93, y: .2, s: 1 }, wb1: { x: .93, y: .35, s: 1 }, wsyn: { x: .82, y: .275, s: 1 } },
  port: { stL: { x: .22, y: .87, s: 1 }, stR: { x: .78, y: .87, s: 1 }, wb0: { x: .3, y: .75, s: 1 }, wb1: { x: .7, y: .75, s: 1 }, wsyn: { x: .5, y: .82, s: 1 } },
};
let LAY = (() => { try { return JSON.parse(store.get("tank-layout") || "null") || {}; } catch (e) { return {}; } })();
const layOri = () => VH > VW * 1.05 ? "port" : "land";
const layOf = id => { const o = layOri(); return (LAY[o] && LAY[o][id]) || LAY_DEF[o][id]; };
function setLay(id, v) { const o = layOri(); LAY[o] = LAY[o] || {}; LAY[o][id] = v; store.set("tank-layout", JSON.stringify(LAY)); }
function applyLayout() {
  for (const id of LAY_IDS) {
    const L = layOf(id), el = $(id);
    el.style.left = (L.x * VW) + "px"; el.style.top = (L.y * VH) + "px";

// スティックの中心と半径（画面の座標）
function stickGeo(id) { const L = layOf(id); return { cx: L.x * VW, cy: L.y * VH, r: STICK * L.s }; }
function knob(id, s) { $(id).firstElementChild.style.transform = s ? `translate(${s.dx * STICK}px,${s.dy * STICK}px)` : ""; }
function setStick(s, x, y) { let dx = (x - s.ox) / s.r, dy = (y - s.oy) / s.r; const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; } s.dx = dx; s.dy = dy; s.dist = Math.hypot(x - s.ox, y - s.oy); }
// バイパー系（タッチ）: 右のスティックを倒すと、戦車からカーソルが動いて弾道をえがく。はなすと発射
const CUR_SPEED = 15;   // 2026-11-19: 7 → 15（倒した向きへすばやく動いて、自由にえがけるように）
const curMesh = new THREE.Mesh(new THREE.TorusGeometry(.22, .04, 8, 24), new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false }));

function cursorTick(dt) {
  const d = IN.draw, t = myTank();
  if (!d || !d.cursor || !IN.tr || !t) { curMesh.visible = false; return; }
  const mag = Math.hypot(IN.tr.dx, IN.tr.dy);
  if (mag > .2) {
    const [wxv, wzv] = screenToWorld(IN.tr.dx, IN.tr.dy), l = Math.hypot(wxv, wzv) || 1;
    const lim = .9, nx = clamp(d.cur[0] + wxv / l * mag * CUR_SPEED * dt, -MW / 2 + lim, MW / 2 - lim), nz = clamp(d.cur[1] + wzv / l * mag * CUR_SPEED * dt, -MH / 2 + lim, MH / 2 - lim);

    if (d.len + Math.hypot(nx - d.cur[0], nz - d.cur[1]) <= PATH_MAX) {

canvas.addEventListener("pointerdown", e => {
  if (screen === "layout") return;
  if (screen !== "game") return;
  if (e.pointerType === "mouse") {
    IN.mouse = true; IN.mx = e.clientX; IN.my = e.clientY;
    if (e.button === 0) { if (isPathKind() && canPlay()) drawStart(e.pointerId, e.clientX, e.clientY); else fireLocal(); }
    else if (e.button === 2) synLocal();
    return;
  }
  IN.mouse = false;
  const gl = stickGeo("stL"), gr = stickGeo("stR"), x = e.clientX, y = e.clientY;
  const inL = Math.hypot(x - gl.cx, y - gl.cy) < gl.r * 1.5, inR = Math.hypot(x - gr.cx, y - gr.cy) < gr.r * 1.5;
  let s = null;
  if (inL && !IN.tl && (!inR || Math.hypot(x - gl.cx, y - gl.cy) <= Math.hypot(x - gr.cx, y - gr.cy))) { s = IN.tl = { id: e.pointerId, ox: gl.cx, oy: gl.cy, r: gl.r }; setStick(s, x, y); knob("stL", s); }
  else if (inR && !IN.tr) {
    s = IN.tr = { id: e.pointerId, ox: gr.cx, oy: gr.cy, r: gr.r }; setStick(s, x, y); knob("stR", s);
    const t = myTank();
    if (isPathKind() && canPlay() && t) IN.draw = { id: e.pointerId, pts: [], len: 0, cursor: true, cur: [t.x, t.z] };
  }
  if (s) { try { canvas.setPointerCapture(e.pointerId); } catch (x2) {} e.preventDefault(); }
});
canvas.addEventListener("pointermove", e => {
  if (IN.draw && !IN.draw.cursor && e.pointerId === IN.draw.id) { drawMove(e.clientX, e.clientY); IN.mx = e.clientX; IN.my = e.clientY; return; }
  if (e.pointerType === "mouse") { IN.mx = e.clientX; IN.my = e.clientY; IN.mouse = true; return; }
  if (IN.tl && e.pointerId === IN.tl.id) { setStick(IN.tl, e.clientX, e.clientY); knob("stL", IN.tl); }
  if (IN.tr && e.pointerId === IN.tr.id) {
    setStick(IN.tr, e.clientX, e.clientY); knob("stR", IN.tr);
    if (!IN.draw && IN.tr.dist > 12) { const [ax, az] = screenToWorld(IN.tr.dx, IN.tr.dy); IN.aimA = Math.atan2(az, ax); IN.aiming = true; }
  }

function endPointer(e) {

  if (IN.tl && e.pointerId === IN.tl.id) { IN.tl = null; knob("stL", null); }
  if (IN.tr && e.pointerId === IN.tr.id) {

const docEl = document.documentElement;
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const canRot = () => matchMedia("(pointer:coarse)").matches && !!(window.screen.orientation && window.screen.orientation.lock) && (standalone || !!(docEl.requestFullscreen || docEl.webkitRequestFullscreen));
const rotLabel = () => innerHeight > innerWidth ? "📱 横画面にする" : "📱 縦画面にする";
// 2026-11-19: えらんだ向きを覚えておき（ykg-orient。ゲーム一覧と共通）、全画面が外れたり、ページを開き直したりしても、次にさわったときに戻す
const ORI_KEY = "ykg-orient";
function applyOrient(land) {
  const lock = () => { try { const r = window.screen.orientation.lock(land ? "landscape" : "portrait"); if (r && r.catch) r.catch(() => {}); } catch (e) {} };
  if (document.fullscreenElement || document.webkitFullscreenElement || standalone) { lock(); return; }
  try {
    const r = docEl.requestFullscreen ? docEl.requestFullscreen({ navigationUI: "hide" }) : docEl.webkitRequestFullscreen();
    if (r && r.then) r.then(lock, () => {}); else setTimeout(lock, 300);
  } catch (e) {}
}
function toggleRot() { const toLand = innerHeight > innerWidth; store.set(ORI_KEY, toLand ? "land" : "port"); applyOrient(toLand); }
function keepOrient() {
  const pref = store.get(ORI_KEY); if (!pref || !canRot()) return;
  const land = pref === "land", now = innerWidth > innerHeight;
  if (land !== now || !(document.fullscreenElement || document.webkitFullscreenElement || standalone)) applyOrient(land);
}
if (canRot()) {
  if (standalone) keepOrient();
  addEventListener("pointerdown", e => { if (!e.target.closest || !e.target.closest("#rotB")) keepOrient(); }, { capture: true });
}
$("rotB").addEventListener("click", e => { e.stopPropagation(); toggleRot(); });

  else if (a === "layout") { if (screen === "menu") fixName(); enterLayout(); }

  else if (a === "ready") readyLocal(true);
  else if (a === "unready") readyLocal(false);
  else if (a === "force") { if (mode === "host") checkReady(true); }
  else if (a === "games") toGames();
  else if (/^(pb|ps|pt|pl)-/.test(a)) {
    const nm = $("name") && $("name").value, v = a.slice(3);
    if (a === "pb-" + v && a[1] === "b") { practiceBots = clamp(+v, 1, 3); store.set("tank-bots", practiceBots); }
    else if (a[1] === "s") { practiceStage = STAGES[v] ? v : "random"; store.set("tank-stage", practiceStage); }
    else if (a[1] === "t") { practiceTeam = v === "1"; store.set("tank-team", practiceTeam ? "1" : "0"); }
    else if (a[1] === "l") { practiceLv = clamp(+v, 0, 2); store.set("tank-lv", practiceLv); }
    renderUI(); if (nm != null && $("name")) $("name").value = nm;
  }
  else if (a.startsWith("hs-") && mode === "host" && !host.playing) { host.stage = STAGES[a.slice(3)] ? a.slice(3) : "random"; hostLobby(); }
  else if (a.startsWith("ht-") && mode === "host" && !host.playing) { host.team = a === "ht-1"; hostLobby(); }
  else if (a.startsWith("hl-") && mode === "host" && !host.playing) { host.cpuLv = clamp(+a.slice(3), 0, 2); hostLobby(); }
  else if (a.startsWith("sw-")) { const id = Number(a.slice(3)); if (mode === "host") swapTeam(id); else if (id === myId) sendHost({ t: "team" }); }
  else if (a === "leave") leave();
  else if (a === "bot+") { if (lobbyPs.length < MAX_PLAYERS) { host.bots++; hostLobby(); } }
  else if (a === "bot-") { host.bots = Math.max(0, host.bots - 1); hostLobby(); }
  else if (a === "start") { if (lobbyPs.length >= 2 && teamsReady()) hostStart(); }
  else if (a === "again") startPractice();
  else if (a === "tolobby") { clearGame(); host.playing = false; host.match = null; screen = "lobby"; hostLobby(); }
  else if (a === "share") {
    const url = shareUrl();
    try { if (navigator.share) { await navigator.share({ title: "タンクファイト", text: `部屋番号 ${host.code} で遊ぼう`, url }); return; } } catch (err) { return; }
    try { await navigator.clipboard.writeText(url); toast("リンクをコピーしました"); } catch (err) { prompt("このリンクを送ってください", url); }
  }
});

// ================= ガレージ（弾・機体・タイヤを選ぶ） =================
const GCOLS = [{ k: "g1", list: "g", name: "弾1" }, { k: "g2", list: "g", name: "弾2" }, { k: "b", list: "b", name: "機体" }, { k: "w", list: "w", name: "タイヤ" }];
let gTmp = null, gFocus = 0, gBack = null, gIcons = null, gR = null, gScene = null, gCam = null, gTank = null, gTankKey = "", gSpin = 0;
const MY_PREVIEW_COL = 0xe8463c;
function initGarage() {
  if (gR) return;
  gR = new THREE.WebGLRenderer({ canvas: $("gcv"), antialias: true, alpha: true, preserveDrawingBuffer: true });
  gR.setPixelRatio(Math.min(devicePixelRatio, 2));
  gScene = new THREE.Scene();
  gScene.add(new THREE.HemisphereLight(0xffffff, 0x50463a, 1.4));
  const l = new THREE.DirectionalLight(0xffffff, 1.6); l.position.set(3, 5, 4); gScene.add(l);
  gCam = new THREE.PerspectiveCamera(30, 1, .1, 50);
  // アイコン（パーツごとに 3D で描いて画像にする）
  gIcons = {};
  gR.setPixelRatio(1); gR.setSize(160, 120, false);
  const ic = new THREE.PerspectiveCamera(30, 160 / 120, .1, 20);
  for (const L of ["g", "b", "w"]) {
    gIcons[L] = PARTS[L].map(p => {
      const g = new THREE.Group();
      if (L === "g") {   // 弾: 弾の色の玉と、その弾の砲塔
        buildTurret(p.tur, g, MY_PREVIEW_COL);
        part(new THREE.SphereGeometry(.09, 14, 10), mat(p.col, "b"), g, .52, .07, 0);
        ic.position.set(.55, .5, .85); ic.lookAt(.2, .06, 0);
      }
      else if (L === "b") { buildBody(p.id, g, MY_PREVIEW_COL); ic.position.set(.95, .85, 1.15); ic.lookAt(0, .2, 0); }
      else { buildTires(p.id, g, MY_PREVIEW_COL); ic.position.set(.95, .75, 1.15); ic.lookAt(0, .1, 0); }
      gScene.add(g); gR.render(gScene, ic); const url = gR.domElement.toDataURL(); gScene.remove(g);
      return url;
    });
  }
  gR.setPixelRatio(Math.min(devicePixelRatio, 2));
  // 台
  const ped = new THREE.Group();
  ped.add(new THREE.Mesh(new THREE.CylinderGeometry(1.25, 1.35, .16, 48), new THREE.MeshLambertMaterial({ color: 0x3a3c42 })));
  const top = new THREE.Mesh(new THREE.CylinderGeometry(1.18, 1.18, .02, 48), new THREE.MeshLambertMaterial({ color: 0x55585f })); top.position.y = .085; ped.add(top);
  ped.position.y = -.08; gScene.add(ped);
  // 列
  const cols = $("gcols"); cols.innerHTML = "";
  GCOLS.forEach((c, ci) => {
    const el = document.createElement("div"); el.className = "gcol"; el.dataset.c = ci;
    el.innerHTML = `<h4>${c.name}</h4><button class="garr" data-nosfx data-d="-1">▲</button><div class="gwin"></div><button class="garr" data-nosfx data-d="1">▼</button>`;
    const win = el.querySelector(".gwin");
    PARTS[c.list].forEach((p, k) => {
      const it = document.createElement("div"); it.className = "gitem"; it.dataset.k = k;
      it.innerHTML = `<img alt="" src="${gIcons[c.list][k]}"><span>${esc(p.name)}</span>`;
      win.appendChild(it);
    });
    el.addEventListener("click", e => {
      gFocus = ci;
      const ar = e.target.closest(".garr"); if (ar) { gStep(ci, +ar.dataset.d); return; }
      const it = e.target.closest(".gitem"); if (it && !win.dataset.dragged) { gSet(ci, +it.dataset.k); return; }
      updGarage();
    });
    // 上下になぞって選ぶ
    let sy = null;
    win.addEventListener("pointerdown", e => { sy = e.clientY; win.dataset.dragged = ""; gFocus = ci; });
    win.addEventListener("pointermove", e => { if (sy == null) return; const d = e.clientY - sy, step = Math.max(36, win.clientHeight / 4); if (Math.abs(d) > step) { gStep(ci, d > 0 ? -1 : 1); sy = e.clientY; win.dataset.dragged = "1"; } });
    win.addEventListener("pointerup", () => { sy = null; setTimeout(() => { win.dataset.dragged = ""; }, 0); });
    win.addEventListener("pointercancel", () => { sy = null; });
    win.addEventListener("wheel", e => { e.preventDefault(); gStep(ci, e.deltaY > 0 ? 1 : -1); }, { passive: false });
    cols.appendChild(el);
  });
  $("gback").onclick = () => closeGarage(false);
  $("gok").onclick = () => closeGarage(true);
}
function gSet(ci, k) { const key = GCOLS[ci].k; k = clamp(k, 0, PARTS[GCOLS[ci].list].length - 1); gFocus = ci; if (gTmp[key] !== k) { gTmp[key] = k; sfx("select"); } updGarage(); }
function gStep(ci, d) { const key = GCOLS[ci].k, n = PARTS[GCOLS[ci].list].length; gSet(ci, (gTmp[key] + d + n) % n); }
function garageKey(e) {
  const nc = GCOLS.length;
  if (e.code === "ArrowLeft" || e.code === "KeyA") gFocus = (gFocus + nc - 1) % nc;
  else if (e.code === "ArrowRight" || e.code === "KeyD") gFocus = (gFocus + 1) % nc;
  else if (e.code === "ArrowUp" || e.code === "KeyW") gStep(gFocus, -1);
  else if (e.code === "ArrowDown" || e.code === "KeyS") gStep(gFocus, 1);
  else if (e.code === "Enter" || e.code === "Space") closeGarage(true);
  else if (e.code === "Escape" || e.code === "Backspace") closeGarage(false);
  else return;
  e.preventDefault(); updGarage();
}
function updGarage() {
  document.querySelectorAll("#gcols .gcol").forEach((el, ci) => {
    el.classList.toggle("focus", ci === gFocus);
    const key = GCOLS[ci].k, sel = gTmp[key], win = el.querySelector(".gwin"), H = win.clientHeight || 240, ih = H / 3;
    el.querySelectorAll(".gitem").forEach(it => {
      const k = +it.dataset.k, off = k - sel;
      it.style.height = (ih - 8) + "px"; it.style.top = "4px";
      it.style.transform = `translateY(${(off + 1) * ih}px) scale(${off === 0 ? 1 : .86})`;
      it.style.opacity = Math.abs(off) > 1 ? 0 : off === 0 ? 1 : .55;
      it.classList.toggle("sel", off === 0);
    });
  });
  const raw = rawStats(gTmp);
  const bar = (name, v, cls) => `<div class="gst"><div class="gl">${name}</div><div class="gb ${cls || ""}"><i style="width:${clamp(v, 0, 1) * 100}%"></i></div></div>`;
  const sk = synOf(gTmp), pw = B => (B.dmg || B.boom || 0) / 3;
  $("gstats").innerHTML = raw.map((v, i) => bar(STAT_NAMES[i], v / 10)).join("") + `<div class="gsep"></div>`
    + bar(`${BUL[gTmp.g1].name}`, pw(BUL[gTmp.g1]), "bul") + bar(`${BUL[gTmp.g2].name}`, pw(BUL[gTmp.g2]), "bul")
    + `<div class="gst"><div class="gl">合成</div><div style="font-size:12px;font-weight:800;color:${sk >= 0 ? css(BUL[sk].col) : "#888"}">${sk >= 0 ? `${BUL[sk].name}（${BUL[sk].sub}）` : "この組み合わせでは合成できない"}</div></div>`;
  updGarageTop();
  const fc = GCOLS[gFocus], fp = PARTS[fc.list][gTmp[fc.k]];
  const dmgText = B => B.boom ? `爆発ダメージ${B.boom}` : `ダメージ${B.dmg}`;
  $("gname").innerHTML = fc.list === "g" ? `<b>${fc.name}: ${esc(fp.name)}（${esc(fp.sub)}）</b><small>${esc(fp.desc)}・${dmgText(fp)}・${fp.max}発まで</small>`
    : `<b>${fc.name}: ${esc(fp.name)}</b><small>${esc(fp.desc)}</small>`;
  const tk = JSON.stringify(gTmp);
  if (tk !== gTankKey) {
    if (gTank) gScene.remove(gTank.root);
    gTank = makeTank(gTmp, previewColor()); gTank.root.scale.setScalar(2.3); gTank.root.position.y = .01; gScene.add(gTank.root); gTankKey = tk;
  }
}
function previewColor() {
  const p = S.prep && S.prep.ps.find(q => q.id === myId); if (p) return p.color;
  const t = S.tanks.get(myId); if (t && screen === "game") return t.color;
  return MY_PREVIEW_COL;
}
function sizePreview() {
  const box2 = $("gprev"), w = Math.max(10, box2.clientWidth), h = Math.max(10, box2.clientHeight);
  gR.setSize(w, h, false); gCam.aspect = w / h; gCam.updateProjectionMatrix();
  const far = w / h < 1 ? 3.9 / Math.max(.55, w / h) : 3.9;
  gCam.position.set(far * .62, far * .5, far * .78); gCam.lookAt(0, .35, 0);
}
function openGarage(back) {
  initGarage();
  gTmp = { ...LOAD }; gBack = back; gTankKey = "";
  $("garage").classList.remove("hidden");
  IN.tl = IN.tr = null; IN.draw = null; knob("stL", null); knob("stR", null);
  requestAnimationFrame(() => { sizePreview(); updGarage(); });
  updGarage();
}
function closeGarage(ok) {
  if (ok) {
    LOAD = fixLoad(gTmp); store.set("tank-load2", JSON.stringify(LOAD));
    host.loads.set(myId, LOAD);
    if (S.prep) readyLocal(true);   // カスタマイズの OK = 準備OK
    else if (mode === "client") sendHost({ t: "load", load: LOAD });
    sfx("go");
  } else sfx("cancel");
  $("garage").classList.add("hidden");
  const b = gBack; gBack = null; if (b) b();
}

// ================= ループ =================
let lastT = performance.now(), acc = 0, sendAcc = 0;
function syncFromG() {
  if (!G) return;
  for (const t of G.tanks.values()) {
    const v = S.tanks.get(t.id); if (!v) continue;
    v.x = t.x; v.z = t.z; v.h = t.h; v.tu = t.tu; v.alive = t.alive; v.hp = t.hp; v.syn = synState(t);
  }
  const seen = new Set();
  for (const b of G.bullets) {
    seen.add(b.id);
    let v = S.bullets.get(b.id);
    if (!v) { v = { id: b.id, ow: b.ow, ty: b.ty }; v.x = b.x; v.z = b.z; v.mesh = makeBulletMesh(v); S.bullets.set(b.id, v); if (b.ow !== myId && mode === "host") sfx("shot"); }
    v.x = b.x; v.z = b.z; v.vx = b.vx; v.vz = b.vz;
  }
  for (const [id, v] of S.bullets) if (!seen.has(id)) { puff(v.x, v.z, BUL[v.ty].col); removeBulletMesh(v); S.bullets.delete(id); }
  S.tleft = Math.max(0, Math.ceil(G.tleft));
}
function clientTick(dt) {
  const me = S.tanks.get(myId);
  const others = [...S.tanks.values()];
  if (me && !spectating && me.alive) {
    const inp = S.phase === "play" ? localMove() : { mx: 0, mz: 0 };
    driveTank(me, inp.mx, inp.mz, dt); sepTanks(me, others);
    me.tu = IN.aimA;
    sendAcc += dt;
    if (sendAcc >= 1 / 30 && S.phase === "play") { sendAcc = 0; sendHost({ t: "p", x: r2(me.x), z: r2(me.z), h: r2(me.h), tu: r2(me.tu), vx: r2(me.vx), vz: r2(me.vz) }); }
  }
  const k = 1 - Math.exp(-16 * dt);
  for (const t of others) {
    if (t.id === myId && !spectating) continue;
    t.x += (t.tx - t.x) * k; t.z += (t.tz - t.z) * k;
    t.h += angDiff(t.th, t.h) * k; t.tu += angDiff(t.ttu, t.tu) * k;
  }
  // 弾は次のスナップショットまで先に進めておく（壁で止まる）
  for (const b of S.bullets.values()) { const nx = b.x + b.vx * dt, nz = b.z + b.vz * dt; if (!solidAt(nx, nz)) { b.x = nx; b.z = nz; } }
  for (const [c, b] of S.pred) {
    b.age += dt;
    if (b.age > .6 || !moveBullet(b, dt)) { puff(b.x, b.z, BUL[b.ty].col); removeBulletMesh(b); S.pred.delete(c); }
  }
}
function updateView(dt) {
  for (const t of S.tanks.values()) {
    const m = t.mesh; if (!m) continue;
    m.root.visible = t.alive;
    if (t.bar) {   // HP の目もり（カメラのほうを向ける）
      t.bar.g.visible = t.alive;
      t.bar.g.position.set(t.x, 1.05, t.z); t.bar.g.quaternion.copy(camera.quaternion);
      const flash = t.hitT && performance.now() - t.hitT < 300;
      t.bar.pips.forEach((p, i) => p.material.color.setHex(i < t.hp ? (flash ? 0xffffff : t.hp === 1 ? 0xff5a3a : 0x6fe06f) : 0x2a2a2a));
    }
    if (!t.alive) continue;
    const dx = t.x - m.root.position.x, dz = t.z - m.root.position.z;
    const mv = dx * Math.cos(t.h) + dz * Math.sin(t.h);
    m.root.position.set(t.x, 0, t.z); m.root.rotation.y = -t.h; m.tur.rotation.y = -angDiff(t.tu, t.h);
    if (Math.abs(mv) < 1) for (const w of m.wheels) w.g.rotation.z -= mv / w.r;
  }
  for (const b of S.bullets.values()) if (b.mesh) b.mesh.position.set(b.x, 0, b.z);
  for (const b of S.pred.values()) if (b.mesh) b.mesh.position.set(b.x, 0, b.z);
  for (let i = fxList.length - 1; i >= 0; i--) {
    const f = fxList[i]; f.t += dt; const k = Math.min(1, f.t / f.life);
    f.upd(f.obj, k, dt);
    if (k >= 1) { scene.remove(f.obj); fxList.splice(i, 1); }
  }
  // ねらいの線
  const me = S.tanks.get(myId);
  if (screen === "game" && me && me.alive && !spectating && S.phase !== "end" && S.phase !== "done") {
    if (IN.draw) updAimLine(me);
    else if (IN.mouse) { mouseAim(me); updAimLine(me); }
    else if (IN.aiming) updAimLine(me);
    else aimLine.visible = false;
  } else aimLine.visible = false;
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if ((mode === "host" || mode === "local") && G) {
    acc += dt; let n = 0;
    while (acc >= 1 / 60 && n < 5) { hostTick(1 / 60); acc -= 1 / 60; n++; if (G && mode === "host" && ++G.snapK % 2 === 0) sendSnap(); }
    if (n >= 5) acc = 0;
    syncFromG();
  } else if (mode === "client" && screen === "game") clientTick(dt);
  if (screen === "game") { cursorTick(dt); updateView(dt); updHud(); }
  if (S.phase === "play" && S.lastCount) S.lastCount = 0;
  renderer.render(scene, camera);
  if (gR && !$("garage").classList.contains("hidden") && gTank) {
    gSpin += dt * .6; gTank.root.rotation.y = gSpin;
    gR.render(gScene, gCam);
  }
}

// 確認用（?debug=1 のときだけ）: 画面が止まっていても、時間を進めて様子を見られる
if (new URLSearchParams(location.search).has("debug")) window.__tank = {
  step(sec) {
    const t0 = performance.now(); let n = 0;
    for (let k = 0; k < Math.round(sec * 60); k++) {
      if (screen === "game") cursorTick(1 / 60);
      if (G) { hostTick(1 / 60); n++; if (mode === "host" && ++G.snapK % 2 === 0) sendSnap(); }
      else if (mode === "client" && screen === "game") clientTick(1 / 60);
    }
    const t1 = performance.now(); syncFromG(); if (screen === "game") { updateView(1 / 60); updHud(); } renderer.render(scene, camera);
    return { simMsPerTick: n ? ((t1 - t0) / n).toFixed(3) : 0, drawMs: (performance.now() - t1).toFixed(1) };
  },
  fireAt(x, z, slot, path) { const t = G && G.tanks.get(myId); return t ? hostFire(myId, Math.atan2(z - t.z, x - t.x), 0, slot, path) : false; },
  syn() { return hostSyn(myId); },
  grid(i, j) { return grid[j * MW + i]; },
  view() { return { mode, screen, phase: S.phase, tleft: S.tleft, tanks: [...S.tanks.values()].map(t => [t.name, t.alive, +t.x.toFixed(1), +t.z.toFixed(1)]), bullets: S.bullets.size, pred: S.pred.size, card: ($("screen").innerText || "").slice(0, 80) }; },
  state() { return G && { phase: G.phase, round: host.match && host.match.round, tleft: G.tleft.toFixed(1), tanks: [...G.tanks.values()].map(t => [t.name, t.hp, +t.x.toFixed(1), +t.z.toFixed(1)]), bullets: G.bullets.length, kinds: G.bullets.map(b => BUL[b.ty].id).join(), bpos: G.bullets.map(b => [BUL[b.ty].id, +b.x.toFixed(2), +b.z.toFixed(2)]), walls: G.wallBroken.length, score: host.match && [...host.match.score], over: !!overInfo }; },
};

// ================= はじめ =================
loadMap("plaza"); buildStage(); resize();
renderUI();
requestAnimationFrame(frame);
if (PARTY) { if (PARTY.role === "host") startHost(); else joinRoom(PARTY.code); }
else if (urlRoom.length === 4 && !isOffline()) setTimeout(() => { const c = $("code"); if (c) c.focus(); }, 300);
for (const ev of ["online", "offline"]) addEventListener(ev, () => { if (screen === "menu") renderUI(); });
</script>
